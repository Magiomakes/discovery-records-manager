<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Discovery Records Manager</title>
<style>
:root{
  --paper:#F4F5F2; --surface:#FFFFFF; --ink:#18222D; --ink-2:#4A5563; --ink-3:#7B8794; --line:#E2E5E1; --line-2:#CBD0CA;
  --green:#0E7C66; --green-ink:#0B5F4F; --green-bg:#E3F3EE; --red:#B42318; --red-bg:#FBEAE7; --amber:#9A6700; --amber-bg:#FFF4D6; --blue-bg:#E8EEF8; --blue-ink:#2B4C8C;
  --hof:#F3C9C4; --inc:#F8DCC2; --nth:#F5E9B8; --lat:#CFE0F2; --nap:#E6E8E6;
  --r:6px; --r-lg:10px;
  --sans:ui-sans-serif,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--sans);color:var(--ink);background:var(--paper);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--green-ink)}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* frame */
.app{display:grid;grid-template-columns:236px 1fr;height:100vh}
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{padding:18px 18px 14px;border-bottom:1px solid var(--line)}
.brand b{display:block;font-size:15px;letter-spacing:-.01em}
.brand span{display:block;font-size:12.5px;color:var(--ink-3);margin-top:2px}
.nav{padding:10px 10px;overflow:auto;flex:1}
.nav a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 10px;border-radius:var(--r);text-decoration:none;color:var(--ink-2);font-size:13.5px}
.nav a:hover{background:var(--paper);color:var(--ink)}
.nav a.on{background:var(--green-bg);color:var(--green-ink);font-weight:600}
.nav .grp{display:flex;align-items:center;gap:6px;width:100%;border:none;background:none;cursor:pointer;font-size:12px;color:var(--ink-3);padding:14px 10px 4px;text-align:left}
.nav .grp:hover{color:var(--ink)}
.nav .grp .chev{display:inline-block;width:10px;transition:transform .15s}
.nav .grp.closed .chev{transform:rotate(-90deg)}
.nav .grp.has-active{color:var(--green-ink);font-weight:600}
.nav .grp .pill{margin-left:auto}
.count{color:var(--ink-3);font-size:12px}
.pill{background:var(--amber);color:#fff;border-radius:999px;font-size:11px;padding:1px 7px;font-weight:600}
.sidefoot{border-top:1px solid var(--line);padding:12px 16px;font-size:12px;color:var(--ink-3);line-height:1.5}
.sidefoot b{color:var(--ink-2);font-weight:600}
.sidefoot .err{color:var(--red)}
.main{overflow:auto;min-width:0}
.page{max-width:1080px;margin:0 auto;padding:28px 32px 90px}
.crumbs{font-size:12.5px;color:var(--ink-3);margin-bottom:6px}
.crumbs a{color:var(--ink-3);text-decoration:none}
.crumbs a:hover{color:var(--ink)}
h1{font-size:24px;font-weight:650;letter-spacing:-.015em;margin:0 0 4px}
h2{font-size:15px;font-weight:650;margin:26px 0 10px;letter-spacing:-.005em}
h2:first-child{margin-top:0}
h3{font-size:13.5px;font-weight:650;margin:0 0 8px}
.lede{color:var(--ink-2);margin:0 0 18px;max-width:64ch}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.muted{color:var(--ink-3)}
.small{font-size:12.5px}
.right{text-align:right}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}
@media (max-width:900px){.app{grid-template-columns:1fr}.side{display:none}.page{padding:18px 16px 80px}}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 18px;margin-bottom:12px}
.card.flat{padding:0;overflow:hidden}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1000px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:700px){.g2,.g3,.g4{grid-template-columns:1fr}}
.split{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:1100px){.split{grid-template-columns:1fr}}

/* controls */
.btn{text-decoration:none;display:inline-block;border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r);padding:7px 13px;cursor:pointer;white-space:nowrap;font-weight:500;color:var(--ink)}
.btn:hover{border-color:var(--ink-3);background:#fafbf9}
.btn.pri{background:var(--green);border-color:var(--green);color:#fff}
.btn.pri:hover{background:var(--green-ink)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.icon{width:32px;height:32px;padding:0;display:inline-flex;align-items:center;justify-content:center;font-size:15px}
.btn.icon.yes{color:var(--green-ink);border-color:#9fd3c2} .btn.icon.yes:hover{background:var(--green-bg)}
.btn.icon.no{color:var(--red);border-color:#ebb3ab} .btn.icon.no:hover{background:var(--red-bg)}
.btn.link{border:none;background:none;color:var(--green-ink);padding:0;text-decoration:underline;font-weight:400}
.btn:disabled{opacity:.5;cursor:not-allowed}
label.f{display:block;font-size:12.5px;color:var(--ink-2);margin-bottom:12px}
label.f > input,label.f > select,label.f > textarea{display:block;width:100%;margin-top:5px}
input[type=text],input[type=number],input[type=date],select,textarea{border:1px solid var(--line-2);border-radius:var(--r);padding:7px 10px;background:var(--surface);color:var(--ink)}
textarea{resize:vertical;min-height:72px;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:2px solid #bfe0d6;border-color:var(--green)}
select.inline{padding:3px 6px;font-size:12.5px;border-color:var(--line)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden}
.seg button{border:none;background:var(--surface);padding:4px 10px;cursor:pointer;border-right:1px solid var(--line-2)}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--ink);color:#fff}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:14px 0 16px}
.tabs button{border:none;background:none;padding:8px 12px;cursor:pointer;color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-color:var(--ink);font-weight:600}
details.fold{border:1px dashed var(--line-2);border-radius:var(--r-lg);padding:10px 14px;margin-top:12px;color:var(--ink-2)}
details.fold summary{cursor:pointer;font-weight:500;color:var(--ink)}
details.fold[open]{background:var(--surface)}

/* tables */
table{width:100%;border-collapse:collapse}
th{font-size:12px;color:var(--ink-3);text-align:left;font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}
tr.click{cursor:pointer} tr.click:hover td{background:#f8f9f6}

/* chips */
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:12px;white-space:nowrap;line-height:1.4}
.chip.gray{background:#eef0ed;color:var(--ink-2)}
.chip.blue{background:var(--blue-bg);color:var(--blue-ink)}
.chip.ok{background:var(--green-bg);color:var(--green-ink)}
.chip.warn{background:var(--amber-bg);color:var(--amber)}
.chip.bad{background:var(--red-bg);color:var(--red)}
.chip.tier{color:#2a2a2a}
.tier-hof{background:var(--hof)} .tier-inc{background:var(--inc)} .tier-nth{background:var(--nth)} .tier-lat{background:var(--lat)} .tier-nap{background:var(--nap)}
.notice{border-radius:var(--r);padding:9px 12px;font-size:13px}
.notice.bad{background:var(--red-bg);color:#7a1a12}
.notice.warn{background:var(--amber-bg);color:#6b4a00}
.notice.ok{background:var(--green-bg);color:var(--green-ink)}

/* metrics */
.metric{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 16px}
.metric .n{font-size:26px;font-weight:650;letter-spacing:-.02em;line-height:1.1}
.metric .l{font-size:12.5px;color:var(--ink-2);margin-top:4px}
.metric .h{font-size:12px;color:var(--ink-3);margin-top:3px}
.metric.warn{border-color:#ead9a0;background:#fffbef} .metric.warn .n{color:var(--amber)}
.metric.good .n{color:var(--green-ink)}
.bar{display:flex;height:8px;border-radius:999px;overflow:hidden;background:#e9ebe7}
.bar div{height:100%}
.bar.tiers{height:20px}
.bar.tiers div{display:flex;align-items:center;justify-content:center;font-size:11px;color:#333}

/* the hero element: the customer's words */
.q{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line-2);border-radius:var(--r-lg);padding:14px 16px 12px 18px;margin-bottom:10px}
.q.s-Confirmed{border-left-color:var(--green)}
.q.s-Candidate{border-left-color:#e2b93b}
.q.s-Rejected{border-left-color:var(--line);opacity:.6}
.q .words{font-family:var(--serif);font-size:17px;line-height:1.45;color:var(--ink);letter-spacing:-.005em}
.q .words:before{content:"\201C"} .q .words:after{content:"\201D"}
.q.compact .words{font-size:15.5px}
.q .meta{display:flex;gap:6px 8px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--ink-3);margin-top:10px}
.q .meta .who{color:var(--ink-2)}
.q .acts{display:flex;gap:6px;flex-shrink:0}
.q.focus{box-shadow:0 0 0 3px #bfe0d6}
.q .ctx{font-size:12.5px;color:var(--ink-3);margin-top:6px}

/* transcript */
.transcript{white-space:pre-wrap;font-family:var(--serif);font-size:15px;line-height:1.7;max-height:70vh;overflow:auto;padding-right:8px;color:var(--ink)}
mark{border-radius:2px;padding:0 1px;cursor:pointer;color:inherit}
mark.s-Confirmed{background:#cdebdf;box-shadow:0 2px 0 var(--green)}
mark.s-Candidate{background:#fbeaa8;box-shadow:0 2px 0 #e2b93b}
mark.s-Rejected{background:#eee;text-decoration:line-through}
mark.focus-mark,mark.focus{outline:2px solid var(--ink);outline-offset:1px}
.near{background:var(--blue-bg);border-radius:3px;outline:2px dashed #8ea6d4;outline-offset:1px}
.legend{font-size:12px;color:var(--ink-3);margin-top:10px}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(24,34,45,.22);z-index:39}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(660px,96vw);background:var(--surface);border-left:1px solid var(--line);box-shadow:-12px 0 40px rgba(0,0,0,.12);display:flex;flex-direction:column;z-index:40}
.drawer .dh{padding:14px 20px;border-bottom:1px solid var(--line)}
.drawer .db{overflow:auto;padding:18px 20px;flex:1}
.drawer .transcript{max-height:none}

/* checklist (first run) */
.check{display:flex;gap:12px;align-items:flex-start;padding:12px 4px;border-bottom:1px solid var(--line)}
.check:last-child{border-bottom:none}
.check .dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line-2);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;margin-top:1px}
.check.done .dot{background:var(--green);border-color:var(--green);color:#fff}
.check.done .t{color:var(--ink-3);text-decoration:line-through}
.check .t{font-weight:600}
.check .d{font-size:12.5px;color:var(--ink-2)}

/* misc */
.empty{color:var(--ink-3);text-align:center;padding:28px 12px}
.empty b{color:var(--ink-2)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:8px;padding:10px 14px;display:flex;gap:14px;align-items:center;box-shadow:0 8px 28px rgba(0,0,0,.22);z-index:60;font-size:13.5px}
.toast button{background:none;border:1px solid #ffffff66;color:#fff;border-radius:5px;padding:3px 9px;cursor:pointer}
.banner{background:var(--amber-bg);border-bottom:1px solid #eedca0;padding:8px 18px;font-size:13px;color:#5e4200}
.welcome{max-width:600px;margin:9vh auto;padding:0 20px}
.welcome h1{font-size:30px;letter-spacing:-.02em}
.welcome .sub{font-family:var(--serif);font-size:18px;color:var(--ink-2);line-height:1.45;margin:8px 0 26px}
.hint{font-size:12.5px;color:var(--ink-3)}
pre.code{white-space:pre-wrap;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;background:#f4f5f2;border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;margin:6px 0}
pre.prompt{white-space:pre-wrap;background:#f4f5f2;border:1px solid var(--line);border-radius:var(--r);padding:12px;max-height:320px;overflow:auto;font-size:12.5px}
.md h1{font-size:20px}.md h2{font-size:15px;margin-top:20px}.md h3{font-size:14px;margin-top:14px}.md table{margin:8px 0 14px}.md td,.md th{border:1px solid var(--line)}
.md blockquote{border-left:3px solid var(--line-2);margin:6px 0;padding:2px 12px;color:var(--ink-2);font-family:var(--serif)}
.md p,.md li{max-width:72ch}
.ai{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--blue-ink);background:var(--blue-bg);border-radius:999px;padding:2px 9px}
.kbd{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:#f0f1ee;border:1px solid var(--line-2);border-radius:4px;padding:1px 6px}
.checks{display:flex;gap:6px;flex-wrap:wrap}
.notecard{border-left:4px solid var(--blue-ink)}
</style>
</head>
<body>
<div id="root"></div>
<script>
"use strict";
/* ============================================================
   Discovery Records Manager (DRM)
   Levels 1-2 of Darren Yee's Discovery Ladder.
   Data lives as plain files in the founder's own repo folder.
   The founder's AI assistant reads and writes the same folder
   (see CLAUDE.md); this app is for entering and judging evidence.
   ============================================================ */

const TEMPLATE_URL = "https://github.com/Magiomakes/discovery-records-manager";
const SETUP_URL = TEMPLATE_URL + "/blob/main/SETUP.md";
const AI_URL = TEMPLATE_URL + "/blob/main/SETUP.md#connect-your-ai";

const TIERS = ["Hair on Fire","Incremental Improvement","Nice to Have","Latent","Not a Problem"];
const TIER_CLASS = {"Hair on Fire":"tier-hof","Incremental Improvement":"tier-inc","Nice to Have":"tier-nth","Latent":"tier-lat","Not a Problem":"tier-nap"};
const TIER_DEF = {
  "Hair on Fire":"Already invested money or recurring time they can't get back, and the problem is still not solved.",
  "Incremental Improvement":"Actively trying to fix it, but the effort is reversible (tried a tool and dropped it, stopped when a free trial ended).",
  "Nice to Have":"Describes the problem clearly but has done nothing about it.",
  "Latent":"Has the problem but doesn't see it as a problem. A coaching flag, not a buying signal.",
  "Not a Problem":"No sign they have it."
};
const EVIDENCE_TYPES = ["Past behavior, irreversible","Past behavior, reversible","Current workaround","Frequency","Cost (time or money)","Strong language","Opinion or future intent"];
const EVIDENCE_DEF = {
  "Past behavior, irreversible":"Money spent, recurring time, or a workaround they built and keep using.",
  "Past behavior, reversible":"Tried something and dropped it, abandoned free trials.",
  "Current workaround":"What they use today instead of a real solution.",
  "Frequency":"How often it happens, in their words.",
  "Cost (time or money)":"Hours, dollars or grades lost.",
  "Strong language":"How they talk about it. Supports a score, never decides it.",
  "Opinion or future intent":"\"I would\", \"I'd probably\", \"sounds useful\". Weak evidence."
};
const SOURCES = ["Stranger (cold outreach)","Online community or follower","Referral from an interviewee","Classmate or acquaintance","Friend or family"];
const FREQ = [["Daily",5],["Weekly",4],["Monthly",3],["A few times a year",2],["Rarely",1]];
const CONSEQ = [[5,"Serious loss (money, grades, job, reputation)"],[4,"Real cost (hours or money lost, someone upset)"],[3,"Noticeable hassle that slows them down"],[2,"Minor annoyance"],[1,"Barely matters"]];
const JOB_TYPES = ["Functional","Emotional","Social"];
const DECISIONS = ["Undecided","Wedge","Later","Say no"];
const PERSONA_FIELDS = [
  ["who","Who they are (role and situation)"],
  ["moment","When the problem hits (the specific moment)"],
  ["workaround","What they do about it today"],
  ["cost","What it costs them (time, money, stress)"],
  ["words","How they describe it, in their own words"],
  ["buyer","Who decides or pays to fix it"],
  ["reach","Where we found them (how to reach more)"]
];
/* ---------------- helpers ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const opt = (v, cur, label) => `<option value="${esc(v)}"${String(v)===String(cur??"")?" selected":""}>${esc(label??v)}</option>`;
const today = () => new Date().toISOString().slice(0,10);
const pad = (n, w) => String(n).padStart(w, "0");
function nextId(prefix, list, width){
  let max = 0;
  for (const r of list){ const m = String(r.id).match(new RegExp("^" + prefix + "(\\d+)$")); if (m) max = Math.max(max, +m[1]); }
  return prefix + pad(max + 1, width);
}
function ago(ms){
  const s = (Date.now() - ms) / 1000;
  if (s < 90) return "just now";
  if (s < 3600) return Math.round(s/60) + " min ago";
  if (s < 86400) return Math.round(s/3600) + " h ago";
  return Math.round(s/86400) + " days ago";
}
function tierChip(t){ return t ? `<span class="chip tier ${TIER_CLASS[t]||""}">${esc(t)}</span>` : `<span class="chip gray">Not scored</span>`; }
function statusChip(s){ return `<span class="chip ${s==="Confirmed"?"ok":s==="Rejected"?"gray":"warn"}">${esc(s)}</span>`; }

/* Verbatim matching: is the quote really in the transcript, word for word? */
function quoteRegex(q){
  const t = String(q||"").trim().replace(/^["“”']+|["“”']+$/g,"").trim();
  if (t.length < 4) return null;
  const body = t.split(/\s+/).map(w => w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&").replace(/['’‘]/g,"['’‘]").replace(/["“”]/g,'["“”]')).join("\\s+");
  try { return new RegExp(body, "i"); } catch(e){ return null; }
}
function findInTranscript(quote, text){
  const re = quoteRegex(quote); if (!re || !text) return null;
  const m = re.exec(text); return m ? {start:m.index, end:m.index + m[0].length} : null;
}

/* ---------------- storage ---------------- */
const idb = {
  open(){ return new Promise((res, rej) => { const r = indexedDB.open("drm", 1); r.onupgradeneeded = () => r.result.createObjectStore("kv"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  async get(k){ const db = await this.open(); return new Promise(res => { const t = db.transaction("kv").objectStore("kv").get(k); t.onsuccess = () => res(t.result); t.onerror = () => res(undefined); }); },
  async set(k, v){ const db = await this.open(); return new Promise(res => { const t = db.transaction("kv","readwrite").objectStore("kv").put(v, k); t.onsuccess = () => res(); t.onerror = () => res(); }); }
};

const DIRS = {interviews:"interviews", evidence:"evidence", pains:"pain-scores", problems:"problems", jobs:"jobs", assumptions:"assumptions"};

class FolderStore {
  constructor(root){ this.root = root; this.kind = "folder"; this.name = root.name; this.stamps = null; }
  async dir(path, create=true){ let d = this.root; for (const p of path.split("/").filter(Boolean)) d = await d.getDirectoryHandle(p, {create}); return d; }
  async write(path, text){
    const parts = path.split("/"); const file = parts.pop();
    const d = await this.dir(parts.join("/"));
    const fh = await d.getFileHandle(file, {create:true});
    const w = await fh.createWritable(); await w.write(text); await w.close();
    if (this.stamps) this.stamps[path] = (await (await fh.getFile()).lastModified);
  }
  async read(path){
    try { const parts = path.split("/"); const file = parts.pop(); const d = await this.dir(parts.join("/"), false); const f = await (await d.getFileHandle(file)).getFile(); return await f.text(); }
    catch(e){ return null; }
  }
  async remove(path){ try { const parts = path.split("/"); const file = parts.pop(); const d = await this.dir(parts.join("/"), false); await d.removeEntry(file); delete (this.stamps||{})[path]; } catch(e){} }
  async isInitialized(){ return (await this.read("drm/config.json")) !== null; }
  async hasGit(){ try { await this.root.getDirectoryHandle(".git"); return true; } catch(e){ return false; } }
  async hasAiInstructions(){ return (await this.read("CLAUDE.md")) !== null; }
  async lastPush(){
    try {
      const g = await this.root.getDirectoryHandle(".git");
      const r = await (await (await g.getDirectoryHandle("refs")).getDirectoryHandle("remotes")).getDirectoryHandle("origin");
      for (const b of ["main","master"]) { try { const f = await (await r.getFileHandle(b)).getFile(); return f.lastModified; } catch(e){} }
    } catch(e){}
    return null;
  }
  /* Snapshot of every data file's modified time, so the app can notice when an AI assistant writes into the folder. */
  async scan(){
    const out = {};
    let drm; try { drm = await this.root.getDirectoryHandle("drm"); } catch(e){ return out; }
    for await (const [name, h] of drm.entries()){
      if (h.kind === "file"){ out["drm/" + name] = (await h.getFile()).lastModified; continue; }

  async loadAll(){

    for (const [key, dir] of Object.entries(DIRS)){

      for await (const [name, h] of d.entries()){

        catch(e){ S.unreadable.push(`drm/${dir}/${name}`); }

    }
    try {
      const d = await this.dir("drm/transcripts", false);
      for await (const [name, h] of d.entries()) if (h.kind === "file" && name.endsWith(".md")) S.transcripts[name.slice(0,-3)] = await (await h.getFile()).text();
    } catch(e){}
    try {
      const d = await this.dir("drm/notes", false);
      for await (const [name, h] of d.entries()) if (h.kind === "file" && name.endsWith(".md")){ const f = await h.getFile(); S.notes.push({name, text: await f.text(), modified: f.lastModified}); }
    } catch(e){}
    S.notes.sort((a, b) => b.modified - a.modified);
    this.stamps = await this.scan();
    return S;
  }
}

/* ---------------- calculations ---------------- */
function confirmedPains(){ return S.pains.filter(p => p.status === "Confirmed"); }
function hygieneIssues(iv){ return (Number(iv.leading) > 0 ? 1 : 0) + (iv.pitched === "Yes" ? 1 : 0) + (iv.demoed === "Yes" ? 1 : 0); }
function topTier(ivId){
  const tiers = confirmedPains().filter(p => p.interviewId === ivId).map(p => TIERS.indexOf(p.tier)).filter(i => i >= 0);
  return tiers.length ? TIERS[Math.min(...tiers)] : "";
}
function problemStats(pr){
  const ps = confirmedPains().filter(p => p.problemId === pr.id);
  const counts = Object.fromEntries(TIERS.map(t => [t, ps.filter(p => p.tier === t).length]));
  const n = ps.length; const top2 = counts["Hair on Fire"] + counts["Incremental Improvement"];
  const share = n ? top2 / n : 0;
  const minN = Number(S.config.minInterviews ?? 5), strong = Number(S.config.strongShare ?? 0.5);
  const signal = n < minN ? "Need more interviews" : share >= strong ? "Strong signal" : "Weak signal";
  const quotes = S.evidence.filter(e => e.problemId === pr.id && e.status === "Confirmed").length;
  return {n, counts, share, signal, quotes};
}
function freqScore(f){ const x = FREQ.find(([k]) => k === f); return x ? x[1] : null; }
function jobStats(j){
  const fs = freqScore(j.frequency), cs = j.consequence ? Number(j.consequence) : null;
  const priority = fs && cs ? fs * cs : null;
  const linked = S.evidence.filter(e => e.jobId === j.id && e.status === "Confirmed");
  const costQuote = linked.some(e => e.type === "Cost (time or money)");
  const checks = [["Named workaround", !!(j.workaround||"").trim()],["Specific moment", !!(j.moment||"").trim()],["How often", !!j.frequency],["Confirmed cost quote", costQuote],["Their own words", linked.length > 0]];
  return {fs, cs, priority, linked, checks, met: checks.filter(c => c[1]).length};
}
function rankedJobs(){
  return S.jobs.map(j => ({j, s:jobStats(j)})).filter(x => x.s.priority !== null)
    .sort((a, b) => b.s.priority - a.s.priority || b.s.met - a.s.met || a.j.id.localeCompare(b.j.id));
}
function confirmedQuoteIds(){ return new Set(S.evidence.filter(e => e.status === "Confirmed").map(e => e.id)); }
function metrics(){
  const iv = S.interviews, n = iv.length;
  const ff = iv.filter(i => i.source === "Friend or family").length;
  return {
    n, ff, ffShare: n ? ff / n : 0,
    recent: iv.filter(i => i.recentInstance === "Yes").length,
    hygiene: iv.filter(i => hygieneIssues(i) > 0).length,
    pitched: iv.filter(i => i.pitched === "Yes").length,
    demoed: iv.filter(i => i.demoed === "Yes").length,
    leading: iv.reduce((a, i) => a + (Number(i.leading) || 0), 0),
    rubric: iv.filter(i => i.rubricRun).length,
    confirmed: S.evidence.filter(e => e.status === "Confirmed").length,
    opinion: S.evidence.filter(e => e.status === "Confirmed" && e.type === "Opinion or future intent").length,
    candidates: S.evidence.filter(e => e.status === "Candidate").length + S.pains.filter(p => p.status === "Candidate").length,
    rejected: S.evidence.filter(e => e.status === "Rejected").length,
    hof: iv.filter(i => topTier(i.id) === "Hair on Fire").length,
    tierCounts: Object.fromEntries(TIERS.map(t => [t, confirmedPains().filter(p => p.tier === t).length]))
  };
}

function matchLabel(v, list){
  const t = String(v||"").trim().toLowerCase();
  return list.find(x => x.toLowerCase() === t) || list.find(x => t && (x.toLowerCase().startsWith(t) || t.startsWith(x.toLowerCase()))) || null;
}
const YN = v => { const t = String(v||"").trim().toLowerCase(); return t.startsWith("y") ? "Yes" : t.startsWith("n") ? "No" : ""; };

function parseRubric(text){
  const out = {hygiene:null, evidence:[], pains:[], skipped:[]};
  for (let raw of String(text||"").split(/\r?\n/)){
    let line = raw.trim();
    if (!line.includes("|") || line.startsWith("```")) continue;
    if (/^\|?[\s:\-|]+\|?$/.test(line)) continue;            // markdown table separator
    if (line.startsWith("|")) line = line.slice(1);
    if (line.endsWith("|")) line = line.slice(0, -1);
    let parts = line.split("|").map(s => s.trim());
    const head = parts[0].toLowerCase();
    if (/^(evidence id|interview id|specific recent)/.test(head)) continue;   // header rows
    if (/^-\s*evidence type/i.test(line) || line.startsWith("- ")) continue;   // stray instruction lines
    if (parts.length === 5 && YN(parts[0]) && !isNaN(parseInt(parts[1]))){
      out.hygiene = {recentInstance:YN(parts[0]), leading:parseInt(parts[1]), pitched:YN(parts[2]), demoed:YN(parts[3]), closing:YN(parts[4])};
    } else if (parts.length === 6 && matchLabel(parts[2], TIERS)){
      out.pains.push({aiInterview:parts[0], problemRef:parts[1], tier:matchLabel(parts[2], TIERS), evidenceIds:parts[3].split(/[,;\s]+/).filter(Boolean)});
    } else if (parts.length >= 9){
      const tail = parts.slice(-4); const quote = parts.slice(4, parts.length - 4).join("/");
      out.evidence.push({aiId:parts[0], problemRef:parts[2], jobRef:parts[3], quote:quote.replace(/^["“]|["”]$/g,"").trim(), where:tail[0], typeRaw:tail[1], type:matchLabel(tail[1], EVIDENCE_TYPES)});
    } else out.skipped.push(raw);
  }
  return out;
}

function planImport(iv, parsed){
  // Work out IDs, new problems and verbatim checks before anything is saved.
  const transcript = S.transcripts[iv.id] || "";
  const newProblems = []; const problemMap = {};
  let prList = [...S.problems];
  function resolveProblem(ref){
    const r = String(ref||"").trim(); if (!r) return "";
    if (problemMap[r] !== undefined) return problemMap[r];
    if (byId(S.problems, r)) return problemMap[r] = r;
    const m = r.match(/^NEW\s*:?\s*(.+)$/i);
    const text = m ? m[1].trim() : r;
    const same = prList.find(p => p.text.toLowerCase() === text.toLowerCase());
    if (same) return problemMap[r] = same.id;
    const id = nextId("PR-", prList, 2); const p = {id, text, who:""}; prList.push(p); newProblems.push(p);
    return problemMap[r] = id;
  }
  const idMap = {}; let evList = [...S.evidence];
  const evidence = parsed.evidence.map(e => {
    let id = e.aiId && /^[A-Za-z0-9_-]+$/.test(e.aiId) && e.aiId.startsWith(iv.id) && !byId(evList, e.aiId) ? e.aiId : null;
    if (!id) id = nextId(iv.id + "-Q", evList.filter(x => x.id.startsWith(iv.id + "-Q")), 2);
    idMap[e.aiId] = id;
    const rec = {id, interviewId:iv.id, problemId:resolveProblem(e.problemRef), jobId:byId(S.jobs, e.jobRef) ? e.jobRef : "", quote:e.quote, where:e.where, type:e.type || "", foundBy:"Claude Code", status:"Candidate", note: e.type ? "" : `AI type: ${e.typeRaw}`};
    evList.push(rec);
    rec._verbatim = !!findInTranscript(rec.quote, transcript);
    return rec;
  });
  const pains = parsed.pains.map(p => {
    const problemId = resolveProblem(p.problemRef);
    const id = `${iv.id}__${problemId}`;
    const existing = byId(S.pains, id);
    return {id, interviewId:iv.id, problemId, tier:p.tier, evidenceIds:p.evidenceIds.map(x => idMap[x] || x), scoredBy:"Claude Code", status:"Candidate", disagree:"", _skip: existing && existing.status === "Confirmed"};
  });
  return {hygiene:parsed.hygiene, evidence, pains, newProblems, skipped:parsed.skipped};
}

function applyImport(iv, plan, raw){
  for (const p of plan.newProblems) upsert("problems", {...p});
  for (const e of plan.evidence){ const r = {...e}; delete r._verbatim; upsert("evidence", r); }
  for (const p of plan.pains){ if (p._skip) continue; const r = {...p}; delete r._skip; upsert("pains", r); }
  const updated = {...iv, rubricRun:true, rubricRaw:raw};
  if (plan.hygiene) Object.assign(updated, plan.hygiene);
  upsert("interviews", updated);
}

/* Minimal markdown rendering for the in-app report preview */
function renderMd(md){
  const lines = md.split("\n"); let html = "", inTable = false, inList = false;
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/_(.+?)_/g,"<i>$1</i>").replace(/\[(.+?)\]\((.+?)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  for (const l of lines){
    if (l.startsWith("|")){
      if (/^\|[-| ]+\|$/.test(l)) continue;
      const cells = l.slice(1, -1).split("|").map(c => c.trim());
      if (!inTable){ html += "<table><tr>" + cells.map(c => `<th>${inline(c)}</th>`).join("") + "</tr>"; inTable = true; }
      else html += "<tr>" + cells.map(c => `<td>${inline(c)}</td>`).join("") + "</tr>";
      continue;
    } else if (inTable){ html += "</table>"; inTable = false; }
    if (l.startsWith("- ")){ if (!inList){ html += "<ul>"; inList = true; } html += `<li>${inline(l.slice(2))}</li>`; continue; }
    else if (inList){ html += "</ul>"; inList = false; }
    if (l.startsWith("### ")) html += `<h3>${inline(l.slice(4))}</h3>`;
    else if (l.startsWith("## ")) html += `<h2>${inline(l.slice(3))}</h2>`;
    else if (l.startsWith("# ")) html += `<h1>${inline(l.slice(2))}</h1>`;
    else if (l.startsWith("> ")) html += `<blockquote>${inline(l.slice(2))}</blockquote>`;
    else if (l === "---") html += "<hr>";
    else if (l.trim()) html += `<p>${inline(l)}</p>`;
  }
  if (inTable) html += "</table>"; if (inList) html += "</ul>";
  return html;
}

const ASSUMPTION_KINDS = {
  problem:     {label:"Problem",     test:"Confirmed pain scores on this problem"},

  alternative: {label:"Alternative", test:"Quotes you tag as supporting or contradicting"},

const STATUS_ORDER = {"Contradicted":0, "Shaky":1, "Untested":2, "Holding up":3};

const PS_FIELDS = [
  ["who","", "A customer like"], ["context","when they are", "in the situation"], ["problem","struggle to", "the struggle"],
  ["cause","because", "the reason"], ["impact","which costs them", "what it costs them"]
];
const VP_FIELDS = [["who","If we help"], ["what","solve"], ["how","with"], ["over","they will choose it over"], ["why","because"]];

}

/* Seed assumptions from the snapshot. Idempotent: each seed has a key; existing ones are kept. */
function seedAssumptions(){
  const seeds = [];
  for (const p of S.problems) seeds.push({key:"problem:" + p.id, kind:"problem", problemId:p.id, text:`${p.who ? p.who : "Our customers"} have this problem: ${p.text}`});
  const ideal = idealCustomer();
  if (ideal) seeds.push({key:"customer:" + ideal.id, kind:"customer", customerId:ideal.id, text:`${ideal.text} feel this problem more than the other segments and are the right first customer`});
  for (const a of S.compass.alternatives || []) seeds.push({key:"alt:" + a.id, kind:"alternative", alternativeId:a.id, text:`${a.name} doesn't solve it well enough${a.gap ? ": " + a.gap : ""}`});
  if (S.compass.solution) seeds.push({key:"solution", kind:"solution", text:`Customers would switch their current workaround for: ${S.compass.solution}`});
  if (S.compass.valueProp.why) seeds.push({key:"value", kind:"value", text:`They would choose us over ${S.compass.valueProp.over || "the alternatives"} because ${S.compass.valueProp.why}`});
  let added = 0;
  for (const s of seeds){
    if (S.assumptions.some(a => a.seed === s.key)) continue;
    const id = nextId("A-", S.assumptions, 2);
    upsert("assumptions", {id, seed:s.key, kind:s.kind, text:s.text, problemId:s.problemId || "", customerId:s.customerId || "", alternativeId:s.alternativeId || "", impact:"", uncertainty:"", aiImpact:"", aiUncertainty:"", aiReason:"", evidence:[], note:"", status:"Active", foundBy:"Founder"});

}

/* Evidence-based status. This is the part that differs from score-based tools: the reading comes from discovery data. */
function assumptionStatus(a){

    const ps = confirmed.filter(p => p.problemId === a.problemId);

    if (n < minN) return {status:"Untested", why:`${n} of ${minN} confirmed interviews scored on this problem`, n, share};
    if (share >= strong) return {status:"Holding up", why:`${top2} of ${n} interviews are Hair on Fire or Incremental (${Math.round(share*100)}%)`, n, share};
    if (share <= 0.2) return {status:"Contradicted", why:`Only ${top2} of ${n} interviews show real pain (${Math.round(share*100)}%)`, n, share};
    return {status:"Shaky", why:`${top2} of ${n} interviews show real pain (${Math.round(share*100)}%), below your ${Math.round(strong*100)}% bar`, n, share};
  }
  if (a.kind === "customer" && a.customerId){

    const mine = bySeg[a.customerId] || []; const untagged = (bySeg["?"] || []).length;
    if (mine.length < 3) return {status:"Untested", why:`${mine.length} of 3 confirmed scores from this segment${untagged ? ` (${untagged} interviews have no segment yet)` : ""}`, n:mine.length};
    const others = Object.entries(bySeg).filter(([k]) => k !== a.customerId && k !== "?").map(([k, ps]) => ({k, share:share(ps), n:ps.length})).filter(o => o.n >= 3);
    const best = others.sort((x, y) => y.share - x.share)[0];
    const s = share(mine);
    if (best && best.share >= s + 0.25){ const c = byId(S.compass.customers, best.k); return {status:"Contradicted", why:`${c ? c.text : best.k} shows more pain (${Math.round(best.share*100)}% vs ${Math.round(s*100)}%)`, n:mine.length, share:s}; }
    if (s >= strong) return {status:"Holding up", why:`${Math.round(s*100)}% of this segment's scores show real pain${best ? `, ahead of ${Math.round(best.share*100)}% elsewhere` : ""}`, n:mine.length, share:s};
    return {status:"Shaky", why:`Only ${Math.round(s*100)}% of this segment's scores show real pain`, n:mine.length, share:s};
  }

  if (sup >= 3 && sup >= 2 * con) return {status:"Holding up", why:`${sup} quotes for, ${con} against`, n:ev.length};
  return {status:"Shaky", why:`${sup} for, ${con} against; not enough yet`, n:ev.length};
}

/* ---------------- routing + rendering ---------------- */
function route(){ const h = location.hash.replace(/^#\/?/, "") || "home"; const [page, id] = h.split("/"); return {page, id: id ? decodeURIComponent(id) : null}; }
function go(h){ location.hash = "#/" + h; }
window.addEventListener("hashchange", () => { ui.drawer = null; ui.askFor = null; render(); });
document.addEventListener("keydown", ev => { if (ev.key === "Escape" && (ui.drawer || ui.askFor)){ ui.drawer = null; ui.askFor = null; render(); } });

function shell(content){
  const m = metrics(); const r = route(); const demo = store.kind === "demo";
  const link = (h, label, badge) => { const on = h.includes("/") ? (r.page + "/" + (r.id || "")) === h : r.page === h; return `<a href="#/${h}" class="${on ? "on" : ""}"><span>${label}</span>${badge || ""}</a>`; };
  const group = (key, title, items, pending) => {
    const closed = !!ui.collapsed[key]; const active = items.some(([h]) => h.split("/")[0] === r.page);
    return `<button class="grp ${closed ? "closed" : ""} ${closed && active ? "has-active" : ""}" data-act="toggleGroup" data-grp="${key}" aria-expanded="${!closed}"><span class="chev">▾</span>${esc(title)}${closed && pending ? `<span class="pill">${pending}</span>` : ""}</button>
      ${closed ? "" : items.map(([h, l, b]) => link(h, l, b)).join("")}`;
  };
  const foot = demo ? "Demo data. Nothing is saved." : `Folder <b>${esc(store.name)}</b><br>${saveErr ? `<span class="err">Save failed: ${esc(saveErr)}</span>` : savedAt ? "Saved " + ago(savedAt) : "Changes save automatically"}<br>${lastPush ? "Pushed " + ago(lastPush) : "Not pushed yet"}${aiReady === false ? `<br><span class="err">CLAUDE.md missing: your AI won't know the rules</span>` : ""}`;
  return `${demo ? `<div class="banner"><b>Demo.</b> A fictional founder's DRM. Nothing is saved. <button class="btn link" data-act="leave">Open your own folder</button></div>` : ""}
  <div class="app" style="${demo ? "height:calc(100vh - 37px)" : ""}">
    <aside class="side">
      <div class="brand"><b>${esc(S.config.venture || "Discovery Records")}</b><span>${esc(S.config.founder || "Discovery Records Manager")}</span></div>
      <nav class="nav">
        ${link("home","Home")}
        ${group("compass", "Compass: what you believe", [
          ["compass/snapshot","1. Snapshot"], ["compass/statements","2. Statements"],
          ["compass/assumptions","3. Riskiest assumptions", (() => { const c = compassReadout(); return c.candidates ? `<span class="pill">${c.candidates}</span>` : c.counts.Contradicted ? `<span class="chip bad">${c.counts.Contradicted}</span>` : ""; })()]
        ], compassReadout().candidates)}
        ${group("l1", "Validate: Level 1, Problem", [
          ["problems","Problems", `<span class="count">${S.problems.length}</span>`],
          ["interviews","Interviews", `<span class="count">${S.interviews.length}</span>`],
          ["review","Review suggestions", m.candidates ? `<span class="pill">${m.candidates}</span>` : ""],
          ["quotes","All quotes"], ["persona","Customer persona"]
        ], m.candidates)}
        ${group("l2", "Validate: Level 2, Jobs", [["jobs","Jobs"], ["mvp","MVP scope"]])}
        ${group("ai", "Your AI", [["ask","Ask your AI"], ["notes","AI notes", S.notes.length ? `<span class="count">${S.notes.length}</span>` : ""]])}
        ${group("help", "Help", [["guide","Pain Scale"], ["report","Coach report"], ["settings","Settings"]])}
      </nav>
      <div class="sidefoot">${foot}</div>
    </aside>
    <main class="main"><div class="page">${content}</div></main>
  </div>`;
}

function render(){
  const root = $("#root");
  if (!store){ root.innerHTML = welcomeView(); return; }
  if (store.needsSetup){ root.innerHTML = setupView(); return; }
  const r = route();
  const views = {home:dashView, compass:compassView, interviews:r.id ? interviewView : interviewsView, review:reviewView, quotes:quotesView, problems:r.id ? problemView : problemsView, persona:personaView, jobs:jobsView, mvp:mvpView, ask:askView, notes:notesView, guide:guideView, report:reportView, settings:settingsView};
  const scrollEl = document.querySelector(".main"); const keep = scrollEl && root.dataset.page === location.hash ? scrollEl.scrollTop : 0;
  root.innerHTML = shell((views[r.page] || dashView)(r.id)) + (ui.drawer ? drawerView() : "") + (ui.askFor ? askPanel() : "");
  root.dataset.page = location.hash;
  const m2 = document.querySelector(".main"); if (m2) m2.scrollTop = keep;
  if (ui.drawer && ui.drawerScroll){ const f = document.querySelector(".drawer .focus-mark, .drawer .near"); if (f) f.scrollIntoView({block:"center"}); ui.drawerScroll = false; }
}

/* ---------------- small building blocks ---------------- */
function tierChip(t){ return t ? `<span class="chip tier ${TIER_CLASS[t]||""}">${esc(t)}</span>` : `<span class="chip gray">Not scored</span>`; }
function statusChip(s){ return `<span class="chip ${s==="Confirmed"?"ok":s==="Rejected"?"gray":"warn"}">${esc(s)}</span>`; }
function signalChip(s){ return `<span class="chip ${s === "Strong signal" ? "ok" : s === "Weak signal" ? "bad" : "gray"}">${esc(s)}</span>`; }
function sourceChip(f){ return f ? `<span class="ai">${esc(f === "AI candidate" ? "AI" : f)}</span>` : ""; }
const W = (cls, n, l, h) => `<div class="metric ${cls}"><div class="n">${n}</div><div class="l">${l}</div>${h ? `<div class="h">${h}</div>` : ""}</div>`;

function quoteCard(e, transcript, opts = {}){
  const found = transcript != null ? !!findInTranscript(e.quote, transcript) : null;
  const pr = byId(S.problems, e.problemId); const iv = byId(S.interviews, e.interviewId);
  const who = iv ? [iv.interviewee, iv.role].filter(Boolean).join(", ") : "";
  return `<div class="q s-${esc(e.status)} ${opts.compact ? "compact" : ""}" id="q-${esc(e.id)}">
    <div class="spread" style="align-items:flex-start"><div class="words" style="flex:1">${esc(e.quote)}</div>
      <div class="acts">${e.status !== "Rejected" ? `<button class="btn icon no" title="Reject" data-act="setStatus" data-kind="evidence" data-id="${esc(e.id)}" data-val="Rejected">✕</button>` : ""}${e.status !== "Confirmed" ? `<button class="btn icon yes" title="Confirm" data-act="setStatus" data-kind="evidence" data-id="${esc(e.id)}" data-val="Confirmed">✓</button>` : ""}</div></div>
    <div class="meta">
      ${opts.showInterview ? `<a href="#/interviews/${esc(e.interviewId)}" class="who" style="text-decoration:none"><b>${esc(e.interviewId)}</b>${who ? " · " + esc(who) : ""}</a>` : ""}
      ${statusChip(e.status)}
      ${found === true ? `<span class="chip ok">Word for word</span>` : found === false ? `<span class="chip bad" title="The exact words aren't in the transcript. Check before confirming.">Not in transcript</span>` : ""}
      ${e.status === "Candidate" ? sourceChip(e.foundBy) : ""}
      <select class="inline" data-act="evField" data-id="${esc(e.id)}" data-field="type"><option value="">Type?</option>${EVIDENCE_TYPES.map(t => opt(t, e.type)).join("")}</select>
      <select class="inline" data-act="evField" data-id="${esc(e.id)}" data-field="problemId"><option value="">No problem</option>${S.problems.map(p => opt(p.id, e.problemId, p.id)).join("")}</select>
      ${S.jobs.length ? `<select class="inline" data-act="evField" data-id="${esc(e.id)}" data-field="jobId"><option value="">No job</option>${S.jobs.map(j => opt(j.id, e.jobId, j.id)).join("")}</select>` : ""}
      ${e.where ? `<span>at ${esc(e.where)}</span>` : ""}
      ${e.type === "Opinion or future intent" ? `<span class="chip warn">Weak evidence</span>` : ""}
      ${transcript ? (opts.inInterview ? `<button class="btn link small" data-act="jump" data-id="${esc(e.id)}">Show in transcript</button>` : `<button class="btn sm" data-act="openDrawer" data-id="${esc(e.id)}">View in transcript</button>`) : ""}
    </div>
    ${pr && opts.showProblem ? `<div class="ctx">${esc(pr.id)}: ${esc(pr.text)}</div>` : ""}
    ${e.note ? `<div class="ctx">${esc(e.note)}</div>` : ""}
  </div>`;
}

function painCard(p, opts = {}){
  const pr = byId(S.problems, p.problemId);
  const ev = (p.evidenceIds || []).map(id => byId(S.evidence, id)).filter(Boolean);
  return `<div class="card"><div class="spread"><div>${opts.showInterview ? `<a href="#/interviews/${esc(p.interviewId)}"><b>${esc(p.interviewId)}</b></a> on ` : ""}<b>${esc(p.problemId)}</b> ${esc(pr ? pr.text : "")}</div>
    <div class="row">${p.status === "Candidate" ? sourceChip(p.scoredBy) : ""}${statusChip(p.status)}${p.status !== "Rejected" ? `<button class="btn icon no" title="Reject" data-act="setStatus" data-kind="pains" data-id="${esc(p.id)}" data-val="Rejected">✕</button>` : ""}${p.status !== "Confirmed" ? `<button class="btn icon yes" title="Confirm" data-act="setStatus" data-kind="pains" data-id="${esc(p.id)}" data-val="Confirmed">✓</button>` : ""}</div></div>
    <div class="row" style="margin:10px 0 6px">${TIERS.map(t => `<button class="btn sm ${p.tier === t ? TIER_CLASS[t] : ""}" style="${p.tier === t ? "font-weight:600;border-color:#8a8a8a" : ""}" data-act="setTier" data-id="${esc(p.id)}" data-val="${esc(t)}">${esc(t)}</button>`).join("")}</div>
    <div class="hint">${esc(TIER_DEF[p.tier] || "Pick the tier this person's behavior supports.")}</div>
    ${ev.length ? `<div style="margin-top:10px">${ev.map(e => quoteCard(e, S.transcripts[e.interviewId] ?? null, {compact:true})).join("")}</div>` : `<p class="hint">No supporting quotes linked.</p>`}
    ${ev.some(e => e.status !== "Confirmed") ? `<div class="notice warn" style="margin-top:4px">Some supporting quotes aren't confirmed yet.</div>` : ""}
    <label class="f" style="margin:10px 0 0">If you changed the tier, say why<input type="text" data-act="painDisagree" data-id="${esc(p.id)}" value="${esc(p.disagree||"")}"></label>
  </div>`;
}

function highlight(text, quotes, focusId, near){
  const ranges = [];
  for (const e of quotes){ if (e.status === "Rejected" && e.id !== focusId) continue; const r = findInTranscript(e.quote, text); if (r) ranges.push({...r, e}); }
  if (near) ranges.push(near);
  ranges.sort((a, b) => a.start - b.start);
  let out = "", pos = 0;
  for (const r of ranges){
    if (r.start < pos) continue;
    const inner = esc(text.slice(r.start, r.end));
    out += esc(text.slice(pos, r.start)) + (r.e ? `<mark class="s-${r.e.status}${r.e.id === focusId ? " focus-mark" : ""}" data-act="jump" data-id="${esc(r.e.id)}" id="m-${esc(r.e.id)}">${inner}</mark>` : `<span class="near" title="Around where the AI said this quote is">${inner}</span>`);
    pos = r.end;
  }
  return out + esc(text.slice(pos));
}
function nearRange(e, text){
  const w = String(e.where || "").trim(); if (w.length < 3 || !text) return null;
  const i = text.toLowerCase().indexOf(w.toLowerCase()); if (i < 0) return null;
  const start = text.lastIndexOf("\n", i) + 1; let end = text.indexOf("\n", i); if (end < 0) end = text.length;
  return {start, end};
}
function drawerView(){
  const e = byId(S.evidence, ui.drawer); if (!e) return "";
  const iv = byId(S.interviews, e.interviewId) || {id:e.interviewId}; const text = S.transcripts[e.interviewId] || "";
  const found = !!findInTranscript(e.quote, text); const near = found ? null : nearRange(e, text);
  const queue = S.evidence.filter(x => x.status === "Candidate").sort((a, b) => a.id.localeCompare(b.id, undefined, {numeric:true}));
  const next = queue.find(x => x.id !== e.id && x.id.localeCompare(e.id, undefined, {numeric:true}) > 0) || queue.find(x => x.id !== e.id);
  return `<div class="scrim" data-act="closeDrawer"></div><aside class="drawer" role="dialog" aria-label="Transcript">
    <div class="dh"><div class="spread"><div><b>${esc(iv.id)}</b> ${esc(iv.interviewee || "")}<div class="hint">${esc([iv.role, iv.date].filter(Boolean).join(", "))}</div></div>
      <div class="row">${next ? `<button class="btn sm" data-act="openDrawer" data-id="${esc(next.id)}">Next suggestion</button>` : ""}<a class="btn sm" href="#/interviews/${esc(iv.id)}">Open interview</a><button class="btn icon" data-act="closeDrawer" title="Close (Esc)">✕</button></div></div>
      <div style="margin-top:12px">${quoteCard(e, text, {inInterview:true})}</div>
      ${found ? "" : `<div class="notice bad">These exact words aren't in the transcript, so the AI may have changed them. ${near ? "The dashed line is where it said the quote came from." : "Read the transcript before confirming."}</div>`}
    </div>
    <div class="db"><div class="transcript">${text ? highlight(text, S.evidence.filter(x => x.interviewId === e.interviewId), e.id, near) : `<p class="empty">No transcript saved for this interview.</p>`}</div></div>
  </aside>`;
}

function problemProgress(p){

function nextStep(m){
  if (!S.problems.length || !idealCustomer()) return ["Fill in your Compass snapshot: the problem you believe exists and who you'd bet has it.", "compass/snapshot", "Open the Compass"];
  if (!S.assumptions.length) return ["Turn your snapshot into assumptions and rate them.", "compass/assumptions", "Open assumptions"];
  { const c = compassReadout(); if (c.riskiestOpen && !S.interviews.length) return [`Your riskiest untested assumption: ${c.riskiestOpen.a.text}. Interviews will test it.`, "interviews", "Log an interview"]; }
  if (!S.interviews.length) return ["Log your first customer interview and paste the transcript.", "interviews", "Log an interview"];
  if (m.candidates) return [`Review ${m.candidates} suggestion${m.candidates>1?"s":""} from your AI. Only confirmed items count.`, "review", "Review now"];
  const noRubric = S.interviews.find(i => !i.rubricRun);

}

  const sorted = [...conf].sort((a, b) => (b.problemId === P.problemId) - (a.problemId === P.problemId));
  return `<h1>Customer persona</h1><p class="lede">Level 1 deliverable. Every line needs a confirmed quote behind it. A line with no quote is still a guess.</p>
  <div class="card row"><label class="f" style="margin:0;min-width:320px">Problem this persona has<select data-act="personaProblem"><option value=""></option>${S.problems.map(p => opt(p.id, P.problemId, p.id + ": " + p.text)).join("")}</select></label>

  ${PERSONA_FIELDS.map(([k, label]) => {
    const f = P.fields[k] || {text:"", evidence:[]}; const ev = (f.evidence||[]).map(id => byId(S.evidence, id)).filter(e => e && e.status === "Confirmed");
    const state = !f.text ? `<span class="chip gray">Not filled in</span>` : ev.length ? `<span class="chip ok">Backed by ${ev.length} quote${ev.length>1?"s":""}</span>` : `<span class="chip bad">A guess: add a quote</span>`;
    return `<div class="card"><div class="spread"><h3>${esc(label)}</h3>${state}</div>
      <textarea data-act="personaText" data-key="${k}" style="width:100%;min-height:54px">${esc(f.text)}</textarea>

function jobsView(){

    <div class="spread"><div class="row"><span class="mono muted">${esc(j.id)}</span>${ranks[j.id] ? `<span class="chip blue">Rank ${ranks[j.id]}</span>` : ""}${s.priority ? `<span class="chip gray">Priority ${s.priority}</span>` : ""}<span class="chip ${s.met >= 4 ? "ok" : s.met >= 2 ? "warn" : "bad"}">${s.met} of 5 checks</span></div>

      <label class="f">Linked problem<select data-act="jobField" data-id="${esc(j.id)}" data-field="problemId"><option value=""></option>${S.problems.map(p => opt(p.id, j.problemId, p.id)).join("")}</select></label>
      <label class="f">How often<select data-act="jobField" data-id="${esc(j.id)}" data-field="frequency"><option value=""></option>${FREQ.map(([f]) => opt(f, j.frequency)).join("")}</select></label>

}

  <div class="card"><h3>Say-no list</h3>${no.length ? `<ul style="margin:0;padding-left:20px">${no.map(j => `<li>${esc(j.statement)} ${j.why ? `<span class="muted">(${esc(j.why)})</span>` : `<span class="chip bad">Reason missing</span>`}</li>`).join("")}</ul>` : `<p class="muted" style="margin:0">Nothing on it yet. Saying no out loud is part of the deliverable.</p>`}</div>`;

/* ---------------- events ---------------- */
function toast(msg, undo){
  ui.toast = {msg, undo};
  let t = document.getElementById("toast");
  if (!t){ t = document.createElement("div"); t.id = "toast"; t.className = "toast"; document.body.appendChild(t); }
  t.innerHTML = `<span>${esc(msg)}</span>${undo ? `<button data-act="undo">Undo</button>` : ""}`; t.style.display = "flex";
  clearTimeout(toast.t); toast.t = setTimeout(hideToast, 5000);
}
function hideToast(){ ui.toast = null; const t = document.getElementById("toast"); if (t) t.style.display = "none"; }
async function copy(text, msg){ try { await navigator.clipboard.writeText(text); toast(msg || "Copied."); } catch(e){ prompt("Copy this:", text); } }

document.addEventListener("click", async ev => {
  const rowLink = ev.target.closest("tr[data-href]");
  if (rowLink && !ev.target.closest("a,button,select,input")) { go(rowLink.dataset.href); return; }
  const el = ev.target.closest("[data-act]"); if (!el || el.tagName === "SELECT" || el.tagName === "INPUT" || el.tagName === "TEXTAREA") return;
  if (el.tagName === "A" && !el.getAttribute("href").startsWith("#/")) ev.preventDefault();
  const a = el.dataset.act; const r = route();
  if (a === "demo"){ store = new MemoryStore(); S = demoState(); aiReady = true; go("home"); render(); }
  else if (a === "open") await openFolder(false);
  else if (a === "reopen") await openFolder(true);
  else if (a === "leave"){ stopWatching(); store = null; S = emptyState(); ui.savedHandle = await idb.get("root").catch(() => null); location.hash = ""; render(); }
  else if (a === "undo"){ const u = ui.toast && ui.toast.undo; hideToast(); if (u) u(); render(); }
  else if (a === "hideChecklist"){ ui.hideChecklist = true; localStorage.setItem("drm-hide-checklist", "1"); render(); }
  else if (a === "showChecklist"){ ui.hideChecklist = false; localStorage.removeItem("drm-hide-checklist"); go("home"); }
  else if (a === "toggleGroup"){ const k = el.dataset.grp; ui.collapsed[k] = !ui.collapsed[k]; try { localStorage.setItem("drm-collapsed", JSON.stringify(ui.collapsed)); } catch(e){} render(); }
  else if (a === "newInterview"){ const id = nextId("INT-", S.interviews, 3); upsert("interviews", {id, date:today(), interviewee:"", role:"", customerId:"", source:"", interviewer:S.config.founder || "", recentInstance:"", leading:"", pitched:"", demoed:"", closing:"", rubricRun:false, notes:"", coachingNote:""}); ui.tab[id] = "quotes"; go("interviews/" + id); }
  else if (a === "tab"){ ui.tab[r.id] = el.dataset.tab; ui.editTranscript = false; render(); }
  else if (a === "seg"){ const iv = byId(S.interviews, r.id); upsert("interviews", {...iv, [el.dataset.field]: iv[el.dataset.field] === el.dataset.val ? "" : el.dataset.val}); render(); }
  else if (a === "editTranscript"){ ui.editTranscript = true; render(); }
  else if (a === "saveTranscript"){ const t = $("#transcriptBox").value; delete ui.drafts.transcript[r.id]; S.transcripts[r.id] = t; persist("transcript", {id:r.id, text:t}); ui.editTranscript = false; render(); toast("Transcript saved. Now ask your AI to review it."); }
  else if (a === "askFor"){ ui.askFor = el.dataset.id; render(); }
  else if (a === "closeAsk"){ ui.askFor = null; render(); }
  else if (a === "copyText") await copy(el.dataset.text, "Copied. Paste it into your AI assistant.");
  else if (a === "copyPrompt"){ const iv = byId(S.interviews, ui.askFor || r.id); if (!S.transcripts[iv.id]){ toast("Save the transcript first, so the prompt can include it."); return; } await copy(rubricPrompt(iv), "Copied. Paste it into any AI chat."); }
  else if (a === "copyGeneric") await copy(rubricPrompt(null), "Copied.");
  else if (a === "previewImport"){ const iv = byId(S.interviews, ui.askFor || r.id); const raw = $("#rubricBox").value; const parsed = parseRubric(raw);
    if (!parsed.evidence.length && !parsed.pains.length && !parsed.hygiene){ toast("Couldn't find any review rows. Paste the AI's full reply, including the code blocks."); return; }
    ui.importPreview = {ivId:iv.id, raw, plan:planImport(iv, parsed)}; render(); }
  else if (a === "cancelImport"){ ui.importPreview = null; delete ui.drafts.rubric[ui.askFor || r.id]; render(); }
  else if (a === "doImport"){ const iv = byId(S.interviews, ui.importPreview.ivId); const p = ui.importPreview.plan; applyImport(iv, p, ui.importPreview.raw); ui.importPreview = null; delete ui.drafts.rubric[iv.id]; ui.askFor = null; ui.tab[iv.id] = "quotes"; go("interviews/" + iv.id); render();
    toast(`Imported ${p.evidence.length} quotes and ${p.pains.filter(x => !x._skip).length} pain scores as suggestions.`); }
  else if (a === "setStatus"){ const kind = el.dataset.kind; const rec = byId(S[kind], el.dataset.id); const prev = rec.status; upsert(kind, {...rec, status:el.dataset.val}); render();
    toast(`${el.dataset.val === "Confirmed" ? "Confirmed" : "Rejected"} ${kind === "pains" ? "pain score" : el.dataset.id}.`, () => upsert(kind, {...byId(S[kind], rec.id), status:prev})); }
  else if (a === "setTier"){ const p = byId(S.pains, el.dataset.id); upsert("pains", {...p, tier:el.dataset.val, scoredBy: p.tier !== el.dataset.val ? "Founder" : p.scoredBy}); render(); }
  else if (a === "addPain"){ const sel = $("#newPainProblem"); if (!sel || !sel.value) return; upsert("pains", {id:`${r.id}__${sel.value}`, interviewId:r.id, problemId:sel.value, tier:"", evidenceIds:[], scoredBy:"Founder", status:"Confirmed", disagree:""}); render(); }
  else if (a === "addQuote"){ ui.addQuote = r.id; render(); }
  else if (a === "cancelQuote"){ ui.addQuote = null; render(); }
  else if (a === "openDrawer"){ ui.drawer = el.dataset.id; ui.drawerScroll = true; render(); }
  else if (a === "closeDrawer"){ ui.drawer = null; render(); }
  else if (a === "jump" && ui.drawer){ const mk = document.querySelector(".drawer #m-" + CSS.escape(el.dataset.id)); if (mk) mk.scrollIntoView({behavior:"smooth", block:"center"}); }
  else if (a === "jump"){ const c = el.tagName === "MARK" ? document.getElementById("q-" + el.dataset.id) : document.getElementById("m-" + el.dataset.id); if (c){ c.scrollIntoView({behavior:"smooth", block:"center"}); c.classList.add("focus"); setTimeout(() => c.classList.remove("focus"), 1500); } }
  else if (a === "deleteInterview"){ if (!confirm("Delete this interview, its transcript, quotes and pain scores?")) return; const id = r.id;
    for (const e of S.evidence.filter(e => e.interviewId === id)) removeRec("evidence", e.id);
    for (const p of S.pains.filter(p => p.interviewId === id)) removeRec("pains", p.id);
    removeRec("interviews", id); delete S.transcripts[id]; store.remove(`drm/transcripts/${id}.md`); go("interviews"); }
  else if (a === "deleteProblem"){ removeRec("problems", el.dataset.id); go("problems"); }
  else if (a === "personaUnlink"){ const f = S.persona.fields[el.dataset.key]; f.evidence = f.evidence.filter(x => x !== el.dataset.id); persist("persona"); render(); }
  else if (a === "go") go(el.dataset.href);
  else if (a === "cAdd"){ const k = el.dataset.kind; const list = S.compass[k] = S.compass[k] || []; const id = nextId(k === "customers" ? "C-" : "ALT-", list, 2); list.push(k === "customers" ? {id, text:"", why:"", ideal:!list.some(c => c.ideal)} : {id, name:"", what:"", gap:""}); persist("compass"); render(); }
  else if (a === "cRemove"){ const k = el.dataset.kind; S.compass[k] = (S.compass[k]||[]).filter(x => x.id !== el.dataset.id); persist("compass"); render(); }
  else if (a === "seedAssumptions"){ const n = seedAssumptions(); render(); toast(n ? `Added ${n} assumption${n > 1 ? "s" : ""} from your snapshot. Now rate each one.` : "Nothing new to add. Everything in the snapshot already has an assumption."); }
  else if (a === "newAssumption"){ const id = nextId("A-", S.assumptions, 2); upsert("assumptions", {id, seed:"", kind:"solution", text:"", problemId:"", customerId:"", alternativeId:"", impact:"", uncertainty:"", aiImpact:"", aiUncertainty:"", aiReason:"", evidence:[], note:"", status:"Active", foundBy:"Founder"}); render(); }
  else if (a === "aScale"){ const x = byId(S.assumptions, el.dataset.id); upsert("assumptions", {...x, [el.dataset.field]: Number(el.dataset.val)}); render(); }
  else if (a === "aStatus"){ const x = byId(S.assumptions, el.dataset.id); upsert("assumptions", {...x, status: el.dataset.val}); render(); }
  else if (a === "aStance"){ const x = byId(S.assumptions, el.dataset.id); upsert("assumptions", {...x, evidence:(x.evidence||[]).map(t => t.id === el.dataset.eid ? {...t, stance:el.dataset.val} : t)}); render(); }
  else if (a === "aUntag"){ const x = byId(S.assumptions, el.dataset.id); upsert("assumptions", {...x, evidence:(x.evidence||[]).filter(t => t.id !== el.dataset.eid)}); render(); }
  else if (a === "newJob"){ const id = nextId("JB-", S.jobs, 2); upsert("jobs", {id, statement:"", type:"", problemId:S.persona.problemId || "", workaround:"", moment:"", frequency:"", consequence:"", decision:"Undecided", why:""}); render(); }
  else if (a === "exportJson"){ const blob = new Blob([JSON.stringify(S, null, 2)], {type:"application/json"}); const u = URL.createObjectURL(blob); const l = document.createElement("a"); l.href = u; l.download = `drm-backup-${today()}.json`; l.click(); URL.revokeObjectURL(u); }
});

document.addEventListener("change", ev => {
  const el = ev.target; const a = el.dataset.act; const r = route();
  if (a === "cIdeal"){ for (const c of S.compass.customers) c.ideal = c.id === el.dataset.id; persist("compass"); render(); }
  else if (a === "aTag"){ if (!el.value) return; const x = byId(S.assumptions, el.dataset.id); upsert("assumptions", {...x, evidence:[...(x.evidence||[]), {id:el.value, stance:"supports"}]}); render(); }
  else if (a === "evField"){ const e = byId(S.evidence, el.dataset.id); upsert("evidence", {...e, [el.dataset.field]: el.value}); render(); }
  else if (a === "filter"){ ui.filters[el.dataset.key] = el.value; render(); }
  else if (a === "personaProblem"){ S.persona.problemId = el.value; persist("persona"); render(); }
  else if (a === "personaLink"){ if (!el.value) return; const f = S.persona.fields[el.dataset.key]; f.evidence = [...(f.evidence||[]), el.value]; persist("persona"); render(); }
  else if (a === "jobField"){ const j = byId(S.jobs, el.dataset.id); upsert("jobs", {...j, [el.dataset.field]: el.value}); render(); }
  else if (el.dataset.field === "leading"){ const iv = byId(S.interviews, r.id); upsert("interviews", {...iv, leading: el.value === "" ? "" : Number(el.value)}); render(); }
});

// Text fields save after a short pause, and immediately when you leave the field. Pasted transcripts and AI replies are kept as drafts until used.
const typeTimers = new WeakMap();
function saveTextField(el){
  const a = el.dataset.act; const form = el.closest("form[data-form]"); const r = route();
  if (a === "cField"){ S.compass[el.dataset.field] = el.value; persist("compass"); }
  else if (a === "cItem"){ const it = byId(S.compass[el.dataset.kind]||[], el.dataset.id); if (it){ it[el.dataset.field] = el.value; persist("compass"); } }
  else if (a === "cStmt"){ S.compass[el.dataset.stmt][el.dataset.field] = el.value; persist("compass"); }
  else if (a === "aText"){ const x = byId(S.assumptions, el.dataset.id); if (x) upsert("assumptions", {...x, text:el.value}); }
  else if (a === "pField"){ const p = byId(S.problems, el.dataset.id); if (p) upsert("problems", {...p, [el.dataset.field]: el.value}); }
  else if (a === "personaText"){ S.persona.fields[el.dataset.key].text = el.value; persist("persona"); }
  else if (a === "jobText"){ const j = byId(S.jobs, el.dataset.id); if (j) upsert("jobs", {...j, [el.dataset.field]: el.value}); }
  else if (a === "painDisagree"){ const p = byId(S.pains, el.dataset.id); if (p) upsert("pains", {...p, disagree: el.value}); }
  else if (form && form.dataset.form === "interview"){ const iv = byId(S.interviews, r.id); if (iv) upsert("interviews", {...iv, ...Object.fromEntries(new FormData(form))}); }
  else if (form && form.dataset.form === "problem"){ const p = byId(S.problems, r.id); if (p) upsert("problems", {...p, ...Object.fromEntries(new FormData(form))}); }
  else if (form && form.dataset.form === "config"){ const d = Object.fromEntries(new FormData(form)); S.config = {...S.config, founder:d.founder, venture:d.venture, coach:d.coach, minInterviews:Number(d.minInterviews) || 5, strongShare:(Number(d.strongPct) || 50) / 100}; persist("config"); }
}
const isTextField = el => el.tagName === "TEXTAREA" || (el.tagName === "INPUT" && ["text","date","number"].includes(el.type));
document.addEventListener("input", ev => {
  const el = ev.target;
  if (el.id === "transcriptBox"){ ui.drafts.transcript[el.dataset.iv] = el.value; return; }
  if (el.id === "rubricBox"){ ui.drafts.rubric[el.dataset.iv] = el.value; return; }
  if (!isTextField(el) || el.dataset.field === "leading") return;
  clearTimeout(typeTimers.get(el)); typeTimers.set(el, setTimeout(() => saveTextField(el), 400));
});
document.addEventListener("change", ev => {
  const el = ev.target; if (!isTextField(el) || el.dataset.field === "leading" || el.id === "transcriptBox" || el.id === "rubricBox") return;
  clearTimeout(typeTimers.get(el)); saveTextField(el);
  if (["personaText","jobText","cStmt","cField","cItem","aText"].includes(el.dataset.act) || el.closest("form[data-form=problem],form[data-form=config]")) setTimeout(render, 0);
}, true);

document.addEventListener("submit", async ev => {
  ev.preventDefault(); const f = ev.target; const d = Object.fromEntries(new FormData(f)); const r = route();
  if (f.dataset.form === "setup"){
    S = emptyState(); S.config = {founder:d.founder, venture:d.venture, coach:d.coach, minInterviews:5, strongShare:0.5, createdAt:new Date().toISOString()};
    await persist("config"); await persist("persona");
    if ((d.problem || "").trim()) upsert("problems", {id:"PR-01", text:d.problem.trim(), who:(d.who || "").trim()});
    if ((d.who || "").trim()){ S.compass.customers = [{id:"C-01", text:d.who.trim(), why:"", ideal:true}]; await persist("compass"); }
    await store.write("drm/README.md", "This folder holds your Discovery Records Manager data. Edit it with the DRM app or ask your AI assistant; see CLAUDE.md at the top of the repository.\n");
    store.needsSetup = false; store.stamps = await store.scan(); startWatching(); go("home"); render();
  } else if (f.dataset.form === "addProblem"){ upsert("problems", {id:nextId("PR-", S.problems, 2), text:d.text.trim(), who:(d.who||"").trim()}); f.reset(); render(); }
  else if (f.dataset.form === "addQuote"){ const id = nextId(r.id + "-Q", S.evidence.filter(x => x.id.startsWith(r.id + "-Q")), 2);
    upsert("evidence", {id, interviewId:r.id, problemId:d.problemId, jobId:"", quote:d.quote.trim(), where:d.where, type:d.type, foundBy:"Founder", status:"Confirmed", note:""}); ui.addQuote = null; render(); }
});

/* ---------------- folder handling + watching for AI writes ---------------- */
let watchTimer = null;
function stopWatching(){ clearInterval(watchTimer); watchTimer = null; }
function startWatching(){
  stopWatching();
  if (!store || store.kind !== "folder") return;
  watchTimer = setInterval(checkFolder, 4000);
}
async function checkFolder(){
  if (!store || store.kind !== "folder" || document.hidden) return;
  const ae = document.activeElement; if (ae && (ae.tagName === "TEXTAREA" || ae.tagName === "INPUT")) return;   // don't yank the page while typing
  let now; try { now = await store.scan(); } catch(e){ return; }
  const before = store.stamps || {};
  const changed = Object.keys(now).filter(k => now[k] !== before[k]).concat(Object.keys(before).filter(k => !(k in now)));
  if (!changed.length) return;
  const beforeCand = S.evidence.filter(e => e.status === "Candidate").length + S.pains.filter(p => p.status === "Candidate").length;
  const beforeNotes = S.notes.length;
  S = await store.loadAll(); lastPush = await store.lastPush(); render();
  const cand = S.evidence.filter(e => e.status === "Candidate").length + S.pains.filter(p => p.status === "Candidate").length;
  if (cand > beforeCand) toast(`${cand - beforeCand} new suggestion${cand - beforeCand > 1 ? "s" : ""} from your AI. Review them when you're ready.`);
  else if (S.notes.length > beforeNotes) toast("Your AI wrote a new note.");
}
async function useRoot(root){
  store = new FolderStore(root);
  await idb.set("root", root).catch(() => {});
  aiReady = await store.hasAiInstructions();
  if (!(await store.isInitialized())){ store.needsSetup = true; store.noGit = !(await store.hasGit()); render(); return; }
  S = await store.loadAll();
  lastPush = await store.lastPush();
  if (!location.hash || location.hash === "#") go("home");
  render(); scheduleReport(); startWatching();
}
async function openFolder(reopen){
  try {
    let root;
    if (reopen && ui.savedHandle){
      const h = ui.savedHandle;
      if ((await h.queryPermission({mode:"readwrite"})) !== "granted" && (await h.requestPermission({mode:"readwrite"})) !== "granted") return;
      root = h;
    } else root = await window.showDirectoryPicker({id:"drm", mode:"readwrite"});
    await useRoot(root);
  } catch(e){ if (e.name !== "AbortError") alert("Couldn't open that folder: " + e.message); }
}

/* ---------------- start ---------------- */
(async function init(){
  const params = new URLSearchParams(location.search);
  window.__drm = {get S(){ return S; }, get store(){ return store; }, buildReport, parseRubric, checkFolder};
  if (params.get("test") === "opfs"){ const root = await navigator.storage.getDirectory(); await useRoot(root); return; }
  if (params.get("demo") === "1"){ store = new MemoryStore(); S = demoState(); aiReady = true; render(); return; }
  ui.savedHandle = ("showDirectoryPicker" in window) ? await idb.get("root").catch(() => null) : null;
  render();
})();
</script>
