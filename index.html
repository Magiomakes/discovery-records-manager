    const shaky = ps.filter(p => !painCheck(p).ok).length;
    return problemSignal(ps, shaky ? ` (${shaky} of those fail the rubric check)` : "");
  }
  if ((a.kind === "early-adopters" || a.kind === "customers") && a.customerId){
    /* Same shape on the segment's scores, with MIN_SEGMENT as the floor. An early-adopter point is also contradicted when another
       segment with MIN_SEGMENT or more scores shows 25 points more pain, and reads only Weak signal until another segment has been interviewed. */
    const bySeg = {};
    for (const p of confirmed){ const iv = byId(S.interviews, p.interviewId); const seg = iv && iv.customerId ? iv.customerId : "?"; (bySeg[seg] = bySeg[seg] || []).push(p); }
    const mine = bySeg[a.customerId] || []; const untagged = (bySeg["?"] || []).length;
    if (mine.length < MIN_SEGMENT) return {status:"Untested", why:`${mine.length} of ${MIN_SEGMENT} confirmed scores from this segment${untagged ? ` (${untagged} interviews have no segment set)` : ""}`, n:mine.length};
    const ms = painShare(mine); const s = ms.share; const pct = Math.round(s * 100);
    const w = ms.weak ? `, ${ms.weak} of them from friends, leading interviews, pitches or no recent instance` : "";
    const others = a.kind === "early-adopters" ? Object.entries(bySeg).filter(([k]) => k !== a.customerId && k !== "?").map(([k, ps]) => ({k, share:segShare(ps), n:ps.length})).filter(o => o.n >= MIN_SEGMENT) : [];
    const best = others.sort((x, y) => y.share - x.share)[0];
    if (best && best.share >= s + 0.25){ const c = byId(S.compass.customers, best.k); return {status:"Contradicted", why:`${c ? c.text : best.k} show more pain (${Math.round(best.share*100)}% vs ${pct}%)`, n:mine.length, share:s}; }
    if (a.kind === "customers" && s <= CONTRADICTED_SHARE) return {status:"Contradicted", why:`Only ${pct}% of this segment's scores show real pain`, n:mine.length, share:s};
    if (s >= strong && ms.cleanShare < strong) return {status:"Shaky", why:`${pct}% of this segment's scores show real pain${w}, so only interviews that can't carry it clear your bar`, n:mine.length, share:s};
    if (s < strong) return {status:"Shaky", why:`Only ${pct}% of this segment's scores show real pain, below your ${Math.round(strong * 100)}% bar`, n:mine.length, share:s};
    if (ms.cleanN < MIN_SEGMENT) return {status:"Weak signal", why:`${pct}% of this segment's scores show real pain${w}, but only ${ms.cleanN} clean score${ms.cleanN === 1 ? "" : "s"} of the ${MIN_SEGMENT} needed`, n:mine.length, share:s};
    if (a.kind === "early-adopters" && !best) return {status:"Weak signal", why:`${pct}% of this segment's scores show real pain${w}, but no other segment has been interviewed to compare against`, n:mine.length, share:s};
    return {status:"Strong signal", why:`${pct}% of this segment's scores show real pain${w}${best ? `, ahead of ${Math.round(best.share*100)}% elsewhere` : ""}`, n:mine.length, share:s};
  }
  /* Everything else is read from the confirmed quotes the founder tags for or against it. */
  const ev = (a.evidence || []).map(x => ({...x, e:byId(S.evidence, x.id)})).filter(x => x.e && x.e.status === "Confirmed");
  const sup = ev.filter(x => x.stance === "supports").length, con = ev.filter(x => x.stance === "contradicts").length;
  if (!ev.length) return {status:"Untested", why:"No confirmed quotes tagged to this yet", n:0};
  if (con >= sup) return {status:"Contradicted", why:`${con} quote${con === 1 ? "" : "s"} against, ${sup} for`, n:ev.length};
  if (sup < 2) return {status:"Shaky", why:`${sup} for, ${con} against; one quote is not a pattern`, n:ev.length};
  if (sup >= 3 && sup >= 2 * con) return {status:"Strong signal", why:`${sup} quotes for, ${con} against`, n:ev.length};
  return {status:"Weak signal", why:`${sup} quotes for, ${con} against; ${sup < 3 ? "fewer than 3 for" : "not yet twice the quotes against"}`, n:ev.length};
}
/* The pivot gate: a pivot is in play only when every trigger assumption is Shaky or Contradicted by confirmed evidence. Otherwise it's shown, stamped, and never counted. */
function pivotGate(pv){
  const ids = (pv.triggerAssumptionIds || []).filter(Boolean);
  if (!ids.length) return {open:false, why:"Not in play: no trigger assumption named"};
  const states = [];
  for (const id of ids){
    const a = byId(S.assumptions, id);
    if (!a) return {open:false, why:`Not in play: ${id} doesn't exist`};
    if (a.status === "Retired") return {open:false, why:`Not in play: ${id} is retired`};
    const s = assumptionStatus(a);
    if (!["Contradicted","Shaky"].includes(s.status)) return {open:false, why:`Not in play: ${id} is ${s.status === "Untested" ? "untested" : "a " + s.status.toLowerCase()} (${s.why})`};
    states.push(`${id} is ${s.status.toLowerCase()}`);
  }
  return {open:true, why:`In play: ${states.join(", ")}`};
}
function pivotsInPlay(){ return (S.pivots || []).filter(pv => pv.status !== "Retired" && pivotGate(pv).open); }
function pivotsFor(aId){ return sortById((S.pivots || []).filter(pv => pv.status !== "Retired" && (pv.triggerAssumptionIds || []).includes(aId))).map(pv => ({pv, g:pivotGate(pv)})); }
function pivotTriggerIds(){ const set = new Set(); for (const pv of pivotsInPlay()) for (const id of pv.triggerAssumptionIds || []) set.add(id); return set; }
/* How many confirmed interviews an assumption is short: an untested one, of its first reading; a weak signal, of a strong one. Null when it isn't counted that way. */
function interviewsShort(a, s){
  if (a.kind === "problem" && a.problemId){
    if (s.status === "Untested") return Math.max(0, MIN_SCORED - (s.n || 0));
    if (s.status === "Weak signal") return Math.max(0, MIN_INTERVIEWS - (s.n || 0));
    return null;
  }
  if ((a.kind === "early-adopters" || a.kind === "customers") && a.customerId && s.status === "Untested") return Math.max(0, MIN_SEGMENT - (s.n || 0));
  return null;
}
function assumptionPriority(a){ const i = Number(a.impact) || 0, c = Number(a.confidence) || 0; return i && c ? i * (6 - c) : null; }
function aiPriority(a){ const i = Number(a.aiImpact) || 0, c = Number(a.aiConfidence) || 0; return i && c ? i * (6 - c) : null; }
function rankedAssumptions(){
  return S.assumptions.filter(a => a.status !== "Retired").map(a => ({a, p:assumptionPriority(a), s:assumptionStatus(a)}))
    .sort((x, y) => (y.p ?? -1) - (x.p ?? -1) || STATUS_ORDER[x.s.status] - STATUS_ORDER[y.s.status] || x.a.id.localeCompare(y.a.id));
}
/* What the AI's rating rests on. Shown wherever the rating is, so a guess never looks like a finding. */
function aiBasis(a){
  if (!a.aiImpact && !a.aiConfidence && !a.aiReason) return {kind:"none", label:"Not rated by AI", ids:[]};
  const ids = (a.aiEvidence || []).filter(Boolean);
  const found = ids.map(id => byId(S.evidence, id)).filter(Boolean);
  const conf = found.filter(e => e.status === "Confirmed");
  if (!ids.length) return {kind:"guess", label:"No evidence: a guess", ids:[]};
  if (!found.length) return {kind:"missing", label:`Cites ${ids.length} quote${ids.length > 1 ? "s" : ""} that don't exist`, ids};
  if (!conf.length) return {kind:"unconfirmed", label:`Cites ${found.length} unconfirmed quote${found.length > 1 ? "s" : ""}`, ids};
  return {kind:"evidence", label:`Based on ${conf.length} confirmed quote${conf.length > 1 ? "s" : ""}${found.length > conf.length ? ` (+${found.length - conf.length} unconfirmed)` : ""}`, ids};
}
function disagreement(a){
  const di = a.impact && a.aiImpact ? Math.abs(Number(a.impact) - Number(a.aiImpact)) : 0;
  const dc = a.confidence && a.aiConfidence ? Math.abs(Number(a.confidence) - Number(a.aiConfidence)) : 0;
  return Math.max(di, dc) >= 2;
}
function compassReadout(){
  const r = rankedAssumptions(); const active = r.filter(x => x.a.status === "Active");
  const rated = active.filter(x => x.p);
  const counts = Object.fromEntries(STATUSES.map(s => [s, 0])); for (const x of active) counts[x.s.status]++;
  const top = rated.slice(0, 3);
  const riskiestOpen = rated.find(x => x.s.status === "Untested") || null;
  let verdict, cls;
  if (!active.length) verdict = "No points on the map yet.", cls = "gray";
  else if (!rated.length) verdict = "Drag your points into the grid to find the riskiest.", cls = "gray";
  else if (top.some(x => x.s.status === "Contradicted")) verdict = "One of your riskiest assumptions is contradicted by your interviews. Time to rethink that part.", cls = "bad";
  else if (top.every(x => x.s.status === "Strong signal")) verdict = "Your three riskiest assumptions show a strong signal so far. Before you lean on them, ask your AI to poke holes.", cls = "ok";
  else if (top.some(x => x.s.status === "Shaky")) verdict = "One of your riskiest assumptions is shaky. More interviews with the right people will settle it.", cls = "warn";
  else if (top.every(x => x.s.status === "Weak signal" || x.s.status === "Strong signal")) verdict = "Your riskiest assumptions show a signal, but a weak one. More clean interviews before you lean on them.", cls = "warn";
  else verdict = "Your riskiest assumptions are still untested. That's where the next interviews go.", cls = "warn";
  return {counts, top, riskiestOpen, verdict, cls, total:active.length, rated:rated.length, candidates:S.assumptions.filter(a => a.status === "Candidate").length, pivots:pivotsInPlay().length};
}
/* Posture: the priority-weighted mean of the three riskiest statuses, in [-1, 1]: the five readings sit at -1, -0.5, 0, 0.5 and 1, so no evidence reads at the centre. */
const POSTURE = {Contradicted:-1, Shaky:-0.5, Untested:0, "Weak signal":0.5, "Strong signal":1};
function posture(top){ let n = 0, d = 0; for (const x of top){ n += POSTURE[x.s.status] * (x.p || 1); d += (x.p || 1); } return d ? n / d : 0; }
/* Five bands on the scale, one per reading; the needle lands on a band's centre (translateX of p × 40%). */
function postureGauge(c, small){
  const p = posture(c.top);
  return `<div class="gauge ${small ? "sm" : ""}" aria-label="Posture ${p.toFixed(2)}"><div class="scale">${[20, 40, 60, 80].map(t => `<i class="tick" style="left:${t}%"></i>`).join("")}<i class="needle" style="--p:${p.toFixed(3)}"></i></div>
    <div class="gl">${STATUSES.map(s => `<span>${s}</span>`).join("")}</div>${small ? "" : `<span class="read">Posture ${p >= 0 ? "+" : ""}${p.toFixed(2)} · ${c.top.length || "no"} riskiest, priority-weighted · no evidence reads at the centre</span>`}</div>`;
}
/* Status as a shape, never a colour: hollow = untested, half = shaky, ringed = weak signal, filled = strong signal, hatched = contradicted. */
const glyphCls = s => s === "Strong signal" ? "strong" : s === "Weak signal" ? "weak" : s === "Shaky" ? "shaky" : s === "Contradicted" ? "contradicted" : "";
function statusWord(s, why){ return `<span class="stw"><i class="gy ${glyphCls(s)}"></i>${esc(s === "Untested" ? "No evidence yet" : s)}</span>${why ? `<span class="why">${esc(why)}.</span>` : ""}`; }
/* The riskiest-assumptions table: priority, the assumption, its status, then the AI's objection before the AI's numbers. */
function betsTable(list){
  if (!list.length) return "";
  const rows = list.map(x => { const a = x.a; const b = aiBasis(a); const ap = aiPriority(a); const obj = a.aiAgainst || a.aiReason; const k = ASSUMPTION_KINDS[a.kind] || {label:a.kind};
    return `<tr class="click" data-act="openPoint" data-id="${esc(a.id)}"><td class="p">${x.p ?? "–"}</td><td class="id">${esc(a.id)}</td><td class="t">${esc(a.text || "untitled point")}<span class="why">${esc(k.label)}${a.status === "Candidate" ? " · suggested by " + esc(a.foundBy || "AI") : ""}</span></td><td>${statusWord(x.s.status, x.s.why)}</td><td class="obj">${b.kind === "none" ? `<span class="muted">Not rated by your AI yet.</span>` : `${esc(obj || "No objection written.")}<span class="why">${esc(b.label)}</span>`}</td><td class="rat">${b.kind === "none" ? "–" : `I ${esc(a.aiImpact || "–")} · C ${esc(a.aiConfidence || "–")}<br><span>P</span> ${ap ?? "–"}`}</td><td class="rat">${a.impact && a.confidence ? `${esc(impactWord(a.impact))}<br>${esc(confidenceWord(a.confidence))}` : "Not placed"}<br><span>P</span> ${x.p ?? "–"}</td></tr>`; });
  return `<div class="tscroll"><table class="bets"><tr><th>Priority</th><th>Point</th><th>Assumption</th><th>Status</th><th>AI objection</th><th>AI rates</th><th>You rate</th></tr>${rows.join("")}</table></div>`;
}
/* The share bar: one slot per interview needed, filled by tier as confirmed scores come in, with the counts as numerals under it. */
function shareBar(p){
  const minN = MIN_INTERVIEWS; const s = problemStats(p);
  const cls = {"Hair on Fire":"hof","Incremental Improvement":"inc","Nice to Have":"nth","Latent":"lat","Not a Problem":"nap","":"empty"};
  const segs = []; for (const t of TIERS) for (let i = 0; i < s.counts[t]; i++) segs.push(t); const slots = Math.max(minN, segs.length); while (segs.length < slots) segs.push("");
  const left = Math.max(0, minN - s.n);
  return `<div class="lrow"><div class="lbl"><a href="#/problems/${esc(p.id)}" style="color:inherit;border:none">${esc(p.id)}</a><span class="sub">${esc(s.signal)}</span></div><div>
    <p style="margin:0;max-width:62ch">${esc(p.text || "untitled problem")}${p.who ? ". " + esc(p.who) : ""}. One slot per interview needed; ${s.n} of ${minN} scored${s.quotes ? `, ${s.quotes} confirmed quote${s.quotes === 1 ? "" : "s"}` : ""}${s.against ? `, ${s.against} against the problem` : ""}.</p>
    <div class="share" style="grid-template-columns:repeat(${slots},1fr)">${segs.map(t => `<i class="${cls[t]}" title="${esc(t || "not yet interviewed")}"></i>`).join("")}</div>
    <div class="share-n" style="grid-template-columns:repeat(${slots},1fr)">${TIERS.filter(t => s.counts[t]).map(t => `<div style="grid-column:span ${s.counts[t]}"><span class="n">${s.counts[t]}</span>${esc(t)}</div>`).join("")}${left ? `<div class="g" style="grid-column:span ${left}"><span class="n">${left}</span>still to interview</div>` : ""}</div></div></div>`;
}
function areaOf(a){ return (ASSUMPTION_KINDS[a.kind] || {}).area || "alternatives"; }
function areaReadout(area){
  const list = rankedAssumptions().filter(x => x.a.status === "Active" && areaOf(x.a) === area);
  const counts = Object.fromEntries(STATUSES.map(s => [s, 0])); for (const x of list) counts[x.s.status]++;
  return {list, counts};
}

/* Ledger check: the same deterministic checks tools/check.js runs for the AI. */
function ledgerChecks(){
  const out = [];
  const push = (sev, where, href, msg) => out.push({sev, where, href, msg});
  for (const e of S.evidence){
    if (e.status === "Rejected") continue;
    const t = S.transcripts[e.interviewId];
    if (t && !findInTranscript(e.quote, t)) push(e.status === "Confirmed" ? "bad" : "warn", e.id, "interviews/" + e.interviewId, `${e.status === "Candidate" ? "Suggested" : e.status} quote isn't in the transcript word for word.`);
    if (!e.type) push("warn", e.id, "interviews/" + e.interviewId, "Quote has no evidence type.");
    if (e.status === "Confirmed" && e.type === "Opinion or future intent") push("info", e.id, "interviews/" + e.interviewId, "Confirmed quote is only opinion or future intent. It can't carry a pain score.");
  }
  for (const p of S.pains){
    if (p.status === "Rejected") continue;
    const c = painCheck(p); for (const i of c.issues) push(p.status === "Confirmed" ? "bad" : "warn", p.id, "interviews/" + p.interviewId, i);
  }
  for (const a of S.assumptions){
    if (a.status === "Retired") continue;
    const b = aiBasis(a);
    if (b.kind === "missing") push("bad", a.id, "compass/map/" + a.id, "AI cites quotes that don't exist in this folder.");
    if (b.kind === "guess") push("info", a.id, "compass/map/" + a.id, "AI rated this with no evidence. Treat it as a second opinion, not a finding.");
    if (b.kind !== "none" && !a.aiAgainst) push("info", a.id, "compass/map/" + a.id, "AI rated this without a case against it. Ask it to poke holes.");
    if (a.status === "Active" && !assumptionPriority(a)) push("info", a.id, "compass/map/" + a.id, "Not placed in the grid yet, so it has no priority.");
  }
  for (const l of S.leads || []){
    if (!["Candidate","Accepted","Dismissed"].includes(l.status)) push("bad", l.id, "compass/leads", `Lead has a bad status "${l.status}".`);
    if (l.status === "Dismissed") continue;
    if (!l.name && !l.role) push("warn", l.id, "compass/leads", "Lead has no name and no role description.");
    if (!l.why) push("warn", l.id, "compass/leads", "Lead has no `why`: say which interview or quote it resembles, or that it's a guess.");
    const b = placeBasis(l);
    if (b.kind === "missing") push("bad", l.id, "compass/leads", "Lead cites quotes that don't exist in this folder.");
    if (b.kind === "guess") push("info", l.id, "compass/leads", "Lead has no quote behind it. Allowed, but it's a guess from the segment description.");
    if (l.url && !/^https?:\/\//.test(l.url)) push("warn", l.id, "compass/leads", "Lead url should be a full http(s) address the AI actually opened, or empty.");
    if (l.customerId && !byId(S.compass.customers || [], l.customerId)) push("warn", l.id, "compass/leads", `Lead customerId ${l.customerId} isn't a segment on the canvas.`);
    if (l.placeId && !byId(S.places, l.placeId)) push("warn", l.id, "compass/leads", `Lead placeId ${l.placeId} doesn't exist.`);
  }
  for (const cp of S.competitors || []){
    const href = "insights/alternatives";
    if (!["Candidate","Accepted","Dismissed"].includes(cp.status)) push("bad", cp.id, href, `Competitor record has a bad status "${cp.status}".`);
    if (cp.status === "Dismissed") continue;
    if (!(cp.name || "").trim()) push("warn", cp.id, href, "Competitor record has no name.");
    if (!["alternative","competitor"].includes(cp.kind)) push("warn", cp.id, href, `Competitor record kind "${cp.kind}" isn't alternative or competitor.`);
    if (!cp.why) push("warn", cp.id, href, "Competitor record has no `why`: say which quote it rests on, or that it's a guess.");
    const b = placeBasis(cp);
    if (b.kind === "missing") push("bad", cp.id, href, "Competitor record cites quotes that don't exist in this folder.");
    if (b.kind === "guess") push("info", cp.id, href, "Competitor record has no quote behind it. Allowed, but it's a guess.");
    if (cp.url && !/^https?:\/\//.test(cp.url)) push("warn", cp.id, href, "Competitor url should be a full http(s) address the AI actually opened, or empty.");
    if (cp.url && !(cp.verified || "").trim()) push("warn", cp.id, href, "Competitor record has a url but nothing in `verified`: say what was seen there and when, or leave url empty.");
    if (cp.customerId && !byId(S.compass.customers || [], cp.customerId)) push("warn", cp.id, href, `Competitor customerId ${cp.customerId} isn't a segment on the canvas.`);
    if (cp.problemId && !byId(S.problems, cp.problemId)) push("warn", cp.id, href, `Competitor problemId ${cp.problemId} doesn't exist.`);
  }
  for (const pv of S.pivots || []){
    if (!["Candidate","Active","Retired"].includes(pv.status)) push("bad", pv.id, "compass/map", `Pivot has a bad status "${pv.status}".`);
    if (pv.status === "Retired") continue;
    const trig = (pv.triggerAssumptionIds || []).filter(Boolean); const href = "compass/map/" + (trig[0] || "");
    if (!PIVOT_KINDS[pv.kind]) push("warn", pv.id, href, `Pivot kind "${pv.kind}" isn't one of ${Object.keys(PIVOT_KINDS).join(", ")}.`);
    if (!(pv.text || "").trim()) push("bad", pv.id, href, "Pivot has no text.");
    if (!trig.length) push("bad", pv.id, href, "Pivot names no trigger assumption.");
    for (const id of trig){ const t = byId(S.assumptions, id); if (!t) push("bad", pv.id, href, `Trigger ${id} doesn't exist.`); else if (t.status === "Retired") push("warn", pv.id, href, `Trigger ${id} is retired.`); }
    const ids = (pv.evidenceIds || []).filter(Boolean); const found = ids.map(id => byId(S.evidence, id));
    const missing = ids.filter((id, i) => !found[i]); if (missing.length) push("bad", pv.id, href, "Pivot cites quotes that don't exist: " + missing.join(", ") + ".");
    if (!ids.length) push("warn", pv.id, href, "Pivot cites no quotes. A pivot with no quotes behind it is a guess; say so in why.");
    else if (found.filter(Boolean).length && found.filter(Boolean).every(e => e.type === "Opinion or future intent")) push("warn", pv.id, href, "Every quote behind this pivot is opinion or future intent. Never propose a pivot from opinion alone.");
    const g = pivotGate(pv); if (!g.open && trig.length && trig.every(id => byId(S.assumptions, id))) push("info", pv.id, href, g.why + ". It isn't counted until the evidence turns.");
  }
  for (const iv of S.interviews){
    if (iv.placeId && !byId(S.places, iv.placeId)) push("warn", iv.id, "interviews/" + iv.id, `placeId ${iv.placeId} doesn't exist.`);
    if (!iv.customerId && S.compass.customers.length) push("info", iv.id, "interviews/" + iv.id, "No customer segment set, so it can't count toward the early-adopter assumption.");
    if (!S.transcripts[iv.id]) push("warn", iv.id, "interviews/" + iv.id, "No transcript saved.");
  }
  for (const f of S.unreadable || []) push("bad", f, "home", "File couldn't be read and was skipped.");
  return out;
}

/* ---------------- sheet building blocks ---------------- */

  <div class="rule"></div>
  <div class="nameline"><span><b>Name:</b> <span contenteditable="plaintext-only" data-act="cMeta" data-field="name" data-ph="type your name">${esc(m.name||"")}</span></span><span><b>Date:</b> <span contenteditable="plaintext-only" data-act="cMeta" data-field="date" data-ph="date">${esc(m.date||"")}</span></span>${extra !== false ? `<span><b>Version:</b> <span contenteditable="plaintext-only" data-act="cMeta" data-field="version" data-ph="v1">${esc(m.version||"")}</span></span>` : ""}</div>`;
}
/* Every other page is a working document too: same header, same rule. title may carry HTML. */

function sheetFoot(num){ const c = S.config; return `<div class="foot"><span>${esc(c.program || "Ideas Lab")} · ${esc(c.cohort || "")}${c.cohort ? " · " : ""}${esc(c.programSub || "LaunchPad")}, Institute for Innovation and Entrepreneurship, Mount Royal University</span><span>${num ? "Week 1 Toolkit · " + num : "Discovery Records Manager"}</span></div>`; }

/* 04 Assumptions Map: a whiteboard. Double-click the board to add a point, drag a point to rate it, drag the board to pan,
   scroll to zoom. Click a point for its card; double-click it for the panel. The position is the rating. */
const statusDot = s => s === "Strong signal" ? "ok" : s === "Weak signal" ? "weak" : s === "Shaky" ? "warn" : s === "Contradicted" ? "bad" : "none";
const statusWordOf = s => s === "Untested" ? "No evidence yet" : s;
function pointHtml(x, w){
  const a = x.a; const sel = ui.selNote === a.id;
  const piv = pivotTriggerIds().has(a.id);
  return `<div class="pt me ${sel ? "sel" : ""} ${a.status === "Candidate" ? "cand" : ""} ${piv ? "piv" : ""}" data-pt="${esc(a.id)}" title="${esc(statusWordOf(x.s.status))}${a.status === "Candidate" ? " · suggested, accept it to move it" : ""}" style="left:${w.x}px;top:${w.y}px"><span class="dotp s-${statusDot(x.s.status)}"></span></div>`;
}
function mapView(){
  const r = compassReadout(); const ranked = rankedAssumptions();
  const active = ranked.filter(x => x.a.status === "Active"), cands = ranked.filter(x => x.a.status === "Candidate");
  const placed = active.filter(x => inGrid(x.a.pos));
  const shelf = active.filter(x => !inGrid(x.a.pos)).concat(cands);
  const sel = ui.selNote ? byId(S.assumptions, ui.selNote) : null;
  const panel = !!(sel && ui.mapPanel);
  const h = MAP.size / 2, q = MAP.size / 4;
  const ai = active.filter(x => x.a.aiImpact && x.a.aiConfidence).map(x => ({x, w:worldOf({x:(Number(x.a.aiConfidence) - 1) / 4, y:(Number(x.a.aiImpact) - 1) / 4})}));
  const wl = (x, y, cls, html) => `<div class="wl ${cls || ""}" style="left:${x}px;top:${y}px"><span>${html}</span></div>`;
  const ticks = [0, 1, 2, 3, 4].map(i => `<line x1="${-h + i * q}" y1="${h}" x2="${-h + i * q}" y2="${h + 6}" stroke="#111"/><line x1="${-h - 6}" y1="${h - i * q}" x2="${-h}" y2="${h - i * q}" stroke="#111"/>`).join("");
  const ties = ai.filter(g => inGrid(g.x.a.pos)).map(g => { const w = worldOf(g.x.a.pos); return `<line class="tie" data-tie="${esc(g.x.a.id)}" x1="${w.x}" y1="${w.y}" x2="${g.w.x}" y2="${g.w.y}" stroke="#8c8c88" stroke-dasharray="4 3" stroke-width="1.2"/>`; }).join("");
  ui.mapKDrawn = ui.mapK || 0;
  const geo = `<svg class="geo">
        <rect x="${-h}" y="${-h}" width="${MAP.size}" height="${MAP.size}" fill="#fff" stroke="none"/>
        <rect x="${-h}" y="${-h}" width="${h}" height="${h}" fill="rgba(17,17,17,.045)" stroke="none"/>
        <line x1="${-q}" y1="${-h}" x2="${-q}" y2="${h}" stroke="#c9c9c4"/><line x1="${q}" y1="${-h}" x2="${q}" y2="${h}" stroke="#c9c9c4"/>
        <line x1="${-h}" y1="${-q}" x2="${h}" y2="${-q}" stroke="#c9c9c4"/><line x1="${-h}" y1="${q}" x2="${h}" y2="${q}" stroke="#c9c9c4"/>
        <rect x="${-h}" y="${-h}" width="${MAP.size}" height="${MAP.size}" fill="none" stroke="#111" stroke-width="2"/>
        <line x1="${-h}" y1="0" x2="${h}" y2="0" stroke="#111" stroke-width="2"/><line x1="0" y1="${-h}" x2="0" y2="${h}" stroke="#111" stroke-width="2"/>
        ${ticks}
        <rect x="${-h}" y="${shelfTop()}" width="${MAP.size}" height="${shelfHeight(shelf.length)}" fill="none" stroke="#8c8c88" stroke-dasharray="4 3"/>
        ${ties}</svg>`;
  /* Every word is anchored on the grid's edge and offset in screen px (margins inside the zoom-corrected anchor), so the layout
     of the words is the same at every zoom and they never land on the grid or on each other. */
  const words = CONFIDENCE_WORDS.map((t, i) => wl(-h + i * q, h, `conf ${i === 0 ? "first" : i === 4 ? "last" : ""} ${i % 2 ? "odd" : ""}`, esc(t))).join("")
    + IMPACT_WORDS.map((t, i) => wl(-h, h - i * q, "imp", esc(t))).join("")
    + wl(h, h, "axname h", "Confidence →") + wl(-h, -h, "axname v", "Impact →")
    + wl(-h, -h, "note", "Riskiest<small>test these first</small>")
    + wl(-h, shelfTop(), "note", shelf.length ? "Not rated yet · drag into the grid" : "Nothing waiting · double-click the board to add a point");
  const steps = [["canvas","01 Leaner Canvas"],["value","02 Value Proposition"],["problem","03 Problem Statement"],["map","04 Assumptions Map"],["leads","05 Leads List"]];
  const counts = STATUSES.map(k => `<span class="cnt" title="${statusWordOf(k)}"><i class="dotp s-${statusDot(k)}"></i>${r.counts[k]}</span>`).join("");
  const filter = ui.mapFilter || "all";
  const seg = `<span class="seg" title="Whose points to show">${[["mine","Mine"],["ai","AI"],["all","All"]].map(([v, l]) => `<button class="${filter === v ? "on" : ""}" data-act="mapFilter" data-val="${v}">${l}</button>`).join("")}</span>`;
  return `<div class="mapfull">
    <div class="tabstrip"><div class="tabs" style="margin:0;border:none">${steps.map(([k, l]) => `<button class="${k === "map" ? "on" : ""}" data-act="go" data-href="compass/${k}">${l}</button>`).join("")}</div>
      <div class="row" style="gap:6px"><span class="counts">${counts}</span>${seg}
        <button class="btn sm" data-act="seedAssumptions" title="Make a point for each item on your canvas">${S.assumptions.length ? "Points from canvas" : "Make points from my canvas"}</button>
        <button class="btn sm ${ui.mapShelf ? "pri" : ""}" data-act="toggleShelf" title="My riskiest assumption, how I'll get evidence, ask your AI">Notes</button>
        <button class="btn sm" data-act="toggleFull" title="${ui.mapFull ? "Show the sidebar" : "Hide the sidebar"}">${ui.mapFull ? "⤡" : "⤢"}</button></div></div>
    <div class="mapband"><div><div class="lab">Posture · ${active.length} active point${active.length === 1 ? "" : "s"}</div><h1 class="verdict sm">${esc(r.verdict)}</h1></div>${postureGauge(r, false)}</div>
    <div class="mapstage ${panel ? "sel" : ""}">
    <div class="vp full f-${esc(filter)}" id="vp">
      <div class="world" id="world">
        ${geo}

        ${shelf.map((x, i) => pointHtml(x, shelfWorld(i))).join("")}
        ${placed.map(x => pointHtml(x, worldOf(x.a.pos))).join("")}
      </div>
      <div class="ptcard" id="card">${sel && !panel ? mapCard(sel) : ""}</div>
      <div class="hud"><button class="btn" data-act="mapZoom" data-val="out" title="Zoom out">−</button><button class="btn" data-act="mapZoom" data-val="in" title="Zoom in">+</button><button class="btn" data-act="mapZoom" data-val="fit" title="Fit the grid and the shelf to the window">Fit</button></div>
      <div class="legend"><span><i style="background:var(--hatch)"></i>Contradicted</span><span><i style="background:linear-gradient(90deg,var(--ink) 50%,transparent 50%)"></i>Shaky</span><span><i></i>No evidence yet</span><span><i style="box-shadow:inset 0 0 0 2px var(--ink)"></i>Weak signal</span><span><i style="background:var(--ink)"></i>Strong signal</span><span><i style="border-style:dashed;border-color:var(--grey)"></i>AI's placement</span><span><i style="box-shadow:0 0 0 2px var(--stone),0 0 0 3px var(--grey);margin-left:3px;margin-right:8px"></i>Pivot in play</span></div>
      <div class="hint2">Double-click the board to add a point · drag a point to rate it · drag the board to pan · scroll to zoom</div>
      ${ui.mapShelf && !sel ? notesShelf(r) : ""}
    </div>
    ${panel ? mapPanel(sel) : ""}
    </div>
  </div>`;
}
/* Pop-out shelf: the toolkit's two boxes and the AI ask, off the canvas until wanted. */
function notesShelf(r){
  return `<div class="ov shelfpanel"><div class="spread"><h4 style="margin:0">Notes</h4><button class="btn icon" data-act="toggleShelf" title="Close">✕</button></div>
    <div class="notice ${r.cls === "ok" ? "ok" : r.cls === "bad" ? "bad" : r.cls === "gray" ? "plain" : "warn"}" style="margin:10px 0 14px"><b>${esc(r.verdict)}</b></div>
    <div class="sidebox"><h4>My riskiest assumption</h4>${ed("cField", `data-field="riskiest"`, S.compass.riskiest, "Type here")}${r.riskiestOpen && !S.compass.riskiest ? `<button class="btn link small" data-act="cSet" data-field="riskiest" data-val="${esc(r.riskiestOpen.a.text)}">Use the top of the map: ${esc(r.riskiestOpen.a.id)}</button>` : ""}</div>
    <div class="sidebox"><h4>How I'll get evidence this week</h4>${ed("cField", `data-field="evidencePlan"`, S.compass.evidencePlan, "Type here")}</div>
    <div class="sidebox"><h4>Ask your AI</h4><div class="small">Say <span class="kbd">Diagnose my snapshot</span>. It rates every point, says what evidence that rests on, lists what's stated but untestable, proposes the assumptions hiding in your canvas, and names the two interviews to run first.</div><button class="btn sm" style="margin-top:6px" data-act="copyText" data-text="Diagnose my snapshot">Copy</button></div>
    ${r.candidates ? `<div class="notice warn">${r.candidates} point${r.candidates > 1 ? "s" : ""} suggested by your AI ${r.candidates > 1 ? "are" : "is"} waiting below the grid. Click one to accept or dismiss it.</div>` : ""}

/* The card on click: kind, status, the words, what the evidence says, the AI's objection. Placed next to the point by placeCard(). */
function mapCard(a){
  const s = assumptionStatus(a); const k = ASSUMPTION_KINDS[a.kind] || {label:a.kind};
  return `<div class="head"><span class="lab">${esc(k.label)}</span><span class="st lab"><i class="gy ${glyphCls(s.status)}"></i>${esc(statusWordOf(s.status))}</span></div>
    ${a.status === "Candidate" ? `<div class="ev" style="margin:0 0 6px">Suggested by ${esc(a.foundBy || "AI")} · accept it to move it</div>` : ""}
    <div class="txt ${a.text ? "" : "empty"}">${a.text ? esc(a.text) : "Nothing written yet · double-click to edit"}</div>
    <div class="ev">${esc(s.why)}.</div>
    <div class="ag"><b>Against</b>${esc(a.aiAgainst || "The AI hasn't looked at this point yet.")}</div>
    ${a.status === "Candidate" ? `<div class="acts"><button class="btn pri sm" data-act="aStatus" data-id="${esc(a.id)}" data-val="Active">Accept</button><button class="btn sm" data-act="aStatus" data-id="${esc(a.id)}" data-val="Retired">Dismiss</button></div>` : ""}
    <div class="more">Double-click the point to edit it</div>`;
}
/* Your AI's reading of one assumption: the basis stamp, the case against before the numbers, then the reason and the quotes it relied on. The map panel and the Insights detail page both draw it from here. */
function aiReading(a){
  const basis = aiBasis(a); const p = aiPriority(a); const dis = disagreement(a);
  if (basis.kind === "none") return `<p class="small muted" style="margin:0 0 8px">Hasn't rated this one. In your AI assistant, say:</p><pre class="code" style="margin:0 0 8px">Diagnose my snapshot</pre><button class="btn sm" data-act="copyText" data-text="Diagnose my snapshot">Copy</button><p class="hint" style="margin-top:12px">It rates every point for impact and confidence, lists the quotes it relied on and is told to say so when it has none, flags what's untestable, proposes the assumptions hiding in your canvas, and names the two interviews to run first.</p>`;
  return `<div style="margin-bottom:12px">${basis.kind === "evidence" ? `<span class="stamp ok">${esc(basis.label)}</span>` : `<span class="stamp">${esc(basis.label)}</span>`}</div>
    <div class="lab">The case against</div><p class="small" style="margin:0 0 10px">${a.aiAgainst ? esc(a.aiAgainst) : `<span class="muted">No objection written yet. In your AI assistant, say <b>Poke holes</b>.</span>`}</p>
    ${a.aiWouldChange ? `<div class="lab">What would change its mind</div><p class="small" style="margin:0 0 10px">${esc(a.aiWouldChange)}</p>` : ""}
    <div class="lab">Impact if wrong <span class="muted">${esc(a.aiImpact || "?")}</span></div>${bar5(a.aiImpact, "ai")}<div class="rate-l"><span>inconvenient</span><span>catastrophic</span></div>
    <div class="lab">Likely right? <span class="muted">${esc(a.aiConfidence || "?")}</span></div>${bar5(a.aiConfidence, "ai")}<div class="rate-l"><span>likely wrong</span><span>likely right</span></div>
    <div class="lab">Priority</div><div>${p ? `<b style="font-size:20px">${p}</b>` : `<span class="small muted">Incomplete rating</span>`}</div>
    <div class="lab">Why</div><p class="small" style="margin:0">${esc(a.aiReason || "No reason given.")}</p>
    ${basis.ids.length ? `<div class="lab">What it relied on</div>${basis.ids.map(id => { const e = byId(S.evidence, id); return e ? `<div class="q compact s-${esc(e.status)}" style="margin:0 0 6px;padding:8px 10px 6px 12px"><span class="words" style="font-size:13.5px">${esc(e.quote)}</span><div class="meta"><a href="#/interviews/${esc(e.interviewId)}">${esc(e.interviewId)}</a>${e.status !== "Confirmed" ? statusChip(e.status) : ""}</div></div>` : `<span class="chip bad">${esc(id)} not found</span>`; }).join("")}` : `<p class="hint" style="margin-top:10px">${basis.kind === "guess" ? "It had no confirmed quotes to go on. This is a reasoned guess, the same kind you're making. Interviews settle it." : ""}</p>`}
    ${dis ? `<div class="notice warn" style="margin-top:10px">You and your AI are 2 or more apart. Who's reading the evidence right?</div>` : ""}`;
}
/* The evidence notice: status, why, what it is read from, and where to go next. On the map it links to the Insights detail; on the detail it links back to the map. */
function statusNotice(a, s, where){
  const k = ASSUMPTION_KINDS[a.kind] || {test:""}; const area = areaOf(a);
  const link = where === "map" ? `<a href="#/insights/${area}/${esc(a.id)}">Open it under Insights</a>` : `<a href="#/compass/map/${esc(a.id)}">Open on the map</a>${a.kind === "problem" && a.problemId ? ` · <a href="#/problems/${esc(a.problemId)}">Edit this problem</a>` : ""}`;
  return `<div class="notice ${s.status === "Strong signal" ? "ok" : s.status === "Contradicted" ? "bad" : s.status === "Shaky" || s.status === "Weak signal" ? "warn" : "plain"}" style="margin-top:10px"><b>${esc(statusWordOf(s.status))}.</b> ${esc(s.why)}. <span class="muted">Read from ${esc(k.test)}.</span> ${link}</div>`;
}
/* A quote the founder has tagged for or against an assumption, with the For/Against toggle and untag. Compact in the map panel, full size on the detail page. */
function tagRow(a, t, compact){

/* One pivot: the move, what it rests on, and whether the evidence has opened the gate. Shown on the selected point and on the Insights page for its area. */
function pivotCard(x, opts = {}){
  const pv = x.pv, g = x.g; const k = PIVOT_KINDS[pv.kind] || {label:pv.kind || "?", meaning:""};

  const quotes = ids.map(id => { const e = byId(S.evidence, id); return e ? `<div class="q compact s-${esc(e.status)}" style="margin:0 0 6px;padding:8px 10px 6px 12px"><span class="words" style="font-size:13.5px">${esc(e.quote)}</span><div class="meta"><a href="#/interviews/${esc(e.interviewId)}">${esc(e.interviewId)}</a>${e.status !== "Confirmed" ? statusChip(e.status) : ""}</div></div>` : `<span class="chip bad">${esc(id)} not found</span>`; }).join("");
  return `<div class="tile" style="margin:0 0 8px">
    <div class="spread"><div class="row" style="gap:6px"><span class="mono muted">${esc(pv.id)}</span><span class="chip blue" title="${esc(k.meaning)}">${esc(k.label)}</span>${g.open ? `<span class="chip bad">In play</span>` : `<span class="chip gray">Not in play</span>`}${pv.status === "Candidate" ? `<span class="ai">Suggested by ${esc(pv.foundBy || "AI")}</span>` : ""}</div>
      ${pv.status === "Candidate" ? `<div class="row"><button class="btn sm" data-act="pivotStatus" data-id="${esc(pv.id)}" data-val="Retired">Dismiss</button><button class="btn pri sm" data-act="pivotStatus" data-id="${esc(pv.id)}" data-val="Active">Accept</button></div>` : pv.status === "Active" ? `<button class="btn sm" data-act="pivotStatus" data-id="${esc(pv.id)}" data-val="Retired">Retire</button>` : ""}</div>
    <div class="belief" style="font-size:14.5px;margin-top:6px">${esc(pv.text || "untitled pivot")}</div>
    <div class="h" style="margin-top:4px">${esc(k.meaning)}. ${esc(g.why)}.${opts.showTriggers !== false && trig.length ? ` If wrong: ${trig.map(id => `<a href="#/compass/map/${esc(id)}" class="mono">${esc(id)}</a>`).join(", ")}.` : ""}</div>
    ${pv.why ? `<p class="small" style="margin:6px 0 0">${esc(pv.why)}</p>` : ""}
    ${ids.length ? `<div class="lab" style="font-size:12.5px;color:var(--ink-2);margin:8px 0 4px">What it rests on</div>${quotes}` : `<div style="margin-top:8px"><span class="stamp" style="transform:none;font-size:10.5px">No quote behind it: a guess</span></div>`}
  </div>`;
}
function pivotsSection(a, s){

  return `<div class="lab" style="font-size:12.5px;color:var(--ink-2);margin:10px 0 4px">If this is wrong</div>${list.map(x => pivotCard(x, {showTriggers:false})).join("")}`;
}

/* ---------------- the first sitting (#/start): the five sheets' questions in order, on the same records ---------------- */

    (C.alternatives || []).some(a => filled(a.name)),
    S.problems.length > 0 && S.problems.every(p => filled((C.solutions || {})[p.id])),
    VP_PARTS.every(([k]) => filled(C.valueProp[k])),

}

/* "If this breaks": the pivots in play for this area, or how far the riskiest assumption here is from giving any signal. */
function pivotBox(area, r){
  const all = sortById((S.pivots || []).filter(pv => pv.status !== "Retired" && (pv.triggerAssumptionIds || []).some(id => { const a = byId(S.assumptions, id); return a && a.status !== "Retired" && areaOf(a) === area; }))).map(pv => ({pv, g:pivotGate(pv)}));
  const open = all.filter(x => x.g.open), closed = all.filter(x => !x.g.open);
  let body;
  if (open.length) body = open.map(x => pivotCard(x)).join("");

/* Customers: one tile per segment, the ideal one marked, ranked by real pain, each with the status of the point that stands for it. */
function segmentTiles(){
  const segs = S.compass.customers || []; if (!segs.length) return `<div class="empty">No customer segments on the canvas yet. <a href="#/compass/canvas">Add them on the Leaner Canvas.</a></div>`;
  const confirmed = confirmedPains();
  const reads = segs.map(c => { const ivs = S.interviews.filter(i => i.customerId === c.id); const ps = confirmed.filter(p => ivs.some(i => i.id === p.interviewId)); const sh = painShare(ps);
      const a = S.assumptions.find(x => (x.kind === "early-adopters" || x.kind === "customers") && x.customerId === c.id && x.status !== "Retired");
      return {c, ivs:ivs.length, ps, ...sh, a, s:a ? assumptionStatus(a) : null}; })
    .sort((x, y) => y.share - x.share || y.n - x.n || (y.c.ideal ? 1 : 0) - (x.c.ideal ? 1 : 0));
  const tiles = reads.map(r => {
    const bar = []; for (const t of TIERS) for (let i = 0; i < r.ps.filter(p => p.tier === t).length; i++) bar.push(t); const slots = Math.max(MIN_SEGMENT, bar.length); while (bar.length < slots) bar.push("");
    const pct = Math.round(r.share * 100), cpct = Math.round(r.cleanShare * 100);
    return `<div class="at seg ${r.c.ideal ? "ideal" : ""}"><div class="atb">
      <div class="ah"><span class="mono">${esc(r.c.id)}</span>${r.c.ideal ? `<span class="pick">Your ideal customer</span>` : ""}</div>
      <p class="txt">${esc(r.c.text)}</p>
      <div class="share sm" style="grid-template-columns:repeat(${slots},1fr)">${bar.map(t => `<i class="${TIER_SLOT[t]}" title="${esc(t || "not yet interviewed")}"></i>`).join("")}</div>
      <div class="rowb"><div><span class="stw">${r.n} confirmed score${r.n === 1 ? "" : "s"}</span><span class="why">${r.n ? `${r.top2} of ${r.n} show real pain (${pct}%)${r.weak ? `; ${cpct}% without the weak interviews` : ""}` : `${r.ivs} interview${r.ivs === 1 ? "" : "s"}, none scored yet`}.</span></div><div class="pri"><span class="n">${r.n ? pct + "%" : "–"}</span><span class="l">real pain</span></div></div>
      <div class="marks">${r.a ? `<a href="#/compass/map/${esc(r.a.id)}" title="${esc(r.a.text)}">${statusWord(r.s.status)}</a><span class="mono muted" style="font-size:11px">${esc(r.a.id)}</span>` : `<span class="hint">No point on the map for this segment.</span>`}</div>
    </div></div>`; }).join("");
  const untagged = S.interviews.filter(i => !i.customerId || !byId(segs, i.customerId)).length;
  return `<div class="agrid">${tiles}</div><p class="small" style="margin:-8px 0 0;max-width:66ch">${untagged ? `<b>${untagged} interview${untagged === 1 ? " has" : "s have"} no segment set.</b> Set it on each interview so it counts here.` : "Every interview has a segment set."} Real pain = the share of confirmed scores in the top two tiers; ${MIN_SEGMENT} confirmed scores per segment before it reads anything, and the ideal segment is contradicted when another shows 25 points more.</p>`;
}

  root.dataset.page = location.hash;
  /* The gauge needle slides once, the first time a gauge is drawn in this page load; after that it holds still across re-renders. */
  if (!needleSettled && root.querySelector(".gauge .needle")){ needleSettled = true; setTimeout(() => document.documentElement.classList.add("settled"), 600); }
  const m2 = document.querySelector(".main"); if (m2) m2.scrollTop = keep;
  if (ui.drawer && ui.drawerScroll){ const f = document.querySelector(".drawer .focus-mark, .drawer .near"); if (f) f.scrollIntoView({block:"center"}); ui.drawerScroll = false; }
  /* On the Quotes page the transcript box scrolls itself to the quote being decided, without moving the page. */
  const rvm = document.querySelector(".rvt .focus-mark, .rvt .near"); if (rvm){ const box = rvm.closest(".rvt"); box.scrollTop = Math.max(0, rvm.offsetTop - box.clientHeight / 2); }
  mountMap();
}

function highlight(text, quotes, focusId, near){
  const ranges = [];
  for (const e of quotes){ if (e.status === "Rejected" && e.id !== focusId) continue; const r = findInTranscript(e.quote, text); if (r) ranges.push({...r, e}); }
  if (near) ranges.push(near);
  ranges.sort((a, b) => a.start - b.start);
  let out = "", pos = 0;
  for (const r of ranges){
    if (r.start < pos) continue;
    const inner = esc(text.slice(r.start, r.end));
    out += esc(text.slice(pos, r.start)) + (r.e ? `<mark class="s-${r.e.status}${r.e.id === focusId ? " focus-mark" : ""}" data-act="jump" data-id="${esc(r.e.id)}" id="m-${esc(r.e.id)}">${inner}</mark>` : `<span class="near" title="Around where the AI said this quote is">${inner}</span>`);
    pos = r.end;
  }
  return out + esc(text.slice(pos));
}
function nearRange(e, text){
  const w = String(e.where || "").trim(); if (w.length < 3 || !text) return null;
  const i = text.toLowerCase().indexOf(w.toLowerCase()); if (i < 0) return null;
  const start = text.lastIndexOf("\n", i) + 1; let end = text.indexOf("\n", i); if (end < 0) end = text.length;
  return {start, end};
}
function drawerView(){
  const e = byId(S.evidence, ui.drawer); if (!e) return "";
  const iv = byId(S.interviews, e.interviewId) || {id:e.interviewId}; const text = S.transcripts[e.interviewId] || "";
  const found = !!findInTranscript(e.quote, text); const near = found ? null : nearRange(e, text);
  const queue = S.evidence.filter(x => x.status === "Candidate").sort((a, b) => a.id.localeCompare(b.id, undefined, {numeric:true}));
  const next = queue.find(x => x.id !== e.id && x.id.localeCompare(e.id, undefined, {numeric:true}) > 0) || queue.find(x => x.id !== e.id);
  return `<div class="scrim" data-act="closeDrawer"></div><aside class="drawer" role="dialog" aria-label="Transcript">
    <div class="dh"><div class="spread"><div><b>${esc(iv.id)}</b> ${esc(iv.interviewee || "")}<div class="hint">${esc([iv.role, iv.date].filter(Boolean).join(", "))}</div></div>
      <div class="row">${next ? `<button class="btn sm" data-act="openDrawer" data-id="${esc(next.id)}">Next suggestion</button>` : ""}<a class="btn sm" href="#/interviews/${esc(iv.id)}">Open interview</a><button class="btn icon" data-act="closeDrawer" title="Close (Esc)">✕</button></div></div>
      <div style="margin-top:12px">${quoteCard(e, text, {inInterview:true})}</div>
      ${found ? "" : `<div class="notice bad">These exact words aren't in the transcript, so the AI may have changed them. ${near ? "The dashed line is where it said the quote came from." : "Read the transcript before confirming."}</div>`}
    </div>
    <div class="db"><div class="transcript">${text ? highlight(text, S.evidence.filter(x => x.interviewId === e.interviewId), e.id, near) : `<p class="empty">No transcript saved for this interview.</p>`}</div></div>
  </aside>`;
}

function nextStep(m){
  if (!S.problems.length || !idealCustomer()) return ["Get your snapshot down in one sitting: the problems you believe exist and who you believe has them.", "start", "Start"];
  if (!S.compass.valueProp.why) return ["Write your value proposition. It's the claim you'll have to earn.", "compass/value", "Write it"];
  if (!S.assumptions.length) return ["Turn your canvas into points and put them on the map.", "compass/map", "Open the map"];
  if (!S.assumptions.some(a => assumptionPriority(a))) return ["Drag your points into the grid. Top-left is what you test first.", "compass/map", "Open the map"];
  const c = compassReadout();
  if (c.riskiestOpen && !S.interviews.length) return [`Your riskiest untested assumption: ${c.riskiestOpen.a.text}. Interviews will test it.`, (S.compass.leads||[]).length ? "compass/leads" : "interviews", (S.compass.leads||[]).length ? "Pick a lead" : "Log an interview"];
  if (!S.interviews.length) return ["Log your first customer interview and paste the transcript.", "interviews", "Log an interview"];
  if (m.toConfirm) return [`${m.toConfirm} quote${m.toConfirm>1?"s and scores":" or score"} from your AI to be confirmed. Only confirmed items count.`, "quotes", "Decide now"];
  if (m.candidates) return [`${m.candidates} suggestion${m.candidates>1?"s":""} from your AI (places, leads, alternatives or competitors). Accept or dismiss ${m.candidates>1?"them":"it"}.`, (S.competitors || []).some(c => c.status === "Candidate") && !(S.places || []).some(p => p.status === "Candidate") && !(S.leads || []).some(l => l.status === "Candidate") ? "insights/alternatives" : "insights/customers", m.candidates>1?"See them":"See it"];
  const noRubric = S.interviews.find(i => !i.rubricRun);
  if (noRubric) return [`${noRubric.id} hasn't been reviewed by your AI yet.`, "interviews/" + noRubric.id, "Open " + noRubric.id];
  const reviewed = S.interviews.filter(i => i.rubricRun).length, holes = S.notes.filter(n => /poke-holes/i.test(n.name)).length;
  if (reviewed >= 2 && holes < Math.floor(reviewed / 2)) return ["Two more interviews are in. Ask your AI to poke holes in your riskiest assumptions before the next ones.", "ask", "See how"];
  if (c.counts.Contradicted){
    const con = rankedAssumptions().filter(x => x.a.status === "Active" && x.s.status === "Contradicted");
    const bare = con.find(x => !pivotsFor(x.a.id).length);
    if (bare) return [`${bare.a.id} is contradicted. Ask your AI to poke holes: it proposes what you'd change.`, "ask", "See how"];

  if (!S.persona.fields.who.text) return ["Start your customer persona, with a quote behind every line.", "persona", "Open persona"];
  return ["Keep interviewing. Each conversation should re-test an assumption, not just add new ideas.", "interviews", "Log an interview"];
}

/* ---------------- quotes: one page, three filters ---------------- */
/* Everything the AI pulled out and the founder hasn't decided on yet, quotes first, then pain scores. */
function reviewQueue(){
  return sortById(S.evidence.filter(e => e.status === "Candidate")).map(e => ({kind:"evidence", rec:e}))
    .concat(sortById(S.pains.filter(p => p.status === "Candidate")).map(p => ({kind:"pains", rec:p})));
}
/* One decision at a time: the quote (or score), its interview, and the transcript scrolled to it. A decision removes it from the queue, so the next one takes its place; Next skips. */
function reviewOne(queue){
  if (!queue.length) return `<div class="empty"><b>Nothing to confirm.</b><br>Ask your AI to review an interview and its quotes and pain scores land here, one at a time. <a href="#/quotes/confirmed">See what's confirmed.</a></div>`;
  const i = Math.min(Math.max(0, ui.reviewIdx || 0), queue.length - 1); const x = queue[i]; const rec = x.rec;
  const iv = byId(S.interviews, rec.interviewId) || {id:rec.interviewId}; const text = S.transcripts[rec.interviewId] || "";
  const who = [iv.interviewee, iv.role].filter(Boolean).join(", ");
  let card, focusId = null, near = null;
  if (x.kind === "evidence"){
    const found = !!findInTranscript(rec.quote, text); near = text && !found ? nearRange(rec, text) : null; focusId = rec.id;
    card = quoteCard(rec, text || null, {inInterview:true, noActs:true}) + (text && !found ? `<div class="notice bad" style="margin-top:10px">These exact words aren't in the transcript, so the AI may have changed them. ${near ? "The dashed line is where it said the quote came from." : "Read the transcript before confirming."}</div>` : "");
  } else { focusId = (rec.evidenceIds || [])[0] || null; card = painCard(rec, {noActs:true}); }
  return `<div class="rv">
    <div class="rvh"><div class="tool">${x.kind === "evidence" ? "Quote" : "Pain score"} ${i + 1} of ${queue.length} · <a href="#/interviews/${esc(iv.id)}">${esc(iv.id)}</a>${who ? ` · <span class="who">${esc(who)}</span>` : ""}</div>
      <div class="row">${queue.length > 1 ? `<button class="btn sm" data-act="reviewNext">Next, decide later</button>` : ""}</div></div>
    <div class="split">
      <div>${card}
        <div class="decide"><button class="btn pri" data-act="setStatus" data-kind="${x.kind}" data-id="${esc(rec.id)}" data-val="Confirmed">✓ Confirm</button><button class="btn" data-act="setStatus" data-kind="${x.kind}" data-id="${esc(rec.id)}" data-val="Rejected">✕ Reject</button><span class="hint">${x.kind === "evidence" ? "Confirm only their exact words. When unsure, reject; your AI can try again." : "Confirm only a tier the cited quotes justify. When unsure between two, the lower."}</span></div></div>
      <div class="box soft" style="margin:0"><h3>Transcript</h3>${text ? `<div class="transcript rvt">${highlight(text, S.evidence.filter(e => e.interviewId === rec.interviewId), focusId, near)}</div><p class="legend">Highlights: <mark class="s-Confirmed">confirmed</mark> <mark class="s-Candidate">suggested</mark>. The outlined one is this ${x.kind === "evidence" ? "quote" : "score's first quote"}.</p>` : `<p class="empty">No transcript saved for this interview. <a href="#/interviews/${esc(iv.id)}">Paste it</a> before you confirm anything from it.</p>`}</div>
    </div></div>`;
}
function quotesView(sub){
  const queue = reviewQueue(); const f = ui.filters;
  const counts = {Candidate:queue.length, Confirmed:S.evidence.filter(e => e.status === "Confirmed").length, Rejected:S.evidence.filter(e => e.status === "Rejected").length};
  const st = sub === "confirmed" ? "Confirmed" : sub === "rejected" ? "Rejected" : sub === "to-confirm" ? "Candidate" : queue.length ? "Candidate" : "Confirmed";
  const filters = `<div class="tabs filters" style="margin-bottom:18px">${[["to-confirm","Candidate","To be confirmed"],["confirmed","Confirmed","Confirmed"],["rejected","Rejected","Rejected"]].map(([h, k, l]) => `<button class="${st === k ? "on" : ""}" data-act="go" data-href="quotes/${h}">${l} <span class="n">${counts[k]}</span></button>`).join("")}</div>`;
  let body;
  if (st === "Candidate") body = reviewOne(queue);
  else {

    const pains = st === "Rejected" ? sortById(S.pains.filter(p => p.status === "Rejected")) : [];

/* ---------------- events ---------------- */
function toast(msg, undo){
  ui.toast = {msg, undo};
  let t = document.getElementById("toast");
  if (!t){ t = document.createElement("div"); t.id = "toast"; t.className = "toast"; document.body.appendChild(t); }
  t.innerHTML = `<span>${esc(msg)}</span>${undo ? `<button data-act="undo">Undo</button>` : ""}`; t.style.display = "flex";
  clearTimeout(toast.t); toast.t = setTimeout(hideToast, 5000);
}
function hideToast(){ ui.toast = null; const t = document.getElementById("toast"); if (t) t.style.display = "none"; }
async function copy(text, msg){ try { await navigator.clipboard.writeText(text); toast(msg || "Copied."); } catch(e){ prompt("Copy this:", text); } }

document.addEventListener("click", async ev => {
  const rowLink = ev.target.closest("[data-href]:not(a)");

  if (el.tagName === "A" && !el.getAttribute("href").startsWith("#/")) ev.preventDefault();
  const a = el.dataset.act; const r = route();
  if (a === "demo"){ store = new MemoryStore(); S = demoState(); aiReady = true; go("home"); render(); }
  else if (a === "open") await openFolder(false);

  else if (a === "reopen") await openFolder(true);

  else if (a === "newInterview"){ const id = nextId("INT-", S.interviews, 3); upsert("interviews", {id, date:today(), interviewee:"", role:"", customerId:"", source:"", interviewer:S.config.founder || "", recentInstance:"", leading:"", pitched:"", demoed:"", closing:"", rubricRun:false, notes:"", coachingNote:""}); ui.tab[id] = "quotes"; go("interviews/" + id); }

// Text fields save after a short pause, and immediately when you leave the field. Pasted transcripts and AI replies are kept as drafts until used.
const typeTimers = new WeakMap();
function saveTextField(el){
  const a = el.dataset.act; const form = el.closest("form[data-form]"); const r = route();
  const v = el.isContentEditable ? el.textContent.replace(/\u00a0/g, " ").trim() : el.value;

  else if (a === "cMeta"){ S.compass.meta = S.compass.meta || {}; S.compass.meta[el.dataset.field] = v; persist("compass"); }
  else if (a === "cSolution"){ S.compass.solutions = S.compass.solutions || {}; S.compass.solutions[el.dataset.id] = v; persist("compass"); }
  else if (a === "cItem"){ const it = byId(S.compass[el.dataset.kind]||[], el.dataset.id); if (it){ it[el.dataset.field] = v; persist("compass"); } }
  else if (a === "cStmt"){ S.compass[el.dataset.stmt][el.dataset.field] = v; persist("compass"); }
  else if (a === "aText"){ const x = byId(S.assumptions, el.dataset.id); if (x) upsert("assumptions", {...x, text:v}); }
  else if (a === "aNote"){ const x = byId(S.assumptions, el.dataset.id); if (x) upsert("assumptions", {...x, note:v}); }
  else if (a === "pField"){ const p = byId(S.problems, el.dataset.id); if (p) upsert("problems", {...p, [el.dataset.field]: v}); }
  else if (a === "personaText"){ S.persona.fields[el.dataset.key].text = el.value; persist("persona"); }
  else if (a === "jobText"){ const j = byId(S.jobs, el.dataset.id); if (j) upsert("jobs", {...j, [el.dataset.field]: el.value}); }
  else if (a === "painDisagree"){ const p = byId(S.pains, el.dataset.id); if (p) upsert("pains", {...p, disagree: v}); }
  else if (a === "recField"){ const rec = byId(S[el.dataset.kind] || [], el.dataset.id); if (rec) upsert(el.dataset.kind, {...rec, [el.dataset.field]: v}); }
  else if (form && form.dataset.form === "interview"){ const iv = byId(S.interviews, r.id); if (iv) upsert("interviews", {...iv, ...Object.fromEntries(new FormData(form))}); }
  else if (form && form.dataset.form === "problem"){ const p = byId(S.problems, r.id); if (p) upsert("problems", {...p, ...Object.fromEntries(new FormData(form))}); }
  else if (form && form.dataset.form === "config"){ const d = Object.fromEntries(new FormData(form)); S.config = {...S.config, founder:d.founder, venture:d.venture, program:d.program, programSub:d.programSub, cohort:d.cohort}; persist("config"); }
}

/* ---------------- the assumptions map: a whiteboard ----------------
   ui.view = {x, y, k}: where the world sits in the viewport and how zoomed. Points live in world px.
   Zoom in has no cap; zoom out stops where the grid plus the shelf fit the viewport (ui.kmin), and that limit follows the
   viewport's size. Left-drag on a point moves it and saves its rating; left-drag on the board pans; wheel zooms. */
function mountMap(){
  const vp = document.getElementById("vp");
  if (!vp){ if (ui.mapRO){ ui.mapRO.disconnect(); ui.mapRO = null; } return; }
  if (!ui.view) fitView(vp); else { const was = ui.view.k <= ui.kmin + 1e-9; ui.kmin = fitK(vp); if (was) fitView(vp); else applyView(); }   // at the limit: re-fit to the new room; else keep the view
  if (settleMetrics(vp)) return;                                                 // the board's proportions changed with the room: drawn again, once
  if (ui.mapRO) ui.mapRO.disconnect();
  ui.mapRO = new ResizeObserver(() => { const v = document.getElementById("vp"); if (!v || !ui.view) return; const was = ui.view.k <= ui.kmin + 1e-9; ui.kmin = fitK(v); if (was) fitView(v); else applyView(); settleMetrics(v); });
  ui.mapRO.observe(vp); const lgd = vp.querySelector(".legend"); if (lgd) ui.mapRO.observe(lgd);   // the legend too: it wraps when the webfont lands or the board narrows, and the fit leaves room for it
  if (ui.focusText){ const el = document.querySelector(`.mappanel .ed[data-act="aText"][data-id="${CSS.escape(ui.focusText)}"]`); ui.focusText = null; if (el){ el.focus(); const s = window.getSelection(), rg = document.createRange(); rg.selectNodeContents(el); rg.collapse(false); s.removeAllRanges(); s.addRange(rg); } }
  const card = document.getElementById("card");
  if (card && card.innerHTML.trim()){ placeCard(); if (ui.cardFor === ui.selNote) card.classList.add("in"); else requestAnimationFrame(() => card.classList.add("in")); ui.cardFor = ui.selNote; }
  else ui.cardFor = null;
}
/* Room on screen around the fitted board: the axis words left and right, the hint above when shown, the legend below. */
function screenPad(vp){
  const shown = el => el && getComputedStyle(el).display !== "none";
  const hint = vp.querySelector(".hint2"), legend = vp.querySelector(".legend");
  return {l:SCREEN_PAD.l, r:SCREEN_PAD.r, t:shown(hint) ? hint.offsetTop + hint.offsetHeight + 12 : SCREEN_PAD.t, b:shown(legend) ? legend.offsetHeight + 24 : SCREEN_PAD.b};
}
/* The shelf's geometry depends on the zoom-out limit, which depends on the shelf's geometry: two passes settle it. A re-render
   happens only when the limit moved enough (8%) to change what's drawn, and never twice in a row. */
function settleMetrics(vp){
  const wasAtLimit = ui.view.k <= ui.kmin + 1e-9, drawn = ui.mapKDrawn || 0;
  let k = ui.mapK || fitK(vp); for (let i = 0; i < 8; i++){ ui.mapK = k; const k2 = fitK(vp); if (Math.abs(k2 - k) < 1e-3){ k = k2; break; } k = k2; }   // the limit and the shelf's size depend on each other: iterate to the fixed point
  if (Math.abs(k - drawn) / (drawn || k) > 0.08 && !ui.mapSettling){ ui.mapK = k; ui.kmin = k; if (wasAtLimit) ui.view.k = k; ui.mapSettling = true; render(); ui.mapSettling = false; return true; }
  ui.mapK = drawn || k; return false;
}
function fitK(vp){ const r = vp.getBoundingClientRect(), b = mapBox(), p = screenPad(vp); return Math.max(0.05, Math.min((r.width - p.l - p.r) / (b.x1 - b.x0), (r.height - p.t - p.b) / (b.y1 - b.y0))); }
/* The view at the zoom-out limit: the grid plus the shelf, centred in the room the axis words leave. */
function fitted(vp){
  const r = vp.getBoundingClientRect(), b = mapBox(), k = fitK(vp), p = screenPad(vp);
  return {k, x:p.l + ((r.width - p.l - p.r) - (b.x1 - b.x0) * k) / 2 - b.x0 * k,
             y:p.t + ((r.height - p.t - p.b) - (b.y1 - b.y0) * k) / 2 - b.y0 * k};
}
function fitView(vp){ ui.kmin = fitK(vp); ui.view = fitted(vp); applyView(); }
function clampView(vp){
  const v = ui.view;
  if (v.k <= ui.kmin + 1e-9){ ui.view = fitted(vp); return; }                 // at the limit the board sits exactly fitted
  const r = vp.getBoundingClientRect(), b = mapBox(), keep = 80;              // otherwise the grid can't be panned fully off the screen
  v.x = Math.min(r.width - keep - b.x0 * v.k, Math.max(keep - b.x1 * v.k, v.x));
  v.y = Math.min(r.height - keep - b.y0 * v.k, Math.max(keep - b.y1 * v.k, v.y));
}
function applyView(){
  const w = document.getElementById("world"), vp = document.getElementById("vp"); if (!w || !vp || !ui.view) return;
  if (ui.kmin == null) ui.kmin = fitK(vp);
  if (ui.view.k < ui.kmin) ui.view.k = ui.kmin;
  clampView(vp);
  w.style.transform = `translate(${ui.view.x}px,${ui.view.y}px) scale(${ui.view.k})`; w.style.setProperty("--ik", 1 / ui.view.k);
  vp.classList.toggle("tiny", ui.view.k < 0.4);                                   // too small for five words across: the two "Probably" words and the axis names go
  placeCard();
}
function zoomAt(cx, cy, f){ const v = ui.view; if (!v) return; const k2 = Math.max(ui.kmin || 0, v.k * f); const wx = (cx - v.x) / v.k, wy = (cy - v.y) / v.k; v.k = k2; v.x = cx - wx * k2; v.y = cy - wy * k2; applyView(); }
function worldAt(vp, clientX, clientY){ const r = vp.getBoundingClientRect(); const v = ui.view; return {x:(clientX - r.left - v.x) / v.k, y:(clientY - r.top - v.y) / v.k}; }
/* The card sits next to the selected point in screen space, flipping left when it would run off the board. */
function placeCard(){
  const card = document.getElementById("card"), vp = document.getElementById("vp"); if (!card || !vp || !ui.view || !ui.selNote || !card.innerHTML.trim()) return;
  const pt = vp.querySelector(`.pt.me[data-pt="${CSS.escape(ui.selNote)}"]`); if (!pt) return;
  const r = vp.getBoundingClientRect(), v = ui.view, sx = v.x + parseFloat(pt.style.left) * v.k, sy = v.y + parseFloat(pt.style.top) * v.k;
  const cw = card.offsetWidth, ch = card.offsetHeight;
  let x = sx + 20, y = sy - 14;
  if (x + cw > r.width - 12) x = sx - 20 - cw;
  if (y + ch > r.height - 12) y = r.height - 12 - ch;
  card.style.left = Math.max(12, x) + "px"; card.style.top = Math.max(12, y) + "px";
}
/* A point with nothing written on it disappears when you click away. */
function cleanupEmpty(id){ const a = id && byId(S.assumptions, id); if (a && a.status === "Active" && !a.seed && !(a.text || "").trim() && !a.aiImpact && !a.aiReason && !(a.evidence || []).length && !(a.note || "").trim()) removeRec("assumptions", a.id); }
function deselect(){ const prev = ui.selNote; ui.selNote = null; ui.mapPanel = false; dropSub(); cleanupEmpty(prev); }
function selectPoint(id){ if (ui.selNote === id) return; const prev = ui.selNote; ui.selNote = id; ui.mapPanel = false; dropSub(); cleanupEmpty(prev); }
let drag = null, pan = null;
const MAP_CHROME = ".ptcard,.hud,.legend,.hint2,.ov,button,select,input,a,[contenteditable]";
document.addEventListener("pointerdown", ev => {
  const vp = ev.target.closest("#vp"); if (!vp || !ui.view) return;
  if (ev.target.closest(MAP_CHROME)) return;
  const pt = ev.target.closest(".pt[data-pt]");
  if (pt && ev.button === 0){
    const a = byId(S.assumptions, pt.dataset.pt); if (!a) return;
    drag = {id:a.id, el:pt, startX:ev.clientX, startY:ev.clientY, moved:false, locked:!!pt.dataset.ai || a.status === "Candidate", wx:parseFloat(pt.style.left), wy:parseFloat(pt.style.top)};
    pt.setPointerCapture(ev.pointerId); return;                              // capture on the point, so a double-click still lands on it
  }
  if (ev.button !== 0 && ev.button !== 1) return;
  ev.preventDefault();
  pan = {button:ev.button, startX:ev.clientX, startY:ev.clientY, vx:ui.view.x, vy:ui.view.y, moved:false, vp, onBoard:!pt};
  vp.setPointerCapture(ev.pointerId);
});
document.addEventListener("pointermove", ev => {
  if (drag){
    if (drag.locked) return;
    const dx = ev.clientX - drag.startX, dy = ev.clientY - drag.startY;
    if (!drag.moved && Math.hypot(dx, dy) < 4) return;                        // 4px threshold: a click never nudges
    if (!drag.moved){ drag.moved = true; ui.dragging = true; drag.el.classList.add("dragging"); const c = document.getElementById("card"); if (c) c.classList.remove("in"); }
    const w0 = {x:drag.wx + dx / ui.view.k, y:drag.wy + dy / ui.view.k}; const raw = posOf(w0);
    drag.w = inGrid(raw) ? worldOf(clampPos(raw)) : w0;                       // inside the grid the edge is the limit
    drag.el.style.left = drag.w.x + "px"; drag.el.style.top = drag.w.y + "px";
    const tie = document.querySelector(`#world line[data-tie="${CSS.escape(drag.id)}"]`); if (tie){ tie.setAttribute("x1", drag.w.x); tie.setAttribute("y1", drag.w.y); }
    return;
  }
  if (pan){
    const dx = ev.clientX - pan.startX, dy = ev.clientY - pan.startY;
    if (!pan.moved && Math.hypot(dx, dy) < 4) return;
    if (!pan.moved){ pan.moved = true; ui.dragging = true; pan.vp.classList.add("panning"); }
    ui.view.x = pan.vx + dx; ui.view.y = pan.vy + dy; applyView();
  }
});
function endPointer(ev){
  if (drag){
    const d = drag; drag = null; ui.dragging = false; d.el.classList.remove("dragging");
    if (!d.moved){ if (ui.selNote !== d.id){ selectPoint(d.id); render(); } return; }   // a click: select; the second click of a double-click changes nothing, so dblclick lands on the same point
    const a = byId(S.assumptions, d.id); if (!a) return;
    const raw = posOf(d.w); const pos = inGrid(raw) ? clampPos(raw) : null;   // release: snap into the grid, rated; or onto the shelf
    upsert("assumptions", {...a, pos, ...(pos ? ratingOf(pos) : {impact:"", confidence:""})}); render(); return;
  }
  if (pan){
    const p = pan; pan = null; ui.dragging = false; p.vp.classList.remove("panning");
    if (p.moved || p.button !== 0 || !p.onBoard || ev.type !== "pointerup") return;
    if (ui.selNote){ deselect(); render(); }                                  // a click on empty board closes the card
  }
}
document.addEventListener("pointerup", endPointer); document.addEventListener("pointercancel", endPointer);
document.addEventListener("dblclick", ev => {
  const vp = ev.target.closest("#vp"); if (!vp || !ui.view) return;
  if (ev.target.closest(MAP_CHROME)) return;
  const pt = ev.target.closest(".pt[data-pt]");
  if (pt){ const a = byId(S.assumptions, pt.dataset.pt); if (!a) return; if (ui.selNote !== a.id) selectPoint(a.id); ui.mapPanel = true; render(); return; }
  // double-click on empty board adds a point there, selects it and opens the panel with the text ready to type
  const raw = posOf(worldAt(vp, ev.clientX, ev.clientY)); const pos = inGrid(raw) ? clampPos(raw) : null; const id = nextId("A-", S.assumptions, 2);
  const prev = ui.selNote; upsert("assumptions", {...blankAssumption(id), pos, ...(pos ? ratingOf(pos) : {})}); ui.selNote = id; ui.mapPanel = true; dropSub(); cleanupEmpty(prev); ui.focusText = id; render();
});
document.addEventListener("wheel", ev => {
  const vp = ev.target.closest && ev.target.closest("#vp"); if (!vp || !ui.view) return;
  if (ev.target.closest(".ov,.ptcard")) return;                                  // panels scroll normally
  ev.preventDefault();
  const r = vp.getBoundingClientRect();
  zoomAt(ev.clientX - r.left, ev.clientY - r.top, Math.exp(-ev.deltaY * (ev.ctrlKey || ev.metaKey ? 0.01 : 0.0015)));   // trackpad pinch arrives as ctrl+wheel
}, {passive:false});

/* ---------------- folder handling + watching for AI writes ---------------- */
let watchTimer = null;
function stopWatching(){ clearInterval(watchTimer); watchTimer = null; }
function startWatching(){
  stopWatching();
  if (!store || store.kind !== "folder") return;
  watchTimer = setInterval(checkFolder, 4000);
}
async function checkFolder(){
  if (!store || store.kind !== "folder" || document.hidden) return;
  const ae = document.activeElement; if (ae && (ae.tagName === "TEXTAREA" || ae.tagName === "INPUT" || ae.isContentEditable)) return;   // don't yank the page while typing
  if (ui.dragging) return;
  let now; try { now = await store.scan(); } catch(e){ return; }
  const before = store.stamps || {};
  const changed = Object.keys(now).filter(k => now[k] !== before[k]).concat(Object.keys(before).filter(k => !(k in now)));
  if (!changed.length) return;
  const beforeCand = S.evidence.filter(e => e.status === "Candidate").length + S.pains.filter(p => p.status === "Candidate").length;
  const beforeNotes = S.notes.length;
  S = await store.loadAll(); lastPush = await store.lastPush(); render();
  const cand = S.evidence.filter(e => e.status === "Candidate").length + S.pains.filter(p => p.status === "Candidate").length;
  if (cand > beforeCand) toast(`${cand - beforeCand} new suggestion${cand - beforeCand > 1 ? "s" : ""} from your AI. Review them when you're ready.`);
  else if (S.notes.length > beforeNotes) toast("Your AI wrote a new note.");
}
async function useRoot(root, force){
  store = new FolderStore(root); ui.view = null;
  if (!force){ store.wrongFolder = await store.looksLikeDataFolder(); if (store.wrongFolder){ render(); return; } }
  await enterRoot();
}
async function enterRoot(){
  await idb.set("root", store.root).catch(() => {});
  aiReady = await store.hasAiInstructions();
  if (!(await store.isInitialized())){ store.needsSetup = true; store.noGit = !(await store.hasGit()); render(); return; }
  S = await store.loadAll();
  lastPush = await store.lastPush();
  if (!location.hash || location.hash === "#") go("home");
  render(); startWatching();
}
async function openFolder(reopen){
  try {
    let root;
    if (reopen && ui.savedHandle){
      const h = ui.savedHandle;
      if ((await h.queryPermission({mode:"readwrite"})) !== "granted" && (await h.requestPermission({mode:"readwrite"})) !== "granted") return;
      root = h;
    } else root = await window.showDirectoryPicker({id:"drm", mode:"readwrite"});
    await useRoot(root);
  } catch(e){ if (e.name !== "AbortError") alert("Couldn't open that folder: " + e.message); }
}

/* ---------------- installable (PWA) ---------------- */
/* The browser offers the install prompt once; keep it so the Settings page can show an Install button. */
let installPrompt = null;
window.addEventListener("beforeinstallprompt", ev => { ev.preventDefault(); installPrompt = ev; if (route().page === "settings") render(); });
window.addEventListener("appinstalled", () => { installPrompt = null; if (route().page === "settings") render(); });
function registerWorker(demo){
  /* Not in the demo, and only where a worker can run: https (GitHub Pages) or localhost. */
  if (!("serviceWorker" in navigator) || demo || !(location.protocol === "https:" || location.hostname === "localhost")) return;
  let had = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (had) toast("Updated. Reload to get the latest version."); had = true; });
  navigator.serviceWorker.register("./sw.js").catch(() => {});
}

/* ---------------- start ---------------- */
(async function init(){
  const params = new URLSearchParams(location.search);
  window.__drm = {get S(){ return S; }, get store(){ return store; }, get ui(){ return ui; }, parseRubric, checkFolder};
  registerWorker(params.get("demo") === "1");
  if (params.get("test") === "opfs"){ const root = await navigator.storage.getDirectory(); await useRoot(root); return; }
  if (params.get("demo") === "1"){ store = new MemoryStore(); S = demoState(); aiReady = true; render(); return; }
  ui.savedHandle = ("showDirectoryPicker" in window) ? await idb.get("root").catch(() => null) : null;
  render();
})();
</script>
