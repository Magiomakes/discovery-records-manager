<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Discovery Records Manager</title>
<style>
:root{
  --navy:#1F3864; --navy-2:#2c4a80; --ink:#1d2433; --muted:#5f6b7a; --line:#e3e7ee; --bg:#f6f7f9; --card:#fff;
  --hof:#F4CCCC; --inc:#FCE5CD; --nth:#FFF2CC; --lat:#CFE2F3; --nap:#EFEFEF;
  --ok:#2e7d4f; --ok-bg:#e3f2e8; --warn:#9a6b00; --warn-bg:#fff4d6; --bad:#b3261e; --bad-bg:#fbe6e4;
  --radius:10px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--navy-2)}
.app{display:grid;grid-template-columns:232px 1fr;height:100vh}
.side{background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{padding:16px 16px 10px;border-bottom:1px solid var(--line)}
.brand b{display:block;font-size:15px;color:var(--navy)}
.brand span{font-size:12px;color:var(--muted)}
.nav{padding:8px;overflow:auto;flex:1}
.nav .grp{display:flex;align-items:center;gap:6px;width:100%;border:none;background:none;cursor:pointer;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:12px 10px 4px;text-align:left}
.nav .grp:hover{color:var(--ink)}
.nav .grp .chev{display:inline-block;width:10px;transition:transform .15s}
.nav .grp.closed .chev{transform:rotate(-90deg)}
.nav .grp.has-active{color:var(--navy);font-weight:600}
.nav .grp .badge{margin-left:auto}
.nav a{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;border-radius:7px;text-decoration:none;color:var(--ink)}
.nav a:hover{background:var(--bg)}
.nav a.on{background:#e8edf6;color:var(--navy);font-weight:600}
.badge{background:var(--navy);color:#fff;border-radius:999px;font-size:11px;padding:1px 7px;font-weight:600}
.badge.warn{background:#d98e04}
.sidefoot{border-top:1px solid var(--line);padding:12px 14px;font-size:12px;color:var(--muted)}
.sidefoot b{color:var(--ink)}
.main{overflow:auto;min-width:0}
.page{max-width:1180px;margin:0 auto;padding:24px 28px 80px}
.crumbs{font-size:13px;color:var(--muted);margin-bottom:4px}
.crumbs a{text-decoration:none}
h1{font-size:22px;margin:0 0 4px}
h2{font-size:16px;margin:0 0 10px}
h3{font-size:14px;margin:0 0 8px}
.sub{color:var(--muted);margin:0 0 18px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:900px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.app{grid-template-columns:1fr}.side{display:none}}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:#c6cdd8}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.pri:hover{background:var(--navy-2)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.sm{padding:4px 9px;font-size:13px}
.btn.icon{width:32px;height:32px;padding:0;display:inline-flex;align-items:center;justify-content:center;font-size:15px}
.btn.icon.yes{color:var(--ok)} .btn.icon.yes:hover{background:var(--ok-bg);border-color:var(--ok)}
.btn.icon.no{color:var(--bad)} .btn.icon.no:hover{background:var(--bad-bg);border-color:var(--bad)}
.btn.link{border:none;background:none;color:var(--navy-2);padding:0;text-decoration:underline}
.btn:disabled{opacity:.5;cursor:not-allowed}
label.f{display:block;font-size:12px;color:var(--muted);margin-bottom:10px}
label.f > input,label.f > select,label.f > textarea{display:block;width:100%;margin-top:4px}
input[type=text],input[type=number],input[type=date],select,textarea{border:1px solid var(--line);border-radius:7px;padding:7px 9px;background:#fff}
textarea{resize:vertical;min-height:70px}
input:focus,select:focus,textarea:focus{outline:2px solid #b9c8e6;border-color:#8ea6d4}
table{width:100%;border-collapse:collapse}
th{font-size:12px;color:var(--muted);text-align:left;font-weight:600;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr.click{cursor:pointer} tr.click:hover td{background:#fafbfd}
.chip{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;border:1px solid transparent;white-space:nowrap}
.chip.gray{background:#eef0f4;color:#3b4554}
.chip.blue{background:#e6edf9;color:var(--navy)}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.tier-hof{background:var(--hof)} .tier-inc{background:var(--inc)} .tier-nth{background:var(--nth)} .tier-lat{background:var(--lat)} .tier-nap{background:var(--nap)}
.chip.tier{color:#2a2a2a}
.metric{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.metric .n{font-size:26px;font-weight:700;color:var(--navy)}
.metric .l{font-size:12px;color:var(--muted)}
.metric.warn{border-color:#f0c24b;background:#fffaf0}
.metric.warn .n{color:var(--warn)}
.metric.good .n{color:var(--ok)}
.bar{display:flex;height:22px;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.bar div{font-size:11px;display:flex;align-items:center;justify-content:center;color:#333}
.next{background:#e8edf6;border:1px solid #c9d5ea;border-radius:var(--radius);padding:14px 16px;margin-bottom:16px}
.next b{color:var(--navy)}
.quote{font-size:14.5px;line-height:1.5}
.quote:before{content:"\201C"} .quote:after{content:"\201D"}
.qcard{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:10px}
.qcard.rejected{opacity:.55}
.qcard .meta{font-size:12px;color:var(--muted);margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.qcard.focus{outline:2px solid #8ea6d4}
.split{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:1100px){.split{grid-template-columns:1fr}}
.transcript{white-space:pre-wrap;font-size:14px;line-height:1.6;max-height:70vh;overflow:auto;padding-right:6px}
mark{border-radius:3px;padding:0 1px;cursor:pointer}
mark.s-Confirmed{background:#cfe9d8} mark.s-Candidate{background:#ffe9a8} mark.s-Rejected{background:#eee;text-decoration:line-through}
.empty{color:var(--muted);text-align:center;padding:26px 10px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1d2433;color:#fff;border-radius:9px;padding:10px 14px;display:flex;gap:14px;align-items:center;box-shadow:0 6px 24px rgba(0,0,0,.2);z-index:50}
.toast button{background:none;border:1px solid #fff6;color:#fff;border-radius:6px;padding:3px 9px;cursor:pointer}
.banner{background:var(--warn-bg);border-bottom:1px solid #f0d58a;padding:8px 16px;font-size:13px}
.welcome{max-width:720px;margin:60px auto;padding:0 20px}
.welcome .card{padding:24px}
.hint{font-size:12px;color:var(--muted)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}
pre.prompt{white-space:pre-wrap;background:#f8f9fb;border:1px solid var(--line);border-radius:8px;padding:12px;max-height:340px;overflow:auto}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:none;background:#fff;padding:5px 10px;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--navy);color:#fff}
.checks{display:flex;gap:6px;flex-wrap:wrap}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:12px}
.tabs button{border:none;background:none;padding:8px 10px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent}
.tabs button.on{color:var(--navy);border-color:var(--navy);font-weight:600}
.md h1{font-size:20px}.md h2{font-size:16px;margin-top:20px}.md table{margin:8px 0 14px}.md td,.md th{border:1px solid var(--line)}
.md blockquote{border-left:3px solid var(--line);margin:6px 0;padding:2px 10px;color:#333}
.small{font-size:12px}
.scrim{position:fixed;inset:0;background:rgba(20,30,50,.18);z-index:39}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,96vw);background:#fff;border-left:1px solid var(--line);box-shadow:-8px 0 30px rgba(0,0,0,.14);display:flex;flex-direction:column;z-index:40}
.drawer .dh{padding:14px 18px;border-bottom:1px solid var(--line)}
.drawer .db{overflow:auto;padding:16px 18px;flex:1}
.drawer .transcript{max-height:none}
mark.focus-mark,mark.focus{outline:2px solid var(--navy);outline-offset:1px}
.near{background:#e6edf9;border-radius:3px;outline:2px dashed #8ea6d4;outline-offset:1px}
.right{text-align:right}
</style>
</head>
<body>
<div id="root"></div>
<script>
"use strict";
/* ============================================================
   Discovery Records Manager (DRM)
   Levels 1-2 of Darren Yee's Discovery Ladder.
   Data lives as plain files in the founder's own repo folder.
   ============================================================ */

const TEMPLATE_URL = "https://github.com/Magiomakes/discovery-records-manager";
const SETUP_URL = TEMPLATE_URL + "/blob/main/SETUP.md";

const TIERS = ["Hair on Fire","Incremental Improvement","Nice to Have","Latent","Not a Problem"];
const TIER_CLASS = {"Hair on Fire":"tier-hof","Incremental Improvement":"tier-inc","Nice to Have":"tier-nth","Latent":"tier-lat","Not a Problem":"tier-nap"};
const TIER_DEF = {
  "Hair on Fire":"Already invested money or recurring time they can't get back, and the problem is still not solved.",
  "Incremental Improvement":"Actively trying to fix it, but the effort is reversible (tried a tool and dropped it, stopped when a free trial ended).",
  "Nice to Have":"Describes the problem clearly but has done nothing about it.",
  "Latent":"Has the problem but doesn't see it as a problem. A coaching flag, not a buying signal.",
  "Not a Problem":"No sign they have it."
};
const EVIDENCE_TYPES = ["Past behavior, irreversible","Past behavior, reversible","Current workaround","Frequency","Cost (time or money)","Strong language","Opinion or future intent"];
const EVIDENCE_DEF = {
  "Past behavior, irreversible":"Money spent, recurring time, or a workaround they built and keep using.",
  "Past behavior, reversible":"Tried something and dropped it, abandoned free trials.",
  "Current workaround":"What they use today instead of a real solution.",
  "Frequency":"How often it happens, in their words.",
  "Cost (time or money)":"Hours, dollars or grades lost.",
  "Strong language":"How they talk about it. Supports a score, never decides it.",
  "Opinion or future intent":"\"I would\", \"I'd probably\", \"sounds useful\". Weak evidence."
};
const SOURCES = ["Stranger (cold outreach)","Online community or follower","Referral from an interviewee","Classmate or acquaintance","Friend or family"];
const FREQ = [["Daily",5],["Weekly",4],["Monthly",3],["A few times a year",2],["Rarely",1]];
const CONSEQ = [[5,"Serious loss (money, grades, job, reputation)"],[4,"Real cost (hours or money lost, someone upset)"],[3,"Noticeable hassle that slows them down"],[2,"Minor annoyance"],[1,"Barely matters"]];
const JOB_TYPES = ["Functional","Emotional","Social"];
const DECISIONS = ["Undecided","Wedge","Later","Say no"];
const PERSONA_FIELDS = [
  ["who","Who they are (role and situation)"],
  ["moment","When the problem hits (the specific moment)"],
  ["workaround","What they do about it today"],
  ["cost","What it costs them (time, money, stress)"],
  ["words","How they describe it, in their own words"],
  ["buyer","Who decides or pays to fix it"],
  ["reach","Where we found them (how to reach more)"]
];

/* ---------------- helpers ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const opt = (v, cur, label) => `<option value="${esc(v)}"${String(v)===String(cur??"")?" selected":""}>${esc(label??v)}</option>`;
const today = () => new Date().toISOString().slice(0,10);
const pad = (n, w) => String(n).padStart(w, "0");
function nextId(prefix, list, width){
  let max = 0;
  for (const r of list){ const m = String(r.id).match(new RegExp("^" + prefix + "(\\d+)$")); if (m) max = Math.max(max, +m[1]); }
  return prefix + pad(max + 1, width);
}
function ago(ms){
  const s = (Date.now() - ms) / 1000;
  if (s < 90) return "just now";
  if (s < 3600) return Math.round(s/60) + " min ago";
  if (s < 86400) return Math.round(s/3600) + " h ago";
  return Math.round(s/86400) + " days ago";
}
function tierChip(t){ return t ? `<span class="chip tier ${TIER_CLASS[t]||""}">${esc(t)}</span>` : `<span class="chip gray">Not scored</span>`; }
function statusChip(s){ return `<span class="chip ${s==="Confirmed"?"ok":s==="Rejected"?"gray":"warn"}">${esc(s)}</span>`; }

/* Verbatim matching: is the quote really in the transcript, word for word? */
function quoteRegex(q){
  const t = String(q||"").trim().replace(/^["“”']+|["“”']+$/g,"").trim();
  if (t.length < 4) return null;
  const body = t.split(/\s+/).map(w => w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&").replace(/['’‘]/g,"['’‘]").replace(/["“”]/g,'["“”]')).join("\\s+");
  try { return new RegExp(body, "i"); } catch(e){ return null; }
}
function findInTranscript(quote, text){
  const re = quoteRegex(quote); if (!re || !text) return null;
  const m = re.exec(text); return m ? {start:m.index, end:m.index + m[0].length} : null;
}

/* ---------------- storage ---------------- */
const idb = {
  open(){ return new Promise((res, rej) => { const r = indexedDB.open("drm", 1); r.onupgradeneeded = () => r.result.createObjectStore("kv"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  async get(k){ const db = await this.open(); return new Promise(res => { const t = db.transaction("kv").objectStore("kv").get(k); t.onsuccess = () => res(t.result); t.onerror = () => res(undefined); }); },
  async set(k, v){ const db = await this.open(); return new Promise(res => { const t = db.transaction("kv","readwrite").objectStore("kv").put(v, k); t.onsuccess = () => res(); t.onerror = () => res(); }); }
};

const DIRS = {interviews:"interviews", evidence:"evidence", pains:"pain-scores", problems:"problems", jobs:"jobs"};

class FolderStore {
  constructor(root){ this.root = root; this.kind = "folder"; this.name = root.name; }
  async dir(path, create=true){ let d = this.root; for (const p of path.split("/").filter(Boolean)) d = await d.getDirectoryHandle(p, {create}); return d; }
  async write(path, text){
    const parts = path.split("/"); const file = parts.pop();
    const d = await this.dir(parts.join("/"));
    const fh = await d.getFileHandle(file, {create:true});
    const w = await fh.createWritable(); await w.write(text); await w.close();
  }
  async read(path){
    try { const parts = path.split("/"); const file = parts.pop(); const d = await this.dir(parts.join("/"), false); const f = await (await d.getFileHandle(file)).getFile(); return await f.text(); }
    catch(e){ return null; }
  }
  async remove(path){ try { const parts = path.split("/"); const file = parts.pop(); const d = await this.dir(parts.join("/"), false); await d.removeEntry(file); } catch(e){} }
  async isInitialized(){ return (await this.read("drm/config.json")) !== null; }
  async hasGit(){ try { await this.root.getDirectoryHandle(".git"); return true; } catch(e){ return false; } }
  async lastPush(){
    try {
      const g = await this.root.getDirectoryHandle(".git");
      const r = await (await (await g.getDirectoryHandle("refs")).getDirectoryHandle("remotes")).getDirectoryHandle("origin");
      for (const b of ["main","master"]) { try { const f = await (await r.getFileHandle(b)).getFile(); return f.lastModified; } catch(e){} }
    } catch(e){}
    return null;
  }
  async loadAll(){
    const S = emptyState();
    S.config = JSON.parse(await this.read("drm/config.json") || "{}");
    S.persona = JSON.parse(await this.read("drm/persona.json") || "null") || S.persona;
    for (const [key, dir] of Object.entries(DIRS)){
      let d; try { d = await this.dir("drm/" + dir, false); } catch(e){ continue; }
      for await (const [name, h] of d.entries()){
        if (h.kind !== "file" || !name.endsWith(".json")) continue;
        try { S[key].push(JSON.parse(await (await h.getFile()).text())); } catch(e){ console.warn("Skipped unreadable file", name); }
      }
    }
    try {
      const d = await this.dir("drm/transcripts", false);
      for await (const [name, h] of d.entries()) if (h.kind === "file" && name.endsWith(".md")) S.transcripts[name.slice(0,-3)] = await (await h.getFile()).text();
    } catch(e){}
    return S;
  }
}

class MemoryStore {
  constructor(){ this.kind = "demo"; this.name = "Demo"; this.files = {}; }
  async write(p, t){ this.files[p] = t; } async read(p){ return this.files[p] ?? null; } async remove(p){ delete this.files[p]; }
  async hasGit(){ return true; } async lastPush(){ return null; }
}

function emptyState(){
  return {config:{}, interviews:[], evidence:[], pains:[], problems:[], jobs:[], transcripts:{},
          persona:{problemId:"", fields:Object.fromEntries(PERSONA_FIELDS.map(([k]) => [k, {text:"", evidence:[]}]))}};
}

/* ---------------- app state ---------------- */
let store = null, S = emptyState(), lastPush = null, saveErr = null, savedAt = null;
function loadCollapsed(){ try { return JSON.parse(localStorage.getItem("drm-collapsed") || "{}"); } catch(e){ return {}; } }
let ui = {collapsed:loadCollapsed(), drafts:{transcript:{}, rubric:{}}, toast:null, importPreview:null, tab:{}, filters:{status:"All", problem:"All", type:"All"}};

const sortById = a => a.sort((x, y) => String(x.id).localeCompare(String(y.id), undefined, {numeric:true}));
function byId(list, id){ return list.find(r => r.id === id); }

async function persist(type, rec){
  try {
    if (type === "config") await store.write("drm/config.json", JSON.stringify(S.config, null, 2));
    else if (type === "persona") await store.write("drm/persona.json", JSON.stringify(S.persona, null, 2));
    else if (type === "transcript") await store.write(`drm/transcripts/${rec.id}.md`, rec.text);
    else await store.write(`drm/${DIRS[type]}/${rec.id}.json`, JSON.stringify(rec, null, 2));
    saveErr = null; savedAt = Date.now(); scheduleReport();
  } catch(e){ saveErr = e.message || String(e); console.error(e); }
}
async function unpersist(type, id){ await store.remove(`drm/${DIRS[type]}/${id}.json`); scheduleReport(); }

let reportTimer = null;
function scheduleReport(){ clearTimeout(reportTimer); reportTimer = setTimeout(async () => { try { await store.write("README.md", buildReport()); } catch(e){ console.error(e); } }, 800); }

function upsert(type, rec){
  const list = S[type]; const i = list.findIndex(r => r.id === rec.id);
  rec.updatedAt = new Date().toISOString();
  if (i >= 0) list[i] = rec; else list.push(rec);
  persist(type, rec);
}
function removeRec(type, id){ S[type] = S[type].filter(r => r.id !== id); unpersist(type, id); }

/* ---------------- calculations ---------------- */
function confirmedPains(){ return S.pains.filter(p => p.status === "Confirmed"); }
function hygieneIssues(iv){ return (Number(iv.leading) > 0 ? 1 : 0) + (iv.pitched === "Yes" ? 1 : 0) + (iv.demoed === "Yes" ? 1 : 0); }
function topTier(ivId){
  const tiers = confirmedPains().filter(p => p.interviewId === ivId).map(p => TIERS.indexOf(p.tier)).filter(i => i >= 0);
  return tiers.length ? TIERS[Math.min(...tiers)] : "";
}
function problemStats(pr){
  const ps = confirmedPains().filter(p => p.problemId === pr.id);
  const counts = Object.fromEntries(TIERS.map(t => [t, ps.filter(p => p.tier === t).length]));
  const n = ps.length; const top2 = counts["Hair on Fire"] + counts["Incremental Improvement"];
  const share = n ? top2 / n : 0;
  const minN = Number(S.config.minInterviews ?? 5), strong = Number(S.config.strongShare ?? 0.5);
  const signal = n < minN ? "Need more interviews" : share >= strong ? "Strong signal" : "Weak signal";
  const quotes = S.evidence.filter(e => e.problemId === pr.id && e.status === "Confirmed").length;
  return {n, counts, share, signal, quotes};
}
function freqScore(f){ const x = FREQ.find(([k]) => k === f); return x ? x[1] : null; }
function jobStats(j){
  const fs = freqScore(j.frequency), cs = j.consequence ? Number(j.consequence) : null;
  const priority = fs && cs ? fs * cs : null;
  const linked = S.evidence.filter(e => e.jobId === j.id && e.status === "Confirmed");
  const costQuote = linked.some(e => e.type === "Cost (time or money)");
  const checks = [["Named workaround", !!(j.workaround||"").trim()],["Specific moment", !!(j.moment||"").trim()],["How often", !!j.frequency],["Confirmed cost quote", costQuote],["Their own words", linked.length > 0]];
  return {fs, cs, priority, linked, checks, met: checks.filter(c => c[1]).length};
}
function rankedJobs(){
  return S.jobs.map(j => ({j, s:jobStats(j)})).filter(x => x.s.priority !== null)
    .sort((a, b) => b.s.priority - a.s.priority || b.s.met - a.s.met || a.j.id.localeCompare(b.j.id));
}
function confirmedQuoteIds(){ return new Set(S.evidence.filter(e => e.status === "Confirmed").map(e => e.id)); }
function metrics(){
  const iv = S.interviews, n = iv.length;
  const ff = iv.filter(i => i.source === "Friend or family").length;
  return {
    n, ff, ffShare: n ? ff / n : 0,
    recent: iv.filter(i => i.recentInstance === "Yes").length,
    hygiene: iv.filter(i => hygieneIssues(i) > 0).length,
    pitched: iv.filter(i => i.pitched === "Yes").length,
    demoed: iv.filter(i => i.demoed === "Yes").length,
    leading: iv.reduce((a, i) => a + (Number(i.leading) || 0), 0),
    rubric: iv.filter(i => i.rubricRun).length,
    confirmed: S.evidence.filter(e => e.status === "Confirmed").length,
    opinion: S.evidence.filter(e => e.status === "Confirmed" && e.type === "Opinion or future intent").length,
    candidates: S.evidence.filter(e => e.status === "Candidate").length + S.pains.filter(p => p.status === "Candidate").length,
    rejected: S.evidence.filter(e => e.status === "Rejected").length,
    hof: iv.filter(i => topTier(i.id) === "Hair on Fire").length,
    tierCounts: Object.fromEntries(TIERS.map(t => [t, confirmedPains().filter(p => p.tier === t).length]))
  };
}

/* ---------------- rubric prompt + parser ---------------- */
function rubricPrompt(iv){
  const probs = S.problems.length ? S.problems.map(p => `${p.id}: ${p.text}`).join("\n") : "none yet (mark every problem as NEW)";
  const jobs = S.jobs.length ? S.jobs.map(j => `${j.id}: ${j.statement}`).join("\n") : "none";
  const transcript = iv ? (S.transcripts[iv.id] || "[paste the full transcript]") : "[paste the full transcript]";
  return `You are reviewing one customer discovery interview for a startup founder. You suggest, the founder decides. Follow these rules exactly.

RULES
1. Quotes, not summaries. Every piece of evidence must be copied word for word from the transcript. Do not paraphrase, shorten, combine or fix grammar. If you can't find the exact words, leave it out.
2. Behavior, not interpretation. What the person has already done counts more than what they feel or say they would do.
3. Mark everything you produce as Candidate. The founder confirms or rejects each item.
4. Use only the exact labels listed below for types, tiers and Yes/No fields.

PART 1: INTERVIEW HYGIENE
Check the interviewer, not the interviewee:
- Leading questions: count interviewer questions that suggest an answer or ask about the future or a hypothetical (examples: "Would you use...", "Don't you hate...", "How much would you pay..."). Quote each one.
- Pitched or sold the idea: Yes if the interviewer described their solution or tried to win the person over.
- Demoed a product: Yes if they showed a prototype, mockup or product.
- Specific recent instance: Yes if the interviewee described a specific, recent time they had the problem.
- Closing question: Yes if the interviewer asked something like "Is there anything I should have asked you but didn't?"
Output one line in a code block, separated by | :
Specific recent instance|Leading questions (number)|Pitched or sold|Demoed|Closing question asked
Then list the leading questions you counted, quoted.

PART 2: EVIDENCE
Pull out every quote that shows the problem, what they do about it, how often, what it costs, or how strongly they feel. One quote per row.
Output in a code block, one row per quote, separated by | , with no header row:
Evidence ID|Interview ID|Problem ID|Job ID|Verbatim quote|Where in transcript|Evidence type|Found by|Status
- Evidence ID: the Interview ID plus -Q01, -Q02 and so on (example: ${iv ? iv.id : "INT-003"}-Q01).
- Problem ID: the matching ID from the problem list. If the quote shows a problem not on the list, write NEW: and a five-word description.
- Job ID: the matching ID from the job list if one was given, otherwise leave it empty.
- Where in transcript: the timestamp, or the first few words of the line if there are no timestamps.
- Evidence type, exactly one of: ${EVIDENCE_TYPES.join(" / ")}

- Found by: AI candidate
- Status: Candidate
Because | separates columns, replace any | inside a quote with /.

PART 3: PAIN SCORE
Score each problem the interviewee talked about, one row per problem. Tiers, from strongest to weakest:
${TIERS.map(t => `- ${t}: ${TIER_DEF[t]}`).join("\n")}
Scoring rules: classify by what they did, not by how they talk. Strong language supports a score but is never enough on its own. If you are unsure between two tiers, choose the lower one. If they could not describe a specific, recent time it happened, score no higher than Nice to Have.
Output in a code block, one row per problem, separated by | , with no header row:
Interview ID|Problem ID|Pain tier|Supporting evidence IDs|Scored by|Status
- Supporting evidence IDs: the Evidence IDs from Part 2 that justify the tier, separated by commas.
- Scored by: Rubric
- Status: Candidate

PART 4: COACHING NOTE
In two or three plain sentences: what the founder should ask next time to get past opinions to behavior, and which problem looks strongest so far and why.

MY INPUTS
Interview ID: ${iv ? iv.id : "[for example INT-003]"}
Problem list:
${probs}
Job list (Level 2):
${jobs}
Transcript:
${transcript}`;
}

function matchLabel(v, list){
  const t = String(v||"").trim().toLowerCase();
  return list.find(x => x.toLowerCase() === t) || list.find(x => t && (x.toLowerCase().startsWith(t) || t.startsWith(x.toLowerCase()))) || null;
}
const YN = v => { const t = String(v||"").trim().toLowerCase(); return t.startsWith("y") ? "Yes" : t.startsWith("n") ? "No" : ""; };

function parseRubric(text){
  const out = {hygiene:null, evidence:[], pains:[], skipped:[]};
  for (let raw of String(text||"").split(/\r?\n/)){
    let line = raw.trim();
    if (!line.includes("|") || line.startsWith("```")) continue;
    if (/^\|?[\s:\-|]+\|?$/.test(line)) continue;            // markdown table separator
    if (line.startsWith("|")) line = line.slice(1);
    if (line.endsWith("|")) line = line.slice(0, -1);
    let parts = line.split("|").map(s => s.trim());
    const head = parts[0].toLowerCase();
    if (/^(evidence id|interview id|specific recent)/.test(head)) continue;   // header rows
    if (/^-\s*evidence type/i.test(line) || line.startsWith("- ")) continue;   // stray instruction lines
    if (parts.length === 5 && YN(parts[0]) && !isNaN(parseInt(parts[1]))){
      out.hygiene = {recentInstance:YN(parts[0]), leading:parseInt(parts[1]), pitched:YN(parts[2]), demoed:YN(parts[3]), closing:YN(parts[4])};
    } else if (parts.length === 6 && matchLabel(parts[2], TIERS)){
      out.pains.push({aiInterview:parts[0], problemRef:parts[1], tier:matchLabel(parts[2], TIERS), evidenceIds:parts[3].split(/[,;\s]+/).filter(Boolean)});
    } else if (parts.length >= 9){
      const tail = parts.slice(-4); const quote = parts.slice(4, parts.length - 4).join("/");
      out.evidence.push({aiId:parts[0], problemRef:parts[2], jobRef:parts[3], quote:quote.replace(/^["“]|["”]$/g,"").trim(), where:tail[0], typeRaw:tail[1], type:matchLabel(tail[1], EVIDENCE_TYPES)});
    } else out.skipped.push(raw);
  }
  return out;
}

function planImport(iv, parsed){
  // Work out IDs, new problems and verbatim checks before anything is saved.
  const transcript = S.transcripts[iv.id] || "";
  const newProblems = []; const problemMap = {};
  let prList = [...S.problems];
  function resolveProblem(ref){
    const r = String(ref||"").trim(); if (!r) return "";
    if (problemMap[r] !== undefined) return problemMap[r];
    if (byId(S.problems, r)) return problemMap[r] = r;
    const m = r.match(/^NEW\s*:?\s*(.+)$/i);
    const text = m ? m[1].trim() : r;
    const same = prList.find(p => p.text.toLowerCase() === text.toLowerCase());
    if (same) return problemMap[r] = same.id;
    const id = nextId("PR-", prList, 2); const p = {id, text, who:""}; prList.push(p); newProblems.push(p);
    return problemMap[r] = id;
  }
  const idMap = {}; let evList = [...S.evidence];
  const evidence = parsed.evidence.map(e => {
    let id = e.aiId && /^[A-Za-z0-9_-]+$/.test(e.aiId) && e.aiId.startsWith(iv.id) && !byId(evList, e.aiId) ? e.aiId : null;
    if (!id) id = nextId(iv.id + "-Q", evList.filter(x => x.id.startsWith(iv.id + "-Q")), 2);
    idMap[e.aiId] = id;
    const rec = {id, interviewId:iv.id, problemId:resolveProblem(e.problemRef), jobId:byId(S.jobs, e.jobRef) ? e.jobRef : "", quote:e.quote, where:e.where, type:e.type || "", foundBy:"AI candidate", status:"Candidate", note: e.type ? "" : `AI type: ${e.typeRaw}`};
    evList.push(rec);
    rec._verbatim = !!findInTranscript(rec.quote, transcript);
    return rec;
  });
  const pains = parsed.pains.map(p => {
    const problemId = resolveProblem(p.problemRef);
    const id = `${iv.id}__${problemId}`;
    const existing = byId(S.pains, id);
    return {id, interviewId:iv.id, problemId, tier:p.tier, evidenceIds:p.evidenceIds.map(x => idMap[x] || x), scoredBy:"Rubric", status:"Candidate", disagree:"", _skip: existing && existing.status === "Confirmed"};
  });
  return {hygiene:parsed.hygiene, evidence, pains, newProblems, skipped:parsed.skipped};
}

function applyImport(iv, plan, raw){
  for (const p of plan.newProblems) upsert("problems", {...p});
  for (const e of plan.evidence){ const r = {...e}; delete r._verbatim; upsert("evidence", r); }
  for (const p of plan.pains){ if (p._skip) continue; const r = {...p}; delete r._skip; upsert("pains", r); }
  const updated = {...iv, rubricRun:true, rubricRaw:raw};
  if (plan.hygiene) Object.assign(updated, plan.hygiene);
  upsert("interviews", updated);
}

  return L.join("\n");
}

/* Minimal markdown rendering for the in-app report preview */
function renderMd(md){
  const lines = md.split("\n"); let html = "", inTable = false, inList = false;
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/_(.+?)_/g,"<i>$1</i>").replace(/\[(.+?)\]\((.+?)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  for (const l of lines){
    if (l.startsWith("|")){
      if (/^\|[-| ]+\|$/.test(l)) continue;
      const cells = l.slice(1, -1).split("|").map(c => c.trim());
      if (!inTable){ html += "<table><tr>" + cells.map(c => `<th>${inline(c)}</th>`).join("") + "</tr>"; inTable = true; }
      else html += "<tr>" + cells.map(c => `<td>${inline(c)}</td>`).join("") + "</tr>";
      continue;
    } else if (inTable){ html += "</table>"; inTable = false; }
    if (l.startsWith("- ")){ if (!inList){ html += "<ul>"; inList = true; } html += `<li>${inline(l.slice(2))}</li>`; continue; }
    else if (inList){ html += "</ul>"; inList = false; }
    if (l.startsWith("### ")) html += `<h3>${inline(l.slice(4))}</h3>`;
    else if (l.startsWith("## ")) html += `<h2>${inline(l.slice(3))}</h2>`;
    else if (l.startsWith("# ")) html += `<h1>${inline(l.slice(2))}</h1>`;
    else if (l.startsWith("> ")) html += `<blockquote>${inline(l.slice(2))}</blockquote>`;
    else if (l === "---") html += "<hr>";
    else if (l.trim()) html += `<p>${inline(l)}</p>`;
  }
  if (inTable) html += "</table>"; if (inList) html += "</ul>";
  return html;
}

function route(){ const h = location.hash.replace(/^#\/?/, "") || "home"; const [page, id] = h.split("/"); return {page, id: id ? decodeURIComponent(id) : null}; }
function go(h){ location.hash = "#/" + h; }
window.addEventListener("hashchange", () => { ui.drawer = null; render(); });
document.addEventListener("keydown", ev => { if (ev.key === "Escape" && ui.drawer){ ui.drawer = null; render(); } });

function shell(content){
  const m = metrics(); const r = route();
  const link = (h, label, badge) => `<a href="#/${h}" class="${r.page === h.split("/")[0] ? "on" : ""}"><span>${label}</span>${badge || ""}</a>`;
  // Collapsible sidebar groups. A collapsed group still shows pending review count and highlights if it holds the current page.
  const group = (key, title, items, pending) => {
    const closed = !!ui.collapsed[key]; const active = items.some(([h]) => h === r.page);
    return `<button class="grp ${closed ? "closed" : ""} ${closed && active ? "has-active" : ""}" data-act="toggleGroup" data-grp="${key}" aria-expanded="${!closed}"><span class="chev">▾</span>${esc(title)}${closed && pending ? `<span class="badge warn">${pending}</span>` : ""}</button>
      ${closed ? "" : items.map(([h, l, b]) => link(h, l, b)).join("")}`;
  };
  const demo = store.kind === "demo";
  return `${demo ? `<div class="banner"><b>Demo mode.</b> This is a fictional example and nothing is saved. <button class="btn link" data-act="leave">Open your own DRM folder</button></div>` : ""}
  <div class="app" style="${demo ? "height:calc(100vh - 37px)" : ""}">

      <div class="brand"><b>Discovery Records</b><span>${esc(S.config.venture || "Untitled venture")}</span></div>

          ["problems","Problems", `<span class="chip gray">${S.problems.length}</span>`],
          ["interviews","Interviews", `<span class="chip gray">${S.interviews.length}</span>`],

        ${group("help", "Help", [["guide","Pain Scale & rubric"], ["report","Coach report"], ["settings","Settings"]])}

      <div class="sidefoot">${demo ? "Demo data" : `Folder: <b>${esc(store.name)}</b><br>${saveErr ? `<span style="color:var(--bad)">Save failed: ${esc(saveErr)}</span>` : savedAt ? "Saved " + ago(savedAt) : "All changes save automatically"}<br>${lastPush ? "Last push detected " + ago(lastPush) : "Push in GitHub Desktop before coach meetings"}`}</div>

`;
}

function nextStep(m){
  if (!S.problems.length) return ["Write down the problem you think exists.", "problems", "Add a problem"];
  if (!S.interviews.length) return ["Log your first customer interview and paste in the transcript.", "interviews", "Go to interviews"];
  if (m.candidates) return [`Review ${m.candidates} AI suggestion${m.candidates>1?"s":""}. Only confirmed items count.`, "review", "Review now"];

function highlight(text, quotes, focusId, near){
  const ranges = [];
  for (const e of quotes){ if (e.status === "Rejected" && e.id !== focusId) continue; const r = findInTranscript(e.quote, text); if (r) ranges.push({...r, e}); }
  if (near) ranges.push(near);
  ranges.sort((a, b) => a.start - b.start);
  let out = "", pos = 0;
  for (const r of ranges){
    if (r.start < pos) continue;
    const inner = esc(text.slice(r.start, r.end));
    out += esc(text.slice(pos, r.start)) + (r.e ? `<mark class="s-${r.e.status}${r.e.id === focusId ? " focus-mark" : ""}" data-act="jump" data-id="${esc(r.e.id)}" id="m-${esc(r.e.id)}">${inner}</mark>` : `<span class="near" title="Around where the AI said this quote is">${inner}</span>`);
    pos = r.end;
  }
  return out + esc(text.slice(pos));
}
// When the exact words aren't in the transcript, point at the line the AI cited (its timestamp or opening words).
function nearRange(e, text){
  const w = String(e.where || "").trim(); if (w.length < 3 || !text) return null;
  const i = text.toLowerCase().indexOf(w.toLowerCase()); if (i < 0) return null;
  const start = text.lastIndexOf("\n", i) + 1; let end = text.indexOf("\n", i); if (end < 0) end = text.length;
  return {start, end};
}

        <span class="chip ${p.hygiene ? "ok" : "warn"}">${p.hygiene ? "Hygiene check found" : "No hygiene line found"}</span>
        <span class="chip blue">${p.evidence.length} quotes</span>
        <span class="chip blue">${p.pains.filter(x => !x._skip).length} pain scores</span>
        ${p.newProblems.length ? `<span class="chip warn">${p.newProblems.length} new problem${p.newProblems.length>1?"s":""}</span>` : ""}
        ${notFound ? `<span class="chip bad">${notFound} not found word for word</span>` : ""}
        ${p.pains.some(x => x._skip) ? `<span class="chip gray">${p.pains.filter(x => x._skip).length} already confirmed, kept yours</span>` : ""}
      </div>
      ${p.newProblems.length ? `<p class="small">New problems the AI spotted: ${p.newProblems.map(x => `<b>${esc(x.id)}</b> ${esc(x.text)}`).join("; ")}</p>` : ""}
      ${p.evidence.slice(0, 50).map(e => `<div class="small" style="margin:5px 0">${e._verbatim ? `<span class="chip ok">✓ verbatim</span>` : `<span class="chip bad">not in transcript</span>`} <span class="quote">${esc(e.quote)}</span> <span class="hint">${esc(e.type || "unknown type")}</span></div>`).join("")}
      ${p.skipped.length ? `<p class="hint">Ignored ${p.skipped.length} line(s) that didn't match the format.</p>` : ""}
      <p class="hint">Everything comes in as “Candidate”. Nothing counts until you confirm it.</p>
      <div class="row"><button class="btn pri" data-act="doImport">Import as candidates</button><button class="btn" data-act="cancelImport">Cancel</button></div></div>`;
  }
  return `<div class="card"><h3>1. Copy the prompt</h3><p class="small">The prompt already includes this interview's ID, your problem list and the transcript. Paste it into Claude, ChatGPT or any AI chat.</p><button class="btn" data-act="copyPrompt">Copy rubric prompt for ${esc(iv.id)}</button></div>
  <div class="card"><h3>2. Paste the AI's whole reply</h3><p class="small">Paste everything it said. The app finds the rows it needs and ignores the rest.</p>
  <textarea id="rubricBox" data-iv="${esc(iv.id)}" style="width:100%;min-height:200px" placeholder="Paste the AI's full reply here">${esc(ui.drafts.rubric[iv.id] ?? (prev ? prev.raw : ""))}</textarea>
  <div class="row" style="margin-top:8px"><button class="btn pri" data-act="previewImport">Check it</button></div></div>${preview}`;
}

function reviewView(){

  return `<h1>Review AI suggestions</h1><p class="sub">Check each quote against the transcript. Confirm what's real and in their own words. Reject paraphrases and anything you can't find. You make the call, not the AI.</p>

  ${Object.keys(byIv).sort().map(ivId => `<h2><a href="#/interviews/${esc(ivId)}" style="text-decoration:none">${esc(ivId)}</a> <span class="hint">${esc((byId(S.interviews, ivId)||{}).interviewee || "")}</span></h2>${byIv[ivId].map(e => quoteCard(e, S.transcripts[ivId] ?? null, {showProblem:true})).join("")}`).join("")}

function problemsView(){

/* ---------------- events ---------------- */
function toast(msg, undo){
  ui.toast = {msg, undo};
  let t = document.getElementById("toast");
  if (!t){ t = document.createElement("div"); t.id = "toast"; t.className = "toast"; document.body.appendChild(t); }
  t.innerHTML = `<span>${esc(msg)}</span>${undo ? `<button data-act="undo">Undo</button>` : ""}`; t.style.display = "flex";
  clearTimeout(toast.t); toast.t = setTimeout(hideToast, 5000);
}
function hideToast(){ ui.toast = null; const t = document.getElementById("toast"); if (t) t.style.display = "none"; }
async function copy(text){ try { await navigator.clipboard.writeText(text); toast("Copied. Paste it into any AI chat."); } catch(e){ prompt("Copy this:", text); } }

document.addEventListener("click", async ev => {
  const rowLink = ev.target.closest("tr[data-href]");
  if (rowLink && !ev.target.closest("a,button,select,input")) { go(rowLink.dataset.href); return; }
  const el = ev.target.closest("[data-act]"); if (!el || el.tagName === "SELECT" || el.tagName === "INPUT" || el.tagName === "TEXTAREA") return;
  if (el.tagName === "A") ev.preventDefault();
  const a = el.dataset.act; const r = route();
  if (a === "demo"){ store = new MemoryStore(); S = demoState(); go("home"); render(); }
  else if (a === "open") await openFolder(false);
  else if (a === "reopen") await openFolder(true);
  else if (a === "leave"){ store = null; S = emptyState(); ui.savedHandle = await idb.get("root").catch(() => null); location.hash = ""; render(); }
  else if (a === "undo"){ const u = ui.toast && ui.toast.undo; hideToast(); if (u) u(); render(); }
  else if (a === "newInterview"){ const id = nextId("INT-", S.interviews, 3); upsert("interviews", {id, date:today(), interviewee:"", role:"", source:"", interviewer:S.config.founder || "", recentInstance:"", leading:"", pitched:"", demoed:"", closing:"", rubricRun:false, notes:""}); ui.tab[id] = "quotes"; go("interviews/" + id); }
  else if (a === "openDrawer"){ ui.drawer = el.dataset.id; ui.drawerScroll = true; render(); }
  else if (a === "closeDrawer"){ ui.drawer = null; render(); }
  else if (a === "toggleGroup"){ const k = el.dataset.grp; ui.collapsed[k] = !ui.collapsed[k]; try { localStorage.setItem("drm-collapsed", JSON.stringify(ui.collapsed)); } catch(e){} render(); }
  else if (a === "tab"){ ui.tab[r.id] = el.dataset.tab; ui.editTranscript = false; render(); }
  else if (a === "seg"){ const iv = byId(S.interviews, r.id); upsert("interviews", {...iv, [el.dataset.field]: iv[el.dataset.field] === el.dataset.val ? "" : el.dataset.val}); render(); }
  else if (a === "editTranscript"){ ui.editTranscript = true; render(); }
  else if (a === "saveTranscript"){ const t = $("#transcriptBox").value; delete ui.drafts.transcript[r.id]; S.transcripts[r.id] = t; persist("transcript", {id:r.id, text:t}); ui.editTranscript = false; render(); toast("Transcript saved."); }
  else if (a === "copyPrompt"){ const iv = byId(S.interviews, r.id); if (!S.transcripts[iv.id]){ toast("Add the transcript first, so the prompt can include it."); return; } await copy(rubricPrompt(iv)); }
  else if (a === "copyGeneric") await copy(rubricPrompt(null));
  else if (a === "previewImport"){ const iv = byId(S.interviews, r.id); const raw = $("#rubricBox").value; const parsed = parseRubric(raw);
    if (!parsed.evidence.length && !parsed.pains.length && !parsed.hygiene){ toast("Couldn't find any rubric rows. Paste the AI's full reply, including the code blocks."); return; }
    ui.importPreview = {ivId:iv.id, raw, plan:planImport(iv, parsed)}; render(); }
  else if (a === "cancelImport"){ ui.importPreview = null; delete ui.drafts.rubric[r.id]; render(); }
  else if (a === "doImport"){ const iv = byId(S.interviews, r.id); const p = ui.importPreview.plan; applyImport(iv, p, ui.importPreview.raw); ui.importPreview = null; delete ui.drafts.rubric[iv.id]; ui.tab[iv.id] = "quotes"; render();
    toast(`Imported ${p.evidence.length} quotes and ${p.pains.filter(x => !x._skip).length} pain scores as candidates.`); }
  else if (a === "setStatus"){ const kind = el.dataset.kind; const rec = byId(S[kind], el.dataset.id); const prev = rec.status; upsert(kind, {...rec, status:el.dataset.val});
    render(); toast(`${el.dataset.val === "Confirmed" ? "Confirmed" : "Rejected"} ${kind === "pains" ? "pain score" : el.dataset.id}.`, () => upsert(kind, {...byId(S[kind], rec.id), status:prev})); }
  else if (a === "setTier"){ const p = byId(S.pains, el.dataset.id); upsert("pains", {...p, tier:el.dataset.val, scoredBy: p.tier !== el.dataset.val ? "Founder" : p.scoredBy}); render(); }
  else if (a === "addPain"){ const sel = $("#newPainProblem"); if (!sel || !sel.value) return; upsert("pains", {id:`${r.id}__${sel.value}`, interviewId:r.id, problemId:sel.value, tier:"", evidenceIds:[], scoredBy:"Founder", status:"Confirmed", disagree:""}); render(); }
  else if (a === "addQuote"){ ui.addQuote = r.id; render(); }
  else if (a === "cancelQuote"){ ui.addQuote = null; render(); }
  else if (a === "jump" && ui.drawer){ const mk = document.querySelector(".drawer #m-" + CSS.escape(el.dataset.id)); if (mk) mk.scrollIntoView({behavior:"smooth", block:"center"}); }
  else if (a === "jump"){ const c = el.tagName === "MARK" ? document.getElementById("q-" + el.dataset.id) : document.getElementById("m-" + el.dataset.id); if (c){ c.scrollIntoView({behavior:"smooth", block:"center"}); c.classList.add("focus"); setTimeout(() => c.classList.remove("focus"), 1500); } }
  else if (a === "deleteInterview"){ if (!confirm("Delete this interview, its transcript, quotes and pain scores?")) return; const id = r.id;
    for (const e of S.evidence.filter(e => e.interviewId === id)) removeRec("evidence", e.id);
    for (const p of S.pains.filter(p => p.interviewId === id)) removeRec("pains", p.id);
    removeRec("interviews", id); delete S.transcripts[id]; store.remove(`drm/transcripts/${id}.md`); go("interviews"); }
  else if (a === "deleteProblem"){ removeRec("problems", el.dataset.id); go("problems"); }
  else if (a === "personaUnlink"){ const f = S.persona.fields[el.dataset.key]; f.evidence = f.evidence.filter(x => x !== el.dataset.id); persist("persona"); render(); }
  else if (a === "newJob"){ const id = nextId("JB-", S.jobs, 2); upsert("jobs", {id, statement:"", type:"", problemId:S.persona.problemId || "", workaround:"", moment:"", frequency:"", consequence:"", decision:"Undecided", why:""}); render(); }
  else if (a === "exportJson"){ const blob = new Blob([JSON.stringify(S, null, 2)], {type:"application/json"}); const u = URL.createObjectURL(blob); const l = document.createElement("a"); l.href = u; l.download = `drm-backup-${today()}.json`; l.click(); URL.revokeObjectURL(u); }
});

document.addEventListener("change", ev => {
  const el = ev.target; const a = el.dataset.act; const r = route();
  if (a === "evField"){ const e = byId(S.evidence, el.dataset.id); upsert("evidence", {...e, [el.dataset.field]: el.value}); render(); }
  else if (a === "filter"){ ui.filters[el.dataset.key] = el.value; render(); }
  else if (a === "personaProblem"){ S.persona.problemId = el.value; persist("persona"); render(); }
  else if (a === "personaLink"){ if (!el.value) return; const f = S.persona.fields[el.dataset.key]; f.evidence = [...(f.evidence||[]), el.value]; persist("persona"); render(); }
  else if (a === "jobField"){ const j = byId(S.jobs, el.dataset.id); upsert("jobs", {...j, [el.dataset.field]: el.value}); render(); }
  else if (el.dataset.field === "leading"){ const iv = byId(S.interviews, r.id); upsert("interviews", {...iv, leading: el.value === "" ? "" : Number(el.value)}); render(); }
});

// Text fields save after a short pause, and immediately when you leave the field.
const typeTimers = new WeakMap();
function saveTextField(el){
  const a = el.dataset.act; const form = el.closest("form[data-form]"); const r = route();
  if (a === "personaText"){ S.persona.fields[el.dataset.key].text = el.value; persist("persona"); }
  else if (a === "jobText"){ const j = byId(S.jobs, el.dataset.id); if (j) upsert("jobs", {...j, [el.dataset.field]: el.value}); }
  else if (a === "painDisagree"){ const p = byId(S.pains, el.dataset.id); if (p) upsert("pains", {...p, disagree: el.value}); }
  else if (form && form.dataset.form === "interview"){ const iv = byId(S.interviews, r.id); if (iv) upsert("interviews", {...iv, ...Object.fromEntries(new FormData(form))}); }
  else if (form && form.dataset.form === "problem"){ const p = byId(S.problems, r.id); if (p) upsert("problems", {...p, ...Object.fromEntries(new FormData(form))}); }
  else if (form && form.dataset.form === "config"){ const d = Object.fromEntries(new FormData(form)); S.config = {...S.config, founder:d.founder, venture:d.venture, coach:d.coach, minInterviews:Number(d.minInterviews) || 5, strongShare:(Number(d.strongPct) || 50) / 100}; persist("config"); }
}
const isTextField = el => el.tagName === "TEXTAREA" || (el.tagName === "INPUT" && ["text","date","number"].includes(el.type));
document.addEventListener("input", ev => {
  const el = ev.target;
  if (el.id === "transcriptBox"){ ui.drafts.transcript[el.dataset.iv] = el.value; return; }
  if (el.id === "rubricBox"){ ui.drafts.rubric[el.dataset.iv] = el.value; return; }
  if (!isTextField(el) || el.dataset.field === "leading") return;
  clearTimeout(typeTimers.get(el)); typeTimers.set(el, setTimeout(() => saveTextField(el), 400));
});
document.addEventListener("change", ev => {
  const el = ev.target; if (!isTextField(el) || el.dataset.field === "leading" || el.id === "transcriptBox" || el.id === "rubricBox") return;
  clearTimeout(typeTimers.get(el)); saveTextField(el);
  // refresh computed badges (persona status, job checks) once the person has left the field
  if (el.dataset.act === "personaText" || el.dataset.act === "jobText" || el.closest("form[data-form=problem],form[data-form=config]")) setTimeout(render, 0);
}, true);

document.addEventListener("submit", async ev => {
  ev.preventDefault(); const f = ev.target; const d = Object.fromEntries(new FormData(f)); const r = route();
  if (f.dataset.form === "setup"){
    S = emptyState(); S.config = {founder:d.founder, venture:d.venture, coach:d.coach, minInterviews:5, strongShare:0.5, createdAt:new Date().toISOString()};
    await persist("config"); await persist("persona");
    if ((d.problem || "").trim()) upsert("problems", {id:"PR-01", text:d.problem.trim(), who:(d.who || "").trim()});
    await store.write("drm/README.md", "This folder holds your Discovery Records Manager data. Edit it with the DRM app, not by hand.\n");
    store.needsSetup = false; go("home"); render();
  } else if (f.dataset.form === "addProblem"){ upsert("problems", {id:nextId("PR-", S.problems, 2), text:d.text.trim(), who:(d.who||"").trim()}); f.reset(); render(); }
  else if (f.dataset.form === "addQuote"){ const id = nextId(r.id + "-Q", S.evidence.filter(x => x.id.startsWith(r.id + "-Q")), 2);
    upsert("evidence", {id, interviewId:r.id, problemId:d.problemId, jobId:"", quote:d.quote.trim(), where:d.where, type:d.type, foundBy:"Founder", status:"Confirmed", note:""}); ui.addQuote = null; render(); }
});

/* ---------------- folder handling ---------------- */
async function useRoot(root){
  store = new FolderStore(root);
  await idb.set("root", root).catch(() => {});
  if (!(await store.isInitialized())){ store.needsSetup = true; store.noGit = !(await store.hasGit()); render(); return; }
  S = await store.loadAll();
  lastPush = await store.lastPush();
  if (!location.hash || location.hash === "#") go("home");
  render(); scheduleReport();
}
async function openFolder(reopen){
  try {
    let root;
    if (reopen && ui.savedHandle){
      const h = ui.savedHandle;
      if ((await h.queryPermission({mode:"readwrite"})) !== "granted" && (await h.requestPermission({mode:"readwrite"})) !== "granted") return;
      root = h;
    } else root = await window.showDirectoryPicker({id:"drm", mode:"readwrite"});
    await useRoot(root);
  } catch(e){ if (e.name !== "AbortError") alert("Couldn't open that folder: " + e.message); }
}

/* ---------------- start ---------------- */
(async function init(){
  const params = new URLSearchParams(location.search);
  if (params.get("test") === "opfs"){ const root = await navigator.storage.getDirectory(); window.__drm = {get S(){ return S; }, get store(){ return store; }, buildReport, parseRubric}; await useRoot(root); return; }
  if (params.get("demo") === "1"){ store = new MemoryStore(); S = demoState(); window.__drm = {get S(){ return S; }, buildReport, parseRubric}; render(); return; }
  ui.savedHandle = ("showDirectoryPicker" in window) ? await idb.get("root").catch(() => null) : null;
  render();
})();
</script>
