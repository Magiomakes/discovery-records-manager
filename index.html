<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Discovery Records Manager</title>
<style>
:root{
  /* Palette from the Ideas Lab Week 1 Toolkit. Swap these when the program palette arrives. */
  --navy:#16365C; --navy-2:#24497A; --coral:#F0735A; --mustard:#F2C14E; --sticky:#FFF0A8; --sticky-2:#F7E07A; --blush:#FBE3DF;
  --desk:#E9ECEF; --paper:#FFFFFF; --paper-2:#F4F6F8; --ink:#1B2430; --ink-2:#4A5563; --ink-3:#7B8794; --line:#DDE2E8; --line-2:#C3CBD5;
  --green:#1E7F5C; --green-bg:#E2F3EB; --red:#B42318; --red-bg:#FBEAE7; --amber:#9A6700; --amber-bg:#FFF4D6; --blue-bg:#E7EEF7;
  --hof:#F3C9C4; --inc:#F8DCC2; --nth:#F5E9B8; --lat:#CFE0F2; --nap:#E6E8E6;
  --r:6px; --r-lg:12px;
  --sans:ui-sans-serif,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--sans);color:var(--ink);background:var(--desk);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--navy-2)}
:focus-visible{outline:2px solid var(--coral);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* frame */
.app{display:grid;grid-template-columns:240px 1fr;height:100vh}
.side{background:var(--paper);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{padding:18px 18px 14px;border-bottom:1px solid var(--line)}
.brand b{display:block;font-size:15px;letter-spacing:-.01em;color:var(--navy)}
.brand span{display:block;font-size:12.5px;color:var(--ink-3);margin-top:2px}
.nav{padding:10px 10px;overflow:auto;flex:1}
.nav a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 10px;border-radius:var(--r);text-decoration:none;color:var(--ink-2);font-size:13.5px}
.nav a:hover{background:var(--paper-2);color:var(--ink)}
.nav a.on{background:var(--blue-bg);color:var(--navy);font-weight:600}
.nav .grp{display:flex;align-items:center;gap:6px;width:100%;border:none;background:none;cursor:pointer;font-size:12px;color:var(--ink-3);padding:14px 10px 4px;text-align:left}
.nav .grp:hover{color:var(--ink)}
.nav .grp .chev{display:inline-block;width:10px;transition:transform .15s}
.nav .grp.closed .chev{transform:rotate(-90deg)}
.nav .grp.has-active{color:var(--navy);font-weight:600}
.nav .grp .pill{margin-left:auto}
.nav .num{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--ink-3);margin-right:6px}
.count{color:var(--ink-3);font-size:12px}
.pill{background:var(--coral);color:#fff;border-radius:999px;font-size:11px;padding:1px 7px;font-weight:600}
.sidefoot{border-top:1px solid var(--line);padding:12px 16px;font-size:12px;color:var(--ink-3);line-height:1.5}
.sidefoot b{color:var(--ink-2);font-weight:600}
.sidefoot .err{color:var(--red)}
.main{overflow:auto;min-width:0}
.page{max-width:1120px;margin:0 auto;padding:28px 32px 90px}
.crumbs{font-size:12.5px;color:var(--ink-3);margin-bottom:6px}
.crumbs a{color:var(--ink-3);text-decoration:none}
h1{font-size:24px;font-weight:700;letter-spacing:-.015em;margin:0 0 4px;color:var(--navy)}
h2{font-size:15px;font-weight:650;margin:26px 0 10px;letter-spacing:-.005em}
h2:first-child{margin-top:0}
h3{font-size:13.5px;font-weight:650;margin:0 0 8px}
.lede{color:var(--ink-2);margin:0 0 18px;max-width:64ch}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.muted{color:var(--ink-3)}
.small{font-size:12.5px}
.right{text-align:right}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}
@media (max-width:900px){.app{grid-template-columns:1fr}.side{display:none}.page{padding:18px 16px 80px}}

/* surfaces */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 18px;margin-bottom:12px}
.card.flat{padding:0;overflow:hidden}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1000px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:700px){.g2,.g3,.g4{grid-template-columns:1fr}}
.split{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:1100px){.split{grid-template-columns:1fr}}

/* controls */
.btn{text-decoration:none;display:inline-block;border:1px solid var(--line-2);background:var(--paper);border-radius:var(--r);padding:7px 13px;cursor:pointer;white-space:nowrap;font-weight:500;color:var(--ink)}
.btn:hover{border-color:var(--ink-3);background:#fafbfc}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.pri:hover{background:var(--navy-2)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.icon{width:30px;height:30px;padding:0;display:inline-flex;align-items:center;justify-content:center;font-size:14px}
.btn.icon.yes{color:var(--green);border-color:#9fd3c2} .btn.icon.yes:hover{background:var(--green-bg)}
.btn.icon.no{color:var(--red);border-color:#ebb3ab} .btn.icon.no:hover{background:var(--red-bg)}
.btn.link{border:none;background:none;color:var(--navy-2);padding:0;text-decoration:underline;font-weight:400}
.btn:disabled{opacity:.5;cursor:not-allowed}
label.f{display:block;font-size:12.5px;color:var(--ink-2);margin-bottom:12px}
label.f > input,label.f > select,label.f > textarea{display:block;width:100%;margin-top:5px}
input[type=text],input[type=number],input[type=date],select,textarea{border:1px solid var(--line-2);border-radius:var(--r);padding:7px 10px;background:var(--paper);color:var(--ink)}
textarea{resize:vertical;min-height:72px;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:2px solid #f9c9bd;border-color:var(--coral)}
select.inline{padding:3px 6px;font-size:12.5px;border-color:var(--line)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden}
.seg button{border:none;background:var(--paper);padding:4px 10px;cursor:pointer;border-right:1px solid var(--line-2)}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--navy);color:#fff}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:14px 0 16px}
.tabs button{border:none;background:none;padding:8px 12px;cursor:pointer;color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--navy);border-color:var(--navy);font-weight:600}
details.fold{border:1px dashed var(--line-2);border-radius:var(--r-lg);padding:10px 14px;margin-top:12px;color:var(--ink-2)}
details.fold summary{cursor:pointer;font-weight:500;color:var(--ink)}
details.fold[open]{background:var(--paper)}

/* tables */
table{width:100%;border-collapse:collapse}
th{font-size:12px;color:var(--ink-3);text-align:left;font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}
tr.click{cursor:pointer} tr.click:hover td{background:#f7f9fb}

/* chips */
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:12px;white-space:nowrap;line-height:1.4}
.chip.gray{background:#eef0f3;color:var(--ink-2)}
.chip.blue{background:var(--blue-bg);color:var(--navy)}
.chip.ok{background:var(--green-bg);color:var(--green)}
.chip.warn{background:var(--amber-bg);color:var(--amber)}
.chip.bad{background:var(--red-bg);color:var(--red)}
.chip.tier{color:#2a2a2a}
.tier-hof{background:var(--hof)} .tier-inc{background:var(--inc)} .tier-nth{background:var(--nth)} .tier-lat{background:var(--lat)} .tier-nap{background:var(--nap)}
.notice{border-radius:var(--r);padding:9px 12px;font-size:13px}
.notice.bad{background:var(--red-bg);color:#7a1a12}
.notice.warn{background:var(--amber-bg);color:#6b4a00}
.notice.ok{background:var(--green-bg);color:var(--green)}
.notice.plain{background:#eef0f3;color:var(--ink-2)}

/* metrics */
.metric{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 16px}
.metric .n{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.1;color:var(--navy)}
.metric .l{font-size:12.5px;color:var(--ink-2);margin-top:4px}
.metric .h{font-size:12px;color:var(--ink-3);margin-top:3px}
.metric.warn{border-color:#ead9a0;background:#fffbef} .metric.warn .n{color:var(--amber)}
.metric.good .n{color:var(--green)}
.bar{display:flex;height:8px;border-radius:999px;overflow:hidden;background:#e9ebe7}
.bar div{height:100%}
.bar.tiers{height:20px}
.bar.tiers div{display:flex;align-items:center;justify-content:center;font-size:11px;color:#333}

/* the customer's words */
.q{background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--line-2);border-radius:var(--r-lg);padding:14px 16px 12px 18px;margin-bottom:10px}
.q.s-Confirmed{border-left-color:var(--green)}
.q.s-Candidate{border-left-color:var(--mustard)}
.q.s-Rejected{border-left-color:var(--line);opacity:.6}
.q .words{font-family:var(--serif);font-size:17px;line-height:1.45;color:var(--ink);letter-spacing:-.005em}
.q .words:before{content:"\201C"} .q .words:after{content:"\201D"}
.q.compact .words{font-size:15.5px}
.q .meta{display:flex;gap:6px 8px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--ink-3);margin-top:10px}
.q .meta .who{color:var(--ink-2)}
.q .acts{display:flex;gap:6px;flex-shrink:0}
.q.focus{box-shadow:0 0 0 3px #f9c9bd}
.q .ctx{font-size:12.5px;color:var(--ink-3);margin-top:6px}

/* transcript */
.transcript{white-space:pre-wrap;font-family:var(--serif);font-size:15px;line-height:1.7;max-height:70vh;overflow:auto;padding-right:8px;color:var(--ink)}
mark{border-radius:2px;padding:0 1px;cursor:pointer;color:inherit}
mark.s-Confirmed{background:#cdebdf;box-shadow:0 2px 0 var(--green)}
mark.s-Candidate{background:var(--sticky);box-shadow:0 2px 0 var(--mustard)}
mark.s-Rejected{background:#eee;text-decoration:line-through}
mark.focus-mark,mark.focus{outline:2px solid var(--ink);outline-offset:1px}
.near{background:var(--blue-bg);border-radius:3px;outline:2px dashed #8ea6d4;outline-offset:1px}
.legend{font-size:12px;color:var(--ink-3);margin-top:10px}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(22,54,92,.28);z-index:39}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(660px,96vw);background:var(--paper);border-left:1px solid var(--line);box-shadow:-12px 0 40px rgba(0,0,0,.14);display:flex;flex-direction:column;z-index:40}
.drawer .dh{padding:14px 20px;border-bottom:1px solid var(--line)}
.drawer .db{overflow:auto;padding:18px 20px;flex:1}
.drawer .transcript{max-height:none}

/* ===== sheets: the Compass tools laid out like the toolkit pages ===== */
.sheet{background:var(--paper);border-radius:4px;box-shadow:0 1px 2px rgba(0,0,0,.08),0 12px 40px rgba(22,54,92,.10);padding:34px 40px 26px;margin:0 auto 28px;max-width:1080px;position:relative}
.sheet .tool{font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--navy-2);text-transform:uppercase}
.sheet h1{font-size:32px;font-weight:800;letter-spacing:-.02em;margin:2px 0 0;color:var(--navy)}
.sheet .wordmark{text-align:right;line-height:1.05}
.sheet .wordmark b{display:block;font-size:17px;font-weight:800;letter-spacing:.02em;color:var(--navy);text-transform:uppercase}
.sheet .wordmark span{font-size:10.5px;font-weight:700;letter-spacing:.08em;color:var(--navy-2);text-transform:uppercase}
.sheet .rule{border-top:3px solid var(--navy);margin:10px 0 10px}
.sheet .nameline{display:flex;gap:40px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);margin-bottom:18px}
.sheet .nameline b{color:var(--navy)}
.sheet .nameline [contenteditable]{display:inline-block;min-width:80px}
.sheet .foot{display:flex;justify-content:space-between;gap:12px;font-size:10.5px;color:var(--ink-3);margin-top:22px}
.box{border:2px solid var(--navy);border-radius:10px;padding:14px 16px 16px;position:relative;background:var(--paper)}
.box:before{content:"";display:block;width:28px;height:4px;background:var(--coral);border-radius:2px;margin-bottom:8px}
.box h3{font-size:14px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--navy);margin:0 0 2px}
.box .ins{font-size:12px;color:var(--ink-3);margin:0 0 12px}
.box .ins .ex{color:var(--ink-3)}
.canvas{display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:auto auto;gap:14px;grid-template-areas:"problem solution customer" "problem solution alts"}
.canvas .b-problem{grid-area:problem} .canvas .b-solution{grid-area:solution} .canvas .b-customer{grid-area:customer} .canvas .b-alts{grid-area:alts}
@media (max-width:900px){.canvas{grid-template-columns:1fr;grid-template-areas:"problem" "solution" "customer" "alts"}}
.lines{display:flex;flex-direction:column;gap:6px}
.ln{display:flex;gap:8px;align-items:flex-start;padding:4px 0;border-bottom:1px solid var(--line)}
.ln .n{font-family:var(--serif);font-style:italic;color:var(--ink-3);width:18px;flex-shrink:0;padding-top:3px;font-size:14px}
.ln .ed{flex:1;min-width:0}
.ln .x{opacity:0;transition:opacity .1s}
.ln:hover .x,.ln:focus-within .x{opacity:1}
.ln .sub{font-size:12px;color:var(--ink-3)}
.ln.ideal{background:var(--sticky);border-radius:6px;padding:4px 6px;margin:0 -6px}
.ln .star{border:1px solid var(--line-2);background:var(--paper);border-radius:999px;font-size:11px;padding:1px 8px;cursor:pointer;color:var(--ink-3);white-space:nowrap}
.ln .star.on{background:var(--navy);color:#fff;border-color:var(--navy)}
[contenteditable]{outline:none;border-radius:3px;min-height:1.4em;padding:2px 3px;margin:-2px -3px;cursor:text}
[contenteditable]:focus{background:#fffdf3;box-shadow:0 0 0 2px var(--mustard)}
[contenteditable][data-ph]:empty:before{content:attr(data-ph);color:var(--ink-3);font-style:italic;pointer-events:none}
.ed{font-family:var(--serif);font-size:15px;line-height:1.5}
.ed.sans{font-family:var(--sans);font-size:13.5px}
.add{font-size:12.5px;color:var(--ink-3);background:none;border:none;cursor:pointer;padding:4px 0;text-align:left}
.add:hover{color:var(--navy)}
/* statement sheets */
.stmt{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr);gap:28px}
@media (max-width:900px){.stmt{grid-template-columns:1fr}}
.blank{border-bottom:3px solid var(--navy);padding:0 0 10px;margin-bottom:22px}
.blank .lead{display:inline-block;background:var(--mustard);color:var(--navy);font-weight:800;font-size:18px;padding:4px 10px;letter-spacing:-.01em}
.blank .ed{display:block;margin-top:10px;min-height:1.6em}
.aside{background:var(--paper-2);border-radius:10px;padding:18px 20px;font-size:13px;color:var(--ink-2)}
.aside h4{font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--navy);margin:0 0 6px}
.aside h4 + p{margin-top:0}
.aside p{margin:0 0 14px;line-height:1.5}
.aside .ex{font-family:var(--serif);font-style:italic}
.aside .use{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:6px 10px;margin:4px 0;display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:12.5px}
.readback{font-family:var(--serif);font-size:19px;line-height:1.45;color:var(--ink);margin:6px 0 22px;max-width:70ch}
.readback .blank-word{color:var(--ink-3);font-style:italic}
/* assumptions map */
.map{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(260px,1fr);gap:22px}
@media (max-width:900px){.map{grid-template-columns:1fr}}
.board{position:relative;border:2px solid var(--navy);border-radius:4px;aspect-ratio:1.05;background:var(--paper);user-select:none;overflow:hidden}
.board .quad{position:absolute;left:0;top:0;width:50%;height:50%;background:var(--blush)}
.board .axis-v{position:absolute;left:50%;top:0;bottom:0;border-left:2px solid var(--navy);transform:translateX(-1px)}
.board .axis-h{position:absolute;top:50%;left:0;right:0;border-top:2px solid var(--navy);transform:translateY(-1px)}
.board .lab{position:absolute;font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--navy);background:var(--paper);padding:1px 6px;pointer-events:none}
.board .lab.top{top:8px;left:50%;transform:translateX(-50%)}
.board .lab.bottom{bottom:8px;left:50%;transform:translateX(-50%)}
.board .lab.left{left:8px;top:50%;transform:translateY(-130%)}
.board .lab.right{right:8px;top:50%;transform:translateY(-130%)}
.board .riskiest{position:absolute;left:10px;top:10px;color:var(--coral);font-weight:800;font-size:12px;letter-spacing:.04em;text-transform:uppercase;pointer-events:none;line-height:1.2}
.board .riskiest small{display:block;font-weight:500;letter-spacing:0;text-transform:none;font-size:11px}
.note{position:absolute;width:132px;min-height:58px;background:var(--sticky);box-shadow:1px 2px 4px rgba(0,0,0,.18);padding:7px 9px 6px;font-size:11.5px;line-height:1.3;cursor:grab;transform:translate(-50%,-50%);border-radius:2px;color:var(--ink)}
.note:hover{z-index:4}
.note:active,.note.dragging{cursor:grabbing;box-shadow:3px 6px 14px rgba(0,0,0,.25);z-index:5}
.note b{display:block;font-size:11px;color:var(--navy)}
.note .t{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.note .st{display:flex;gap:4px;align-items:center;margin-top:5px;font-size:10px;color:var(--ink-2)}
.note .dot{width:8px;height:8px;border-radius:50%;background:var(--line-2);flex-shrink:0}
.note .dot.ok{background:var(--green)} .note .dot.warn{background:var(--mustard)} .note .dot.bad{background:var(--red)}
.note.sel{outline:2px solid var(--navy);outline-offset:1px}
.note.ghost{background:transparent;border:1.5px dashed var(--navy-2);box-shadow:none;color:var(--navy-2);width:auto;min-height:0;padding:2px 7px;font-size:10.5px;font-weight:700;cursor:default;pointer-events:none}
.board svg.links{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.tray h4{font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--navy);margin:0 0 8px}
.tray .notes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tray .note{position:static;transform:none;width:auto}
.tray .note.sug{background:#fff8d6;border:1.5px dashed var(--navy-2)}
.sidebox{background:var(--paper-2);border-radius:10px;padding:14px 16px;margin-top:14px}
.sidebox h4{font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--navy);margin:0 0 6px}
/* AI vs you comparison */
.cmp{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:center;font-size:12.5px}
.cmp .scale{display:flex;gap:3px}
.cmp .scale i{width:14px;height:10px;border-radius:2px;background:#e3e7ec;display:block}
.cmp .scale i.you{background:var(--navy)} .cmp .scale i.ai{background:var(--coral)}
.stamp{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--red);color:var(--red);border-radius:4px;padding:2px 8px;font-size:11.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;transform:rotate(-1.5deg)}
.stamp.ok{border-color:var(--green);color:var(--green)}
/* checklist */
.check{display:flex;gap:12px;align-items:flex-start;padding:12px 4px;border-bottom:1px solid var(--line)}
.check:last-child{border-bottom:none}
.check .dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line-2);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;margin-top:1px}
.check.done .dot{background:var(--green);border-color:var(--green);color:#fff}
.check.done .t{color:var(--ink-3);text-decoration:line-through}
.check .t{font-weight:600}

<body>
<div id="root"></div>
<script>
"use strict";
/* ============================================================
   Discovery Records Manager (DRM)
   Compass (what you believe) -> Evidence (what customers said)
   -> Validate (which beliefs hold up), by focus area.
   Data lives as plain files in the founder's own repo folder.
   The founder's AI assistant reads and writes the same folder
   (see CLAUDE.md); this app is for entering and judging evidence.
   ============================================================ */

const TEMPLATE_URL = "https://github.com/Magiomakes/discovery-records-manager";
const SETUP_URL = TEMPLATE_URL + "/blob/main/SETUP.md";

const TIERS = ["Hair on Fire","Incremental Improvement","Nice to Have","Latent","Not a Problem"];
const TIER_CLASS = {"Hair on Fire":"tier-hof","Incremental Improvement":"tier-inc","Nice to Have":"tier-nth","Latent":"tier-lat","Not a Problem":"tier-nap"};
const TIER_DEF = {
  "Hair on Fire":"Already invested money or recurring time they can't get back, and the problem is still not solved.",
  "Incremental Improvement":"Actively trying to fix it, but the effort is reversible (tried a tool and dropped it, stopped when a free trial ended).",
  "Nice to Have":"Describes the problem clearly but has done nothing about it.",
  "Latent":"Has the problem but doesn't see it as a problem. A coaching flag, not a buying signal.",
  "Not a Problem":"No sign they have it."
};
const EVIDENCE_TYPES = ["Past behavior, irreversible","Past behavior, reversible","Current workaround","Frequency","Cost (time or money)","Strong language","Opinion or future intent"];
const EVIDENCE_DEF = {
  "Past behavior, irreversible":"Money spent, recurring time, or a workaround they built and keep using.",
  "Past behavior, reversible":"Tried something and dropped it, abandoned free trials.",
  "Current workaround":"What they use today instead of a real solution.",
  "Frequency":"How often it happens, in their words.",
  "Cost (time or money)":"Hours, dollars or grades lost.",
  "Strong language":"How they talk about it. Supports a score, never decides it.",
  "Opinion or future intent":"\"I would\", \"I'd probably\", \"sounds useful\". Weak evidence."
};
const SOURCES = ["Stranger (cold outreach)","Online community or follower","Referral from an interviewee","Classmate or acquaintance","Friend or family"];
const FREQ = [["Daily",5],["Weekly",4],["Monthly",3],["A few times a year",2],["Rarely",1]];
const CONSEQ = [[5,"Serious loss (money, grades, job, reputation)"],[4,"Real cost (hours or money lost, someone upset)"],[3,"Noticeable hassle that slows them down"],[2,"Minor annoyance"],[1,"Barely matters"]];
const JOB_TYPES = ["Functional","Emotional","Social"];
const DECISIONS = ["Undecided","Wedge","Later","Say no"];
const PERSONA_FIELDS = [
  ["who","Who they are (role and situation)"],
  ["moment","When the problem hits (the specific moment)"],
  ["workaround","What they do about it today"],
  ["cost","What it costs them (time, money, stress)"],
  ["words","How they describe it, in their own words"],
  ["buyer","Who decides or pays to fix it"],
  ["reach","Where we found them (how to reach more)"]
];
/* ---------------- helpers ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const opt = (v, cur, label) => `<option value="${esc(v)}"${String(v)===String(cur??"")?" selected":""}>${esc(label??v)}</option>`;
const today = () => new Date().toISOString().slice(0,10);
const pad = (n, w) => String(n).padStart(w, "0");
function nextId(prefix, list, width){
  let max = 0;
  for (const r of list){ const m = String(r.id).match(new RegExp("^" + prefix + "(\\d+)$")); if (m) max = Math.max(max, +m[1]); }
  return prefix + pad(max + 1, width);
}
function ago(ms){
  const s = (Date.now() - ms) / 1000;
  if (s < 90) return "just now";
  if (s < 3600) return Math.round(s/60) + " min ago";
  if (s < 86400) return Math.round(s/3600) + " h ago";
  return Math.round(s/86400) + " days ago";
}
function tierChip(t){ return t ? `<span class="chip tier ${TIER_CLASS[t]||""}">${esc(t)}</span>` : `<span class="chip gray">Not scored</span>`; }
function statusChip(s){ return `<span class="chip ${s==="Confirmed"?"ok":s==="Rejected"?"gray":"warn"}">${esc(s)}</span>`; }

/* Verbatim matching: is the quote really in the transcript, word for word? */
function quoteRegex(q){
  const t = String(q||"").trim().replace(/^["“”']+|["“”']+$/g,"").trim();
  if (t.length < 4) return null;
  const body = t.split(/\s+/).map(w => w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&").replace(/['’‘]/g,"['’‘]").replace(/["“”]/g,'["“”]')).join("\\s+");
  try { return new RegExp(body, "i"); } catch(e){ return null; }
}
function findInTranscript(quote, text){
  const re = quoteRegex(quote); if (!re || !text) return null;
  const m = re.exec(text); return m ? {start:m.index, end:m.index + m[0].length} : null;
}

/* ---------------- storage ---------------- */
const idb = {
  open(){ return new Promise((res, rej) => { const r = indexedDB.open("drm", 1); r.onupgradeneeded = () => r.result.createObjectStore("kv"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  async get(k){ const db = await this.open(); return new Promise(res => { const t = db.transaction("kv").objectStore("kv").get(k); t.onsuccess = () => res(t.result); t.onerror = () => res(undefined); }); },
  async set(k, v){ const db = await this.open(); return new Promise(res => { const t = db.transaction("kv","readwrite").objectStore("kv").put(v, k); t.onsuccess = () => res(); t.onerror = () => res(); }); }
};

const DIRS = {interviews:"interviews", evidence:"evidence", pains:"pain-scores", problems:"problems", jobs:"jobs", assumptions:"assumptions"};

class FolderStore {
  constructor(root){ this.root = root; this.kind = "folder"; this.name = root.name; this.stamps = null; }
  async dir(path, create=true){ let d = this.root; for (const p of path.split("/").filter(Boolean)) d = await d.getDirectoryHandle(p, {create}); return d; }
  async write(path, text){
    const parts = path.split("/"); const file = parts.pop();
    const d = await this.dir(parts.join("/"));
    const fh = await d.getFileHandle(file, {create:true});
    const w = await fh.createWritable(); await w.write(text); await w.close();
    if (this.stamps) this.stamps[path] = (await (await fh.getFile()).lastModified);
  }
  async read(path){
    try { const parts = path.split("/"); const file = parts.pop(); const d = await this.dir(parts.join("/"), false); const f = await (await d.getFileHandle(file)).getFile(); return await f.text(); }
    catch(e){ return null; }
  }
  async remove(path){ try { const parts = path.split("/"); const file = parts.pop(); const d = await this.dir(parts.join("/"), false); await d.removeEntry(file); delete (this.stamps||{})[path]; } catch(e){} }
  async isInitialized(){ return (await this.read("drm/config.json")) !== null; }
  async hasGit(){ try { await this.root.getDirectoryHandle(".git"); return true; } catch(e){ return false; } }
  async hasAiInstructions(){ return (await this.read("CLAUDE.md")) !== null; }
  async lastPush(){
    try {
      const g = await this.root.getDirectoryHandle(".git");
      const r = await (await (await g.getDirectoryHandle("refs")).getDirectoryHandle("remotes")).getDirectoryHandle("origin");
      for (const b of ["main","master"]) { try { const f = await (await r.getFileHandle(b)).getFile(); return f.lastModified; } catch(e){} }
    } catch(e){}
    return null;
  }
  /* Snapshot of every data file's modified time, so the app can notice when an AI assistant writes into the folder. */
  async scan(){
    const out = {};
    let drm; try { drm = await this.root.getDirectoryHandle("drm"); } catch(e){ return out; }
    for await (const [name, h] of drm.entries()){
      if (h.kind === "file"){ out["drm/" + name] = (await h.getFile()).lastModified; continue; }
      for await (const [n2, h2] of h.entries()) if (h2.kind === "file") out[`drm/${name}/${n2}`] = (await h2.getFile()).lastModified;
    }
    return out;
  }
  async loadAll(){
    const S = emptyState();
    S.config = JSON.parse(await this.read("drm/config.json") || "{}");
    S.persona = JSON.parse(await this.read("drm/persona.json") || "null") || S.persona;
    S.compass = {...emptyCompass(), ...(JSON.parse(await this.read("drm/compass.json") || "null") || {})};
    for (const [key, dir] of Object.entries(DIRS)){
      let d; try { d = await this.dir("drm/" + dir, false); } catch(e){ continue; }
      for await (const [name, h] of d.entries()){
        if (h.kind !== "file" || !name.endsWith(".json")) continue;
        try { const rec = JSON.parse(await (await h.getFile()).text()); if (rec && rec.id) S[key].push(rec); else S.unreadable.push(`drm/${dir}/${name}`); }
        catch(e){ S.unreadable.push(`drm/${dir}/${name}`); }
      }
    }
    try {
      const d = await this.dir("drm/transcripts", false);
      for await (const [name, h] of d.entries()) if (h.kind === "file" && name.endsWith(".md")) S.transcripts[name.slice(0,-3)] = await (await h.getFile()).text();
    } catch(e){}
    try {
      const d = await this.dir("drm/notes", false);
      for await (const [name, h] of d.entries()) if (h.kind === "file" && name.endsWith(".md")){ const f = await h.getFile(); S.notes.push({name, text: await f.text(), modified: f.lastModified}); }
    } catch(e){}
    S.notes.sort((a, b) => b.modified - a.modified);
    this.stamps = await this.scan();
    migrate(S);
    return S;
  }
}

class MemoryStore {
  constructor(){ this.kind = "demo"; this.name = "Demo"; this.files = {}; }
  async write(p, t){ this.files[p] = t; } async read(p){ return this.files[p] ?? null; } async remove(p){ delete this.files[p]; }
  async hasGit(){ return true; } async lastPush(){ return null; } async hasAiInstructions(){ return true; } async scan(){ return {}; }
}

function emptyState(){
  return {config:{}, interviews:[], evidence:[], pains:[], problems:[], jobs:[], assumptions:[], compass:emptyCompass(), transcripts:{}, notes:[], unreadable:[],
          persona:{problemId:"", fields:Object.fromEntries(PERSONA_FIELDS.map(([k]) => [k, {text:"", evidence:[]}]))}};
}

/* ---------------- app state ---------------- */
let store = null, S = emptyState(), lastPush = null, saveErr = null, savedAt = null, aiReady = null;
function loadCollapsed(){ try { return JSON.parse(localStorage.getItem("drm-collapsed") || "{}"); } catch(e){ return {}; } }
let ui = {collapsed:loadCollapsed(), drafts:{transcript:{}, rubric:{}}, toast:null, importPreview:null, tab:{}, filters:{status:"All", problem:"All", type:"All"}, drawer:null, hideChecklist: localStorage.getItem("drm-hide-checklist") === "1"};

const sortById = a => a.sort((x, y) => String(x.id).localeCompare(String(y.id), undefined, {numeric:true}));
function byId(list, id){ return list.find(r => r.id === id); }

async function persist(type, rec){
  try {
    if (type === "config") await store.write("drm/config.json", JSON.stringify(S.config, null, 2));
    else if (type === "persona") await store.write("drm/persona.json", JSON.stringify(S.persona, null, 2));
    else if (type === "compass") await store.write("drm/compass.json", JSON.stringify(S.compass, null, 2));
    else if (type === "transcript") await store.write(`drm/transcripts/${rec.id}.md`, rec.text);
    else await store.write(`drm/${DIRS[type]}/${rec.id}.json`, JSON.stringify(rec, null, 2));
    saveErr = null; savedAt = Date.now(); scheduleReport();
  } catch(e){ saveErr = e.message || String(e); console.error(e); }
}
async function unpersist(type, id){ await store.remove(`drm/${DIRS[type]}/${id}.json`); scheduleReport(); }

let reportTimer = null;
function scheduleReport(){ clearTimeout(reportTimer); reportTimer = setTimeout(async () => { try { await store.write("README.md", buildReport()); } catch(e){ console.error(e); } }, 800); }

function upsert(type, rec){
  const list = S[type]; const i = list.findIndex(r => r.id === rec.id);
  rec.updatedAt = new Date().toISOString();
  if (i >= 0) list[i] = rec; else list.push(rec);
  persist(type, rec);
}
function removeRec(type, id){ S[type] = S[type].filter(r => r.id !== id); unpersist(type, id); }

/* ---------------- calculations ---------------- */
function confirmedPains(){ return S.pains.filter(p => p.status === "Confirmed"); }
function hygieneIssues(iv){ return (Number(iv.leading) > 0 ? 1 : 0) + (iv.pitched === "Yes" ? 1 : 0) + (iv.demoed === "Yes" ? 1 : 0); }
function topTier(ivId){
  const tiers = confirmedPains().filter(p => p.interviewId === ivId).map(p => TIERS.indexOf(p.tier)).filter(i => i >= 0);
  return tiers.length ? TIERS[Math.min(...tiers)] : "";
}
function problemStats(pr){
  const ps = confirmedPains().filter(p => p.problemId === pr.id);
  const counts = Object.fromEntries(TIERS.map(t => [t, ps.filter(p => p.tier === t).length]));
  const n = ps.length; const top2 = counts["Hair on Fire"] + counts["Incremental Improvement"];
  const share = n ? top2 / n : 0;
  const minN = Number(S.config.minInterviews ?? 5), strong = Number(S.config.strongShare ?? 0.5);
  const signal = n < minN ? "Need more interviews" : share >= strong ? "Strong signal" : "Weak signal";
  const quotes = S.evidence.filter(e => e.problemId === pr.id && e.status === "Confirmed").length;
  return {n, counts, share, signal, quotes};
}
/* Deterministic rubric check: does the cited evidence justify the tier? Same rule the AI is told to follow. */
function painCheck(p){
  const ev = (p.evidenceIds || []).map(id => byId(S.evidence, id)).filter(Boolean);
  const types = new Set(ev.map(e => e.type));
  const iv = byId(S.interviews, p.interviewId);
  const issues = [];
  if (!ev.length && p.tier && p.tier !== "Not a Problem") issues.push("No quotes cited. A tier needs evidence behind it.");
  const strongTiers = ["Hair on Fire","Incremental Improvement"];
  if (strongTiers.includes(p.tier) && iv && iv.recentInstance === "No") issues.push("They couldn't describe a specific, recent instance, so the ceiling is Nice to Have.");
  if (p.tier === "Hair on Fire" && !types.has("Past behavior, irreversible")) issues.push("Hair on Fire needs a quote showing irreversible investment (money spent, recurring time, a workaround they built and keep using).");
  if (p.tier === "Incremental Improvement" && !types.has("Past behavior, reversible") && !types.has("Current workaround") && !types.has("Past behavior, irreversible")) issues.push("Incremental Improvement needs a quote showing they tried something (reversible effort or a current workaround).");
  const onlyWeak = ev.length && [...types].every(t => ["Opinion or future intent","Strong language"].includes(t));
  if (onlyWeak && strongTiers.includes(p.tier)) issues.push("Every cited quote is opinion or language. Those support a score; they can't decide one.");
  const unconfirmed = ev.filter(e => e.status !== "Confirmed").length;
  if (unconfirmed) issues.push(`${unconfirmed} cited quote${unconfirmed > 1 ? "s aren't" : " isn't"} confirmed yet.`);
  const missing = (p.evidenceIds || []).filter(id => !byId(S.evidence, id));
  if (missing.length) issues.push(`Cites quotes that don't exist: ${missing.join(", ")}.`);
  return {ok: issues.length === 0, issues, types:[...types]};
}
function freqScore(f){ const x = FREQ.find(([k]) => k === f); return x ? x[1] : null; }
function jobStats(j){
  const fs = freqScore(j.frequency), cs = j.consequence ? Number(j.consequence) : null;
  const priority = fs && cs ? fs * cs : null;
  const linked = S.evidence.filter(e => e.jobId === j.id && e.status === "Confirmed");
  const costQuote = linked.some(e => e.type === "Cost (time or money)");
  const checks = [["Named workaround", !!(j.workaround||"").trim()],["Specific moment", !!(j.moment||"").trim()],["How often", !!j.frequency],["Confirmed cost quote", costQuote],["Their own words", linked.length > 0]];
  return {fs, cs, priority, linked, checks, met: checks.filter(c => c[1]).length};
}
function rankedJobs(){
  return S.jobs.map(j => ({j, s:jobStats(j)})).filter(x => x.s.priority !== null)
    .sort((a, b) => b.s.priority - a.s.priority || b.s.met - a.s.met || a.j.id.localeCompare(b.j.id));
}
function confirmedQuoteIds(){ return new Set(S.evidence.filter(e => e.status === "Confirmed").map(e => e.id)); }
function metrics(){
  const iv = S.interviews, n = iv.length;
  const ff = iv.filter(i => i.source === "Friend or family").length;
  return {
    n, ff, ffShare: n ? ff / n : 0,
    recent: iv.filter(i => i.recentInstance === "Yes").length,
    hygiene: iv.filter(i => hygieneIssues(i) > 0).length,
    pitched: iv.filter(i => i.pitched === "Yes").length,
    demoed: iv.filter(i => i.demoed === "Yes").length,
    leading: iv.reduce((a, i) => a + (Number(i.leading) || 0), 0),
    rubric: iv.filter(i => i.rubricRun).length,
    confirmed: S.evidence.filter(e => e.status === "Confirmed").length,
    opinion: S.evidence.filter(e => e.status === "Confirmed" && e.type === "Opinion or future intent").length,
    candidates: S.evidence.filter(e => e.status === "Candidate").length + S.pains.filter(p => p.status === "Candidate").length,
    rejected: S.evidence.filter(e => e.status === "Rejected").length,
    hof: iv.filter(i => topTier(i.id) === "Hair on Fire").length,
    painIssues: S.pains.filter(p => p.status !== "Rejected" && !painCheck(p).ok).length,
    tierCounts: Object.fromEntries(TIERS.map(t => [t, confirmedPains().filter(p => p.tier === t).length]))
  };
}

/* ---------------- rubric prompt + parser ---------------- */
function rubricPrompt(iv){
  const probs = S.problems.length ? S.problems.map(p => `${p.id}: ${p.text}`).join("\n") : "none yet (mark every problem as NEW)";
  const jobs = S.jobs.length ? S.jobs.map(j => `${j.id}: ${j.statement}`).join("\n") : "none";
  const transcript = iv ? (S.transcripts[iv.id] || "[paste the full transcript]") : "[paste the full transcript]";
  return `You are reviewing one customer discovery interview for a startup founder. You suggest, the founder decides. Follow these rules exactly.

RULES
1. Quotes, not summaries. Every piece of evidence must be copied word for word from the transcript. Do not paraphrase, shorten, combine or fix grammar. If you can't find the exact words, leave it out.
2. Behavior, not interpretation. What the person has already done counts more than what they feel or say they would do.
3. Mark everything you produce as Candidate. The founder confirms or rejects each item.
4. Use only the exact labels listed below for types, tiers and Yes/No fields.

PART 1: INTERVIEW HYGIENE
Check the interviewer, not the interviewee:
- Leading questions: count interviewer questions that suggest an answer or ask about the future or a hypothetical (examples: "Would you use...", "Don't you hate...", "How much would you pay..."). Quote each one.
- Pitched or sold the idea: Yes if the interviewer described their solution or tried to win the person over.
- Demoed a product: Yes if they showed a prototype, mockup or product.
- Specific recent instance: Yes if the interviewee described a specific, recent time they had the problem.
- Closing question: Yes if the interviewer asked something like "Is there anything I should have asked you but didn't?"
Output one line in a code block, separated by | :
Specific recent instance|Leading questions (number)|Pitched or sold|Demoed|Closing question asked
Then list the leading questions you counted, quoted.

PART 2: EVIDENCE
Pull out every quote that shows the problem, what they do about it, how often, what it costs, or how strongly they feel. One quote per row.
Output in a code block, one row per quote, separated by | , with no header row:
Evidence ID|Interview ID|Problem ID|Job ID|Verbatim quote|Where in transcript|Evidence type|Found by|Status
- Evidence ID: the Interview ID plus -Q01, -Q02 and so on (example: ${iv ? iv.id : "INT-003"}-Q01).
- Problem ID: the matching ID from the problem list. If the quote shows a problem not on the list, write NEW: and a five-word description.
- Job ID: the matching ID from the job list if one was given, otherwise leave it empty.
- Where in transcript: the timestamp, or the first few words of the line if there are no timestamps.
- Evidence type, exactly one of: ${EVIDENCE_TYPES.join(" / ")}
  (Past behavior, irreversible = money spent, recurring time, or a workaround they built and keep using. Past behavior, reversible = tried something and dropped it, free trials. Opinion or future intent = "I would", "I'd probably", "that sounds useful".)
- Found by: AI candidate
- Status: Candidate
Because | separates columns, replace any | inside a quote with /.

PART 3: PAIN SCORE
Score each problem the interviewee talked about, one row per problem. Tiers, from strongest to weakest:
${TIERS.map(t => `- ${t}: ${TIER_DEF[t]}`).join("\n")}
Scoring rules: classify by what they did, not by how they talk. Strong language supports a score but is never enough on its own. If you are unsure between two tiers, choose the lower one. If they could not describe a specific, recent time it happened, score no higher than Nice to Have.
Output in a code block, one row per problem, separated by | , with no header row:
Interview ID|Problem ID|Pain tier|Supporting evidence IDs|Scored by|Status
- Supporting evidence IDs: the Evidence IDs from Part 2 that justify the tier, separated by commas.
- Scored by: Rubric
- Status: Candidate

PART 4: COACHING NOTE
In two or three plain sentences: what the founder should ask next time to get past opinions to behavior, and which problem looks strongest so far and why.

MY INPUTS
Interview ID: ${iv ? iv.id : "[for example INT-003]"}
Problem list:
${probs}
Job list (Level 2):
${jobs}
Transcript:
${transcript}`;
}

function matchLabel(v, list){
  const t = String(v||"").trim().toLowerCase();
  return list.find(x => x.toLowerCase() === t) || list.find(x => t && (x.toLowerCase().startsWith(t) || t.startsWith(x.toLowerCase()))) || null;
}
const YN = v => { const t = String(v||"").trim().toLowerCase(); return t.startsWith("y") ? "Yes" : t.startsWith("n") ? "No" : ""; };

function parseRubric(text){
  const out = {hygiene:null, evidence:[], pains:[], skipped:[]};
  for (let raw of String(text||"").split(/\r?\n/)){
    let line = raw.trim();
    if (!line.includes("|") || line.startsWith("```")) continue;
    if (/^\|?[\s:\-|]+\|?$/.test(line)) continue;            // markdown table separator
    if (line.startsWith("|")) line = line.slice(1);
    if (line.endsWith("|")) line = line.slice(0, -1);
    let parts = line.split("|").map(s => s.trim());
    const head = parts[0].toLowerCase();
    if (/^(evidence id|interview id|specific recent)/.test(head)) continue;   // header rows
    if (/^-\s*evidence type/i.test(line) || line.startsWith("- ")) continue;   // stray instruction lines
    if (parts.length === 5 && YN(parts[0]) && !isNaN(parseInt(parts[1]))){
      out.hygiene = {recentInstance:YN(parts[0]), leading:parseInt(parts[1]), pitched:YN(parts[2]), demoed:YN(parts[3]), closing:YN(parts[4])};
    } else if (parts.length === 6 && matchLabel(parts[2], TIERS)){
      out.pains.push({aiInterview:parts[0], problemRef:parts[1], tier:matchLabel(parts[2], TIERS), evidenceIds:parts[3].split(/[,;\s]+/).filter(Boolean)});
    } else if (parts.length >= 9){
      const tail = parts.slice(-4); const quote = parts.slice(4, parts.length - 4).join("/");
      out.evidence.push({aiId:parts[0], problemRef:parts[2], jobRef:parts[3], quote:quote.replace(/^["“]|["”]$/g,"").trim(), where:tail[0], typeRaw:tail[1], type:matchLabel(tail[1], EVIDENCE_TYPES)});
    } else out.skipped.push(raw);
  }
  return out;
}

function planImport(iv, parsed){
  // Work out IDs, new problems and verbatim checks before anything is saved.
  const transcript = S.transcripts[iv.id] || "";
  const newProblems = []; const problemMap = {};
  let prList = [...S.problems];
  function resolveProblem(ref){
    const r = String(ref||"").trim(); if (!r) return "";
    if (problemMap[r] !== undefined) return problemMap[r];
    if (byId(S.problems, r)) return problemMap[r] = r;
    const m = r.match(/^NEW\s*:?\s*(.+)$/i);
    const text = m ? m[1].trim() : r;
    const same = prList.find(p => p.text.toLowerCase() === text.toLowerCase());
    if (same) return problemMap[r] = same.id;
    const id = nextId("PR-", prList, 2); const p = {id, text, who:""}; prList.push(p); newProblems.push(p);
    return problemMap[r] = id;
  }
  const idMap = {}; let evList = [...S.evidence];
  const evidence = parsed.evidence.map(e => {
    let id = e.aiId && /^[A-Za-z0-9_-]+$/.test(e.aiId) && e.aiId.startsWith(iv.id) && !byId(evList, e.aiId) ? e.aiId : null;
    if (!id) id = nextId(iv.id + "-Q", evList.filter(x => x.id.startsWith(iv.id + "-Q")), 2);
    idMap[e.aiId] = id;
    const rec = {id, interviewId:iv.id, problemId:resolveProblem(e.problemRef), jobId:byId(S.jobs, e.jobRef) ? e.jobRef : "", quote:e.quote, where:e.where, type:e.type || "", foundBy:"Claude Code", status:"Candidate", note: e.type ? "" : `AI type: ${e.typeRaw}`};
    evList.push(rec);
    rec._verbatim = !!findInTranscript(rec.quote, transcript);
    return rec;
  });
  const pains = parsed.pains.map(p => {
    const problemId = resolveProblem(p.problemRef);
    const id = `${iv.id}__${problemId}`;
    const existing = byId(S.pains, id);
    return {id, interviewId:iv.id, problemId, tier:p.tier, evidenceIds:p.evidenceIds.map(x => idMap[x] || x), scoredBy:"Claude Code", status:"Candidate", disagree:"", _skip: existing && existing.status === "Confirmed"};
  });
  return {hygiene:parsed.hygiene, evidence, pains, newProblems, skipped:parsed.skipped};
}

function applyImport(iv, plan, raw){
  for (const p of plan.newProblems) upsert("problems", {...p});
  for (const e of plan.evidence){ const r = {...e}; delete r._verbatim; upsert("evidence", r); }
  for (const p of plan.pains){ if (p._skip) continue; const r = {...p}; delete r._skip; upsert("pains", r); }
  const updated = {...iv, rubricRun:true, rubricRaw:raw};
  if (plan.hygiene) Object.assign(updated, plan.hygiene);
  upsert("interviews", updated);
}

/* Minimal markdown rendering for the in-app report preview */
function renderMd(md){
  const lines = md.split("\n"); let html = "", inTable = false, inList = false;
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/_(.+?)_/g,"<i>$1</i>").replace(/\[(.+?)\]\((.+?)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  for (const l of lines){
    if (l.startsWith("|")){
      if (/^\|[-| ]+\|$/.test(l)) continue;
      const cells = l.slice(1, -1).split("|").map(c => c.trim());
      if (!inTable){ html += "<table><tr>" + cells.map(c => `<th>${inline(c)}</th>`).join("") + "</tr>"; inTable = true; }
      else html += "<tr>" + cells.map(c => `<td>${inline(c)}</td>`).join("") + "</tr>";
      continue;
    } else if (inTable){ html += "</table>"; inTable = false; }
    if (l.startsWith("- ")){ if (!inList){ html += "<ul>"; inList = true; } html += `<li>${inline(l.slice(2))}</li>`; continue; }
    else if (inList){ html += "</ul>"; inList = false; }
    if (l.startsWith("### ")) html += `<h3>${inline(l.slice(4))}</h3>`;
    else if (l.startsWith("## ")) html += `<h2>${inline(l.slice(3))}</h2>`;
    else if (l.startsWith("# ")) html += `<h1>${inline(l.slice(2))}</h1>`;
    else if (l.startsWith("> ")) html += `<blockquote>${inline(l.slice(2))}</blockquote>`;
    else if (l === "---") html += "<hr>";
    else if (l.trim()) html += `<p>${inline(l)}</p>`;
  }
  if (inTable) html += "</table>"; if (inList) html += "</ul>";
  return html;
}

const PS_PARTS = [["context","When","Type your context here"],["complication","it leads to","Type your complication here"],["consequence","which matters because","Type your consequence here"]];
const VP_EXAMPLE = "If we help people who want to play D&D but don't have a group solve the challenge of finding a group to play with by allowing them to quickly and easily connect with others like them, they will choose it over online chat forums like Reddit or Discord because it gives them a faster way to go from online to in person.";
const PS_EXAMPLE = "When tabletop players start looking for a group to play with, it leads to searching Facebook groups and Discords and sifting through local meetups, which matters because it's overwhelming, frustrating, and often ends before you ever get to play.";

function emptyCompass(){
  return {meta:{name:"", date:"", version:"v1"}, solutions:{}, customers:[], alternatives:[],
          problemStatement:{context:"", complication:"", consequence:""}, valueProp:{who:"", what:"", how:"", over:"", why:""},
          riskiest:"", evidencePlan:"", leads:[]};
}
/* Older files: map earlier field names onto the toolkit's. */
function migrate(S){
  const c = S.compass;
  if (!c.meta) c.meta = {name:S.config.founder || "", date:"", version:"v1"};
  if (!c.solutions) c.solutions = {};
  if (c.solution && S.problems[0] && !c.solutions[S.problems[0].id]) c.solutions[S.problems[0].id] = c.solution;
  const ps = c.problemStatement || {};
  if (ps.problem !== undefined && ps.complication === undefined) c.problemStatement = {context:ps.context || "", complication:ps.problem || "", consequence:ps.impact || ""};
  if (!c.leads) c.leads = [];
  c.riskiest = c.riskiest || ""; c.evidencePlan = c.evidencePlan || "";
  for (const a of S.assumptions){
    if (a.kind === "customer") a.kind = "early-adopters";
    if (a.kind === "alternative") a.kind = "alternatives";
    if (a.kind === "value") a.kind = "solution";
    if (a.confidence === undefined) a.confidence = a.uncertainty ? 6 - Number(a.uncertainty) : "";
    if (a.aiConfidence === undefined) a.aiConfidence = a.aiUncertainty ? 6 - Number(a.aiUncertainty) : "";
    if (!a.aiEvidence) a.aiEvidence = [];
    if (a.pos === undefined) a.pos = (a.impact && a.confidence) ? {x:(a.confidence - 1) / 4, y:(a.impact - 1) / 4} : null;
  }
}
function idealCustomer(){ return (S.compass.customers || []).find(c => c.ideal) || null; }
function valuePropText(){ const v = S.compass.valueProp; return VP_PARTS.map(([k, lead]) => lead + " " + (v[k] || "[" + VP_PARTS.find(p => p[0] === k)[2].replace("Type your ", "").replace(" here", "") + "]")).join(" ") + "."; }
function problemStatementText(){ const p = S.compass.problemStatement; return PS_PARTS.map(([k, lead]) => lead + " " + (p[k] || "[" + k + "]")).join(" ") + "."; }
function firstQuestion(){ const p = S.compass.problemStatement; return `Have you experienced ${p.context || "[context]"} / ${p.complication || "[complication]"}?`; }

/* Seed assumptions from the canvas. Idempotent: each seed has a key; existing ones are kept. */
function seedAssumptions(){
  const seeds = [];
  for (const p of S.problems) seeds.push({key:"problem:" + p.id, kind:"problem", problemId:p.id, text:`${p.who || "Our customers"} have this problem: ${p.text}`});
  for (const p of S.problems) if ((S.compass.solutions||{})[p.id]) seeds.push({key:"solution:" + p.id, kind:"solution", problemId:p.id, text:`They would switch from what they do today to: ${S.compass.solutions[p.id]}`});
  const ideal = idealCustomer();
  if (ideal) seeds.push({key:"customer:" + ideal.id, kind:"early-adopters", customerId:ideal.id, text:`${ideal.text} feel this problem more than the other segments and are the right first customer`});
  for (const c of (S.compass.customers||[]).filter(c => !c.ideal)) seeds.push({key:"customers:" + c.id, kind:"customers", customerId:c.id, text:`${c.text} have this problem too`});
  for (const a of S.compass.alternatives || []) seeds.push({key:"alt:" + a.id, kind:"alternatives", alternativeId:a.id, text:`${a.name} doesn't solve it well enough${a.gap ? ": " + a.gap : ""}`});
  if (S.compass.valueProp.why) seeds.push({key:"value", kind:"solution", text:`They would choose us over ${S.compass.valueProp.over || "the alternatives"} because our solution is ${S.compass.valueProp.why}`});
  let added = 0;
  for (const s of seeds){
    if (S.assumptions.some(a => a.seed === s.key)) continue;
    const id = nextId("A-", S.assumptions, 2);
    upsert("assumptions", {id, seed:s.key, kind:s.kind, text:s.text, problemId:s.problemId || "", customerId:s.customerId || "", alternativeId:s.alternativeId || "", impact:"", confidence:"", pos:null, aiImpact:"", aiConfidence:"", aiEvidence:[], aiReason:"", evidence:[], note:"", status:"Active", foundBy:"Founder"});
    added++;
  }
  return added;
}

/* Evidence-based status. The reading comes from discovery data, never from a typed score. */
function segShare(ps){ return ps.length ? ps.filter(p => ["Hair on Fire","Incremental Improvement"].includes(p.tier)).length / ps.length : 0; }
function assumptionStatus(a){
  const minN = Number(S.config.minInterviews ?? 5), strong = Number(S.config.strongShare ?? 0.5);
  const confirmed = confirmedPains();
  if (a.kind === "problem" && a.problemId){
    const ps = confirmed.filter(p => p.problemId === a.problemId);
    const n = ps.length; const top2 = ps.filter(p => ["Hair on Fire","Incremental Improvement"].includes(p.tier)).length; const share = n ? top2 / n : 0;
    const shaky = ps.filter(p => !painCheck(p).ok).length;
    const q = shaky ? ` (${shaky} of those fail the rubric check)` : "";
    if (n < minN) return {status:"Untested", why:`${n} of ${minN} confirmed interviews scored on this problem${q}`, n, share};
    if (share >= strong) return {status:"Holding up", why:`${top2} of ${n} interviews are Hair on Fire or Incremental (${Math.round(share*100)}%)${q}`, n, share};
    if (share <= 0.2) return {status:"Contradicted", why:`Only ${top2} of ${n} interviews show real pain (${Math.round(share*100)}%)${q}`, n, share};
    return {status:"Shaky", why:`${top2} of ${n} interviews show real pain (${Math.round(share*100)}%), below your ${Math.round(strong*100)}% bar${q}`, n, share};
  }
  if ((a.kind === "early-adopters" || a.kind === "customers") && a.customerId){
    const bySeg = {};
    for (const p of confirmed){ const iv = byId(S.interviews, p.interviewId); const seg = iv && iv.customerId ? iv.customerId : "?"; (bySeg[seg] = bySeg[seg] || []).push(p); }
    const mine = bySeg[a.customerId] || []; const untagged = (bySeg["?"] || []).length;
    if (mine.length < 3) return {status:"Untested", why:`${mine.length} of 3 confirmed scores from this segment${untagged ? ` (${untagged} interviews have no segment set)` : ""}`, n:mine.length};
    const s = segShare(mine);
    if (a.kind === "customers"){
      if (s >= strong) return {status:"Holding up", why:`${Math.round(s*100)}% of this segment's scores show real pain`, n:mine.length, share:s};
      if (s <= 0.2) return {status:"Contradicted", why:`Only ${Math.round(s*100)}% of this segment's scores show real pain`, n:mine.length, share:s};
      return {status:"Shaky", why:`${Math.round(s*100)}% of this segment's scores show real pain`, n:mine.length, share:s};
    }
    const others = Object.entries(bySeg).filter(([k]) => k !== a.customerId && k !== "?").map(([k, ps]) => ({k, share:segShare(ps), n:ps.length})).filter(o => o.n >= 3);
    const best = others.sort((x, y) => y.share - x.share)[0];
    if (best && best.share >= s + 0.25){ const c = byId(S.compass.customers, best.k); return {status:"Contradicted", why:`${c ? c.text : best.k} show more pain (${Math.round(best.share*100)}% vs ${Math.round(s*100)}%)`, n:mine.length, share:s}; }
    if (s >= strong) return {status:"Holding up", why:`${Math.round(s*100)}% of this segment's scores show real pain${best ? `, ahead of ${Math.round(best.share*100)}% elsewhere` : ", no other segment interviewed yet"}`, n:mine.length, share:s};
    return {status:"Shaky", why:`Only ${Math.round(s*100)}% of this segment's scores show real pain`, n:mine.length, share:s};
  }
  const ev = (a.evidence || []).map(x => ({...x, e:byId(S.evidence, x.id)})).filter(x => x.e && x.e.status === "Confirmed");
  const sup = ev.filter(x => x.stance === "supports").length, con = ev.filter(x => x.stance === "contradicts").length;
  if (!ev.length) return {status:"Untested", why:"No confirmed quotes tagged to this yet", n:0};
  if (con >= sup) return {status:"Contradicted", why:`${con} quote${con === 1 ? "" : "s"} against, ${sup} for`, n:ev.length};
  if (sup >= 3 && sup >= 2 * con) return {status:"Holding up", why:`${sup} quotes for, ${con} against`, n:ev.length};
  return {status:"Shaky", why:`${sup} for, ${con} against; not enough yet`, n:ev.length};
}
function assumptionPriority(a){ const i = Number(a.impact) || 0, c = Number(a.confidence) || 0; return i && c ? i * (6 - c) : null; }
function rankedAssumptions(){
  return S.assumptions.filter(a => a.status !== "Retired").map(a => ({a, p:assumptionPriority(a), s:assumptionStatus(a)}))
    .sort((x, y) => (y.p ?? -1) - (x.p ?? -1) || STATUS_ORDER[x.s.status] - STATUS_ORDER[y.s.status] || x.a.id.localeCompare(y.a.id));
}
/* What the AI's rating rests on. This is shown everywhere the rating is, so a guess never looks like a finding. */
function aiBasis(a){
  if (!a.aiImpact && !a.aiConfidence && !a.aiReason) return {kind:"none", label:"Not rated by AI", ids:[]};
  const ids = (a.aiEvidence || []).filter(Boolean);
  const found = ids.map(id => byId(S.evidence, id)).filter(Boolean);
  const conf = found.filter(e => e.status === "Confirmed");
  if (!ids.length) return {kind:"guess", label:"No evidence: a guess", ids:[]};
  if (!found.length) return {kind:"missing", label:`Cites ${ids.length} quote${ids.length > 1 ? "s" : ""} that don't exist`, ids};
  if (!conf.length) return {kind:"unconfirmed", label:`Cites ${found.length} unconfirmed quote${found.length > 1 ? "s" : ""}`, ids};
  return {kind:"evidence", label:`Based on ${conf.length} confirmed quote${conf.length > 1 ? "s" : ""}${found.length > conf.length ? ` (+${found.length - conf.length} unconfirmed)` : ""}`, ids};
}
function disagreement(a){
  const di = a.impact && a.aiImpact ? Math.abs(Number(a.impact) - Number(a.aiImpact)) : 0;
  const dc = a.confidence && a.aiConfidence ? Math.abs(Number(a.confidence) - Number(a.aiConfidence)) : 0;
  return Math.max(di, dc) >= 2;
}
function compassReadout(){
  const r = rankedAssumptions(); const active = r.filter(x => x.a.status === "Active");
  const rated = active.filter(x => x.p);
  const counts = {Contradicted:0, Shaky:0, Untested:0, "Holding up":0}; for (const x of active) counts[x.s.status]++;
  const top = rated.slice(0, 3);
  const riskiestOpen = rated.find(x => x.s.status === "Untested") || null;
  let verdict, cls;
  if (!active.length) verdict = "No assumptions on the map yet.", cls = "gray";
  else if (!rated.length) verdict = "Drag your notes onto the map to find the riskiest.", cls = "gray";
  else if (top.some(x => x.s.status === "Contradicted")) verdict = "One of your riskiest assumptions is contradicted by your interviews. Time to rethink that part.", cls = "bad";
  else if (top.every(x => x.s.status === "Holding up")) verdict = "Your three riskiest assumptions are holding up. Keep testing the next ones.", cls = "ok";
  else if (top.some(x => x.s.status === "Shaky")) verdict = "One of your riskiest assumptions is shaky. More interviews with the right people will settle it.", cls = "warn";
  else verdict = "Your riskiest assumptions are still untested. That's where the next interviews go.", cls = "warn";
  return {counts, top, riskiestOpen, verdict, cls, total:active.length, rated:rated.length, candidates:S.assumptions.filter(a => a.status === "Candidate").length};
}
function areaOf(a){ return (ASSUMPTION_KINDS[a.kind] || {}).area || "customers"; }
function areaReadout(area){
  const list = rankedAssumptions().filter(x => x.a.status === "Active" && areaOf(x.a) === area);
  const counts = {Contradicted:0, Shaky:0, Untested:0, "Holding up":0}; for (const x of list) counts[x.s.status]++;
  return {list, counts};
}

/* Ledger check: the same deterministic checks tools/check.js runs for the AI. */
function ledgerChecks(){
  const out = [];
  const push = (sev, where, href, msg) => out.push({sev, where, href, msg});
  for (const e of S.evidence){
    if (e.status === "Rejected") continue;
    const t = S.transcripts[e.interviewId];
    if (t && !findInTranscript(e.quote, t)) push(e.status === "Confirmed" ? "bad" : "warn", e.id, "interviews/" + e.interviewId, `${e.status} quote isn't in the transcript word for word.`);
    if (!e.type) push("warn", e.id, "interviews/" + e.interviewId, "Quote has no evidence type.");
    if (e.status === "Confirmed" && e.type === "Opinion or future intent") push("info", e.id, "interviews/" + e.interviewId, "Confirmed quote is only opinion or future intent. It can't carry a pain score.");
  }
  for (const p of S.pains){
    if (p.status === "Rejected") continue;
    const c = painCheck(p); for (const i of c.issues) push(p.status === "Confirmed" ? "bad" : "warn", p.id, "interviews/" + p.interviewId, i);
  }
  for (const a of S.assumptions){
    if (a.status === "Retired") continue;
    const b = aiBasis(a);
    if (b.kind === "missing") push("bad", a.id, "compass/map", "AI cites quotes that don't exist in this folder.");
    if (b.kind === "guess") push("info", a.id, "compass/map", "AI rated this with no evidence. Treat it as a second opinion, not a finding.");
    if (a.status === "Active" && !assumptionPriority(a)) push("info", a.id, "compass/map", "Not placed on the map yet.");
  }
  for (const iv of S.interviews){
    if (!iv.customerId && S.compass.customers.length) push("info", iv.id, "interviews/" + iv.id, "No customer segment set, so it can't count toward the early-adopter bet.");
    if (!S.transcripts[iv.id]) push("warn", iv.id, "interviews/" + iv.id, "No transcript saved.");
  }
  for (const f of S.unreadable || []) push("bad", f, "home", "File couldn't be read and was skipped.");
  return out;
}

}
function sheetFoot(num){ const c = S.config; return `<div class="foot"><span>${esc(c.program || "Ideas Lab")} · ${esc(c.cohort || "")}${c.cohort ? " · " : ""}${esc(c.programSub || "LaunchPad")}, Institute for Innovation and Entrepreneurship, Mount Royal University</span><span>Week 1 Toolkit · ${num}</span></div>`; }
const ed = (act, attrs, val, ph, cls) => `<div class="ed ${cls||""}" contenteditable="plaintext-only" data-act="${act}" ${attrs} data-ph="${esc(ph)}">${esc(val||"")}</div>`;
function compassNav(cur){
  const steps = [["canvas","01 Leaner Canvas"],["value","02 Value Proposition"],["problem","03 Problem Statement"],["map","04 Assumptions Map"],["leads","05 Leads List"]];
  return `<div class="tabs" style="margin-top:0">${steps.map(([k, l]) => `<button class="${cur === k ? "on" : ""}" data-act="go" data-href="compass/${k}">${l}</button>`).join("")}</div>`;
}
function compassView(step){
  step = step || "canvas";
  const views = {canvas:canvasSheet, value:valueSheet, problem:problemSheet, map:mapSheet, leads:leadsSheet};
  return compassNav(step) + (views[step] || canvasSheet)();
}

/* 01 Leaner Canvas */

      ${lines(probs, (p, i) => `<div class="ln">${numbered(i)}<div class="ed" style="flex:1">${ed("pField", `data-id="${esc(p.id)}" data-field="text"`, p.text, "Type here")}<div class="sub">${ed("pField", `data-id="${esc(p.id)}" data-field="who"`, p.who, "who has it", "sans")}</div></div><button class="btn icon no x" title="Remove" data-act="pRemove" data-id="${esc(p.id)}">✕</button></div>`, "problem", "Add a problem")}</div>

    <div class="box b-customer"><h3>Ideal customer</h3><p class="ins">List all possible customers. Label your ideal customer 1.</p>

/* 04 Assumptions Map */
function noteHtml(x, extraCls, style){
  const a = x.a, s = x.s; const k = ASSUMPTION_KINDS[a.kind] || {label:a.kind};
  const dot = s.status === "Holding up" ? "ok" : s.status === "Shaky" ? "warn" : s.status === "Contradicted" ? "bad" : "";
  return `<div class="note ${extraCls||""} ${ui.selNote === a.id ? "sel" : ""}" data-note="${esc(a.id)}" data-act="selNote" data-id="${esc(a.id)}" style="${style||""}" title="${esc(a.text)}"><b>${esc(k.label)}:</b><div class="t">${esc(a.text || "type your assumption")}</div><div class="st"><span class="dot ${dot}"></span>${esc(s.status === "Untested" ? "No evidence yet" : s.status)}</div></div>`;
}
function mapSheet(){
  const r = compassReadout(); const ranked = rankedAssumptions();
  const placed = ranked.filter(x => x.a.status === "Active" && x.a.pos);
  const tray = ranked.filter(x => x.a.status === "Active" && !x.a.pos);
  const sug = ranked.filter(x => x.a.status === "Candidate");

function areaAssumptionRow(x){

  return `<div class="card" style="border-left:4px solid ${s.status === "Holding up" ? "var(--green)" : s.status === "Contradicted" ? "var(--red)" : s.status === "Shaky" ? "var(--mustard)" : "var(--line-2)"};cursor:pointer" data-act="selNote" data-id="${esc(a.id)}">

    <div class="small muted" style="margin-top:6px">${esc(s.why)}.${b.kind === "guess" ? ` <span class="chip bad">AI rated with no evidence</span>` : b.kind === "evidence" ? ` <span class="chip ok">AI: ${esc(b.label)}</span>` : ""}</div></div>`;

function statusChipA(s){ return `<span class="chip ${s === "Holding up" ? "ok" : s === "Contradicted" ? "bad" : s === "Shaky" ? "warn" : "gray"}">${esc(s === "Untested" ? "No evidence yet" : s)}</span>`; }
function validateView(area){
  area = AREAS[area] ? area : "problem";
  const A = AREAS[area]; const r = areaReadout(area);
  const tabs = `<div class="tabs" style="margin-top:0">${Object.entries(AREAS).map(([k, v]) => `<button class="${area === k ? "on" : ""}" data-act="go" data-href="validate/${k}">${v.title}</button>`).join("")}</div>`;
  const head = `<div class="area-head"><div class="k">${A.k}</div><div><h1>${esc(A.title)}</h1><p class="lede" style="margin-bottom:0">${esc(A.lede)}</p></div></div>
  <div class="row small" style="margin-bottom:14px">${["Holding up","Shaky","Untested","Contradicted"].map(k => `${statusChipA(k)} ${r.counts[k]}`).join(" ")}</div>
  <h2>Assumptions in this area</h2>${r.list.length ? r.list.map(areaAssumptionRow).join("") : `<div class="card empty">No ${esc(A.title.toLowerCase())} assumptions yet. <a href="#/compass/map">Make them on the map.</a></div>`}`;
  let tools = "";
  if (area === "problem") tools = `<h2>Evidence: pain per problem</h2>${problemsTable()}<h2>Tool: customer persona</h2><p class="lede">Every line needs a confirmed quote behind it. <a href="#/persona">Open the persona</a>.</p>${personaSummary()}`;
  else if (area === "solution") tools = `<h2>Evidence: what they do today</h2><p class="lede">Solution assumptions are tested by tagging quotes for or against them. Confirmed workaround and past-behavior quotes are the best place to look.</p>${quoteList(S.evidence.filter(e => e.status === "Confirmed" && ["Current workaround","Past behavior, irreversible","Past behavior, reversible"].includes(e.type)))}
    <details class="fold"><summary>When you're ready: jobs and MVP scope</summary><p class="small">A job is the progress a customer is trying to make at a specific moment. Jobs tie what people do today to what you'd build. <a href="#/jobs">Open jobs</a> · <a href="#/mvp">Open MVP scope</a></p></details>`;

function problemsTable(){
  return `<div class="card flat">${S.problems.length ? `<table><tr><th>ID</th><th>Problem</th><th class="right">Scored</th>${TIERS.map(t => `<th class="right" title="${esc(t)}"><span class="chip tier ${TIER_CLASS[t]}">${esc(t.split(" ").map(w => w[0]).join(""))}</span></th>`).join("")}<th class="right">Top-two share</th><th class="right">Quotes</th><th>Signal</th></tr>

/* ---------------- routing + rendering ---------------- */
function route(){ const h = location.hash.replace(/^#\/?/, "") || "home"; const [page, id] = h.split("/"); return {page, id: id ? decodeURIComponent(id) : null}; }
function go(h){ location.hash = "#/" + h; }
window.addEventListener("hashchange", () => { ui.drawer = null; ui.askFor = null; ui.selNote = null; render(); });
document.addEventListener("keydown", ev => { if (ev.key === "Escape" && (ui.drawer || ui.askFor || ui.selNote)){ ui.drawer = null; ui.askFor = null; ui.selNote = null; render(); } });

function shell(content){
  const m = metrics(); const r = route(); const demo = store.kind === "demo";
  const link = (h, label, badge) => { const on = h.includes("/") ? (r.page + "/" + (r.id || "")) === h : r.page === h; return `<a href="#/${h}" class="${on ? "on" : ""}"><span>${label}</span>${badge || ""}</a>`; };
  const group = (key, title, items, pending) => {

  const scrollEl = document.querySelector(".main"); const keep = scrollEl && root.dataset.page === location.hash ? scrollEl.scrollTop : 0;
  root.innerHTML = shell((views[r.page] || dashView)(r.id)) + (ui.drawer ? drawerView() : "") + (ui.askFor ? askPanel() : "") + (ui.selNote ? noteDrawer() : "");

function tierChip(t){ return t ? `<span class="chip tier ${TIER_CLASS[t]||""}">${esc(t)}</span>` : `<span class="chip gray">Not scored</span>`; }
function statusChip(s){ return `<span class="chip ${s==="Confirmed"?"ok":s==="Rejected"?"gray":"warn"}">${esc(s)}</span>`; }
function signalChip(s){ return `<span class="chip ${s === "Strong signal" ? "ok" : s === "Weak signal" ? "bad" : "gray"}">${esc(s)}</span>`; }
function sourceChip(f){ return f ? `<span class="ai">${esc(f === "AI candidate" ? "AI" : f)}</span>` : ""; }
const W = (cls, n, l, h) => `<div class="metric ${cls}"><div class="n">${n}</div><div class="l">${l}</div>${h ? `<div class="h">${h}</div>` : ""}</div>`;

function quoteCard(e, transcript, opts = {}){

  const pr = byId(S.problems, e.problemId); const iv = byId(S.interviews, e.interviewId);
  const who = iv ? [iv.interviewee, iv.role].filter(Boolean).join(", ") : "";
  return `<div class="q s-${esc(e.status)} ${opts.compact ? "compact" : ""}" id="q-${esc(e.id)}">
    <div class="spread" style="align-items:flex-start"><div class="words" style="flex:1">${esc(e.quote)}</div>
      <div class="acts">${e.status !== "Rejected" ? `<button class="btn icon no" title="Reject" data-act="setStatus" data-kind="evidence" data-id="${esc(e.id)}" data-val="Rejected">✕</button>` : ""}${e.status !== "Confirmed" ? `<button class="btn icon yes" title="Confirm" data-act="setStatus" data-kind="evidence" data-id="${esc(e.id)}" data-val="Confirmed">✓</button>` : ""}</div></div>
    <div class="meta">
      ${opts.showInterview ? `<a href="#/interviews/${esc(e.interviewId)}" class="who" style="text-decoration:none"><b>${esc(e.interviewId)}</b>${who ? " · " + esc(who) : ""}</a>` : ""}
      ${statusChip(e.status)}
      ${found === true ? `<span class="chip ok">Word for word</span>` : found === false ? `<span class="chip bad" title="The exact words aren't in the transcript. Check before confirming.">Not in transcript</span>` : ""}
      ${e.status === "Candidate" ? sourceChip(e.foundBy) : ""}
      <select class="inline" data-act="evField" data-id="${esc(e.id)}" data-field="type"><option value="">Type?</option>${EVIDENCE_TYPES.map(t => opt(t, e.type)).join("")}</select>
      <select class="inline" data-act="evField" data-id="${esc(e.id)}" data-field="problemId"><option value="">No problem</option>${S.problems.map(p => opt(p.id, e.problemId, p.id)).join("")}</select>
      ${S.jobs.length ? `<select class="inline" data-act="evField" data-id="${esc(e.id)}" data-field="jobId"><option value="">No job</option>${S.jobs.map(j => opt(j.id, e.jobId, j.id)).join("")}</select>` : ""}
      ${e.where ? `<span>at ${esc(e.where)}</span>` : ""}
      ${e.type === "Opinion or future intent" ? `<span class="chip warn">Weak evidence</span>` : ""}
      ${transcript ? (opts.inInterview ? `<button class="btn link small" data-act="jump" data-id="${esc(e.id)}">Show in transcript</button>` : `<button class="btn sm" data-act="openDrawer" data-id="${esc(e.id)}">View in transcript</button>`) : ""}
    </div>
    ${pr && opts.showProblem ? `<div class="ctx">${esc(pr.id)}: ${esc(pr.text)}</div>` : ""}
    ${e.note ? `<div class="ctx">${esc(e.note)}</div>` : ""}
  </div>`;
}

function painCard(p, opts = {}){
  const pr = byId(S.problems, p.problemId);
  const ev = (p.evidenceIds || []).map(id => byId(S.evidence, id)).filter(Boolean);
  return `<div class="card"><div class="spread"><div>${opts.showInterview ? `<a href="#/interviews/${esc(p.interviewId)}"><b>${esc(p.interviewId)}</b></a> on ` : ""}<b>${esc(p.problemId)}</b> ${esc(pr ? pr.text : "")}</div>
    <div class="row">${p.status === "Candidate" ? sourceChip(p.scoredBy) : ""}${statusChip(p.status)}${p.status !== "Rejected" ? `<button class="btn icon no" title="Reject" data-act="setStatus" data-kind="pains" data-id="${esc(p.id)}" data-val="Rejected">✕</button>` : ""}${p.status !== "Confirmed" ? `<button class="btn icon yes" title="Confirm" data-act="setStatus" data-kind="pains" data-id="${esc(p.id)}" data-val="Confirmed">✓</button>` : ""}</div></div>
    <div class="row" style="margin:10px 0 6px">${TIERS.map(t => `<button class="btn sm ${p.tier === t ? TIER_CLASS[t] : ""}" style="${p.tier === t ? "font-weight:600;border-color:#8a8a8a" : ""}" data-act="setTier" data-id="${esc(p.id)}" data-val="${esc(t)}">${esc(t)}</button>`).join("")}</div>

    ${(() => { const c = painCheck(p); return c.ok ? `<div class="notice ok" style="margin-top:8px"><b>Rubric check:</b> the cited quotes justify this tier${c.types.length ? ` (${c.types.map(esc).join(", ")})` : ""}.</div>` : `<div class="notice bad" style="margin-top:8px"><b>Rubric check:</b> ${c.issues.map(esc).join(" ")}</div>`; })()}
    ${ev.length ? `<div style="margin-top:10px">${ev.map(e => quoteCard(e, S.transcripts[e.interviewId] ?? null, {compact:true})).join("")}</div>` : `<p class="hint">No supporting quotes linked.</p>`}
    ${ev.some(e => e.status !== "Confirmed") ? `<div class="notice warn" style="margin-top:4px">Some supporting quotes aren't confirmed yet.</div>` : ""}
    <label class="f" style="margin:10px 0 0">If you changed the tier, say why<input type="text" data-act="painDisagree" data-id="${esc(p.id)}" value="${esc(p.disagree||"")}"></label>
  </div>`;
}

function highlight(text, quotes, focusId, near){
  const ranges = [];
  for (const e of quotes){ if (e.status === "Rejected" && e.id !== focusId) continue; const r = findInTranscript(e.quote, text); if (r) ranges.push({...r, e}); }
  if (near) ranges.push(near);
  ranges.sort((a, b) => a.start - b.start);
  let out = "", pos = 0;
  for (const r of ranges){
    if (r.start < pos) continue;
    const inner = esc(text.slice(r.start, r.end));
    out += esc(text.slice(pos, r.start)) + (r.e ? `<mark class="s-${r.e.status}${r.e.id === focusId ? " focus-mark" : ""}" data-act="jump" data-id="${esc(r.e.id)}" id="m-${esc(r.e.id)}">${inner}</mark>` : `<span class="near" title="Around where the AI said this quote is">${inner}</span>`);
    pos = r.end;
  }
  return out + esc(text.slice(pos));
}
function nearRange(e, text){
  const w = String(e.where || "").trim(); if (w.length < 3 || !text) return null;
  const i = text.toLowerCase().indexOf(w.toLowerCase()); if (i < 0) return null;
  const start = text.lastIndexOf("\n", i) + 1; let end = text.indexOf("\n", i); if (end < 0) end = text.length;
  return {start, end};
}
function drawerView(){
  const e = byId(S.evidence, ui.drawer); if (!e) return "";
  const iv = byId(S.interviews, e.interviewId) || {id:e.interviewId}; const text = S.transcripts[e.interviewId] || "";
  const found = !!findInTranscript(e.quote, text); const near = found ? null : nearRange(e, text);
  const queue = S.evidence.filter(x => x.status === "Candidate").sort((a, b) => a.id.localeCompare(b.id, undefined, {numeric:true}));
  const next = queue.find(x => x.id !== e.id && x.id.localeCompare(e.id, undefined, {numeric:true}) > 0) || queue.find(x => x.id !== e.id);
  return `<div class="scrim" data-act="closeDrawer"></div><aside class="drawer" role="dialog" aria-label="Transcript">
    <div class="dh"><div class="spread"><div><b>${esc(iv.id)}</b> ${esc(iv.interviewee || "")}<div class="hint">${esc([iv.role, iv.date].filter(Boolean).join(", "))}</div></div>
      <div class="row">${next ? `<button class="btn sm" data-act="openDrawer" data-id="${esc(next.id)}">Next suggestion</button>` : ""}<a class="btn sm" href="#/interviews/${esc(iv.id)}">Open interview</a><button class="btn icon" data-act="closeDrawer" title="Close (Esc)">✕</button></div></div>
      <div style="margin-top:12px">${quoteCard(e, text, {inInterview:true})}</div>
      ${found ? "" : `<div class="notice bad">These exact words aren't in the transcript, so the AI may have changed them. ${near ? "The dashed line is where it said the quote came from." : "Read the transcript before confirming."}</div>`}
    </div>
    <div class="db"><div class="transcript">${text ? highlight(text, S.evidence.filter(x => x.interviewId === e.interviewId), e.id, near) : `<p class="empty">No transcript saved for this interview.</p>`}</div></div>
  </aside>`;
}

function checklist(m){

}
function problemProgress(p){
  const s = problemStats(p); const minN = Number(S.config.minInterviews ?? 5);
  const pct = Math.min(100, s.n / minN * 100); const left = Math.max(0, minN - s.n);
  return `<div class="card"><div class="spread"><div style="flex:1;min-width:240px"><a href="#/problems/${esc(p.id)}" style="text-decoration:none;color:inherit"><b>${esc(p.text)}</b></a><div class="hint">${esc(p.id)}${p.who ? ", " + esc(p.who) : ""}</div></div>

    <div style="margin-top:12px"><div class="bar"><div style="width:${pct}%;background:${s.signal === "Strong signal" ? "var(--green)" : "#9fb3d1"}"></div></div>
    <div class="row small" style="margin-top:8px"><span>${s.n} of ${minN} confirmed interviews${left ? `, ${left} to go` : ""}</span>${TIERS.filter(t => s.counts[t]).map(t => `<span class="chip tier ${TIER_CLASS[t]}">${esc(t)}: ${s.counts[t]}</span>`).join("")}<span class="muted">${s.quotes} confirmed quote${s.quotes === 1 ? "" : "s"}</span></div></div></div>`;
}
function nextStep(m){
  if (!S.problems.length || !idealCustomer()) return ["Fill in your Leaner Canvas: the problems you believe exist and who you'd bet has them.", "compass/canvas", "Open the canvas"];
  if (!S.compass.valueProp.why) return ["Write your value proposition. It's the claim you'll have to earn.", "compass/value", "Write it"];
  if (!S.assumptions.length) return ["Turn your canvas into sticky notes and put them on the map.", "compass/map", "Open the map"];
  if (!S.assumptions.some(a => assumptionPriority(a))) return ["Drag your notes onto the map. Top-left is what you test first.", "compass/map", "Open the map"];
  const c = compassReadout();
  if (c.riskiestOpen && !S.interviews.length) return [`Your riskiest untested assumption: ${c.riskiestOpen.a.text}. Interviews will test it.`, (S.compass.leads||[]).length ? "compass/leads" : "interviews", (S.compass.leads||[]).length ? "Pick a lead" : "Log an interview"];
  if (!S.interviews.length) return ["Log your first customer interview and paste the transcript.", "interviews", "Log an interview"];
  if (m.candidates) return [`Review ${m.candidates} suggestion${m.candidates>1?"s":""} from your AI. Only confirmed items count.`, "review", "Review now"];
  const noRubric = S.interviews.find(i => !i.rubricRun);
  if (noRubric) return [`${noRubric.id} hasn't been reviewed by your AI yet.`, "interviews/" + noRubric.id, "Open " + noRubric.id];
  if (c.counts.Contradicted) return ["An assumption is contradicted. Decide what changes on the canvas.", "compass/map", "Open the map"];
  if (c.riskiestOpen) return [`Still untested: ${c.riskiestOpen.a.text}. Point the next interviews at it.`, "compass/map", "Open the map"];
  if (!S.persona.fields.who.text) return ["Start your customer persona, with a quote behind every line.", "persona", "Open persona"];
  return ["Keep interviewing. Each conversation should re-test an assumption, not just add new ideas.", "interviews", "Log an interview"];
}

    return `<div class="card"><div class="spread"><h3>${esc(label)}</h3>${state}</div>

  }).join("")}`;
