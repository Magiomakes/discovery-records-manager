<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Discovery Records Manager</title>
<meta name="theme-color" content="#eeeeea">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100,200;100,300;100,800&family=Fraunces:ital,opsz,wght@0,9..144,300;1,9..144,300&display=swap" rel="stylesheet">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<style>
:root{
  /* DESIGN.md: stone, ink, one blue accent (links, primary action, focus, selection only). Status is shape, never colour. */
  --stone:#eeeeea; --stone-top:#f3f3ef; --inset:#f6f6f3; --paper:#ffffff;
  --ink:#111111; --grey:#8c8c88; --hair:#c9c9c4;
  --acc:#1438d8;
  --hatch:repeating-linear-gradient(45deg,var(--ink) 0 1px,transparent 1px 3.5px);
  --hatch-grey:repeating-linear-gradient(45deg,var(--grey) 0 1px,transparent 1px 3.5px);
  --sans:"Archivo","Helvetica Neue",Arial,sans-serif;
  --serif:"Fraunces",Georgia,"Iowan Old Style",serif;
  --mono:ui-monospace,Menlo,Consolas,monospace;
  --w:300; --wb:800; --wl:200;
  --t:.15s ease-out;
  /* names the old code still uses for inline colours; mapped onto the neutral ramp */
  --navy:var(--ink); --teal:var(--ink); --coral:var(--ink); --red:var(--ink); --sky:var(--grey); --yellow:var(--grey); --pale:var(--inset);
  --line:var(--hair); --line-2:var(--grey); --ink-2:var(--ink); --ink-3:var(--grey); --paper-2:var(--inset); --nap:var(--inset);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--sans);font-weight:var(--w);font-variation-settings:"wdth" 100;color:var(--ink);background:linear-gradient(180deg,var(--stone-top) 0,var(--stone) 480px) fixed;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit;font-weight:inherit}
a{color:var(--acc);text-decoration:none;border-bottom:1px solid currentColor}
a:hover{border-bottom-width:2px}
a:active{opacity:.7}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
b,strong{font-weight:var(--wb)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important}.pt:hover,.pt .dotp:hover,.btn:active,.tile.click:hover{transform:none!important}}

/* ===== frame: the sidebar is the first column of the grid, not a panel ===== */
.app{display:grid;grid-template-columns:236px 1fr;height:100vh}
.side{border-right:2px solid var(--ink);display:flex;flex-direction:column;min-height:0}
.brand{padding:22px 20px 14px;border-bottom:1px solid var(--ink)}
.brand b{display:block;font-size:12px;font-weight:var(--wb);letter-spacing:.02em;text-transform:uppercase;line-height:1.3}
.brand span{display:block;font-size:12px;color:var(--grey);margin-top:4px}
.nav{padding:8px 0 12px;overflow:auto;flex:1}
.nav a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 20px 5px 20px;border:none;color:var(--ink);font-size:14px;line-height:1.3;border-left:3px solid transparent}
.nav a:hover{border-left-color:var(--grey)}
.nav a:active{opacity:.7}
.nav a.on{font-weight:var(--wb);border-left-color:var(--ink)}
.nav .grp{display:flex;align-items:center;gap:6px;width:100%;border:none;background:none;cursor:pointer;font-size:11px;font-weight:var(--wb);letter-spacing:.04em;text-transform:uppercase;color:var(--grey);padding:18px 20px 5px;text-align:left}
.nav .grp:hover{color:var(--ink)}
.nav .grp:active{opacity:.7}
.nav .grp .chev{display:inline-block;width:10px;transition:transform var(--t)}
.nav .grp.closed .chev{transform:rotate(-90deg)}
.nav .grp.has-active{color:var(--ink)}
.nav .grp .pill{margin-left:auto}
.nav .num{font-family:var(--mono);font-size:11px;color:var(--grey);margin-right:6px}
.count{color:var(--grey);font-size:12px;font-family:var(--mono)}
.pill{background:var(--ink);color:var(--stone);font-size:11px;font-weight:var(--wb);padding:1px 6px;font-family:var(--mono)}
.sidefoot{border-top:1px solid var(--ink);padding:12px 20px;font-size:12px;color:var(--grey);line-height:1.5}
.sidefoot b{color:var(--ink)}
.sidefoot .err{color:var(--ink);background:var(--hatch-grey);padding:0 2px}
.main{overflow:auto;min-width:0}
.main.bare{overflow:hidden;display:flex;flex-direction:column}
.app.nosb{grid-template-columns:1fr} .app.nosb .side{display:none}
.page{max-width:1280px;padding:36px 48px 96px}
.crumbs{font-size:12px;color:var(--grey);margin-bottom:8px}
.crumbs a{color:var(--grey)}
h2{font-size:12px;font-weight:var(--wb);text-transform:uppercase;letter-spacing:.02em;margin:40px 0 12px;padding-top:12px;border-top:2px solid var(--ink)}
h2:first-child{margin-top:0}
h3{font-size:12px;font-weight:var(--wb);text-transform:uppercase;letter-spacing:.02em;margin:0 0 8px}
.lede{color:var(--ink);margin:0 0 18px;max-width:62ch}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.muted{color:var(--grey)}
.small{font-size:12px}
.right{text-align:right}
.mono{font-family:var(--mono);font-size:12px}
@media (max-width:900px){.app{grid-template-columns:1fr}.side{display:none}.page{padding:20px 16px 80px}}

/* ===== sheets: every page is one typographic document; no container ===== */
.sheet{background:none;border:none;box-shadow:none;padding:0;margin:0 0 32px;position:relative}
.sheet .tool{font-size:12px;font-weight:var(--wb);letter-spacing:.02em;text-transform:uppercase}
.sheet h1{font-size:48px;font-weight:var(--wb);letter-spacing:-.03em;line-height:1;margin:6px 0 0}
.sheet h1 .muted.mono{font-size:12px;font-weight:var(--wb);letter-spacing:0;vertical-align:middle}
.sheet .wordmark{text-align:right;line-height:1.2}
.sheet .wordmark b{display:block;font-size:12px;font-weight:var(--wb);letter-spacing:.02em;text-transform:uppercase}
.sheet .wordmark span{font-size:12px;color:var(--grey)}
.sheet .rule{border-top:2px solid var(--ink);margin:16px 0 14px}
.sheet .nameline{display:flex;gap:32px;flex-wrap:wrap;font-size:12px;margin-bottom:22px}
.sheet .nameline b{font-weight:var(--wb);text-transform:uppercase;letter-spacing:.02em}
.sheet .nameline [contenteditable]{display:inline-block;min-width:80px}
.sheet .intro{margin:0 0 20px;max-width:66ch}
.sheet .foot{display:flex;justify-content:space-between;gap:12px;font-size:12px;color:var(--grey);margin-top:40px;padding-top:10px;border-top:1px solid var(--ink)}
.sheet .actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:-2px 0 14px}

/* boxes become ruled rows: a 2px rule, an uppercase label, the content */
.box{border:none;border-top:2px solid var(--ink);padding:12px 0 8px;position:relative;background:none;margin-bottom:24px}
.box h3{font-size:12px;font-weight:var(--wb);letter-spacing:.02em;text-transform:uppercase;margin:0 0 4px}
.box .ins{font-size:12px;color:var(--grey);margin:0 0 12px;max-width:66ch}
.box.soft{border-top-width:1px}
.box.flat{padding:12px 0 0}
.boxes{display:grid;gap:0 24px}
.boxes.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.boxes.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:900px){.boxes.g2,.boxes.g3{grid-template-columns:1fr}}
/* counts: label / big thin numeral / caption, on a hairline */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0 24px;margin-bottom:24px}
@media (max-width:1000px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{border:none;border-top:1px solid var(--ink);padding:10px 0 12px;background:none}
.tile .n{font-size:48px;font-weight:var(--wl);letter-spacing:-.02em;line-height:1;margin:2px 0 4px}
.tile .n .muted{font-size:15px;font-weight:var(--w)}
.tile .l{font-size:12px;font-weight:var(--wb);text-transform:uppercase;letter-spacing:.02em}
.tile .h{font-size:12px;color:var(--grey);margin-top:4px}
.tile .belief{font-size:15px}
.tile.warn .n,.tile.good .n,.tile.bad .n{color:var(--ink)}
.tile.bad .l:after{content:"";display:inline-block;width:9px;height:9px;border:1px solid var(--ink);background:var(--hatch);margin-left:8px;vertical-align:0}
.tile.good .l:after{content:"";display:inline-block;width:9px;height:9px;border:1px solid var(--ink);background:var(--ink);margin-left:8px;vertical-align:0}
.tile.warn .l:after{content:"";display:inline-block;width:9px;height:9px;border:1px solid var(--ink);margin-left:8px;vertical-align:0}
.tile.click{cursor:pointer;transition:transform var(--t)} .tile.click:hover{transform:translateX(4px)} .tile.click:active{opacity:.7}
/* a row of the page: label column, then content (the 12-column grid: 2 + 10) */
.g12{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:24px}
.lrow{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,10fr);column-gap:24px;border-top:2px solid var(--ink);padding:14px 0 20px;align-items:start}
.lrow.hair{border-top-width:1px}
.lrow>.lbl{font-size:12px;font-weight:var(--wb);text-transform:uppercase;letter-spacing:.02em;line-height:1.4;padding-top:2px}
.lrow>.lbl .sub{display:block;font-weight:var(--w);text-transform:none;letter-spacing:0;color:var(--grey);margin-top:4px}
@media (max-width:1100px){.lrow{grid-template-columns:minmax(0,1fr);row-gap:8px}}
/* the verdict: first and largest on the home page and the map */
h1.verdict{font-size:64px;font-weight:var(--wb);line-height:.98;letter-spacing:-.03em;margin:0}
h1.verdict.sm{font-size:24px;line-height:1.15;letter-spacing:-.02em;max-width:none}
@media (max-width:1100px){h1.verdict{font-size:clamp(34px,6vw,56px)}}
@media (max-width:600px){h1.verdict{font-size:34px;letter-spacing:-.02em}h1.verdict.sm{font-size:20px}}
.vrow{display:grid;grid-template-columns:minmax(0,9fr) minmax(220px,3fr);column-gap:24px;padding:28px 0 32px;align-items:start}
@media (max-width:1100px){.vrow{grid-template-columns:1fr;row-gap:20px}}
.facts{display:grid;grid-template-columns:1fr 1fr;column-gap:24px;row-gap:16px;border-top:1px solid var(--ink);padding-top:12px}
.facts>div{min-width:0}
.facts .lbl{font-size:12px;font-weight:var(--wb);text-transform:uppercase;letter-spacing:.02em;line-height:1.2;min-height:29px;display:flex;align-items:flex-end}
.facts .n{font-size:48px;font-weight:var(--wl);line-height:1;letter-spacing:-.02em;margin:4px 0 2px}
.facts .s{font-size:12px;color:var(--grey);line-height:1.3}
.facts a{color:inherit;border:none;display:block} .facts a:hover .n{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:6px}
.nextline{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,7fr) minmax(0,3fr);column-gap:24px;align-items:center;border-top:2px solid var(--ink);padding:14px 0 16px}
.nextline .lbl{font-size:12px;font-weight:var(--wb);text-transform:uppercase;letter-spacing:.02em}
.nextline .a{text-align:right}
@media (max-width:1100px){.nextline{grid-template-columns:1fr;row-gap:10px}.nextline .a{text-align:left}}
/* the posture gauge (map: large; home: under the verdict) */
.gauge{position:relative;padding-top:14px}
.gauge .scale{position:relative;height:28px;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink)}
.gauge .tick{position:absolute;top:0;bottom:0;width:1px;background:var(--hair)}
.gauge .tick.c{background:var(--ink)}
.gauge .needle{position:absolute;left:0;top:-10px;width:100%;height:48px;background:none;margin:0;pointer-events:none;transform:translateX(calc(var(--p,0) * 50%));animation:needle .24s ease-out both}
.gauge .needle:before{content:"";position:absolute;left:50%;top:0;width:2px;height:100%;margin-left:-1px;background:var(--ink)}
.gauge .needle:after{content:"";position:absolute;left:50%;top:-6px;border:6px solid transparent;border-top-color:var(--ink);transform:translateX(-50%)}
@keyframes needle{from{transform:translateX(0)}to{transform:translateX(calc(var(--p,0) * 50%))}}
@media (prefers-reduced-motion:reduce){@keyframes needle{from{opacity:0}to{opacity:1}}}
.chip.st:before{display:none}
.q .meta .etype{font-weight:var(--wb);text-transform:uppercase;letter-spacing:.02em;color:var(--ink);font-size:11px}
.btn.on{background:var(--ink);color:var(--stone)}
.gauge .gl{display:flex;justify-content:space-between;margin-top:6px;font-size:11px;font-weight:var(--wb);letter-spacing:.02em;text-transform:uppercase}
.gauge .read{display:block;margin-top:8px;font-size:12px;color:var(--grey)}
.gauge.sm .scale{height:18px} .gauge.sm .needle{height:36px;top:-8px}
/* the share bar per problem: one slot per interview needed */
.share{display:grid;column-gap:4px;height:56px;margin:14px 0 0}
.share i{display:block;border:2px solid var(--ink)}
.share i.hof{background:var(--ink)}
.share i.inc{background:var(--hatch)}
.share i.nth{background:var(--grey)}
.share i.lat{background:var(--hatch-grey)}
.share i.nap{border-color:var(--grey)}
.share i.empty{border:1px dashed var(--grey)}
.share-n{display:grid;column-gap:4px;margin-top:10px}
.share-n>div{font-size:12px;font-weight:var(--wb);text-transform:uppercase;letter-spacing:.02em;padding-top:8px;border-top:1px solid var(--ink);min-width:0}
.share-n .n{display:block;font-weight:var(--wl);font-size:96px;line-height:.9;letter-spacing:-.03em;margin:4px 0 6px}
.share-n .g{color:var(--grey)}
@media (max-width:900px){.share{height:40px}.share-n .n{font-size:48px}}
/* status glyph and word: shape, never colour */
.gy{display:inline-block;width:10px;height:10px;border:1px solid var(--ink);vertical-align:0;margin-right:6px;flex-shrink:0;background:transparent}
.gy.shaky{background:linear-gradient(90deg,var(--ink) 50%,transparent 50%)}
.gy.holding{background:var(--ink)}
.gy.contradicted{background:var(--hatch)}
.gy.ai{border-style:dashed;border-color:var(--grey)}
.stw{font-size:12px;font-weight:var(--wb);text-transform:uppercase;letter-spacing:.02em;white-space:nowrap}
.why{font-size:12px;color:var(--grey);display:block;margin-top:2px;font-weight:var(--w);text-transform:none;letter-spacing:0;white-space:normal}
/* the riskiest-assumptions table */
table.bets{width:100%}
table.bets th{padding:8px 16px 8px 0}
table.bets td{padding:14px 16px 16px 0;vertical-align:top}
table.bets td.p{font-size:48px;font-weight:var(--wl);line-height:.9;letter-spacing:-.02em;width:72px;padding-top:12px}
table.bets td.id{font-family:var(--mono);font-size:12px;font-weight:var(--wb);width:64px;padding-top:18px}
table.bets td.t{width:26%}
table.bets td.obj{width:26%}
table.bets .rat{font-weight:var(--wb);font-size:12px;white-space:nowrap}
table.bets .rat span{font-weight:var(--w);color:var(--grey)}
table.bets tr.click td{cursor:pointer} table.bets tr.click:hover td{background:none;text-decoration:none} table.bets tr.click:hover td.t{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
.tscroll{overflow-x:auto}

/* ===== canvas sheet ===== */
.canvas{display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:auto auto;gap:0 24px;grid-template-areas:"problem solution customer" "problem solution alts"}
.canvas .b-problem{grid-area:problem} .canvas .b-solution{grid-area:solution} .canvas .b-customer{grid-area:customer} .canvas .b-alts{grid-area:alts}
.canvas .box{margin:0 0 24px}
@media (max-width:900px){.canvas{grid-template-columns:1fr;grid-template-areas:"problem" "solution" "customer" "alts"}}
.lines{display:flex;flex-direction:column;gap:0}
.ln{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--hair)}
.ln .n{font-family:var(--mono);font-size:12px;color:var(--grey);width:18px;flex-shrink:0;padding-top:5px}
.ln .x{opacity:0;transition:opacity var(--t)}
.ln:hover .x,.ln:focus-within .x{opacity:1}
.ln .sub{font-size:12px;color:var(--grey)}
.ln.ideal{border-left:3px solid var(--ink);padding-left:8px;margin-left:-11px}
.ln .star{border:1px solid var(--ink);background:none;font-size:11px;font-weight:var(--wb);text-transform:uppercase;letter-spacing:.02em;padding:2px 8px;cursor:pointer;white-space:nowrap}
.ln .star:hover{background:var(--ink);color:var(--stone)} .ln .star:active{opacity:.7}
.ln .star.on{background:var(--ink);color:var(--stone)}
[contenteditable]{outline:none;min-height:1.4em;padding:2px 3px;margin:-2px -3px;cursor:text}
[contenteditable]:focus{background:var(--inset);box-shadow:0 0 0 2px var(--acc)}
[contenteditable][data-ph]:empty:before{content:attr(data-ph);color:var(--grey);font-style:italic;pointer-events:none}
.ed{font-family:var(--serif);font-weight:300;font-size:17px;line-height:1.4;font-variation-settings:"opsz" 24}
.ed.sans{font-family:var(--sans);font-weight:var(--w);font-size:14px;font-variation-settings:"wdth" 100}
.add{font-size:12px;font-weight:var(--wb);text-transform:uppercase;letter-spacing:.02em;color:var(--grey);background:none;border:none;cursor:pointer;padding:8px 0;text-align:left}
.add:hover{color:var(--ink)} .add:active{opacity:.7}
.stmt{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr);gap:0 48px}
@media (max-width:900px){.stmt{grid-template-columns:1fr}}
.blank{border-bottom:2px solid var(--ink);padding:0 0 10px;margin-bottom:22px}
.blank .lead{display:inline-block;font-weight:var(--wb);font-size:12px;text-transform:uppercase;letter-spacing:.02em;padding:4px 0}
.blank .ed{display:block;margin-top:6px;min-height:1.6em;font-size:24px;font-variation-settings:"opsz" 48}
.aside{border-top:1px solid var(--ink);padding:12px 0 0;font-size:14px}
.aside h4{font-size:12px;font-weight:var(--wb);letter-spacing:.02em;text-transform:uppercase;margin:0 0 6px}
.aside p{margin:0 0 14px;line-height:1.5}
.aside .ex{font-family:var(--serif);font-weight:300;font-style:italic;font-size:17px}
.aside .use{border-top:1px solid var(--hair);padding:8px 0;margin:0;display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:14px}
.readback{font-family:var(--serif);font-weight:300;font-size:28px;line-height:1.25;margin:6px 0 22px;max-width:30ch;font-variation-settings:"opsz" 72}

/* ===== controls: square, 800 uppercase, invert on hover ===== */
.btn{text-decoration:none;display:inline-block;border:2px solid var(--ink);background:none;padding:8px 14px;cursor:pointer;white-space:nowrap;font-weight:var(--wb);font-size:12px;text-transform:uppercase;letter-spacing:.02em;color:var(--ink);line-height:1.2;transition:opacity var(--t)}
.btn:hover{background:var(--ink);color:var(--stone)}
.btn:active{opacity:.7}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--stone)}
.btn.pri:hover{background:var(--stone);color:var(--acc)}
.btn.sm{padding:5px 10px;font-size:11px;border-width:1px}
.btn.icon{width:30px;height:30px;padding:0;display:inline-flex;align-items:center;justify-content:center;font-size:13px;border-width:1px}
.btn.icon.yes:hover{background:var(--ink);color:var(--stone)}
.btn.icon.no{border-style:dashed} .btn.icon.no:hover{background:var(--hatch);color:var(--ink)}
.btn.link{border:none;background:none;color:var(--acc);padding:0;text-decoration:none;border-bottom:1px solid currentColor;font-weight:var(--w);text-transform:none;letter-spacing:0;font-size:inherit}
.btn.link:hover{background:none;color:var(--acc);border-bottom-width:2px}
.btn:disabled,.btn[disabled]{opacity:.4;cursor:not-allowed;pointer-events:none}
label.f{display:block;font-size:12px;font-weight:var(--wb);text-transform:uppercase;letter-spacing:.02em;margin-bottom:14px}
label.f > input,label.f > select,label.f > textarea{display:block;width:100%;margin-top:5px}
label.f .hint{display:block;font-weight:var(--w);text-transform:none;letter-spacing:0;margin-top:4px}
input[type=text],input[type=number],input[type=date],select,textarea{border:1px solid var(--ink);padding:8px 10px;background:var(--inset);color:var(--ink);font-weight:var(--w);text-transform:none;letter-spacing:0;font-size:15px}
input[type=checkbox]{accent-color:var(--ink);width:16px;height:16px}
textarea{resize:vertical;min-height:72px;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:0;border-color:var(--ink)}
input:disabled,select:disabled,textarea:disabled{opacity:.4;cursor:not-allowed}
select.inline{padding:3px 6px;font-size:12px}
.seg{display:inline-flex;border:1px solid var(--ink)}
.seg button{border:none;background:none;padding:4px 10px;cursor:pointer;border-right:1px solid var(--ink);font-size:12px;font-weight:var(--wb)}
.seg button:last-child{border-right:none}
.seg button:hover{background:var(--inset)} .seg button:active{opacity:.7}
.seg button.on{background:var(--ink);color:var(--stone)}

<script>
"use strict";
/* ============================================================
   Discovery Records Manager (DRM)
   Compass (what you believe) -> Evidence (what customers said)
   -> Validate (which beliefs hold up), by focus area.
   Data lives as plain files in the founder's own repo folder.
   The founder's AI assistant reads and writes the same folder
   (see CLAUDE.md); this app is for entering and judging evidence.
   ============================================================ */

const TEMPLATE_URL = "https://github.com/Magiomakes/discovery-records-manager";
const SETUP_URL = TEMPLATE_URL + "/blob/main/SETUP.md";

const TIERS = ["Hair on Fire","Incremental Improvement","Nice to Have","Latent","Not a Problem"];
const TIER_CLASS = {"Hair on Fire":"tier-hof","Incremental Improvement":"tier-inc","Nice to Have":"tier-nth","Latent":"tier-lat","Not a Problem":"tier-nap"};
const TIER_DEF = {
  "Hair on Fire":"Already invested money or recurring time they can't get back, and the problem is still not solved.",
  "Incremental Improvement":"Actively trying to fix it, but the effort is reversible (tried a tool and dropped it, stopped when a free trial ended).",
  "Nice to Have":"Describes the problem clearly but has done nothing about it.",
  "Latent":"Has the problem but doesn't see it as a problem. A coaching flag, not a buying signal.",
  "Not a Problem":"No sign they have it."
};
const EVIDENCE_TYPES = ["Past behavior, irreversible","Past behavior, reversible","Current workaround","Frequency","Cost (time or money)","Strong language","Opinion or future intent"];
/* A quote is for the problem (shows it, or what they do about it) or against it (shows it's mild, rare, solved or not theirs). Older files have no stance: for. */
const STANCES = ["for","against"];
const stanceOf = e => e && e.stance === "against" ? "against" : "for";
const EVIDENCE_DEF = {
  "Past behavior, irreversible":"Money spent, recurring time, or a workaround they built and keep using.",
  "Past behavior, reversible":"Tried something and dropped it, abandoned free trials.",
  "Current workaround":"What they use today instead of a real solution.",
  "Frequency":"How often it happens, in their words.",
  "Cost (time or money)":"Hours, dollars or grades lost.",
  "Strong language":"How they talk about it. Supports a score, never decides it.",
  "Opinion or future intent":"\"I would\", \"I'd probably\", \"sounds useful\". Weak evidence."
};

function quoteRegex(q){
  const t = String(q||"").trim().replace(/^["“”']+|["“”']+$/g,"").trim();

class FolderStore {
  constructor(root){ this.root = root; this.kind = "folder"; this.name = root.name; this.stamps = null; }
  async dir(path, create=true){ let d = this.root; for (const p of path.split("/").filter(Boolean)) d = await d.getDirectoryHandle(p, {create}); return d; }
  async write(path, text){
    const parts = path.split("/"); const file = parts.pop();
    const d = await this.dir(parts.join("/"));
    const fh = await d.getFileHandle(file, {create:true});
    const w = await fh.createWritable(); await w.write(text); await w.close();
    if (this.stamps) this.stamps[path] = (await (await fh.getFile()).lastModified);
  }
  async read(path){
    try { const parts = path.split("/"); const file = parts.pop(); const d = await this.dir(parts.join("/"), false); const f = await (await d.getFileHandle(file)).getFile(); return await f.text(); }
    catch(e){ return null; }
  }
  async remove(path){ try { const parts = path.split("/"); const file = parts.pop(); const d = await this.dir(parts.join("/"), false); await d.removeEntry(file); delete (this.stamps||{})[path]; } catch(e){} }
  async isInitialized(){ return (await this.read("drm/config.json")) !== null; }
  async hasGit(){ try { await this.root.getDirectoryHandle(".git"); return true; } catch(e){ return false; } }
  async hasAiInstructions(){ return (await this.read("CLAUDE.md")) !== null; }
  async lastPush(){
    try {
      const g = await this.root.getDirectoryHandle(".git");
      const r = await (await (await g.getDirectoryHandle("refs")).getDirectoryHandle("remotes")).getDirectoryHandle("origin");
      for (const b of ["main","master"]) { try { const f = await (await r.getFileHandle(b)).getFile(); return f.lastModified; } catch(e){} }
    } catch(e){}
    return null;
  }
  /* Snapshot of every data file's modified time, so the app can notice when an AI assistant writes into the folder. */
  async scan(){
    const out = {};
    let drm; try { drm = await this.root.getDirectoryHandle("drm"); } catch(e){ return out; }
    for await (const [name, h] of drm.entries()){
      if (h.kind === "file"){ out["drm/" + name] = (await h.getFile()).lastModified; continue; }
      for await (const [n2, h2] of h.entries()) if (h2.kind === "file") out[`drm/${name}/${n2}`] = (await h2.getFile()).lastModified;
    }
    return out;
  }
  async loadAll(){
    const S = emptyState();
    S.config = JSON.parse(await this.read("drm/config.json") || "{}");
    S.persona = JSON.parse(await this.read("drm/persona.json") || "null") || S.persona;
    S.compass = {...emptyCompass(), ...(JSON.parse(await this.read("drm/compass.json") || "null") || {})};
    for (const [key, dir] of Object.entries(DIRS)){
      let d; try { d = await this.dir("drm/" + dir, false); } catch(e){ continue; }
      for await (const [name, h] of d.entries()){
        if (h.kind !== "file" || !name.endsWith(".json")) continue;
        try { const rec = JSON.parse(await (await h.getFile()).text()); if (rec && rec.id) S[key].push(rec); else S.unreadable.push(`drm/${dir}/${name}`); }
        catch(e){ S.unreadable.push(`drm/${dir}/${name}`); }
      }
    }
    try {
      const d = await this.dir("drm/transcripts", false);
      for await (const [name, h] of d.entries()) if (h.kind === "file" && name.endsWith(".md")) S.transcripts[name.slice(0,-3)] = await (await h.getFile()).text();
    } catch(e){}
    try {
      const d = await this.dir("drm/notes", false);
      for await (const [name, h] of d.entries()) if (h.kind === "file" && name.endsWith(".md")){ const f = await h.getFile(); S.notes.push({name, text: await f.text(), modified: f.lastModified}); }
    } catch(e){}
    S.notes.sort((a, b) => b.modified - a.modified);
    this.stamps = await this.scan();
    migrate(S);
    return S;
  }
}

/* Deterministic rubric check: does the cited evidence justify the tier? Same rule the AI is told to follow. */
function painCheck(p){
  const ev = (p.evidenceIds || []).map(id => byId(S.evidence, id)).filter(Boolean);
  const types = new Set(ev.map(e => e.type));
  const iv = byId(S.interviews, p.interviewId);
  const issues = [];
  if (!ev.length && p.tier && p.tier !== "Not a Problem") issues.push("No quotes cited. A tier needs evidence behind it.");
  const strongTiers = ["Hair on Fire","Incremental Improvement"];
  if (strongTiers.includes(p.tier) && iv && iv.recentInstance === "No") issues.push("They couldn't describe a specific, recent instance, so the ceiling is Nice to Have.");
  if (p.tier === "Hair on Fire" && !types.has("Past behavior, irreversible")) issues.push("Hair on Fire needs a quote showing irreversible investment (money spent, recurring time, a workaround they built and keep using).");
  if (p.tier === "Incremental Improvement" && !types.has("Past behavior, reversible") && !types.has("Current workaround") && !types.has("Past behavior, irreversible")) issues.push("Incremental Improvement needs a quote showing they tried something (reversible effort or a current workaround).");
  const onlyWeak = ev.length && [...types].every(t => ["Opinion or future intent","Strong language"].includes(t));
  if (onlyWeak && strongTiers.includes(p.tier)) issues.push("Every cited quote is opinion or language. Those support a score; they can't decide one.");
  const against = ev.filter(e => stanceOf(e) === "against").length;
  if (against && strongTiers.includes(p.tier)) issues.push(`${against} cited quote${against > 1 ? "s say" : " says"} the problem is mild, rare or solved. That lowers a tier; it can't justify a strong one.`);
  const unconfirmed = ev.filter(e => e.status !== "Confirmed").length;

function matchLabel(v, list){
  const t = String(v||"").trim().toLowerCase();
  return list.find(x => x.toLowerCase() === t) || list.find(x => t && (x.toLowerCase().startsWith(t) || t.startsWith(x.toLowerCase()))) || null;
}
const YN = v => { const t = String(v||"").trim().toLowerCase(); return t.startsWith("y") ? "Yes" : t.startsWith("n") ? "No" : ""; };

function parseRubric(text){
  const out = {hygiene:null, evidence:[], pains:[], skipped:[]};
  for (let raw of String(text||"").split(/\r?\n/)){
    let line = raw.trim();
    if (!line.includes("|") || line.startsWith("```")) continue;
    if (/^\|?[\s:\-|]+\|?$/.test(line)) continue;            // markdown table separator
    if (line.startsWith("|")) line = line.slice(1);
    if (line.endsWith("|")) line = line.slice(0, -1);
    let parts = line.split("|").map(s => s.trim());
    const head = parts[0].toLowerCase();
    if (/^(evidence id|interview id|specific recent)/.test(head)) continue;   // header rows
    if (/^-\s*evidence type/i.test(line) || line.startsWith("- ")) continue;   // stray instruction lines
    if (parts.length === 5 && YN(parts[0]) && !isNaN(parseInt(parts[1]))){
      out.hygiene = {recentInstance:YN(parts[0]), leading:parseInt(parts[1]), pitched:YN(parts[2]), demoed:YN(parts[3]), closing:YN(parts[4])};
    } else if (parts.length === 6 && matchLabel(parts[2], TIERS)){
      out.pains.push({aiInterview:parts[0], problemRef:parts[1], tier:matchLabel(parts[2], TIERS), evidenceIds:parts[3].split(/[,;\s]+/).filter(Boolean)});
    } else if (parts.length >= 9){
      const hasStance = parts.length >= 10 && STANCES.includes(String(parts[parts.length - 3]).trim().toLowerCase());   // replies to the older prompt have no stance column
      const tail = parts.slice(hasStance ? -5 : -4); const quote = parts.slice(4, parts.length - tail.length).join("/");
      out.evidence.push({aiId:parts[0], problemRef:parts[2], jobRef:parts[3], quote:quote.replace(/^["“]|["”]$/g,"").trim(), where:tail[0], typeRaw:tail[1], type:matchLabel(tail[1], EVIDENCE_TYPES), stance:hasStance ? tail[2].trim().toLowerCase() : "for"});
    } else out.skipped.push(raw);
  }
  return out;
}

function planImport(iv, parsed){
  // Work out IDs, new problems and verbatim checks before anything is saved.
  const transcript = S.transcripts[iv.id] || "";
  const newProblems = []; const problemMap = {};
  let prList = [...S.problems];
  function resolveProblem(ref){
    const r = String(ref||"").trim(); if (!r) return "";
    if (problemMap[r] !== undefined) return problemMap[r];
    if (byId(S.problems, r)) return problemMap[r] = r;
    const m = r.match(/^NEW\s*:?\s*(.+)$/i);
    const text = m ? m[1].trim() : r;
    const same = prList.find(p => p.text.toLowerCase() === text.toLowerCase());
    if (same) return problemMap[r] = same.id;
    const id = nextId("PR-", prList, 2); const p = {id, text, who:""}; prList.push(p); newProblems.push(p);
    return problemMap[r] = id;
  }
  const idMap = {}; let evList = [...S.evidence];
  const evidence = parsed.evidence.map(e => {
    let id = e.aiId && /^[A-Za-z0-9_-]+$/.test(e.aiId) && e.aiId.startsWith(iv.id) && !byId(evList, e.aiId) ? e.aiId : null;
    if (!id) id = nextId(iv.id + "-Q", evList.filter(x => x.id.startsWith(iv.id + "-Q")), 2);
    idMap[e.aiId] = id;
    const rec = {id, interviewId:iv.id, problemId:resolveProblem(e.problemRef), jobId:byId(S.jobs, e.jobRef) ? e.jobRef : "", quote:e.quote, where:e.where, type:e.type || "", stance:e.stance || "for", foundBy:"Claude Code", status:"Candidate", note: e.type ? "" : `AI type: ${e.typeRaw}`};
    evList.push(rec);
    rec._verbatim = !!findInTranscript(rec.quote, transcript);
    return rec;
  });
  const pains = parsed.pains.map(p => {
    const problemId = resolveProblem(p.problemRef);
    const id = `${iv.id}__${problemId}`;
    const existing = byId(S.pains, id);
    return {id, interviewId:iv.id, problemId, tier:p.tier, evidenceIds:p.evidenceIds.map(x => idMap[x] || x), scoredBy:"Claude Code", status:"Candidate", disagree:"", _skip: existing && existing.status === "Confirmed"};
  });
  return {hygiene:parsed.hygiene, evidence, pains, newProblems, skipped:parsed.skipped};
}

function applyImport(iv, plan, raw){
  for (const p of plan.newProblems) upsert("problems", {...p});
  for (const e of plan.evidence){ const r = {...e}; delete r._verbatim; upsert("evidence", r); }
  for (const p of plan.pains){ if (p._skip) continue; const r = {...p}; delete r._skip; upsert("pains", r); }
  const updated = {...iv, rubricRun:true, rubricRaw:raw};
  if (plan.hygiene) Object.assign(updated, plan.hygiene);
  upsert("interviews", updated);
}

/* Minimal markdown rendering for the in-app report preview */
function renderMd(md){
  const lines = md.split("\n"); let html = "", inTable = false, inList = false;
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/_(.+?)_/g,"<i>$1</i>").replace(/\[(.+?)\]\((.+?)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  for (const l of lines){
    if (l.startsWith("|")){
      if (/^\|[-| ]+\|$/.test(l)) continue;
      const cells = l.slice(1, -1).split("|").map(c => c.trim());
      if (!inTable){ html += "<table><tr>" + cells.map(c => `<th>${inline(c)}</th>`).join("") + "</tr>"; inTable = true; }
      else html += "<tr>" + cells.map(c => `<td>${inline(c)}</td>`).join("") + "</tr>";
      continue;
    } else if (inTable){ html += "</table>"; inTable = false; }
    if (l.startsWith("- ")){ if (!inList){ html += "<ul>"; inList = true; } html += `<li>${inline(l.slice(2))}</li>`; continue; }
    else if (inList){ html += "</ul>"; inList = false; }
    if (l.startsWith("### ")) html += `<h3>${inline(l.slice(4))}</h3>`;
    else if (l.startsWith("## ")) html += `<h2>${inline(l.slice(3))}</h2>`;
    else if (l.startsWith("# ")) html += `<h1>${inline(l.slice(2))}</h1>`;
    else if (l.startsWith("> ")) html += `<blockquote>${inline(l.slice(2))}</blockquote>`;
    else if (l === "---") html += "<hr>";
    else if (l.trim()) html += `<p>${inline(l)}</p>`;
  }
  if (inTable) html += "</table>"; if (inList) html += "</ul>";
  return html;
}

  "problem":        {label:"Problem",              short:"P",  area:"problem",      test:"confirmed pain scores on this problem"},
  "customers":      {label:"Customers",            short:"C",  area:"customers",    test:"confirmed pain scores from this segment"},
  "early-adopters": {label:"Early adopters",       short:"EA", area:"customers",    test:"pain in this segment compared with the others"},
  "solution":       {label:"Solution",             short:"S",  area:"solution",     test:"confirmed quotes you tag as for or against"},

    if (e.status === "Rejected") continue;
    const t = S.transcripts[e.interviewId];
    if (t && !findInTranscript(e.quote, t)) push(e.status === "Confirmed" ? "bad" : "warn", e.id, "interviews/" + e.interviewId, `${e.status === "Candidate" ? "Suggested" : e.status} quote isn't in the transcript word for word.`);
    if (!e.type) push("warn", e.id, "interviews/" + e.interviewId, "Quote has no evidence type.");
    if (e.status === "Confirmed" && e.type === "Opinion or future intent") push("info", e.id, "interviews/" + e.interviewId, "Confirmed quote is only opinion or future intent. It can't carry a pain score.");
  }
  for (const p of S.pains){
    if (p.status === "Rejected") continue;
    const c = painCheck(p); for (const i of c.issues) push(p.status === "Confirmed" ? "bad" : "warn", p.id, "interviews/" + p.interviewId, i);
  }
  for (const a of S.assumptions){
    if (a.status === "Retired") continue;
    const b = aiBasis(a);
    if (b.kind === "missing") push("bad", a.id, "compass/map/" + a.id, "AI cites quotes that don't exist in this folder.");
    if (b.kind === "guess") push("info", a.id, "compass/map/" + a.id, "AI rated this with no evidence. Treat it as a second opinion, not a finding.");
    if (b.kind !== "none" && !a.aiAgainst) push("info", a.id, "compass/map/" + a.id, "AI rated this without a case against it. Ask it to poke holes.");
    if (a.status === "Active" && !assumptionPriority(a)) push("info", a.id, "compass/map/" + a.id, "Not placed in the grid yet, so it has no priority.");
  }
  for (const l of S.leads || []){
    if (!["Candidate","Accepted","Dismissed"].includes(l.status)) push("bad", l.id, "compass/leads", `Lead has a bad status "${l.status}".`);
    if (l.status === "Dismissed") continue;
    if (!l.name && !l.role) push("warn", l.id, "compass/leads", "Lead has no name and no role description.");
    if (!l.why) push("warn", l.id, "compass/leads", "Lead has no `why`: say which interview or quote it resembles, or that it's a guess.");
    const b = placeBasis(l);
    if (b.kind === "missing") push("bad", l.id, "compass/leads", "Lead cites quotes that don't exist in this folder.");
    if (b.kind === "guess") push("info", l.id, "compass/leads", "Lead has no quote behind it. Allowed, but it's a guess from the segment description.");
    if (l.url && !/^https?:\/\//.test(l.url)) push("warn", l.id, "compass/leads", "Lead url should be a full http(s) address the AI actually opened, or empty.");
    if (l.customerId && !byId(S.compass.customers || [], l.customerId)) push("warn", l.id, "compass/leads", `Lead customerId ${l.customerId} isn't a segment on the canvas.`);
    if (l.placeId && !byId(S.places, l.placeId)) push("warn", l.id, "compass/leads", `Lead placeId ${l.placeId} doesn't exist.`);
  }
  for (const pv of S.pivots || []){
    if (!["Candidate","Active","Retired"].includes(pv.status)) push("bad", pv.id, "compass/map", `Pivot has a bad status "${pv.status}".`);
    if (pv.status === "Retired") continue;
    const trig = (pv.triggerAssumptionIds || []).filter(Boolean); const href = "compass/map/" + (trig[0] || "");
    if (!PIVOT_KINDS[pv.kind]) push("warn", pv.id, href, `Pivot kind "${pv.kind}" isn't one of ${Object.keys(PIVOT_KINDS).join(", ")}.`);
    if (!(pv.text || "").trim()) push("bad", pv.id, href, "Pivot has no text.");
    if (!trig.length) push("bad", pv.id, href, "Pivot names no trigger assumption.");
    for (const id of trig){ const t = byId(S.assumptions, id); if (!t) push("bad", pv.id, href, `Trigger ${id} doesn't exist.`); else if (t.status === "Retired") push("warn", pv.id, href, `Trigger ${id} is retired.`); }
    const ids = (pv.evidenceIds || []).filter(Boolean); const found = ids.map(id => byId(S.evidence, id));
    const missing = ids.filter((id, i) => !found[i]); if (missing.length) push("bad", pv.id, href, "Pivot cites quotes that don't exist: " + missing.join(", ") + ".");
    if (!ids.length) push("warn", pv.id, href, "Pivot cites no quotes. A pivot with no quotes behind it is a guess; say so in why.");
    else if (found.filter(Boolean).length && found.filter(Boolean).every(e => e.type === "Opinion or future intent")) push("warn", pv.id, href, "Every quote behind this pivot is opinion or future intent. Never propose a pivot from opinion alone.");
    const g = pivotGate(pv); if (!g.open && trig.length && trig.every(id => byId(S.assumptions, id))) push("info", pv.id, href, g.why + ". It isn't counted until the evidence turns.");
  }
  for (const iv of S.interviews){
    if (iv.placeId && !byId(S.places, iv.placeId)) push("warn", iv.id, "interviews/" + iv.id, `placeId ${iv.placeId} doesn't exist.`);
    if (!iv.customerId && S.compass.customers.length) push("info", iv.id, "interviews/" + iv.id, "No customer segment set, so it can't count toward the early-adopter bet.");
    if (!S.transcripts[iv.id]) push("warn", iv.id, "interviews/" + iv.id, "No transcript saved.");
  }
  for (const f of S.unreadable || []) push("bad", f, "home", "File couldn't be read and was skipped.");
  return out;
}

/* ---------------- sheet building blocks ---------------- */
function wordmark(){ return `<div class="wordmark"><b>${esc(S.config.program || "Ideas Lab")}</b><span>${esc(S.config.programSub || "LaunchPad")}</span></div>`; }
function sheetHead(num, title, mins, extra){
  const m = S.compass.meta || {};
  return `<div class="spread" style="align-items:flex-end"><div><div class="tool">Tool ${num}${mins ? " · " + mins + " min" : ""}</div><h1>${esc(title)}</h1></div>${wordmark()}</div>

}
/* Every other page is a working document too: same header, same rule. title may carry HTML. */
function docHead(section, title, lede, right, crumbs){

}
function sheetFoot(num){ const c = S.config; return `<div class="foot"><span>${esc(c.program || "Ideas Lab")} · ${esc(c.cohort || "")}${c.cohort ? " · " : ""}${esc(c.programSub || "LaunchPad")}, Institute for Innovation and Entrepreneurship, Mount Royal University</span><span>${num ? "Week 1 Toolkit · " + num : "Discovery Records Manager"}</span></div>`; }
const ed = (act, attrs, val, ph, cls) => `<div class="ed ${cls||""}" contenteditable="plaintext-only" data-act="${act}" ${attrs} data-ph="${esc(ph)}">${esc(val||"")}</div>`;
function compassNav(cur){
  const steps = [["canvas","01 Leaner Canvas"],["value","02 Value Proposition"],["problem","03 Problem Statement"],["map","04 Assumptions Map"],["leads","05 Leads List"]];
  return `<div class="tabs" style="margin-top:0">${steps.map(([k, l]) => `<button class="${cur === k ? "on" : ""}" data-act="go" data-href="compass/${k}">${l}</button>`).join("")}</div>`;
}
function compassView(step){
  step = step || "canvas";
  if (step === "map") return mapView();
  const views = {canvas:canvasSheet, value:valueSheet, problem:problemSheet, leads:leadsSheet};
  return compassNav(step) + (views[step] || canvasSheet)();
}
const stepNav = (back, backLabel, next, nextLabel) => `<div class="row" style="justify-content:space-between;max-width:1120px;margin:0 auto">${back ? `<a class="btn" href="#/${back}">${backLabel}</a>` : "<span></span>"}${next ? `<a class="btn pri" href="#/${next}">${nextLabel}</a>` : ""}</div>`;

/* The canvas's editable lines. The Leaner Canvas and the first sitting (#/start) draw the same lines on the same records. */
const numberedN = (i) => `<span class="n">${i + 1}.</span>`;
const canvasLines = (items, render, addKind, addLabel) => `<div class="lines">${items.map((it, i) => render(it, i)).join("")}</div><button class="add" data-act="cAdd" data-kind="${addKind}">+ ${addLabel}</button>`;

}
function solutionLines(showProblem){

/* The two ad-libs, as fill-in-the-blank lines plus the sentence read back. */
function statementBlanks(stmt, parts, readback){

}
/* "Use" rows that pull the value proposition's parts from the canvas. */
function valuePropUses(){
  const ideal = idealCustomer(); const pr = sortById([...S.problems])[0]; const alts = S.compass.alternatives || [];

/* 04 Assumptions Map: the whole screen is the canvas. Left click adds a point, drag a point to rate it,
   drag its label to tidy up, right-drag to pan, scroll to zoom. The grid's edge is as far as a point goes. */
const statusDot = s => s === "Holding up" ? "ok" : s === "Shaky" ? "warn" : s === "Contradicted" ? "bad" : "none";
const LABEL_DEFAULT = {dx:18, dy:0};
function labelOf(a){ const l = a.label && typeof a.label === "object" ? a.label : LABEL_DEFAULT; return {dx:Number(l.dx) || 0, dy:Number(l.dy) || 0}; }
function pointHtml(x, w, extra){
  const a = x.a; const sel = ui.selNote === a.id; const l = labelOf(a); const k = ASSUMPTION_KINDS[a.kind] || {short:"?"};
  const piv = pivotTriggerIds().has(a.id);
  return `<div class="pt ${extra || ""} ${sel ? "sel" : ""} ${a.status === "Candidate" ? "cand" : ""} ${piv ? "piv" : ""}" data-pt="${esc(a.id)}" style="left:${w.x}px;top:${w.y}px"><span class="dotp s-${statusDot(x.s.status)}"></span></div>
  <div class="lbx ${sel ? "sel" : ""} ${a.status === "Candidate" ? "cand" : ""}" data-lab="${esc(a.id)}" data-act="aText" data-id="${esc(a.id)}" contenteditable="plaintext-only" data-ph="Type the assumption" data-k="${esc(k.short)}" style="left:${w.x + l.dx}px;top:${w.y + l.dy}px">${esc(a.text)}</div>`;
}
function mapView(){
  const r = compassReadout(); const ranked = rankedAssumptions();
  const active = ranked.filter(x => x.a.status === "Active"), cands = ranked.filter(x => x.a.status === "Candidate");
  const placed = active.filter(x => inGrid(x.a.pos));
  const shelf = active.filter(x => !inGrid(x.a.pos)).concat(cands);
  const sel = ui.selNote ? byId(S.assumptions, ui.selNote) : null;
  const h = MAP.size / 2;
  const ai = active.filter(x => x.a.aiImpact && x.a.aiConfidence).map(x => ({x, w:worldOf({x:(Number(x.a.aiConfidence) - 1) / 4, y:(Number(x.a.aiImpact) - 1) / 4})}));
  const lab = (x, y, cls, text) => `<div class="wlab ${cls || ""}" style="left:${x}px;top:${y}px"><span>${text}</span></div>`;
  const worldPos = x => inGrid(x.a.pos) ? worldOf(x.a.pos) : shelfWorld(shelf.indexOf(x));
  const leaders = active.concat(cands).map(x => { const w = worldPos(x); const l = labelOf(x.a); return `<line x1="${w.x}" y1="${w.y}" x2="${w.x + l.dx}" y2="${w.y + l.dy}" stroke="#c9c9c4" stroke-width="1.2"/>`; }).join("");
  const steps = [["canvas","01 Leaner Canvas"],["value","02 Value Proposition"],["problem","03 Problem Statement"],["map","04 Assumptions Map"],["leads","05 Leads List"]];
  const counts = ["Holding up","Shaky","Untested","Contradicted"].map(k => `<span class="cnt" title="${k === "Untested" ? "No evidence yet" : k}"><i class="dotp s-${statusDot(k)}"></i>${r.counts[k]}</span>`).join("");
  return `<div class="mapfull">
    <div class="tabstrip"><div class="tabs" style="margin:0;border:none">${steps.map(([k, l]) => `<button class="${k === "map" ? "on" : ""}" data-act="go" data-href="compass/${k}">${l}</button>`).join("")}</div>
      <div class="row" style="gap:6px"><span class="counts">${counts}</span>
        <button class="btn sm" data-act="seedAssumptions" title="Make a point for each item on your canvas">${S.assumptions.length ? "Points from canvas" : "Make points from my canvas"}</button>
        <button class="btn sm ${ui.mapShelf ? "pri" : ""}" data-act="toggleShelf" title="My riskiest assumption, how I'll get evidence, ask your AI">Notes</button>
        <button class="btn sm" data-act="toggleFull" title="${ui.mapFull ? "Show the sidebar" : "Hide the sidebar"}">${ui.mapFull ? "⤡" : "⤢"}</button></div></div>
    <div class="mapband"><div><div class="lab">Posture · ${active.length} active point${active.length === 1 ? "" : "s"}</div><h1 class="verdict sm">${esc(r.verdict)}</h1></div>${postureGauge(r, false)}</div>
    <div class="vp full" id="vp">
      <div class="world" id="world">
        <div class="bounds" style="left:${WORLD.x0}px;top:${WORLD.y0}px;width:${WORLD.x1 - WORLD.x0}px;height:${WORLD.y1 - WORLD.y0}px"></div>
        <div class="quad" style="left:${-h}px;top:${-h}px;width:${h}px;height:${h}px"></div>
        <div class="region grid" style="left:${-h}px;top:${-h}px;width:${MAP.size}px;height:${MAP.size}px"></div>
        <div class="axis h" style="left:${-h}px;top:-1px;width:${MAP.size}px"></div><div class="axis v" style="top:${-h}px;left:-1px;height:${MAP.size}px"></div>
        ${lab(-h + 10, -h + 14, "", "↑ Catastrophic if wrong")}${lab(-h + 10, h - 32, "", "↓ Inconvenient if wrong")}${lab(-h + 10, h - 14, "l", "← Likely wrong")}${lab(h - 10, h - 14, "r", "Likely right →")}
        ${lab(-h + 14, -h + 28, "risk", "Riskiest<small>test these first</small>")}
        <div class="region shelf" style="left:${-h}px;top:${MAP.shelfTop}px;width:${MAP.size}px;height:${Math.max(MAP.shelfH, 76 + Math.ceil(shelf.length / 4) * 36)}px"></div>
        ${lab(-h + 14, MAP.shelfTop + 6, "shelf", shelf.length ? "Not rated yet · drag into the grid" : "Nothing waiting · click anywhere to add a point")}
        <svg class="links">${leaders}${ai.filter(g => inGrid(g.x.a.pos)).map(g => { const w = worldOf(g.x.a.pos); return `<line x1="${w.x}" y1="${w.y}" x2="${g.w.x}" y2="${g.w.y}" stroke="#8c8c88" stroke-dasharray="4 3" stroke-width="1.2"/>`; }).join("")}</svg>
        ${ai.map(g => `<div class="pt ai ${ui.selNote === g.x.a.id ? "sel" : ""}" style="left:${g.w.x}px;top:${g.w.y}px"><span class="dotp"></span><span class="lbl">AI</span></div>`).join("")}
        ${shelf.map((x, i) => pointHtml(x, shelfWorld(i), "parked")).join("")}
        ${placed.map(x => pointHtml(x, worldOf(x.a.pos))).join("")}
      </div>
      <div class="hud"><button class="btn" data-act="mapZoom" data-val="out" title="Zoom out">−</button><button class="btn" data-act="mapZoom" data-val="in" title="Zoom in">+</button><button class="btn" data-act="mapZoom" data-val="fit">Fit</button></div>
      <div class="legend"><span><i style="background:var(--ink)"></i>Holding up</span><span><i style="background:linear-gradient(90deg,var(--ink) 50%,transparent 50%)"></i>Shaky</span><span><i style="background:var(--hatch)"></i>Contradicted</span><span><i></i>No evidence yet</span><span><i style="border-style:dashed;border-color:var(--grey)"></i>AI's placement</span><span><i style="box-shadow:0 0 0 2px var(--stone),0 0 0 3px var(--grey);margin-left:3px;margin-right:8px"></i>Pivot in play</span></div>
      <div class="hint2">Click to add a point · drag a point to rate it · drag its label to tidy · right-drag to pan · scroll to zoom</div>
      ${sel ? selCard(sel) + youPanel(sel) + aiPanel(sel) : ""}
      ${ui.mapShelf && !sel ? notesShelf(r) : ""}
    </div>
  </div>`;
}
/* Pop-out shelf: the toolkit's two boxes and the AI ask, off the canvas until wanted. */
function notesShelf(r){
  return `<div class="ov shelfpanel"><div class="spread"><h4 style="margin:0">Notes</h4><button class="btn icon" data-act="toggleShelf" title="Close">✕</button></div>
    <div class="notice ${r.cls === "ok" ? "ok" : r.cls === "bad" ? "bad" : r.cls === "gray" ? "plain" : "warn"}" style="margin:10px 0 14px"><b>${esc(r.verdict)}</b></div>
    <div class="sidebox"><h4>My riskiest assumption</h4>${ed("cField", `data-field="riskiest"`, S.compass.riskiest, "Type here")}${r.riskiestOpen && !S.compass.riskiest ? `<button class="btn link small" data-act="cSet" data-field="riskiest" data-val="${esc(r.riskiestOpen.a.text)}">Use the top of the map: ${esc(r.riskiestOpen.a.id)}</button>` : ""}</div>
    <div class="sidebox"><h4>How I'll get evidence this week</h4>${ed("cField", `data-field="evidencePlan"`, S.compass.evidencePlan, "Type here")}</div>
    <div class="sidebox"><h4>Ask your AI</h4><div class="small">Say <span class="kbd">Diagnose my snapshot</span>. It rates every point, says what evidence that rests on, lists what's stated but untestable, proposes the assumptions hiding in your canvas, and names the two interviews to run first.</div><button class="btn sm" style="margin-top:6px" data-act="copyText" data-text="Diagnose my snapshot">Copy</button></div>

/* The selected point: what the evidence says. Neither yours nor the AI's: the data's. Floats at the top of the canvas. */
function selCard(a){
  const x = {a, p:assumptionPriority(a), s:assumptionStatus(a)}; const k = ASSUMPTION_KINDS[a.kind] || {label:a.kind, test:""};

  const tagged = (a.evidence || []).map(t => ({...t, e:byId(S.evidence, t.id)})).filter(t => t.e);
  const confirmedQuotes = S.evidence.filter(e => e.status === "Confirmed");
  const where = x.p ? `<span class="chip gray">Priority ${x.p}</span>` : `<span class="chip warn">Not rated yet</span>`;
  return `<div class="ov ov-t selbar">
    <div class="spread"><div class="row" style="gap:6px"><span class="mono muted">${esc(a.id)}</span><span class="chip blue">${esc(k.label)}</span>${where}${a.status === "Candidate" ? `<span class="ai">Suggested by ${esc(a.foundBy || "AI")}</span>` : ""}</div>
      <div class="row">${a.status === "Candidate" ? `<button class="btn sm" data-act="aStatus" data-id="${esc(a.id)}" data-val="Retired">Dismiss</button><button class="btn pri sm" data-act="aStatus" data-id="${esc(a.id)}" data-val="Active">Accept</button>` : ""}<button class="btn icon" data-act="closeNote" title="Close (Esc)">✕</button></div></div>
    <div class="notice ${x.s.status === "Holding up" ? "ok" : x.s.status === "Contradicted" ? "bad" : x.s.status === "Shaky" ? "warn" : "plain"}" style="margin-top:8px"><b>${esc(x.s.status === "Untested" ? "No evidence yet" : x.s.status)}.</b> ${esc(x.s.why)}. <span class="muted">Read from ${esc(k.test)}.</span> ${link}</div>
    ${taggable ? `<details class="fold" style="margin-top:8px;padding:6px 12px"><summary>Quotes for and against (${tagged.length})</summary>
      ${tagged.map(t => `<div class="q compact s-${esc(t.e.status)}" style="margin:8px 0 6px"><div class="spread"><span class="words">${esc(t.e.quote)}</span><div class="row"><span class="seg"><button class="${t.stance === "supports" ? "on" : ""}" data-act="aStance" data-id="${esc(a.id)}" data-eid="${esc(t.id)}" data-val="supports">For</button><button class="${t.stance === "contradicts" ? "on" : ""}" data-act="aStance" data-id="${esc(a.id)}" data-eid="${esc(t.id)}" data-val="contradicts">Against</button></span><button class="btn icon no" title="Untag" data-act="aUntag" data-id="${esc(a.id)}" data-eid="${esc(t.id)}">✕</button></div></div><div class="meta"><a href="#/interviews/${esc(t.e.interviewId)}">${esc(t.e.interviewId)}</a>${t.e.status !== "Confirmed" ? statusChip(t.e.status) : ""}</div></div>`).join("")}
      <select data-act="aTag" data-id="${esc(a.id)}" style="max-width:100%;margin-top:6px"><option value="">Tag a confirmed quote…</option>${confirmedQuotes.filter(e => !(a.evidence||[]).some(t => t.id === e.id)).map(e => opt(e.id, "", `${e.id}: ${e.quote.slice(0, 90)}`)).join("")}</select></details>` : ""}

/* One pivot: the move, what it rests on, and whether the evidence has opened the gate. Shown on the selected point and on the Insights page for its area. */
function pivotCard(x, opts = {}){
  const pv = x.pv, g = x.g; const k = PIVOT_KINDS[pv.kind] || {label:pv.kind || "?", meaning:""};
  const ids = (pv.evidenceIds || []).filter(Boolean);
  const trig = (pv.triggerAssumptionIds || []).filter(Boolean);
  const quotes = ids.map(id => { const e = byId(S.evidence, id); return e ? `<div class="q compact s-${esc(e.status)}" style="margin:0 0 6px;padding:8px 10px 6px 12px"><span class="words" style="font-size:13.5px">${esc(e.quote)}</span><div class="meta"><a href="#/interviews/${esc(e.interviewId)}">${esc(e.interviewId)}</a>${e.status !== "Confirmed" ? statusChip(e.status) : ""}</div></div>` : `<span class="chip bad">${esc(id)} not found</span>`; }).join("");
  return `<div class="tile" style="margin:0 0 8px">
    <div class="spread"><div class="row" style="gap:6px"><span class="mono muted">${esc(pv.id)}</span><span class="chip blue" title="${esc(k.meaning)}">${esc(k.label)}</span>${g.open ? `<span class="chip bad">In play</span>` : `<span class="chip gray">Not in play</span>`}${pv.status === "Candidate" ? `<span class="ai">Suggested by ${esc(pv.foundBy || "AI")}</span>` : ""}</div>
      ${pv.status === "Candidate" ? `<div class="row"><button class="btn sm" data-act="pivotStatus" data-id="${esc(pv.id)}" data-val="Retired">Dismiss</button><button class="btn pri sm" data-act="pivotStatus" data-id="${esc(pv.id)}" data-val="Active">Accept</button></div>` : pv.status === "Active" ? `<button class="btn sm" data-act="pivotStatus" data-id="${esc(pv.id)}" data-val="Retired">Retire</button>` : ""}</div>

    <div class="h" style="margin-top:4px">${esc(k.meaning)}. ${esc(g.why)}.${opts.showTriggers !== false && trig.length ? ` If wrong: ${trig.map(id => `<a href="#/compass/map/${esc(id)}" class="mono">${esc(id)}</a>`).join(", ")}.` : ""}</div>

}
function pivotsSection(a, s){

function scale5(name, id, val){ return `<span class="seg you">${[1,2,3,4,5].map(n => `<button class="${String(val) === String(n) ? "on" : ""}" data-act="aScale" data-id="${esc(id)}" data-field="${name}" data-val="${n}">${n}</button>`).join("")}</span>`; }
function bar5(val, cls){ const v = Number(val) || 0; return `<div class="rate">${[1,2,3,4,5].map(n => `<i class="${n <= v ? cls : ""}"></i>`).join("")}</div>`; }

/* ---------------- the first sitting (#/start): the five sheets' questions in order, on the same records ---------------- */

}

/* ---------------- Insights: one page per focus area ---------------- */

/* Kept for the older tile layout; the bets table (betsTable) replaced it on every page. Status is a glyph, never a colour. */
const statusColor = s => s === "Untested" ? "var(--grey)" : "var(--ink)";

      ${transcript ? `${sep}${opts.inInterview ? `<button class="btn link small" data-act="jump" data-id="${esc(e.id)}">Find in transcript</button>` : `<button class="btn link small" data-act="openDrawer" data-id="${esc(e.id)}">Read in transcript</button>`}` : ""}

      <select class="inline" data-act="evField" data-id="${esc(e.id)}" data-field="problemId"><option value="">No problem</option>${S.problems.map(p => opt(p.id, e.problemId, p.id + ": " + p.text.slice(0, 40))).join("")}</select>

    ${p.scoredBy === "Founder" || p.disagree ? `<div class="small muted" style="margin-top:6px">Why you set this tier: <span contenteditable="plaintext-only" data-act="painDisagree" data-id="${esc(p.id)}" data-ph="optional" style="display:inline-block;min-width:160px">${esc(p.disagree||"")}</span></div>` : ""}

function highlight(text, quotes, focusId, near){
  const ranges = [];
  for (const e of quotes){ if (e.status === "Rejected" && e.id !== focusId) continue; const r = findInTranscript(e.quote, text); if (r) ranges.push({...r, e}); }
  if (near) ranges.push(near);
  ranges.sort((a, b) => a.start - b.start);
  let out = "", pos = 0;
  for (const r of ranges){
    if (r.start < pos) continue;
    const inner = esc(text.slice(r.start, r.end));
    out += esc(text.slice(pos, r.start)) + (r.e ? `<mark class="s-${r.e.status}${r.e.id === focusId ? " focus-mark" : ""}" data-act="jump" data-id="${esc(r.e.id)}" id="m-${esc(r.e.id)}">${inner}</mark>` : `<span class="near" title="Around where the AI said this quote is">${inner}</span>`);
    pos = r.end;
  }
  return out + esc(text.slice(pos));
}
function nearRange(e, text){
  const w = String(e.where || "").trim(); if (w.length < 3 || !text) return null;
  const i = text.toLowerCase().indexOf(w.toLowerCase()); if (i < 0) return null;
  const start = text.lastIndexOf("\n", i) + 1; let end = text.indexOf("\n", i); if (end < 0) end = text.length;
  return {start, end};
}
function drawerView(){
  const e = byId(S.evidence, ui.drawer); if (!e) return "";
  const iv = byId(S.interviews, e.interviewId) || {id:e.interviewId}; const text = S.transcripts[e.interviewId] || "";
  const found = !!findInTranscript(e.quote, text); const near = found ? null : nearRange(e, text);
  const queue = S.evidence.filter(x => x.status === "Candidate").sort((a, b) => a.id.localeCompare(b.id, undefined, {numeric:true}));
  const next = queue.find(x => x.id !== e.id && x.id.localeCompare(e.id, undefined, {numeric:true}) > 0) || queue.find(x => x.id !== e.id);
  return `<div class="scrim" data-act="closeDrawer"></div><aside class="drawer" role="dialog" aria-label="Transcript">
    <div class="dh"><div class="spread"><div><b>${esc(iv.id)}</b> ${esc(iv.interviewee || "")}<div class="hint">${esc([iv.role, iv.date].filter(Boolean).join(", "))}</div></div>
      <div class="row">${next ? `<button class="btn sm" data-act="openDrawer" data-id="${esc(next.id)}">Next suggestion</button>` : ""}<a class="btn sm" href="#/interviews/${esc(iv.id)}">Open interview</a><button class="btn icon" data-act="closeDrawer" title="Close (Esc)">✕</button></div></div>
      <div style="margin-top:12px">${quoteCard(e, text, {inInterview:true})}</div>
      ${found ? "" : `<div class="notice bad">These exact words aren't in the transcript, so the AI may have changed them. ${near ? "The dashed line is where it said the quote came from." : "Read the transcript before confirming."}</div>`}
    </div>
    <div class="db"><div class="transcript">${text ? highlight(text, S.evidence.filter(x => x.interviewId === e.interviewId), e.id, near) : `<p class="empty">No transcript saved for this interview.</p>`}</div></div>
  </aside>`;
}

function nextStep(m){
  if (!S.problems.length || !idealCustomer()) return ["Get your snapshot down in one sitting: the problems you believe exist and who you'd bet has them.", "start", "Start"];
  if (!S.compass.valueProp.why) return ["Write your value proposition. It's the claim you'll have to earn.", "compass/value", "Write it"];
  if (!S.assumptions.length) return ["Turn your canvas into points and put them on the map.", "compass/map", "Open the map"];
  if (!S.assumptions.some(a => assumptionPriority(a))) return ["Drag your points into the grid. Top-left is what you test first.", "compass/map", "Open the map"];
  const c = compassReadout();
  if (c.riskiestOpen && !S.interviews.length) return [`Your riskiest untested assumption: ${c.riskiestOpen.a.text}. Interviews will test it.`, (S.compass.leads||[]).length ? "compass/leads" : "interviews", (S.compass.leads||[]).length ? "Pick a lead" : "Log an interview"];
  if (!S.interviews.length) return ["Log your first customer interview and paste the transcript.", "interviews", "Log an interview"];
  if (m.candidates) return [`Review ${m.candidates} suggestion${m.candidates>1?"s":""} from your AI. Only confirmed items count.`, "review", "Review now"];
  const noRubric = S.interviews.find(i => !i.rubricRun);
  if (noRubric) return [`${noRubric.id} hasn't been reviewed by your AI yet.`, "interviews/" + noRubric.id, "Open " + noRubric.id];
  const reviewed = S.interviews.filter(i => i.rubricRun).length, holes = S.notes.filter(n => /poke-holes/i.test(n.name)).length;
  if (reviewed >= 2 && holes < Math.floor(reviewed / 2)) return ["Two more interviews are in. Ask your AI to poke holes in your riskiest assumptions before the next ones.", "ask", "See how"];
  if (c.counts.Contradicted){
    const con = rankedAssumptions().filter(x => x.a.status === "Active" && x.s.status === "Contradicted");
    const bare = con.find(x => !pivotsFor(x.a.id).length);
    if (bare) return [`${bare.a.id} is contradicted. Ask your AI to poke holes: it proposes what you'd change.`, "ask", "See how"];
    return ["An assumption is contradicted and your AI has proposed a pivot. Accept or dismiss it on the map, then decide what changes on the canvas.", "compass/map/" + con[0].a.id, "Open the point"];
  }
  if (c.riskiestOpen) return [`Still untested: ${c.riskiestOpen.a.text}. Point the next interviews at it.`, "compass/map", "Open the map"];
  if (!S.persona.fields.who.text) return ["Start your customer persona, with a quote behind every line.", "persona", "Open persona"];
  return ["Keep interviewing. Each conversation should re-test an assumption, not just add new ideas.", "interviews", "Log an interview"];
}

    ["Diagnose my snapshot", "Rates every point on your map for impact and confidence and says which confirmed quotes it relied on (flagging any it rated with none), lists what's stated but untestable, proposes the assumptions hiding in your canvas (a buyer, a channel, a switching cost), and names the two interviews to run first."],
    ["Poke holes", "For your three riskiest assumptions: the strongest case each is wrong, from confirmed quotes only, the move you'd make if it is, and the one question that would settle it. When the evidence has turned on a bet (shaky or contradicted), it proposes a pivot you accept or dismiss on the map; otherwise it says how many interviews short the signal is. Run it after every two interviews."],
    ["Find where to interview next", "Reads every transcript for where these people gather, checks which places have already produced real pain, and suggests places to look, each with the quote it rests on."],
    ["Find leads", "Proposes people to talk to for your ideal segment and one other, with where to find them and the interview or quote each one resembles. You accept or dismiss each on the Leads List."],
    [`Research a segment ${(idealCustomer() || {}).id || "C-01"}`, "Who these people are, what they already use, where they gather and what they call the problem in their own words, every claim linked to a page it opened and dated. Swap in the segment id."],

function toast(msg, undo){
  ui.toast = {msg, undo};
  let t = document.getElementById("toast");
  if (!t){ t = document.createElement("div"); t.id = "toast"; t.className = "toast"; document.body.appendChild(t); }
  t.innerHTML = `<span>${esc(msg)}</span>${undo ? `<button data-act="undo">Undo</button>` : ""}`; t.style.display = "flex";
  clearTimeout(toast.t); toast.t = setTimeout(hideToast, 5000);
}
function hideToast(){ ui.toast = null; const t = document.getElementById("toast"); if (t) t.style.display = "none"; }

/* ---------------- the assumptions map: an infinite canvas ----------------
   ui.view = {x, y, k}: where the world sits in the viewport and how zoomed. Points live in world px.
   Dragging a point moves it and saves its rating; dragging the background pans; ctrl/cmd + wheel zooms. */
function mountMap(){
  const vp = document.getElementById("vp"); if (!vp) return;
  const w = vp.getBoundingClientRect().width;
  if (!ui.view) fitMap(vp); else if (ui.viewW && Math.abs(w - ui.viewW) > 2) ui.view.x += (w - ui.viewW) / 2;   // layout changed: keep the view centred
  ui.viewW = w; applyView();
  if (ui.focusLab){ const el = vp.querySelector(`.lbx[data-lab="${CSS.escape(ui.focusLab)}"]`); ui.focusLab = null; if (el){ el.focus(); const s = window.getSelection(), rg = document.createRange(); rg.selectNodeContents(el); rg.collapse(false); s.removeAllRanges(); s.addRange(rg); } }
}
function fitK(vp){ const r = vp.getBoundingClientRect(); const pad = 12; return Math.max(0.15, Math.min((r.width - pad * 2) / (WORLD.x1 - WORLD.x0), (r.height - pad * 2) / (WORLD.y1 - WORLD.y0))); }
function fitMap(vp){ const r = vp.getBoundingClientRect(); const k = fitK(vp); ui.view = {k, x:r.width / 2 - k * (WORLD.x0 + WORLD.x1) / 2, y:r.height / 2 - k * (WORLD.y0 + WORLD.y1) / 2}; }
/* The world has edges: you can't zoom out past the whole map, and you can't pan it off the screen. */
function clampView(vp){
  const v = ui.view; const r = vp.getBoundingClientRect(); const kmin = fitK(vp);
  if (v.k < kmin) v.k = kmin;
  const ww = (WORLD.x1 - WORLD.x0) * v.k, wh = (WORLD.y1 - WORLD.y0) * v.k;
  const minX = r.width - WORLD.x1 * v.k, maxX = -WORLD.x0 * v.k;      // world right edge at the viewport's right … world left edge at the viewport's left
  v.x = ww <= r.width ? (r.width - ww) / 2 - WORLD.x0 * v.k : Math.min(maxX, Math.max(minX, v.x));
  const minY = r.height - WORLD.y1 * v.k, maxY = -WORLD.y0 * v.k;
  v.y = wh <= r.height ? (r.height - wh) / 2 - WORLD.y0 * v.k : Math.min(maxY, Math.max(minY, v.y));
}
function applyView(){ const w = document.getElementById("world"), vp = document.getElementById("vp"); if (!w || !vp || !ui.view) return; clampView(vp); w.style.transform = `translate(${ui.view.x}px,${ui.view.y}px) scale(${ui.view.k})`; w.style.setProperty("--ik", 1 / ui.view.k); }
function zoomAt(cx, cy, f){ const v = ui.view; if (!v) return; const k2 = Math.min(4, v.k * f); const wx = (cx - v.x) / v.k, wy = (cy - v.y) / v.k; v.k = k2; v.x = cx - wx * k2; v.y = cy - wy * k2; applyView(); }
function worldAt(vp, clientX, clientY){ const r = vp.getBoundingClientRect(); const v = ui.view; return {x:(clientX - r.left - v.x) / v.k, y:(clientY - r.top - v.y) / v.k}; }
/* A point with nothing written on it disappears when you click away. */
function cleanupEmpty(id){ const a = id && byId(S.assumptions, id); if (a && a.status === "Active" && !a.seed && !(a.text || "").trim() && !a.aiImpact && !a.aiReason && !(a.evidence || []).length && !(a.note || "").trim()) removeRec("assumptions", a.id); }
function deselect(){ const prev = ui.selNote; ui.selNote = null; dropSub(); cleanupEmpty(prev); }
function selectPoint(id){ if (ui.selNote === id) return; const prev = ui.selNote; ui.selNote = id; dropSub(); cleanupEmpty(prev); }
let drag = null, dragLab = null, pan = null;
document.addEventListener("contextmenu", ev => { if (ev.target.closest && ev.target.closest("#vp")) ev.preventDefault(); });
document.addEventListener("pointerdown", ev => {
  const vp = ev.target.closest("#vp"); if (!vp || !ui.view) return;
  if (ev.target.closest(".hud,.legend,.hint2,.ov,button,select,input")) return;
  if (ev.button === 0){
    const pt = ev.target.closest(".pt[data-pt]");
    if (pt){ const a = byId(S.assumptions, pt.dataset.pt); if (!a) return;
      drag = {id:a.id, el:pt, lab:vp.querySelector(`.lbx[data-lab="${CSS.escape(a.id)}"]`), startX:ev.clientX, startY:ev.clientY, moved:false, locked:a.status === "Candidate", wx:parseFloat(pt.style.left), wy:parseFloat(pt.style.top)};
      pt.setPointerCapture(ev.pointerId); return; }
    const lab = ev.target.closest(".lbx[data-lab]");
    if (lab){ if (document.activeElement === lab) return;           // already editing: let the mouse select text
      ev.preventDefault();
      dragLab = {id:lab.dataset.lab, el:lab, startX:ev.clientX, startY:ev.clientY, moved:false, wx:parseFloat(lab.style.left), wy:parseFloat(lab.style.top)};
      lab.setPointerCapture(ev.pointerId); return; }
    if (ev.target.closest("[contenteditable]")) return;
  }
  if (ev.button > 2) return;
  ev.preventDefault();
  pan = {button:ev.button, startX:ev.clientX, startY:ev.clientY, vx:ui.view.x, vy:ui.view.y, moved:false, vp};
  vp.setPointerCapture(ev.pointerId);
});
document.addEventListener("pointermove", ev => {
  if (drag){
    const dx = ev.clientX - drag.startX, dy = ev.clientY - drag.startY;
    if (!drag.moved && Math.hypot(dx, dy) < 4) return;
    if (drag.locked) return;
    if (!drag.moved){ drag.moved = true; ui.dragging = true; drag.el.classList.add("dragging"); }
    const w0 = {x:drag.wx + dx / ui.view.k, y:drag.wy + dy / ui.view.k}; const raw = posOf(w0);
    drag.w = inGrid(raw) ? worldOf(clampPos(raw)) : clampWorld(w0);            // inside the grid the edge is the limit
    drag.el.style.left = drag.w.x + "px"; drag.el.style.top = drag.w.y + "px";
    if (drag.lab){ const l = labelOf(byId(S.assumptions, drag.id)); drag.lab.style.left = (drag.w.x + l.dx) + "px"; drag.lab.style.top = (drag.w.y + l.dy) + "px"; }
    return;
  }
  if (dragLab){
    const dx = ev.clientX - dragLab.startX, dy = ev.clientY - dragLab.startY;
    if (!dragLab.moved && Math.hypot(dx, dy) < 4) return;
    if (!dragLab.moved){ dragLab.moved = true; ui.dragging = true; dragLab.el.classList.add("dragging"); }
    dragLab.w = clampWorld({x:dragLab.wx + dx / ui.view.k, y:dragLab.wy + dy / ui.view.k});
    dragLab.el.style.left = dragLab.w.x + "px"; dragLab.el.style.top = dragLab.w.y + "px"; return;
  }
  if (pan){
    const dx = ev.clientX - pan.startX, dy = ev.clientY - pan.startY;
    if (!pan.moved && Math.hypot(dx, dy) < 4) return;
    if (!pan.moved){ pan.moved = true; ui.dragging = true; pan.vp.classList.add("panning"); }
    ui.view.x = pan.vx + dx; ui.view.y = pan.vy + dy; applyView();
  }
});
document.addEventListener("pointerup", ev => {
  if (drag){
    const d = drag; drag = null; ui.dragging = false;
    if (!d.moved){ selectPoint(d.id); render(); return; }
    const a = byId(S.assumptions, d.id); if (!a) return;
    const raw = posOf(d.w); const pos = inGrid(raw) ? clampPos(raw) : null;   // in the grid: rated; outside: back on the shelf
    upsert("assumptions", {...a, pos, ...(pos ? ratingOf(pos) : {impact:"", confidence:""})}); render(); return;
  }
  if (dragLab){
    const d = dragLab; dragLab = null; ui.dragging = false;
    const a = byId(S.assumptions, d.id); if (!a) return;
    if (!d.moved){ selectPoint(d.id); ui.focusLab = d.id; render(); return; }   // a click on the label: edit it
    const pt = document.querySelector(`#vp .pt[data-pt="${CSS.escape(d.id)}"]`); const px = parseFloat(pt.style.left), py = parseFloat(pt.style.top);
    upsert("assumptions", {...a, label:{dx:Math.round(d.w.x - px), dy:Math.round(d.w.y - py)}}); render(); return;
  }
  if (pan){
    const p = pan; pan = null; ui.dragging = false; p.vp.classList.remove("panning");
    if (p.moved || p.button !== 0) return;
    // a plain left click on empty canvas adds a point there
    const raw = posOf(clampWorld(worldAt(p.vp, ev.clientX, ev.clientY))); const pos = inGrid(raw) ? clampPos(raw) : null; const id = nextId("A-", S.assumptions, 2);
    const prev = ui.selNote; upsert("assumptions", {...blankAssumption(id), pos, ...(pos ? ratingOf(pos) : {})}); ui.selNote = id; dropSub(); cleanupEmpty(prev); ui.focusLab = id; render();
  }
});
document.addEventListener("wheel", ev => {
  const vp = ev.target.closest && ev.target.closest("#vp"); if (!vp || !ui.view) return;
  if (ev.target.closest(".ov")) return;                                          // panels scroll normally
  ev.preventDefault();
  const r = vp.getBoundingClientRect();
  zoomAt(ev.clientX - r.left, ev.clientY - r.top, Math.exp(-ev.deltaY * (ev.ctrlKey || ev.metaKey ? 0.01 : 0.0018)));
}, {passive:false});

/* ---------------- folder handling + watching for AI writes ---------------- */
let watchTimer = null;
function stopWatching(){ clearInterval(watchTimer); watchTimer = null; }
function startWatching(){
  stopWatching();
  if (!store || store.kind !== "folder") return;
  watchTimer = setInterval(checkFolder, 4000);
}
async function checkFolder(){
  if (!store || store.kind !== "folder" || document.hidden) return;
  const ae = document.activeElement; if (ae && (ae.tagName === "TEXTAREA" || ae.tagName === "INPUT" || ae.isContentEditable)) return;   // don't yank the page while typing
  if (ui.dragging) return;
  let now; try { now = await store.scan(); } catch(e){ return; }
  const before = store.stamps || {};
  const changed = Object.keys(now).filter(k => now[k] !== before[k]).concat(Object.keys(before).filter(k => !(k in now)));
  if (!changed.length) return;
  const beforeCand = S.evidence.filter(e => e.status === "Candidate").length + S.pains.filter(p => p.status === "Candidate").length;
  const beforeNotes = S.notes.length;
  S = await store.loadAll(); lastPush = await store.lastPush(); render();
  const cand = S.evidence.filter(e => e.status === "Candidate").length + S.pains.filter(p => p.status === "Candidate").length;
  if (cand > beforeCand) toast(`${cand - beforeCand} new suggestion${cand - beforeCand > 1 ? "s" : ""} from your AI. Review them when you're ready.`);
  else if (S.notes.length > beforeNotes) toast("Your AI wrote a new note.");
}
async function useRoot(root){
  store = new FolderStore(root); ui.view = null;
  await idb.set("root", root).catch(() => {});
  aiReady = await store.hasAiInstructions();
  if (!(await store.isInitialized())){ store.needsSetup = true; store.noGit = !(await store.hasGit()); render(); return; }
  S = await store.loadAll();
  lastPush = await store.lastPush();
  if (!location.hash || location.hash === "#") go("home");
  render(); scheduleReport(); startWatching();
}
async function openFolder(reopen){
  try {
    let root;
    if (reopen && ui.savedHandle){
      const h = ui.savedHandle;
      if ((await h.queryPermission({mode:"readwrite"})) !== "granted" && (await h.requestPermission({mode:"readwrite"})) !== "granted") return;
      root = h;
    } else root = await window.showDirectoryPicker({id:"drm", mode:"readwrite"});
    await useRoot(root);
  } catch(e){ if (e.name !== "AbortError") alert("Couldn't open that folder: " + e.message); }
}

/* ---------------- installable (PWA) ---------------- */
/* The browser offers the install prompt once; keep it so the Settings page can show an Install button. */
let installPrompt = null;
window.addEventListener("beforeinstallprompt", ev => { ev.preventDefault(); installPrompt = ev; if (route().page === "settings") render(); });
window.addEventListener("appinstalled", () => { installPrompt = null; if (route().page === "settings") render(); });
function registerWorker(demo){
  /* Not in the demo, and only where a worker can run: https (GitHub Pages) or localhost. */
  if (!("serviceWorker" in navigator) || demo || !(location.protocol === "https:" || location.hostname === "localhost")) return;
  let had = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (had) toast("Updated. Reload to get the latest version."); had = true; });
  navigator.serviceWorker.register("./sw.js").catch(() => {});
}

/* ---------------- start ---------------- */
(async function init(){
  const params = new URLSearchParams(location.search);
  window.__drm = {get S(){ return S; }, get store(){ return store; }, get ui(){ return ui; }, buildReport, parseRubric, checkFolder};
  registerWorker(params.get("demo") === "1");
  if (params.get("test") === "opfs"){ const root = await navigator.storage.getDirectory(); await useRoot(root); return; }
  if (params.get("demo") === "1"){ store = new MemoryStore(); S = demoState(); aiReady = true; render(); return; }
  ui.savedHandle = ("showDirectoryPicker" in window) ? await idb.get("root").catch(() => null) : null;
  render();
})();
