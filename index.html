    ${p.scoredBy === "Founder" || p.disagree ? `<div class="small muted" style="margin-top:6px">Why you set this tier: <span contenteditable="plaintext-only" data-act="painDisagree" data-id="${esc(p.id)}" data-ph="optional" style="display:inline-block;min-width:160px">${esc(p.disagree||"")}</span></div>` : ""}

function highlight(text, quotes, focusId, near){
  const ranges = [];
  for (const e of quotes){ if (e.status === "Rejected" && e.id !== focusId) continue; const r = findInTranscript(e.quote, text); if (r) ranges.push({...r, e}); }
  if (near) ranges.push(near);
  ranges.sort((a, b) => a.start - b.start);
  let out = "", pos = 0;
  for (const r of ranges){
    if (r.start < pos) continue;
    const inner = esc(text.slice(r.start, r.end));
    out += esc(text.slice(pos, r.start)) + (r.e ? `<mark class="s-${r.e.status}${r.e.id === focusId ? " focus-mark" : ""}" data-act="jump" data-id="${esc(r.e.id)}" id="m-${esc(r.e.id)}">${inner}</mark>` : `<span class="near" title="Around where the AI said this quote is">${inner}</span>`);
    pos = r.end;
  }
  return out + esc(text.slice(pos));
}
function nearRange(e, text){
  const w = String(e.where || "").trim(); if (w.length < 3 || !text) return null;
  const i = text.toLowerCase().indexOf(w.toLowerCase()); if (i < 0) return null;
  const start = text.lastIndexOf("\n", i) + 1; let end = text.indexOf("\n", i); if (end < 0) end = text.length;
  return {start, end};
}
function drawerView(){
  const e = byId(S.evidence, ui.drawer); if (!e) return "";
  const iv = byId(S.interviews, e.interviewId) || {id:e.interviewId}; const text = S.transcripts[e.interviewId] || "";
  const found = !!findInTranscript(e.quote, text); const near = found ? null : nearRange(e, text);
  const queue = S.evidence.filter(x => x.status === "Candidate").sort((a, b) => a.id.localeCompare(b.id, undefined, {numeric:true}));
  const next = queue.find(x => x.id !== e.id && x.id.localeCompare(e.id, undefined, {numeric:true}) > 0) || queue.find(x => x.id !== e.id);
  return `<div class="scrim" data-act="closeDrawer"></div><aside class="drawer" role="dialog" aria-label="Transcript">
    <div class="dh"><div class="spread"><div><b>${esc(iv.id)}</b> ${esc(iv.interviewee || "")}<div class="hint">${esc([iv.role, iv.date].filter(Boolean).join(", "))}</div></div>
      <div class="row">${next ? `<button class="btn sm" data-act="openDrawer" data-id="${esc(next.id)}">Next suggestion</button>` : ""}<a class="btn sm" href="#/interviews/${esc(iv.id)}">Open interview</a><button class="btn icon" data-act="closeDrawer" title="Close (Esc)">✕</button></div></div>

    </div>
    <div class="db"><div class="transcript">${text ? highlight(text, S.evidence.filter(x => x.interviewId === e.interviewId), e.id, near) : `<p class="empty">No transcript saved for this interview.</p>`}</div></div>
  </aside>`;
}

function checklist(m){

  const ev = S.evidence.filter(e => e.status === "Candidate");

  ${sheetFoot("")}</div>`;
}

function problemView(id){

  <div class="boxes g2"><div class="box soft"><h3>The problem</h3><form data-form="problem"><label class="f">In the customer's words<input type="text" name="text" value="${esc(p.text)}"></label><label class="f">Who has it<input type="text" name="who" value="${esc(p.who||"")}"></label></form></div>

/* ---------------- events ---------------- */
function toast(msg, undo){
  ui.toast = {msg, undo};
  let t = document.getElementById("toast");
  if (!t){ t = document.createElement("div"); t.id = "toast"; t.className = "toast"; document.body.appendChild(t); }
  t.innerHTML = `<span>${esc(msg)}</span>${undo ? `<button data-act="undo">Undo</button>` : ""}`; t.style.display = "flex";
  clearTimeout(toast.t); toast.t = setTimeout(hideToast, 5000);
}
function hideToast(){ ui.toast = null; const t = document.getElementById("toast"); if (t) t.style.display = "none"; }
async function copy(text, msg){ try { await navigator.clipboard.writeText(text); toast(msg || "Copied."); } catch(e){ prompt("Copy this:", text); } }

document.addEventListener("click", async ev => {
  const rowLink = ev.target.closest("[data-href]:not(a)");

  else if (a === "open") await openFolder(false);
  else if (a === "reopen") await openFolder(true);

  else if (a === "tab"){ ui.tab[r.id] = el.dataset.tab; ui.editTranscript = false; render(); }

  else if (a === "cUse"){ S.compass[el.dataset.stmt][el.dataset.field] = el.dataset.val; persist("compass"); render(); }
  else if (a === "cSet"){ S.compass[el.dataset.field] = el.dataset.val; persist("compass"); render(); }
  else if (a === "leadInterview"){ const l = byId(S.compass.leads, el.dataset.id); const id = nextId("INT-", S.interviews, 3);
    upsert("interviews", {id, date:today(), interviewee:l.name || "", role:l.org || "", customerId:(idealCustomer()||{}).id || "", source:"", interviewer:S.config.founder || "", recentInstance:"", leading:"", pitched:"", demoed:"", closing:"", rubricRun:false, notes:l.why ? "From leads list: " + l.why : "", coachingNote:""});
    l.done = true; l.interviewId = id; persist("compass"); ui.tab[id] = "quotes"; go("interviews/" + id); }
  else if (a === "seedAssumptions"){ const n = seedAssumptions(); render(); toast(n ? `Added ${n} point${n > 1 ? "s" : ""} from your canvas. Drag them into the grid to rate them.` : "Nothing new. Everything on the canvas already has a point."); }
  else if (a === "newAssumption"){ const id = nextId("A-", S.assumptions, 2); upsert("assumptions", blankAssumption(id)); selectPoint(id); ui.focusLab = id; render(); }
  else if (a === "selNote"){ selectPoint(el.dataset.id); render(); }
  else if (a === "closeNote"){ deselect(); render(); }
  else if (a === "toggleShelf"){ ui.mapShelf = !ui.mapShelf; if (ui.mapShelf) deselect(); render(); }
  else if (a === "toggleFull"){ ui.mapFull = !ui.mapFull; render(); }
  else if (a === "aScale"){ const x = byId(S.assumptions, el.dataset.id); const nx = {...x, [el.dataset.field]: Number(el.dataset.val)}; if (nx.impact && nx.confidence) nx.pos = {x:(nx.confidence - 1) / 4, y:(nx.impact - 1) / 4}; upsert("assumptions", nx); render(); }
  else if (a === "aStatus"){ const x = byId(S.assumptions, el.dataset.id); upsert("assumptions", {...x, status: el.dataset.val}); if (el.dataset.val === "Retired"){ ui.selNote = null; dropSub(); } render(); }
  else if (a === "aStance"){ const x = byId(S.assumptions, el.dataset.id); upsert("assumptions", {...x, evidence:(x.evidence||[]).map(t => t.id === el.dataset.eid ? {...t, stance:el.dataset.val} : t)}); render(); }
  else if (a === "aUntag"){ const x = byId(S.assumptions, el.dataset.id); upsert("assumptions", {...x, evidence:(x.evidence||[]).filter(t => t.id !== el.dataset.eid)}); render(); }
  else if (a === "newJob"){ const id = nextId("JB-", S.jobs, 2); upsert("jobs", {id, statement:"", type:"", problemId:S.persona.problemId || "", workaround:"", moment:"", frequency:"", consequence:"", decision:"Undecided", why:""}); render(); }
  else if (a === "exportJson"){ const blob = new Blob([JSON.stringify(S, null, 2)], {type:"application/json"}); const u = URL.createObjectURL(blob); const l = document.createElement("a"); l.href = u; l.download = `drm-backup-${today()}.json`; l.click(); URL.revokeObjectURL(u); }
});

document.addEventListener("change", ev => {
  const el = ev.target; const a = el.dataset.act; const r = route();
  if (a === "aKind"){ const x = byId(S.assumptions, el.dataset.id); upsert("assumptions", {...x, kind: el.value}); render(); }
  else if (a === "aLink"){ const x = byId(S.assumptions, el.dataset.id); upsert("assumptions", {...x, [el.dataset.field]: el.value}); render(); }
  else if (a === "leadDone"){ const l = byId(S.compass.leads, el.dataset.id); l.done = el.checked; persist("compass"); }
  else if (a === "aTag"){ if (!el.value) return; const x = byId(S.assumptions, el.dataset.id); upsert("assumptions", {...x, evidence:[...(x.evidence||[]), {id:el.value, stance:"supports"}]}); render(); }
  else if (a === "evField"){ const e = byId(S.evidence, el.dataset.id); upsert("evidence", {...e, [el.dataset.field]: el.value}); render(); }
  else if (a === "filter"){ ui.filters[el.dataset.key] = el.value; render(); }
  else if (a === "personaProblem"){ S.persona.problemId = el.value; persist("persona"); render(); }
  else if (a === "personaLink"){ if (!el.value) return; const f = S.persona.fields[el.dataset.key]; f.evidence = [...(f.evidence||[]), el.value]; persist("persona"); render(); }
  else if (a === "jobField"){ const j = byId(S.jobs, el.dataset.id); upsert("jobs", {...j, [el.dataset.field]: el.value}); render(); }
  else if (el.dataset.field === "leading"){ const iv = byId(S.interviews, r.id); upsert("interviews", {...iv, leading: el.value === "" ? "" : Number(el.value)}); render(); }
});

// Text fields save after a short pause, and immediately when you leave the field. Pasted transcripts and AI replies are kept as drafts until used.
const typeTimers = new WeakMap();
function saveTextField(el){
  const a = el.dataset.act; const form = el.closest("form[data-form]"); const r = route();
  const v = el.isContentEditable ? el.textContent.replace(/\u00a0/g, " ").trim() : el.value;
  if (a === "cField"){ S.compass[el.dataset.field] = v; persist("compass"); }
  else if (a === "cMeta"){ S.compass.meta = S.compass.meta || {}; S.compass.meta[el.dataset.field] = v; persist("compass"); }
  else if (a === "cSolution"){ S.compass.solutions = S.compass.solutions || {}; S.compass.solutions[el.dataset.id] = v; persist("compass"); }
  else if (a === "cItem"){ const it = byId(S.compass[el.dataset.kind]||[], el.dataset.id); if (it){ it[el.dataset.field] = v; persist("compass"); } }
  else if (a === "cStmt"){ S.compass[el.dataset.stmt][el.dataset.field] = v; persist("compass"); }
  else if (a === "aText"){ const x = byId(S.assumptions, el.dataset.id); if (x) upsert("assumptions", {...x, text:v}); }
  else if (a === "aNote"){ const x = byId(S.assumptions, el.dataset.id); if (x) upsert("assumptions", {...x, note:v}); }
  else if (a === "pField"){ const p = byId(S.problems, el.dataset.id); if (p) upsert("problems", {...p, [el.dataset.field]: v}); }
  else if (a === "personaText"){ S.persona.fields[el.dataset.key].text = el.value; persist("persona"); }
  else if (a === "jobText"){ const j = byId(S.jobs, el.dataset.id); if (j) upsert("jobs", {...j, [el.dataset.field]: el.value}); }
  else if (a === "painDisagree"){ const p = byId(S.pains, el.dataset.id); if (p) upsert("pains", {...p, disagree: v}); }
  else if (form && form.dataset.form === "interview"){ const iv = byId(S.interviews, r.id); if (iv) upsert("interviews", {...iv, ...Object.fromEntries(new FormData(form))}); }
  else if (form && form.dataset.form === "problem"){ const p = byId(S.problems, r.id); if (p) upsert("problems", {...p, ...Object.fromEntries(new FormData(form))}); }
  else if (form && form.dataset.form === "config"){ const d = Object.fromEntries(new FormData(form)); S.config = {...S.config, founder:d.founder, venture:d.venture, coach:d.coach, program:d.program, programSub:d.programSub, cohort:d.cohort, minInterviews:Number(d.minInterviews) || 5, strongShare:(Number(d.strongPct) || 50) / 100}; persist("config"); }
}
const isTextField = el => el.isContentEditable || el.tagName === "TEXTAREA" || (el.tagName === "INPUT" && ["text","date","number"].includes(el.type));
function focusLast(sel){ const els = document.querySelectorAll(sel); const last = els[els.length - 1]; if (last) last.focus(); }
// contenteditable fields don't fire "change": save them on blur, then refresh so read-backs and the map update.
document.addEventListener("focusout", ev => {
  const el = ev.target; if (!el.isContentEditable || !el.dataset.act) return;
  clearTimeout(typeTimers.get(el)); saveTextField(el);
  // Delay the refresh so a click that caused the blur lands on the element the person aimed at.
  setTimeout(() => { if (!document.activeElement || !document.activeElement.isContentEditable) render(); }, 160);
});
document.addEventListener("keydown", ev => { if (ev.key === "Enter" && !ev.shiftKey && ev.target.isContentEditable && (ev.target.classList.contains("ed") || ev.target.classList.contains("lbx"))){ ev.preventDefault(); ev.target.blur(); } });
document.addEventListener("input", ev => {
  const el = ev.target;
  if (el.id === "transcriptBox"){ ui.drafts.transcript[el.dataset.iv] = el.value; return; }
  if (el.id === "rubricBox"){ ui.drafts.rubric[el.dataset.iv] = el.value; return; }
  if (!isTextField(el) || el.dataset.field === "leading") return;
  clearTimeout(typeTimers.get(el)); typeTimers.set(el, setTimeout(() => saveTextField(el), 400));
});
document.addEventListener("change", ev => {
  const el = ev.target; if (!isTextField(el) || el.dataset.field === "leading" || el.id === "transcriptBox" || el.id === "rubricBox") return;
  clearTimeout(typeTimers.get(el)); saveTextField(el);
  if (["personaText","jobText","cStmt","cField","cItem","aText"].includes(el.dataset.act) || el.closest("form[data-form=problem],form[data-form=config]")) setTimeout(render, 0);
}, true);

document.addEventListener("submit", async ev => {
  ev.preventDefault(); const f = ev.target; const d = Object.fromEntries(new FormData(f)); const r = route();
  if (f.dataset.form === "setup"){
    S = emptyState(); S.config = {founder:d.founder, venture:d.venture, coach:d.coach, minInterviews:5, strongShare:0.5, createdAt:new Date().toISOString()};
    await persist("config"); await persist("persona");
    if ((d.problem || "").trim()) upsert("problems", {id:"PR-01", text:d.problem.trim(), who:(d.who || "").trim()});
    if ((d.who || "").trim()){ S.compass.customers = [{id:"C-01", text:d.who.trim(), why:"", ideal:true}]; await persist("compass"); }
    await store.write("drm/README.md", "This folder holds your Discovery Records Manager data. Edit it with the DRM app or ask your AI assistant; see CLAUDE.md at the top of the repository.\n");
    store.needsSetup = false; store.stamps = await store.scan(); startWatching(); go("home"); render();
  } else if (f.dataset.form === "addProblem"){ upsert("problems", {id:nextId("PR-", S.problems, 2), text:d.text.trim(), who:(d.who||"").trim()}); f.reset(); render(); }
  else if (f.dataset.form === "addQuote"){ const id = nextId(r.id + "-Q", S.evidence.filter(x => x.id.startsWith(r.id + "-Q")), 2);
    upsert("evidence", {id, interviewId:r.id, problemId:d.problemId, jobId:"", quote:d.quote.trim(), where:d.where, type:d.type, foundBy:"Founder", status:"Confirmed", note:""}); ui.addQuote = null; render(); }
});

/* ---------------- the assumptions map: an infinite canvas ----------------
   ui.view = {x, y, k}: where the world sits in the viewport and how zoomed. Points live in world px.
   Dragging a point moves it and saves its rating; dragging the background pans; ctrl/cmd + wheel zooms. */
function mountMap(){
  const vp = document.getElementById("vp"); if (!vp) return;
  const w = vp.getBoundingClientRect().width;
  if (!ui.view) fitMap(vp); else if (ui.viewW && Math.abs(w - ui.viewW) > 2) ui.view.x += (w - ui.viewW) / 2;   // layout changed: keep the view centred
  ui.viewW = w; applyView();
  if (ui.focusLab){ const el = vp.querySelector(`.lbx[data-lab="${CSS.escape(ui.focusLab)}"]`); ui.focusLab = null; if (el){ el.focus(); const s = window.getSelection(), rg = document.createRange(); rg.selectNodeContents(el); rg.collapse(false); s.removeAllRanges(); s.addRange(rg); } }
}
function fitK(vp){ const r = vp.getBoundingClientRect(); const pad = 12; return Math.max(0.15, Math.min((r.width - pad * 2) / (WORLD.x1 - WORLD.x0), (r.height - pad * 2) / (WORLD.y1 - WORLD.y0))); }
function fitMap(vp){ const r = vp.getBoundingClientRect(); const k = fitK(vp); ui.view = {k, x:r.width / 2 - k * (WORLD.x0 + WORLD.x1) / 2, y:r.height / 2 - k * (WORLD.y0 + WORLD.y1) / 2}; }
/* The world has edges: you can't zoom out past the whole map, and you can't pan it off the screen. */
function clampView(vp){
  const v = ui.view; const r = vp.getBoundingClientRect(); const kmin = fitK(vp);
  if (v.k < kmin) v.k = kmin;
  const ww = (WORLD.x1 - WORLD.x0) * v.k, wh = (WORLD.y1 - WORLD.y0) * v.k;
  const minX = r.width - WORLD.x1 * v.k, maxX = -WORLD.x0 * v.k;      // world right edge at the viewport's right … world left edge at the viewport's left
  v.x = ww <= r.width ? (r.width - ww) / 2 - WORLD.x0 * v.k : Math.min(maxX, Math.max(minX, v.x));
  const minY = r.height - WORLD.y1 * v.k, maxY = -WORLD.y0 * v.k;
  v.y = wh <= r.height ? (r.height - wh) / 2 - WORLD.y0 * v.k : Math.min(maxY, Math.max(minY, v.y));
}
function applyView(){ const w = document.getElementById("world"), vp = document.getElementById("vp"); if (!w || !vp || !ui.view) return; clampView(vp); w.style.transform = `translate(${ui.view.x}px,${ui.view.y}px) scale(${ui.view.k})`; w.style.setProperty("--ik", 1 / ui.view.k); }
function zoomAt(cx, cy, f){ const v = ui.view; if (!v) return; const k2 = Math.min(4, v.k * f); const wx = (cx - v.x) / v.k, wy = (cy - v.y) / v.k; v.k = k2; v.x = cx - wx * k2; v.y = cy - wy * k2; applyView(); }
function worldAt(vp, clientX, clientY){ const r = vp.getBoundingClientRect(); const v = ui.view; return {x:(clientX - r.left - v.x) / v.k, y:(clientY - r.top - v.y) / v.k}; }
/* A point with nothing written on it disappears when you click away. */
function cleanupEmpty(id){ const a = id && byId(S.assumptions, id); if (a && a.status === "Active" && !a.seed && !(a.text || "").trim() && !a.aiImpact && !a.aiReason && !(a.evidence || []).length && !(a.note || "").trim()) removeRec("assumptions", a.id); }
function deselect(){ const prev = ui.selNote; ui.selNote = null; dropSub(); cleanupEmpty(prev); }
function selectPoint(id){ if (ui.selNote === id) return; const prev = ui.selNote; ui.selNote = id; dropSub(); cleanupEmpty(prev); }
let drag = null, dragLab = null, pan = null;
document.addEventListener("contextmenu", ev => { if (ev.target.closest && ev.target.closest("#vp")) ev.preventDefault(); });
document.addEventListener("pointerdown", ev => {
  const vp = ev.target.closest("#vp"); if (!vp || !ui.view) return;
  if (ev.target.closest(".hud,.legend,.hint2,.ov,button,select,input")) return;
  if (ev.button === 0){
    const pt = ev.target.closest(".pt[data-pt]");
    if (pt){ const a = byId(S.assumptions, pt.dataset.pt); if (!a) return;
      drag = {id:a.id, el:pt, lab:vp.querySelector(`.lbx[data-lab="${CSS.escape(a.id)}"]`), startX:ev.clientX, startY:ev.clientY, moved:false, locked:a.status === "Candidate", wx:parseFloat(pt.style.left), wy:parseFloat(pt.style.top)};
      pt.setPointerCapture(ev.pointerId); return; }
    const lab = ev.target.closest(".lbx[data-lab]");
    if (lab){ if (document.activeElement === lab) return;           // already editing: let the mouse select text
      ev.preventDefault();
      dragLab = {id:lab.dataset.lab, el:lab, startX:ev.clientX, startY:ev.clientY, moved:false, wx:parseFloat(lab.style.left), wy:parseFloat(lab.style.top)};
      lab.setPointerCapture(ev.pointerId); return; }
    if (ev.target.closest("[contenteditable]")) return;
  }
  if (ev.button > 2) return;
  ev.preventDefault();
  pan = {button:ev.button, startX:ev.clientX, startY:ev.clientY, vx:ui.view.x, vy:ui.view.y, moved:false, vp};
  vp.setPointerCapture(ev.pointerId);
});
document.addEventListener("pointermove", ev => {
  if (drag){
    const dx = ev.clientX - drag.startX, dy = ev.clientY - drag.startY;
    if (!drag.moved && Math.hypot(dx, dy) < 4) return;
    if (drag.locked) return;
    if (!drag.moved){ drag.moved = true; ui.dragging = true; drag.el.classList.add("dragging"); }
    const w0 = {x:drag.wx + dx / ui.view.k, y:drag.wy + dy / ui.view.k}; const raw = posOf(w0);
    drag.w = inGrid(raw) ? worldOf(clampPos(raw)) : clampWorld(w0);            // inside the grid the edge is the limit
    drag.el.style.left = drag.w.x + "px"; drag.el.style.top = drag.w.y + "px";
    if (drag.lab){ const l = labelOf(byId(S.assumptions, drag.id)); drag.lab.style.left = (drag.w.x + l.dx) + "px"; drag.lab.style.top = (drag.w.y + l.dy) + "px"; }
    return;
  }
  if (dragLab){
    const dx = ev.clientX - dragLab.startX, dy = ev.clientY - dragLab.startY;
    if (!dragLab.moved && Math.hypot(dx, dy) < 4) return;
    if (!dragLab.moved){ dragLab.moved = true; ui.dragging = true; dragLab.el.classList.add("dragging"); }
    dragLab.w = clampWorld({x:dragLab.wx + dx / ui.view.k, y:dragLab.wy + dy / ui.view.k});
    dragLab.el.style.left = dragLab.w.x + "px"; dragLab.el.style.top = dragLab.w.y + "px"; return;
  }
  if (pan){
    const dx = ev.clientX - pan.startX, dy = ev.clientY - pan.startY;
    if (!pan.moved && Math.hypot(dx, dy) < 4) return;
    if (!pan.moved){ pan.moved = true; ui.dragging = true; pan.vp.classList.add("panning"); }
    ui.view.x = pan.vx + dx; ui.view.y = pan.vy + dy; applyView();
  }
});
document.addEventListener("pointerup", ev => {
  if (drag){
    const d = drag; drag = null; ui.dragging = false;
    if (!d.moved){ selectPoint(d.id); render(); return; }
    const a = byId(S.assumptions, d.id); if (!a) return;
    const raw = posOf(d.w); const pos = inGrid(raw) ? clampPos(raw) : null;   // in the grid: rated; outside: back on the shelf
    upsert("assumptions", {...a, pos, ...(pos ? ratingOf(pos) : {impact:"", confidence:""})}); render(); return;
  }
  if (dragLab){
    const d = dragLab; dragLab = null; ui.dragging = false;
    const a = byId(S.assumptions, d.id); if (!a) return;
    if (!d.moved){ selectPoint(d.id); ui.focusLab = d.id; render(); return; }   // a click on the label: edit it
    const pt = document.querySelector(`#vp .pt[data-pt="${CSS.escape(d.id)}"]`); const px = parseFloat(pt.style.left), py = parseFloat(pt.style.top);
    upsert("assumptions", {...a, label:{dx:Math.round(d.w.x - px), dy:Math.round(d.w.y - py)}}); render(); return;
  }
  if (pan){
    const p = pan; pan = null; ui.dragging = false; p.vp.classList.remove("panning");
    if (p.moved || p.button !== 0) return;
    // a plain left click on empty canvas adds a point there
    const raw = posOf(clampWorld(worldAt(p.vp, ev.clientX, ev.clientY))); const pos = inGrid(raw) ? clampPos(raw) : null; const id = nextId("A-", S.assumptions, 2);
    const prev = ui.selNote; upsert("assumptions", {...blankAssumption(id), pos, ...(pos ? ratingOf(pos) : {})}); ui.selNote = id; dropSub(); cleanupEmpty(prev); ui.focusLab = id; render();
  }
});
document.addEventListener("wheel", ev => {
  const vp = ev.target.closest && ev.target.closest("#vp"); if (!vp || !ui.view) return;
  if (ev.target.closest(".ov")) return;                                          // panels scroll normally
  ev.preventDefault();
  const r = vp.getBoundingClientRect();
  zoomAt(ev.clientX - r.left, ev.clientY - r.top, Math.exp(-ev.deltaY * (ev.ctrlKey || ev.metaKey ? 0.01 : 0.0018)));
}, {passive:false});

/* ---------------- folder handling + watching for AI writes ---------------- */
let watchTimer = null;
function stopWatching(){ clearInterval(watchTimer); watchTimer = null; }
function startWatching(){
  stopWatching();
  if (!store || store.kind !== "folder") return;
  watchTimer = setInterval(checkFolder, 4000);
}
async function checkFolder(){
  if (!store || store.kind !== "folder" || document.hidden) return;
  const ae = document.activeElement; if (ae && (ae.tagName === "TEXTAREA" || ae.tagName === "INPUT" || ae.isContentEditable)) return;   // don't yank the page while typing
  if (ui.dragging) return;
  let now; try { now = await store.scan(); } catch(e){ return; }
  const before = store.stamps || {};
  const changed = Object.keys(now).filter(k => now[k] !== before[k]).concat(Object.keys(before).filter(k => !(k in now)));
  if (!changed.length) return;
  const beforeCand = S.evidence.filter(e => e.status === "Candidate").length + S.pains.filter(p => p.status === "Candidate").length;
  const beforeNotes = S.notes.length;
  S = await store.loadAll(); lastPush = await store.lastPush(); render();
  const cand = S.evidence.filter(e => e.status === "Candidate").length + S.pains.filter(p => p.status === "Candidate").length;
  if (cand > beforeCand) toast(`${cand - beforeCand} new suggestion${cand - beforeCand > 1 ? "s" : ""} from your AI. Review them when you're ready.`);
  else if (S.notes.length > beforeNotes) toast("Your AI wrote a new note.");
}
async function useRoot(root){
  store = new FolderStore(root); ui.view = null;
  await idb.set("root", root).catch(() => {});
  aiReady = await store.hasAiInstructions();
  if (!(await store.isInitialized())){ store.needsSetup = true; store.noGit = !(await store.hasGit()); render(); return; }
  S = await store.loadAll();
  lastPush = await store.lastPush();
  if (!location.hash || location.hash === "#") go("home");
  render(); scheduleReport(); startWatching();
}
async function openFolder(reopen){
  try {
    let root;
    if (reopen && ui.savedHandle){
      const h = ui.savedHandle;
      if ((await h.queryPermission({mode:"readwrite"})) !== "granted" && (await h.requestPermission({mode:"readwrite"})) !== "granted") return;
      root = h;
    } else root = await window.showDirectoryPicker({id:"drm", mode:"readwrite"});
    await useRoot(root);
  } catch(e){ if (e.name !== "AbortError") alert("Couldn't open that folder: " + e.message); }
}

/* ---------------- start ---------------- */
(async function init(){
  const params = new URLSearchParams(location.search);
  window.__drm = {get S(){ return S; }, get store(){ return store; }, get ui(){ return ui; }, buildReport, parseRubric, checkFolder};
  if (params.get("test") === "opfs"){ const root = await navigator.storage.getDirectory(); await useRoot(root); return; }
  if (params.get("demo") === "1"){ store = new MemoryStore(); S = demoState(); aiReady = true; render(); return; }
  ui.savedHandle = ("showDirectoryPicker" in window) ? await idb.get("root").catch(() => null) : null;
  render();
})();
</script>
