<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Discovery Records Manager</title>
<style>
:root{
  /* Program palette */
  --navy:#003352; --teal:#356981; --red:#c93631; --coral:#f25d4f; --sky:#79c9e1; --pale:#d5eef3; --yellow:#f1c528; --white:#ffffff;
  /* tints of the palette for surfaces */
  --desk:#eaf3f7; --paper:#ffffff; --paper-2:#f3f8fa; --line:#d3e3ea; --line-2:#afc6d1;
  --ink:#003352; --ink-2:#356981; --ink-3:#5f7f8e;
  --ok:#356981; --ok-bg:#d5eef3; --bad:#c93631; --bad-bg:#fae1df; --warn:#8a6d00; --warn-bg:#fdf1c2; --coral-bg:#fde0dc;
  --hof:#fcd0cb; --inc:#fde7a6; --nth:#fdf4d2; --lat:#d5eef3; --nap:#e4ecf0;
  --r:6px; --r-lg:12px;
  --sans:ui-sans-serif,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--sans);color:var(--ink);background:var(--desk);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--teal)}
:focus-visible{outline:2px solid var(--coral);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* frame */
.app{display:grid;grid-template-columns:236px 1fr;height:100vh}
.side{background:var(--navy);color:#fff;display:flex;flex-direction:column;min-height:0}
.brand{padding:18px 18px 14px;border-bottom:1px solid rgba(255,255,255,.14)}
.brand b{display:block;font-size:15px;letter-spacing:-.01em;color:#fff}
.brand span{display:block;font-size:12.5px;color:var(--sky);margin-top:2px}
.nav{padding:10px 10px;overflow:auto;flex:1}
.nav a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 10px;border-radius:var(--r);text-decoration:none;color:#d9e8ef;font-size:13.5px}
.nav a:hover{background:rgba(255,255,255,.08);color:#fff}
.nav a.on{background:var(--pale);color:var(--navy);font-weight:600}
.nav .grp{display:flex;align-items:center;gap:6px;width:100%;border:none;background:none;cursor:pointer;font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--sky);padding:16px 10px 5px;text-align:left}
.nav .grp:hover{color:#fff}
.nav .grp .chev{display:inline-block;width:10px;transition:transform .15s}
.nav .grp.closed .chev{transform:rotate(-90deg)}
.nav .grp.has-active{color:#fff}
.nav .grp .pill{margin-left:auto}
.nav .num{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--sky);margin-right:6px}
.nav a.on .num{color:var(--teal)}
.count{color:var(--sky);font-size:12px}
.nav a.on .count{color:var(--teal)}
.pill{background:var(--coral);color:#fff;border-radius:999px;font-size:11px;padding:1px 7px;font-weight:600}
.sidefoot{border-top:1px solid rgba(255,255,255,.14);padding:12px 16px;font-size:12px;color:#b9d3df;line-height:1.5}
.sidefoot b{color:#fff;font-weight:600}
.sidefoot .err{color:#ffb3ac}
.main{overflow:auto;min-width:0}
.main.bare{overflow:hidden;display:flex;flex-direction:column}
.app.nosb{grid-template-columns:1fr} .app.nosb .side{display:none}
.page{max-width:1160px;margin:0 auto;padding:26px 32px 90px}
.crumbs{font-size:12.5px;color:var(--ink-3);margin-bottom:6px}
.crumbs a{color:var(--ink-3);text-decoration:none}
h2{font-size:15px;font-weight:700;margin:24px 0 10px;letter-spacing:-.005em;color:var(--navy)}
h2:first-child{margin-top:0}
h3{font-size:13.5px;font-weight:700;margin:0 0 8px;color:var(--navy)}
.lede{color:var(--ink-2);margin:0 0 18px;max-width:66ch}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.muted{color:var(--ink-3)}
.small{font-size:12.5px}
.right{text-align:right}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}
@media (max-width:900px){.app{grid-template-columns:1fr}.side{display:none}.page{padding:18px 16px 80px}}

/* ===== sheets: every page is a working document ===== */
.sheet{background:var(--paper);border-radius:4px;box-shadow:0 1px 2px rgba(0,51,82,.08),0 14px 40px rgba(0,51,82,.10);padding:30px 40px 24px;margin:0 auto 22px;max-width:1120px;position:relative}
.sheet .tool{font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--teal);text-transform:uppercase}
.sheet h1{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:2px 0 0;color:var(--navy)}
.sheet .wordmark{text-align:right;line-height:1.05}
.sheet .wordmark b{display:block;font-size:17px;font-weight:800;letter-spacing:.02em;color:var(--navy);text-transform:uppercase}
.sheet .wordmark span{font-size:10.5px;font-weight:700;letter-spacing:.08em;color:var(--teal);text-transform:uppercase}
.sheet .rule{border-top:3px solid var(--navy);margin:10px 0 12px}
.sheet .nameline{display:flex;gap:40px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);margin-bottom:18px}
.sheet .nameline b{color:var(--navy)}
.sheet .nameline [contenteditable]{display:inline-block;min-width:80px}
.sheet .intro{color:var(--ink-2);margin:-4px 0 16px;max-width:70ch}
.sheet .foot{display:flex;justify-content:space-between;gap:12px;font-size:10.5px;color:var(--ink-3);margin-top:22px}
.sheet .actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:-2px 0 14px}
.box{border:2px solid var(--navy);border-radius:10px;padding:14px 16px 16px;position:relative;background:var(--paper);margin-bottom:14px}
.box:before{content:"";display:block;width:28px;height:4px;background:var(--coral);border-radius:2px;margin-bottom:8px}
.box h3{font-size:13px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--navy);margin:0 0 2px}
.box .ins{font-size:12px;color:var(--ink-3);margin:0 0 12px}
.box.soft{border-color:var(--line-2)}
.box.soft:before{background:var(--sky)}
.box.flat{padding:14px 0 0}
.box.flat h3,.box.flat .ins{padding:0 16px}
.box.flat:before{margin-left:16px}
.boxes{display:grid;gap:14px}
.boxes.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.boxes.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:900px){.boxes.g2,.boxes.g3{grid-template-columns:1fr}}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}
@media (max-width:1000px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{border:1.5px solid var(--line-2);border-radius:10px;padding:12px 14px;background:var(--paper)}
.tile .n{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.1;color:var(--navy)}
.tile .l{font-size:12.5px;color:var(--ink-2);margin-top:3px}
.tile .h{font-size:12px;color:var(--ink-3);margin-top:2px}
.tile.warn{border-color:var(--yellow);background:#fffbe8} .tile.warn .n{color:var(--warn)}
.tile.good{border-color:var(--sky);background:#f3fafc} .tile.good .n{color:var(--teal)}
.tile.bad{border-color:var(--coral);background:#fff5f4} .tile.bad .n{color:var(--red)}
.tile.click{cursor:pointer} .tile.click:hover{border-color:var(--navy)}
.canvas{display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:auto auto;gap:14px;grid-template-areas:"problem solution customer" "problem solution alts"}
.canvas .b-problem{grid-area:problem} .canvas .b-solution{grid-area:solution} .canvas .b-customer{grid-area:customer} .canvas .b-alts{grid-area:alts}
.canvas .box{margin:0}
@media (max-width:900px){.canvas{grid-template-columns:1fr;grid-template-areas:"problem" "solution" "customer" "alts"}}
.lines{display:flex;flex-direction:column;gap:6px}
.ln{display:flex;gap:8px;align-items:flex-start;padding:4px 0;border-bottom:1px solid var(--line)}
.ln .n{font-family:var(--serif);font-style:italic;color:var(--ink-3);width:18px;flex-shrink:0;padding-top:3px;font-size:14px}
.ln .x{opacity:0;transition:opacity .1s}
.ln:hover .x,.ln:focus-within .x{opacity:1}
.ln .sub{font-size:12px;color:var(--ink-3)}
.ln.ideal{background:#fdf6d4;border-radius:6px;padding:4px 6px;margin:0 -6px}
.ln .star{border:1px solid var(--line-2);background:var(--paper);border-radius:999px;font-size:11px;padding:1px 8px;cursor:pointer;color:var(--ink-3);white-space:nowrap}
.ln .star.on{background:var(--navy);color:#fff;border-color:var(--navy)}
[contenteditable]{outline:none;border-radius:3px;min-height:1.4em;padding:2px 3px;margin:-2px -3px;cursor:text}
[contenteditable]:focus{background:#fffbe8;box-shadow:0 0 0 2px var(--yellow)}
[contenteditable][data-ph]:empty:before{content:attr(data-ph);color:var(--ink-3);font-style:italic;pointer-events:none}
.ed{font-family:var(--serif);font-size:15px;line-height:1.5}
.ed.sans{font-family:var(--sans);font-size:13.5px}
.add{font-size:12.5px;color:var(--ink-3);background:none;border:none;cursor:pointer;padding:4px 0;text-align:left}
.add:hover{color:var(--navy)}
.stmt{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr);gap:28px}
@media (max-width:900px){.stmt{grid-template-columns:1fr}}
.blank{border-bottom:3px solid var(--navy);padding:0 0 10px;margin-bottom:22px}
.blank .lead{display:inline-block;background:var(--yellow);color:var(--navy);font-weight:800;font-size:18px;padding:4px 10px;letter-spacing:-.01em}
.blank .ed{display:block;margin-top:10px;min-height:1.6em}
.aside{background:var(--paper-2);border-radius:10px;padding:18px 20px;font-size:13px;color:var(--ink-2)}
.aside h4{font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--navy);margin:0 0 6px}
.aside p{margin:0 0 14px;line-height:1.5}
.aside .ex{font-family:var(--serif);font-style:italic}
.aside .use{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:6px 10px;margin:4px 0;display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:12.5px}
.readback{font-family:var(--serif);font-size:19px;line-height:1.45;color:var(--ink);margin:6px 0 22px;max-width:70ch}

/* controls */
.btn{text-decoration:none;display:inline-block;border:1px solid var(--line-2);background:var(--paper);border-radius:var(--r);padding:7px 13px;cursor:pointer;white-space:nowrap;font-weight:500;color:var(--navy)}
.btn:hover{border-color:var(--teal);background:#f6fafc}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.pri:hover{background:var(--teal);border-color:var(--teal)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.icon{width:30px;height:30px;padding:0;display:inline-flex;align-items:center;justify-content:center;font-size:14px}
.btn.icon.yes{color:var(--teal);border-color:var(--sky)} .btn.icon.yes:hover{background:var(--pale)}
.btn.icon.no{color:var(--red);border-color:#e9a7a2} .btn.icon.no:hover{background:var(--bad-bg)}
.btn.link{border:none;background:none;color:var(--teal);padding:0;text-decoration:underline;font-weight:400}
.btn:disabled{opacity:.5;cursor:not-allowed}
label.f{display:block;font-size:12.5px;color:var(--ink-2);margin-bottom:12px}
label.f > input,label.f > select,label.f > textarea{display:block;width:100%;margin-top:5px}
input[type=text],input[type=number],input[type=date],select,textarea{border:1px solid var(--line-2);border-radius:var(--r);padding:7px 10px;background:var(--paper);color:var(--ink)}
textarea{resize:vertical;min-height:72px;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:2px solid #fbd5d0;border-color:var(--coral)}
select.inline{padding:3px 6px;font-size:12.5px;border-color:var(--line)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden}
.seg button{border:none;background:var(--paper);padding:4px 10px;cursor:pointer;border-right:1px solid var(--line-2);color:var(--navy)}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--navy);color:#fff}
.seg.ai button.on{background:var(--coral)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:0 0 14px}
.tabs button{border:none;background:none;padding:8px 12px;cursor:pointer;color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--navy);border-color:var(--coral);font-weight:700}
.tabs.filters{border:none;margin:0 0 10px;gap:6px}
.tabs.filters button{border:1px solid var(--line-2);border-radius:999px;padding:3px 11px;font-size:12.5px;margin:0}
.tabs.filters button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
details.fold{border:1px dashed var(--line-2);border-radius:var(--r-lg);padding:10px 14px;margin-top:12px;color:var(--ink-2)}
details.fold summary{cursor:pointer;font-weight:500;color:var(--navy)}

/* tables */
table{width:100%;border-collapse:collapse}
th{font-size:12px;color:var(--ink-3);text-align:left;font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}
tr.click{cursor:pointer} tr.click:hover td{background:var(--paper-2)}

/* chips, notices */
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:12px;white-space:nowrap;line-height:1.4}
.chip.gray{background:var(--nap);color:var(--ink-2)}
.chip.blue{background:var(--pale);color:var(--navy)}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.tier{color:var(--navy)}
.tier-hof{background:var(--hof)} .tier-inc{background:var(--inc)} .tier-nth{background:var(--nth)} .tier-lat{background:var(--lat)} .tier-nap{background:var(--nap)}
.notice{border-radius:var(--r);padding:9px 12px;font-size:13px}
.notice.bad{background:var(--bad-bg);color:#7a1f1a}
.notice.warn{background:var(--warn-bg);color:#5e4a00}
.notice.ok{background:var(--ok-bg);color:var(--navy)}
.notice.plain{background:var(--nap);color:var(--ink-2)}
.ai{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--navy);background:var(--pale);border-radius:999px;padding:2px 9px}
.kbd{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:var(--paper-2);border:1px solid var(--line-2);border-radius:4px;padding:1px 6px}
.stamp{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--red);color:var(--red);border-radius:4px;padding:2px 8px;font-size:11.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;transform:rotate(-1.5deg)}
.stamp.ok{border-color:var(--teal);color:var(--teal)}
.bar{display:flex;height:8px;border-radius:999px;overflow:hidden;background:var(--nap)}
.bar div{height:100%}
.bar.tiers{height:20px}
.bar.tiers div{display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--navy)}

/* the customer's words */
.q{background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--line-2);border-radius:10px;padding:12px 14px 10px 16px;margin-bottom:8px}
.q.s-Confirmed{border-left-color:var(--teal)}
.q.s-Candidate{border-left-color:var(--yellow)}
.q.s-Rejected{border-left-color:var(--line);opacity:.55}
.q .words{font-family:var(--serif);font-size:16.5px;line-height:1.45;color:var(--ink);letter-spacing:-.005em}
.q .words:before{content:"\201C"} .q .words:after{content:"\201D"}
.q.compact .words{font-size:15px}
.q .meta{display:flex;gap:4px 10px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--ink-3);margin-top:7px}
.q .meta a{color:var(--teal);text-decoration:none}
.q .meta .sep{color:var(--line-2)}
.q .acts{display:flex;gap:6px;flex-shrink:0}
.q.focus{box-shadow:0 0 0 3px var(--pale)}
.q.open{cursor:pointer} .q.open:hover{border-color:var(--line-2)}

/* transcript */
.transcript{white-space:pre-wrap;font-family:var(--serif);font-size:15px;line-height:1.7;max-height:70vh;overflow:auto;padding-right:8px;color:var(--ink)}
mark{border-radius:2px;padding:0 1px;cursor:pointer;color:inherit}
mark.s-Confirmed{background:var(--pale);box-shadow:0 2px 0 var(--teal)}
mark.s-Candidate{background:#fdf3c4;box-shadow:0 2px 0 var(--yellow)}
mark.s-Rejected{background:#eee;text-decoration:line-through}
mark.focus-mark,mark.focus{outline:2px solid var(--navy);outline-offset:1px}
.near{background:var(--pale);border-radius:3px;outline:2px dashed var(--sky);outline-offset:1px}
.legend{font-size:12px;color:var(--ink-3);margin-top:10px}

/* drawers */
.scrim{position:fixed;inset:0;background:rgba(0,51,82,.30);z-index:39}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,96vw);background:var(--paper);border-left:1px solid var(--line);box-shadow:-12px 0 40px rgba(0,51,82,.18);display:flex;flex-direction:column;z-index:40}
.drawer .dh{padding:14px 20px;border-bottom:1px solid var(--line)}
.drawer .db{overflow:auto;padding:18px 20px;flex:1}
.drawer .transcript{max-height:none}

/* ===== assumptions map: infinite canvas ===== */
.mapwrap{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:16px}
.mapwrap.sel{grid-template-columns:270px minmax(0,1fr) 290px}
@media (max-width:1000px){.mapwrap,.mapwrap.sel{grid-template-columns:1fr}}
.mapfull{position:relative;flex:1;display:flex;flex-direction:column;min-height:0}
.tabstrip{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:4px 10px 4px 14px;background:var(--paper);border-bottom:1px solid var(--line);flex-shrink:0}
.tabstrip .tabs button{padding:7px 10px;font-size:13px}
.counts{display:inline-flex;gap:8px;align-items:center;font-size:12px;color:var(--ink-2);margin-right:6px}
.counts .cnt{display:inline-flex;align-items:center;gap:3px}
.counts .dotp{display:inline-block;width:10px;height:10px;border-radius:50%;border:1.5px solid var(--navy);background:#fff}
.counts .dotp.s-ok{background:var(--teal)} .counts .dotp.s-warn{background:var(--yellow)} .counts .dotp.s-bad{background:var(--coral)}
.vp.full{flex:1;height:auto;border:none;border-radius:0;min-height:0}
.ov{position:absolute;z-index:5;background:rgba(255,255,255,.97);border:2px solid var(--line-2);border-radius:10px;padding:14px 16px;box-shadow:0 10px 34px rgba(0,51,82,.16);cursor:default}
.ov.ov-l{left:14px;top:14px;width:280px;max-height:calc(100% - 70px);overflow:auto}
.ov.ov-r{right:14px;top:14px;width:300px;max-height:calc(100% - 70px);overflow:auto}
.ov.ov-t{left:50%;transform:translateX(-50%);top:14px;width:min(620px,calc(100% - 660px));min-width:380px;max-height:45%;overflow:auto;border-color:var(--navy);padding:12px 16px}
.ov.shelfpanel{right:14px;top:14px;bottom:52px;width:330px;overflow:auto}
.ov h4{font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--navy)}
.ov.panel{padding:14px 16px}
.vp{position:relative;height:640px;border:2px solid var(--navy);border-radius:8px;overflow:hidden;background-color:#e4eef3;background-image:radial-gradient(circle,#b9cfda 1px,transparent 1.3px);background-size:22px 22px;cursor:grab;user-select:none;touch-action:none}
.vp.panning{cursor:grabbing}
.world{position:absolute;left:0;top:0;width:0;height:0;transform-origin:0 0;--ik:1}
.world .axis{position:absolute;background:var(--navy);height:2px;width:2px}
.world .bounds{position:absolute;border:2px solid var(--line-2);border-radius:10px;background:#fff;box-shadow:0 2px 14px rgba(0,51,82,.08)}
.world .quad{position:absolute;background:rgba(242,93,79,.10);border-radius:6px 0 0 0}
.world .region{position:absolute;border:1.5px solid var(--navy);border-radius:6px}
.world .region.grid{background:rgba(255,255,255,.75)}
.world .region.shelf{border:1.5px dashed var(--line-2);background:rgba(234,243,247,.6)}
.world .wlab{position:absolute;width:0;height:0;transform:scale(var(--ik));transform-origin:0 0;pointer-events:none}

<body>
<div id="root"></div>
<script>
"use strict";
/* ============================================================
   Discovery Records Manager (DRM)
   Compass (what you believe) -> Evidence (what customers said)
   -> Validate (which beliefs hold up), by focus area.
   Data lives as plain files in the founder's own repo folder.
   The founder's AI assistant reads and writes the same folder
   (see CLAUDE.md); this app is for entering and judging evidence.
   ============================================================ */

const TEMPLATE_URL = "https://github.com/Magiomakes/discovery-records-manager";
const SETUP_URL = TEMPLATE_URL + "/blob/main/SETUP.md";

const TIERS = ["Hair on Fire","Incremental Improvement","Nice to Have","Latent","Not a Problem"];
const TIER_CLASS = {"Hair on Fire":"tier-hof","Incremental Improvement":"tier-inc","Nice to Have":"tier-nth","Latent":"tier-lat","Not a Problem":"tier-nap"};
const TIER_DEF = {
  "Hair on Fire":"Already invested money or recurring time they can't get back, and the problem is still not solved.",
  "Incremental Improvement":"Actively trying to fix it, but the effort is reversible (tried a tool and dropped it, stopped when a free trial ended).",
  "Nice to Have":"Describes the problem clearly but has done nothing about it.",
  "Latent":"Has the problem but doesn't see it as a problem. A coaching flag, not a buying signal.",
  "Not a Problem":"No sign they have it."
};
const EVIDENCE_TYPES = ["Past behavior, irreversible","Past behavior, reversible","Current workaround","Frequency","Cost (time or money)","Strong language","Opinion or future intent"];
const EVIDENCE_DEF = {
  "Past behavior, irreversible":"Money spent, recurring time, or a workaround they built and keep using.",
  "Past behavior, reversible":"Tried something and dropped it, abandoned free trials.",
  "Current workaround":"What they use today instead of a real solution.",
  "Frequency":"How often it happens, in their words.",
  "Cost (time or money)":"Hours, dollars or grades lost.",
  "Strong language":"How they talk about it. Supports a score, never decides it.",
  "Opinion or future intent":"\"I would\", \"I'd probably\", \"sounds useful\". Weak evidence."
};
const SOURCES = ["Stranger (cold outreach)","Online community or follower","Referral from an interviewee","Classmate or acquaintance","Friend or family"];
const FREQ = [["Daily",5],["Weekly",4],["Monthly",3],["A few times a year",2],["Rarely",1]];
const CONSEQ = [[5,"Serious loss (money, grades, job, reputation)"],[4,"Real cost (hours or money lost, someone upset)"],[3,"Noticeable hassle that slows them down"],[2,"Minor annoyance"],[1,"Barely matters"]];
const JOB_TYPES = ["Functional","Emotional","Social"];
const DECISIONS = ["Undecided","Wedge","Later","Say no"];
const PERSONA_FIELDS = [
  ["who","Who they are (role and situation)"],
  ["moment","When the problem hits (the specific moment)"],
  ["workaround","What they do about it today"],
  ["cost","What it costs them (time, money, stress)"],
  ["words","How they describe it, in their own words"],
  ["buyer","Who decides or pays to fix it"],
  ["reach","Where we found them (how to reach more)"]
];
/* ---------------- helpers ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const opt = (v, cur, label) => `<option value="${esc(v)}"${String(v)===String(cur??"")?" selected":""}>${esc(label??v)}</option>`;
const today = () => new Date().toISOString().slice(0,10);
const pad = (n, w) => String(n).padStart(w, "0");
function nextId(prefix, list, width){
  let max = 0;
  for (const r of list){ const m = String(r.id).match(new RegExp("^" + prefix + "(\\d+)$")); if (m) max = Math.max(max, +m[1]); }
  return prefix + pad(max + 1, width);
}
function ago(ms){
  const s = (Date.now() - ms) / 1000;
  if (s < 90) return "just now";
  if (s < 3600) return Math.round(s/60) + " min ago";
  if (s < 86400) return Math.round(s/3600) + " h ago";
  return Math.round(s/86400) + " days ago";
}
function tierChip(t){ return t ? `<span class="chip tier ${TIER_CLASS[t]||""}">${esc(t)}</span>` : `<span class="chip gray">Not scored</span>`; }
function statusChip(s){ return `<span class="chip ${s==="Confirmed"?"ok":s==="Rejected"?"gray":"warn"}">${esc(s)}</span>`; }

/* Verbatim matching: is the quote really in the transcript, word for word? */
function quoteRegex(q){
  const t = String(q||"").trim().replace(/^["“”']+|["“”']+$/g,"").trim();
  if (t.length < 4) return null;
  const body = t.split(/\s+/).map(w => w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&").replace(/['’‘]/g,"['’‘]").replace(/["“”]/g,'["“”]')).join("\\s+");
  try { return new RegExp(body, "i"); } catch(e){ return null; }
}
function findInTranscript(quote, text){
  const re = quoteRegex(quote); if (!re || !text) return null;
  const m = re.exec(text); return m ? {start:m.index, end:m.index + m[0].length} : null;
}

/* ---------------- storage ---------------- */
const idb = {
  open(){ return new Promise((res, rej) => { const r = indexedDB.open("drm", 1); r.onupgradeneeded = () => r.result.createObjectStore("kv"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  async get(k){ const db = await this.open(); return new Promise(res => { const t = db.transaction("kv").objectStore("kv").get(k); t.onsuccess = () => res(t.result); t.onerror = () => res(undefined); }); },
  async set(k, v){ const db = await this.open(); return new Promise(res => { const t = db.transaction("kv","readwrite").objectStore("kv").put(v, k); t.onsuccess = () => res(); t.onerror = () => res(); }); }
};

const DIRS = {interviews:"interviews", evidence:"evidence", pains:"pain-scores", problems:"problems", jobs:"jobs", assumptions:"assumptions", places:"places"};

class FolderStore {
  constructor(root){ this.root = root; this.kind = "folder"; this.name = root.name; this.stamps = null; }
  async dir(path, create=true){ let d = this.root; for (const p of path.split("/").filter(Boolean)) d = await d.getDirectoryHandle(p, {create}); return d; }
  async write(path, text){
    const parts = path.split("/"); const file = parts.pop();
    const d = await this.dir(parts.join("/"));
    const fh = await d.getFileHandle(file, {create:true});
    const w = await fh.createWritable(); await w.write(text); await w.close();
    if (this.stamps) this.stamps[path] = (await (await fh.getFile()).lastModified);
  }
  async read(path){
    try { const parts = path.split("/"); const file = parts.pop(); const d = await this.dir(parts.join("/"), false); const f = await (await d.getFileHandle(file)).getFile(); return await f.text(); }
    catch(e){ return null; }
  }
  async remove(path){ try { const parts = path.split("/"); const file = parts.pop(); const d = await this.dir(parts.join("/"), false); await d.removeEntry(file); delete (this.stamps||{})[path]; } catch(e){} }
  async isInitialized(){ return (await this.read("drm/config.json")) !== null; }
  async hasGit(){ try { await this.root.getDirectoryHandle(".git"); return true; } catch(e){ return false; } }
  async hasAiInstructions(){ return (await this.read("CLAUDE.md")) !== null; }
  async lastPush(){
    try {
      const g = await this.root.getDirectoryHandle(".git");
      const r = await (await (await g.getDirectoryHandle("refs")).getDirectoryHandle("remotes")).getDirectoryHandle("origin");
      for (const b of ["main","master"]) { try { const f = await (await r.getFileHandle(b)).getFile(); return f.lastModified; } catch(e){} }
    } catch(e){}
    return null;
  }
  /* Snapshot of every data file's modified time, so the app can notice when an AI assistant writes into the folder. */
  async scan(){
    const out = {};
    let drm; try { drm = await this.root.getDirectoryHandle("drm"); } catch(e){ return out; }
    for await (const [name, h] of drm.entries()){
      if (h.kind === "file"){ out["drm/" + name] = (await h.getFile()).lastModified; continue; }
      for await (const [n2, h2] of h.entries()) if (h2.kind === "file") out[`drm/${name}/${n2}`] = (await h2.getFile()).lastModified;
    }
    return out;
  }
  async loadAll(){
    const S = emptyState();
    S.config = JSON.parse(await this.read("drm/config.json") || "{}");
    S.persona = JSON.parse(await this.read("drm/persona.json") || "null") || S.persona;
    S.compass = {...emptyCompass(), ...(JSON.parse(await this.read("drm/compass.json") || "null") || {})};
    for (const [key, dir] of Object.entries(DIRS)){
      let d; try { d = await this.dir("drm/" + dir, false); } catch(e){ continue; }
      for await (const [name, h] of d.entries()){
        if (h.kind !== "file" || !name.endsWith(".json")) continue;
        try { const rec = JSON.parse(await (await h.getFile()).text()); if (rec && rec.id) S[key].push(rec); else S.unreadable.push(`drm/${dir}/${name}`); }
        catch(e){ S.unreadable.push(`drm/${dir}/${name}`); }
      }
    }
    try {
      const d = await this.dir("drm/transcripts", false);
      for await (const [name, h] of d.entries()) if (h.kind === "file" && name.endsWith(".md")) S.transcripts[name.slice(0,-3)] = await (await h.getFile()).text();
    } catch(e){}
    try {
      const d = await this.dir("drm/notes", false);
      for await (const [name, h] of d.entries()) if (h.kind === "file" && name.endsWith(".md")){ const f = await h.getFile(); S.notes.push({name, text: await f.text(), modified: f.lastModified}); }
    } catch(e){}
    S.notes.sort((a, b) => b.modified - a.modified);
    this.stamps = await this.scan();
    migrate(S);
    return S;
  }
}

class MemoryStore {
  constructor(){ this.kind = "demo"; this.name = "Demo"; this.files = {}; }
  async write(p, t){ this.files[p] = t; } async read(p){ return this.files[p] ?? null; } async remove(p){ delete this.files[p]; }
  async hasGit(){ return true; } async lastPush(){ return null; } async hasAiInstructions(){ return true; } async scan(){ return {}; }
}

function emptyState(){
  return {config:{}, interviews:[], evidence:[], pains:[], problems:[], jobs:[], assumptions:[], places:[], compass:emptyCompass(), transcripts:{}, notes:[], unreadable:[],
          persona:{problemId:"", fields:Object.fromEntries(PERSONA_FIELDS.map(([k]) => [k, {text:"", evidence:[]}]))}};
}

/* ---------------- app state ---------------- */
let store = null, S = emptyState(), lastPush = null, saveErr = null, savedAt = null, aiReady = null;
function loadCollapsed(){ try { return JSON.parse(localStorage.getItem("drm-collapsed") || "{}"); } catch(e){ return {}; } }
let ui = {collapsed:loadCollapsed(), drafts:{transcript:{}, rubric:{}}, toast:null, importPreview:null, tab:{}, filters:{status:"All", problem:"All", type:"All"}, drawer:null, hideChecklist: localStorage.getItem("drm-hide-checklist") === "1"};

const sortById = a => a.sort((x, y) => String(x.id).localeCompare(String(y.id), undefined, {numeric:true}));
function byId(list, id){ return list.find(r => r.id === id); }

async function persist(type, rec){
  try {
    if (type === "config") await store.write("drm/config.json", JSON.stringify(S.config, null, 2));
    else if (type === "persona") await store.write("drm/persona.json", JSON.stringify(S.persona, null, 2));
    else if (type === "compass") await store.write("drm/compass.json", JSON.stringify(S.compass, null, 2));
    else if (type === "transcript") await store.write(`drm/transcripts/${rec.id}.md`, rec.text);
    else await store.write(`drm/${DIRS[type]}/${rec.id}.json`, JSON.stringify(rec, null, 2));
    saveErr = null; savedAt = Date.now(); scheduleReport();
  } catch(e){ saveErr = e.message || String(e); console.error(e); }
}
async function unpersist(type, id){ await store.remove(`drm/${DIRS[type]}/${id}.json`); scheduleReport(); }

let reportTimer = null;
function scheduleReport(){ clearTimeout(reportTimer); reportTimer = setTimeout(async () => { try { await store.write("README.md", buildReport()); } catch(e){ console.error(e); } }, 800); }

function upsert(type, rec){
  const list = S[type]; const i = list.findIndex(r => r.id === rec.id);
  rec.updatedAt = new Date().toISOString();
  if (i >= 0) list[i] = rec; else list.push(rec);
  persist(type, rec);
}
function removeRec(type, id){ S[type] = S[type].filter(r => r.id !== id); unpersist(type, id); }

/* ---------------- calculations ---------------- */
function confirmedPains(){ return S.pains.filter(p => p.status === "Confirmed"); }
function hygieneIssues(iv){ return (Number(iv.leading) > 0 ? 1 : 0) + (iv.pitched === "Yes" ? 1 : 0) + (iv.demoed === "Yes" ? 1 : 0); }
function topTier(ivId){
  const tiers = confirmedPains().filter(p => p.interviewId === ivId).map(p => TIERS.indexOf(p.tier)).filter(i => i >= 0);
  return tiers.length ? TIERS[Math.min(...tiers)] : "";
}
function problemStats(pr){
  const ps = confirmedPains().filter(p => p.problemId === pr.id);
  const counts = Object.fromEntries(TIERS.map(t => [t, ps.filter(p => p.tier === t).length]));
  const n = ps.length; const top2 = counts["Hair on Fire"] + counts["Incremental Improvement"];
  const share = n ? top2 / n : 0;
  const minN = Number(S.config.minInterviews ?? 5), strong = Number(S.config.strongShare ?? 0.5);
  const signal = n < minN ? "Need more interviews" : share >= strong ? "Strong signal" : "Weak signal";
  const quotes = S.evidence.filter(e => e.problemId === pr.id && e.status === "Confirmed").length;
  return {n, counts, share, signal, quotes};
}
/* Deterministic rubric check: does the cited evidence justify the tier? Same rule the AI is told to follow. */
function painCheck(p){
  const ev = (p.evidenceIds || []).map(id => byId(S.evidence, id)).filter(Boolean);
  const types = new Set(ev.map(e => e.type));
  const iv = byId(S.interviews, p.interviewId);
  const issues = [];
  if (!ev.length && p.tier && p.tier !== "Not a Problem") issues.push("No quotes cited. A tier needs evidence behind it.");
  const strongTiers = ["Hair on Fire","Incremental Improvement"];
  if (strongTiers.includes(p.tier) && iv && iv.recentInstance === "No") issues.push("They couldn't describe a specific, recent instance, so the ceiling is Nice to Have.");
  if (p.tier === "Hair on Fire" && !types.has("Past behavior, irreversible")) issues.push("Hair on Fire needs a quote showing irreversible investment (money spent, recurring time, a workaround they built and keep using).");
  if (p.tier === "Incremental Improvement" && !types.has("Past behavior, reversible") && !types.has("Current workaround") && !types.has("Past behavior, irreversible")) issues.push("Incremental Improvement needs a quote showing they tried something (reversible effort or a current workaround).");
  const onlyWeak = ev.length && [...types].every(t => ["Opinion or future intent","Strong language"].includes(t));
  if (onlyWeak && strongTiers.includes(p.tier)) issues.push("Every cited quote is opinion or language. Those support a score; they can't decide one.");
  const unconfirmed = ev.filter(e => e.status !== "Confirmed").length;
  if (unconfirmed) issues.push(`${unconfirmed} cited quote${unconfirmed > 1 ? "s aren't" : " isn't"} confirmed yet.`);
  const missing = (p.evidenceIds || []).filter(id => !byId(S.evidence, id));
  if (missing.length) issues.push(`Cites quotes that don't exist: ${missing.join(", ")}.`);
  return {ok: issues.length === 0, issues, types:[...types]};
}
function freqScore(f){ const x = FREQ.find(([k]) => k === f); return x ? x[1] : null; }
function jobStats(j){
  const fs = freqScore(j.frequency), cs = j.consequence ? Number(j.consequence) : null;
  const priority = fs && cs ? fs * cs : null;
  const linked = S.evidence.filter(e => e.jobId === j.id && e.status === "Confirmed");
  const costQuote = linked.some(e => e.type === "Cost (time or money)");
  const checks = [["Named workaround", !!(j.workaround||"").trim()],["Specific moment", !!(j.moment||"").trim()],["How often", !!j.frequency],["Confirmed cost quote", costQuote],["Their own words", linked.length > 0]];
  return {fs, cs, priority, linked, checks, met: checks.filter(c => c[1]).length};
}
function rankedJobs(){
  return S.jobs.map(j => ({j, s:jobStats(j)})).filter(x => x.s.priority !== null)
    .sort((a, b) => b.s.priority - a.s.priority || b.s.met - a.s.met || a.j.id.localeCompare(b.j.id));
}
function confirmedQuoteIds(){ return new Set(S.evidence.filter(e => e.status === "Confirmed").map(e => e.id)); }
function metrics(){
  const iv = S.interviews, n = iv.length;
  const ff = iv.filter(i => i.source === "Friend or family").length;
  return {
    n, ff, ffShare: n ? ff / n : 0,
    recent: iv.filter(i => i.recentInstance === "Yes").length,
    hygiene: iv.filter(i => hygieneIssues(i) > 0).length,
    pitched: iv.filter(i => i.pitched === "Yes").length,
    demoed: iv.filter(i => i.demoed === "Yes").length,
    leading: iv.reduce((a, i) => a + (Number(i.leading) || 0), 0),
    rubric: iv.filter(i => i.rubricRun).length,
    confirmed: S.evidence.filter(e => e.status === "Confirmed").length,
    opinion: S.evidence.filter(e => e.status === "Confirmed" && e.type === "Opinion or future intent").length,
    candidates: S.evidence.filter(e => e.status === "Candidate").length + S.pains.filter(p => p.status === "Candidate").length + (S.places || []).filter(p => p.status === "Candidate").length,
    rejected: S.evidence.filter(e => e.status === "Rejected").length,
    hof: iv.filter(i => topTier(i.id) === "Hair on Fire").length,
    painIssues: S.pains.filter(p => p.status !== "Rejected" && !painCheck(p).ok).length,
    tierCounts: Object.fromEntries(TIERS.map(t => [t, confirmedPains().filter(p => p.tier === t).length]))
  };
}

  return `You are reviewing one customer discovery interview for a startup founder. You suggest, the founder decides. Follow these rules exactly.

1. Quotes, not summaries. Every piece of evidence must be copied word for word from the transcript. Do not paraphrase, shorten, combine or fix grammar. If you can't find the exact words, leave it out.

4. Use only the exact labels listed below for types, tiers and Yes/No fields.

PART 1: INTERVIEW HYGIENE

function matchLabel(v, list){
  const t = String(v||"").trim().toLowerCase();
  return list.find(x => x.toLowerCase() === t) || list.find(x => t && (x.toLowerCase().startsWith(t) || t.startsWith(x.toLowerCase()))) || null;
}
const YN = v => { const t = String(v||"").trim().toLowerCase(); return t.startsWith("y") ? "Yes" : t.startsWith("n") ? "No" : ""; };

function parseRubric(text){
  const out = {hygiene:null, evidence:[], pains:[], skipped:[]};
  for (let raw of String(text||"").split(/\r?\n/)){
    let line = raw.trim();
    if (!line.includes("|") || line.startsWith("```")) continue;
    if (/^\|?[\s:\-|]+\|?$/.test(line)) continue;            // markdown table separator
    if (line.startsWith("|")) line = line.slice(1);
    if (line.endsWith("|")) line = line.slice(0, -1);
    let parts = line.split("|").map(s => s.trim());
    const head = parts[0].toLowerCase();
    if (/^(evidence id|interview id|specific recent)/.test(head)) continue;   // header rows
    if (/^-\s*evidence type/i.test(line) || line.startsWith("- ")) continue;   // stray instruction lines
    if (parts.length === 5 && YN(parts[0]) && !isNaN(parseInt(parts[1]))){
      out.hygiene = {recentInstance:YN(parts[0]), leading:parseInt(parts[1]), pitched:YN(parts[2]), demoed:YN(parts[3]), closing:YN(parts[4])};
    } else if (parts.length === 6 && matchLabel(parts[2], TIERS)){
      out.pains.push({aiInterview:parts[0], problemRef:parts[1], tier:matchLabel(parts[2], TIERS), evidenceIds:parts[3].split(/[,;\s]+/).filter(Boolean)});
    } else if (parts.length >= 9){
      const tail = parts.slice(-4); const quote = parts.slice(4, parts.length - 4).join("/");
      out.evidence.push({aiId:parts[0], problemRef:parts[2], jobRef:parts[3], quote:quote.replace(/^["“]|["”]$/g,"").trim(), where:tail[0], typeRaw:tail[1], type:matchLabel(tail[1], EVIDENCE_TYPES)});
    } else out.skipped.push(raw);
  }
  return out;
}

function planImport(iv, parsed){
  // Work out IDs, new problems and verbatim checks before anything is saved.
  const transcript = S.transcripts[iv.id] || "";
  const newProblems = []; const problemMap = {};
  let prList = [...S.problems];
  function resolveProblem(ref){
    const r = String(ref||"").trim(); if (!r) return "";
    if (problemMap[r] !== undefined) return problemMap[r];
    if (byId(S.problems, r)) return problemMap[r] = r;
    const m = r.match(/^NEW\s*:?\s*(.+)$/i);
    const text = m ? m[1].trim() : r;
    const same = prList.find(p => p.text.toLowerCase() === text.toLowerCase());
    if (same) return problemMap[r] = same.id;
    const id = nextId("PR-", prList, 2); const p = {id, text, who:""}; prList.push(p); newProblems.push(p);
    return problemMap[r] = id;
  }
  const idMap = {}; let evList = [...S.evidence];
  const evidence = parsed.evidence.map(e => {
    let id = e.aiId && /^[A-Za-z0-9_-]+$/.test(e.aiId) && e.aiId.startsWith(iv.id) && !byId(evList, e.aiId) ? e.aiId : null;
    if (!id) id = nextId(iv.id + "-Q", evList.filter(x => x.id.startsWith(iv.id + "-Q")), 2);
    idMap[e.aiId] = id;
    const rec = {id, interviewId:iv.id, problemId:resolveProblem(e.problemRef), jobId:byId(S.jobs, e.jobRef) ? e.jobRef : "", quote:e.quote, where:e.where, type:e.type || "", foundBy:"Claude Code", status:"Candidate", note: e.type ? "" : `AI type: ${e.typeRaw}`};
    evList.push(rec);
    rec._verbatim = !!findInTranscript(rec.quote, transcript);
    return rec;
  });
  const pains = parsed.pains.map(p => {
    const problemId = resolveProblem(p.problemRef);
    const id = `${iv.id}__${problemId}`;
    const existing = byId(S.pains, id);
    return {id, interviewId:iv.id, problemId, tier:p.tier, evidenceIds:p.evidenceIds.map(x => idMap[x] || x), scoredBy:"Claude Code", status:"Candidate", disagree:"", _skip: existing && existing.status === "Confirmed"};
  });
  return {hygiene:parsed.hygiene, evidence, pains, newProblems, skipped:parsed.skipped};
}

function applyImport(iv, plan, raw){
  for (const p of plan.newProblems) upsert("problems", {...p});
  for (const e of plan.evidence){ const r = {...e}; delete r._verbatim; upsert("evidence", r); }
  for (const p of plan.pains){ if (p._skip) continue; const r = {...p}; delete r._skip; upsert("pains", r); }
  const updated = {...iv, rubricRun:true, rubricRaw:raw};
  if (plan.hygiene) Object.assign(updated, plan.hygiene);
  upsert("interviews", updated);
}

/* Minimal markdown rendering for the in-app report preview */
function renderMd(md){
  const lines = md.split("\n"); let html = "", inTable = false, inList = false;
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/_(.+?)_/g,"<i>$1</i>").replace(/\[(.+?)\]\((.+?)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  for (const l of lines){
    if (l.startsWith("|")){
      if (/^\|[-| ]+\|$/.test(l)) continue;
      const cells = l.slice(1, -1).split("|").map(c => c.trim());
      if (!inTable){ html += "<table><tr>" + cells.map(c => `<th>${inline(c)}</th>`).join("") + "</tr>"; inTable = true; }
      else html += "<tr>" + cells.map(c => `<td>${inline(c)}</td>`).join("") + "</tr>";
      continue;
    } else if (inTable){ html += "</table>"; inTable = false; }
    if (l.startsWith("- ")){ if (!inList){ html += "<ul>"; inList = true; } html += `<li>${inline(l.slice(2))}</li>`; continue; }
    else if (inList){ html += "</ul>"; inList = false; }
    if (l.startsWith("### ")) html += `<h3>${inline(l.slice(4))}</h3>`;
    else if (l.startsWith("## ")) html += `<h2>${inline(l.slice(3))}</h2>`;
    else if (l.startsWith("# ")) html += `<h1>${inline(l.slice(2))}</h1>`;
    else if (l.startsWith("> ")) html += `<blockquote>${inline(l.slice(2))}</blockquote>`;
    else if (l === "---") html += "<hr>";
    else if (l.trim()) html += `<p>${inline(l)}</p>`;
  }
  if (inTable) html += "</table>"; if (inList) html += "</ul>";
  return html;
}

/* Seed points from the canvas. Idempotent: each seed has a key; existing ones are kept. */
function seedAssumptions(){

  for (const c of (S.compass.customers||[]).filter(c => !c.ideal)) seeds.push({key:"customers:" + c.id, kind:"customers", customerId:c.id, text:`${c.text} have this problem too`});

/* ---- map geometry. pos is {x: 0..1 likely wrong -> likely right, y: 0..1 inconvenient -> catastrophic}, or null when

const MAP = {size:600, shelfTop:370, shelfH:120, pad:0.04, margin:90};
const WORLD = {x0:-MAP.size / 2 - MAP.margin, x1:MAP.size / 2 + MAP.margin, y0:-MAP.size / 2 - 50, y1:MAP.shelfTop + MAP.shelfH + 20};
function worldOf(pos){ return {x:(pos.x - 0.5) * MAP.size, y:(0.5 - pos.y) * MAP.size}; }
function posOf(w){ return {x:w.x / MAP.size + 0.5, y:0.5 - w.y / MAP.size}; }
function clampWorld(w){ return {x:Math.min(WORLD.x1, Math.max(WORLD.x0, w.x)), y:Math.min(WORLD.y1, Math.max(WORLD.y0, w.y))}; }
function inGrid(pos){ return !!pos && pos.x >= -MAP.pad && pos.x <= 1 + MAP.pad && pos.y >= -MAP.pad && pos.y <= 1 + MAP.pad; }
function clampPos(pos){ return {x:Math.min(1, Math.max(0, pos.x)), y:Math.min(1, Math.max(0, pos.y))}; }
function ratingOf(pos){ if (!inGrid(pos)) return {impact:"", confidence:""}; const c = v => Math.min(5, Math.max(1, Math.round(1 + v * 4))); return {impact:c(pos.y), confidence:c(pos.x)}; }

    if (share >= strong) return {status:"Holding up", why:`${top2} of ${n} interviews are Hair on Fire or Incremental (${Math.round(share*100)}%)${q}`, n, share};

    if (a.status === "Retired") continue;
    const b = aiBasis(a);
    if (b.kind === "missing") push("bad", a.id, "compass/map/" + a.id, "AI cites quotes that don't exist in this folder.");
    if (b.kind === "guess") push("info", a.id, "compass/map/" + a.id, "AI rated this with no evidence. Treat it as a second opinion, not a finding.");
    if (a.status === "Active" && !assumptionPriority(a)) push("info", a.id, "compass/map/" + a.id, "Not placed in the grid yet, so it has no priority.");
  }
  for (const iv of S.interviews){
    if (!iv.customerId && S.compass.customers.length) push("info", iv.id, "interviews/" + iv.id, "No customer segment set, so it can't count toward the early-adopter bet.");
    if (!S.transcripts[iv.id]) push("warn", iv.id, "interviews/" + iv.id, "No transcript saved.");
  }
  for (const f of S.unreadable || []) push("bad", f, "home", "File couldn't be read and was skipped.");
  return out;
}

/* 04 Assumptions Map: the whole screen is the canvas. Left click adds a point, drag a point to rate it,
   drag its label to tidy up, right-drag to pan, scroll to zoom. The grid's edge is as far as a point goes. */
const statusDot = s => s === "Holding up" ? "ok" : s === "Shaky" ? "warn" : s === "Contradicted" ? "bad" : "none";
const LABEL_DEFAULT = {dx:18, dy:0};
function labelOf(a){ const l = a.label && typeof a.label === "object" ? a.label : LABEL_DEFAULT; return {dx:Number(l.dx) || 0, dy:Number(l.dy) || 0}; }
function pointHtml(x, w, extra){
  const a = x.a; const sel = ui.selNote === a.id; const l = labelOf(a); const k = ASSUMPTION_KINDS[a.kind] || {short:"?"};
  return `<div class="pt ${extra || ""} ${sel ? "sel" : ""} ${a.status === "Candidate" ? "cand" : ""}" data-pt="${esc(a.id)}" style="left:${w.x}px;top:${w.y}px"><span class="dotp s-${statusDot(x.s.status)}"></span></div>
  <div class="lbx ${sel ? "sel" : ""} ${a.status === "Candidate" ? "cand" : ""}" data-lab="${esc(a.id)}" data-act="aText" data-id="${esc(a.id)}" contenteditable="plaintext-only" data-ph="Type the assumption" data-k="${esc(k.short)}" style="left:${w.x + l.dx}px;top:${w.y + l.dy}px">${esc(a.text)}</div>`;
}
function mapView(){
  const r = compassReadout(); const ranked = rankedAssumptions();
  const active = ranked.filter(x => x.a.status === "Active"), cands = ranked.filter(x => x.a.status === "Candidate");
  const placed = active.filter(x => inGrid(x.a.pos));
  const shelf = active.filter(x => !inGrid(x.a.pos)).concat(cands);
  const sel = ui.selNote ? byId(S.assumptions, ui.selNote) : null;
  const h = MAP.size / 2;
  const ai = active.filter(x => x.a.aiImpact && x.a.aiConfidence).map(x => ({x, w:worldOf({x:(Number(x.a.aiConfidence) - 1) / 4, y:(Number(x.a.aiImpact) - 1) / 4})}));
  const lab = (x, y, cls, text) => `<div class="wlab ${cls || ""}" style="left:${x}px;top:${y}px"><span>${text}</span></div>`;
  const worldPos = x => inGrid(x.a.pos) ? worldOf(x.a.pos) : shelfWorld(shelf.indexOf(x));
  const leaders = active.concat(cands).map(x => { const w = worldPos(x); const l = labelOf(x.a); return `<line x1="${w.x}" y1="${w.y}" x2="${w.x + l.dx}" y2="${w.y + l.dy}" stroke="#afc6d1" stroke-width="1.2"/>`; }).join("");
  const steps = [["canvas","01 Leaner Canvas"],["value","02 Value Proposition"],["problem","03 Problem Statement"],["map","04 Assumptions Map"],["leads","05 Leads List"]];
  const counts = ["Holding up","Shaky","Untested","Contradicted"].map(k => `<span class="cnt" title="${k === "Untested" ? "No evidence yet" : k}"><i class="dotp s-${statusDot(k)}"></i>${r.counts[k]}</span>`).join("");
  return `<div class="mapfull">
    <div class="tabstrip"><div class="tabs" style="margin:0;border:none">${steps.map(([k, l]) => `<button class="${k === "map" ? "on" : ""}" data-act="go" data-href="compass/${k}">${l}</button>`).join("")}</div>
      <div class="row" style="gap:6px"><span class="counts">${counts}</span>
        <button class="btn sm" data-act="seedAssumptions" title="Make a point for each item on your canvas">${S.assumptions.length ? "Points from canvas" : "Make points from my canvas"}</button>
        <button class="btn sm ${ui.mapShelf ? "pri" : ""}" data-act="toggleShelf" title="My riskiest assumption, how I'll get evidence, ask your AI">Notes</button>
        <button class="btn sm" data-act="toggleFull" title="${ui.mapFull ? "Show the sidebar" : "Hide the sidebar"}">${ui.mapFull ? "⤡" : "⤢"}</button></div></div>
    <div class="vp full" id="vp">
      <div class="world" id="world">
        <div class="bounds" style="left:${WORLD.x0}px;top:${WORLD.y0}px;width:${WORLD.x1 - WORLD.x0}px;height:${WORLD.y1 - WORLD.y0}px"></div>
        <div class="quad" style="left:${-h}px;top:${-h}px;width:${h}px;height:${h}px"></div>
        <div class="region grid" style="left:${-h}px;top:${-h}px;width:${MAP.size}px;height:${MAP.size}px"></div>
        <div class="axis h" style="left:${-h}px;top:-1px;width:${MAP.size}px"></div><div class="axis v" style="top:${-h}px;left:-1px;height:${MAP.size}px"></div>
        ${lab(0, -h - 16, "", "Catastrophic")}${lab(0, h + 16, "", "Inconvenient")}${lab(-h - 14, 0, "l", "Likely wrong")}${lab(h + 14, 0, "r", "Likely right")}

        ${ai.map(g => `<div class="pt ai ${ui.selNote === g.x.a.id ? "sel" : ""}" style="left:${g.w.x}px;top:${g.w.y}px"><span class="dotp"></span><span class="lbl">AI</span></div>`).join("")}
        ${shelf.map((x, i) => pointHtml(x, shelfWorld(i), "parked")).join("")}
        ${placed.map(x => pointHtml(x, worldOf(x.a.pos))).join("")}
      </div>
      <div class="hud"><button class="btn" data-act="mapZoom" data-val="out" title="Zoom out">−</button><button class="btn" data-act="mapZoom" data-val="in" title="Zoom in">+</button><button class="btn" data-act="mapZoom" data-val="fit">Fit</button></div>
      <div class="legend"><span><i style="background:var(--teal)"></i>Holding up</span><span><i style="background:var(--yellow)"></i>Shaky</span><span><i style="background:var(--coral)"></i>Contradicted</span><span><i style="background:#fff"></i>No evidence yet</span><span><i style="border:1.5px dashed var(--coral)"></i>AI's placement</span></div>
      <div class="hint2">Click to add a point · drag a point to rate it · drag its label to tidy · right-drag to pan · scroll to zoom</div>
      ${sel ? selCard(sel) + youPanel(sel) + aiPanel(sel) : ""}

/* Pop-out shelf: the toolkit's two boxes and the AI ask, off the canvas until wanted. */
function notesShelf(r){

    ${r.candidates ? `<div class="notice warn">${r.candidates} point${r.candidates > 1 ? "s" : ""} suggested by your AI ${r.candidates > 1 ? "are" : "is"} waiting below the grid. Click one to accept or dismiss it.</div>` : ""}

/* The selected point: what the evidence says. Neither yours nor the AI's: the data's. Floats at the top of the canvas. */
function selCard(a){
  const x = {a, p:assumptionPriority(a), s:assumptionStatus(a)}; const k = ASSUMPTION_KINDS[a.kind] || {label:a.kind, test:""};
  const area = areaOf(a);
  const link = a.kind === "problem" && a.problemId ? `<a href="#/problems/${esc(a.problemId)}">Open this problem's evidence</a>` : `<a href="#/insights/${area}">Open ${esc(AREAS[area].title)} insights</a>`;
  const taggable = !((a.kind === "problem" && a.problemId) || ((a.kind === "early-adopters" || a.kind === "customers") && a.customerId));
  const tagged = (a.evidence || []).map(t => ({...t, e:byId(S.evidence, t.id)})).filter(t => t.e);
  const confirmedQuotes = S.evidence.filter(e => e.status === "Confirmed");
  const where = x.p ? `<span class="chip gray">Priority ${x.p}</span>` : `<span class="chip warn">Not rated yet</span>`;
  return `<div class="ov ov-t selbar">
    <div class="spread"><div class="row" style="gap:6px"><span class="mono muted">${esc(a.id)}</span><span class="chip blue">${esc(k.label)}</span>${where}${a.status === "Candidate" ? `<span class="ai">Suggested by ${esc(a.foundBy || "AI")}</span>` : ""}</div>
      <div class="row">${a.status === "Candidate" ? `<button class="btn sm" data-act="aStatus" data-id="${esc(a.id)}" data-val="Retired">Dismiss</button><button class="btn pri sm" data-act="aStatus" data-id="${esc(a.id)}" data-val="Active">Accept</button>` : ""}<button class="btn icon" data-act="closeNote" title="Close (Esc)">✕</button></div></div>
    <div class="notice ${x.s.status === "Holding up" ? "ok" : x.s.status === "Contradicted" ? "bad" : x.s.status === "Shaky" ? "warn" : "plain"}" style="margin-top:8px"><b>${esc(x.s.status === "Untested" ? "No evidence yet" : x.s.status)}.</b> ${esc(x.s.why)}. <span class="muted">Read from ${esc(k.test)}.</span> ${link}</div>
    ${taggable ? `<details class="fold" style="margin-top:8px;padding:6px 12px"><summary>Quotes for and against (${tagged.length})</summary>
      ${tagged.map(t => `<div class="q compact s-${esc(t.e.status)}" style="margin:8px 0 6px"><div class="spread"><span class="words">${esc(t.e.quote)}</span><div class="row"><span class="seg"><button class="${t.stance === "supports" ? "on" : ""}" data-act="aStance" data-id="${esc(a.id)}" data-eid="${esc(t.id)}" data-val="supports">For</button><button class="${t.stance === "contradicts" ? "on" : ""}" data-act="aStance" data-id="${esc(a.id)}" data-eid="${esc(t.id)}" data-val="contradicts">Against</button></span><button class="btn icon no" title="Untag" data-act="aUntag" data-id="${esc(a.id)}" data-eid="${esc(t.id)}">✕</button></div></div><div class="meta"><a href="#/interviews/${esc(t.e.interviewId)}">${esc(t.e.interviewId)}</a>${t.e.status !== "Confirmed" ? statusChip(t.e.status) : ""}</div></div>`).join("")}
      <select data-act="aTag" data-id="${esc(a.id)}" style="max-width:100%;margin-top:6px"><option value="">Tag a confirmed quote…</option>${confirmedQuotes.filter(e => !(a.evidence||[]).some(t => t.id === e.id)).map(e => opt(e.id, "", `${e.id}: ${e.quote.slice(0, 90)}`)).join("")}</select></details>` : ""}
  </div>`;
}
function scale5(name, id, val){ return `<span class="seg you">${[1,2,3,4,5].map(n => `<button class="${String(val) === String(n) ? "on" : ""}" data-act="aScale" data-id="${esc(id)}" data-field="${name}" data-val="${n}">${n}</button>`).join("")}</span>`; }
function bar5(val, cls){ const v = Number(val) || 0; return `<div class="rate">${[1,2,3,4,5].map(n => `<i class="${n <= v ? cls : ""}"></i>`).join("")}</div>`; }
/* Your side of the page. */
function youPanel(a){
  const p = assumptionPriority(a);
  return `<div class="ov ov-l panel p-you"><h4>You</h4>
    <div class="lab">Impact if wrong</div>${scale5("impact", a.id, a.impact)}<div class="rate-l"><span>inconvenient</span><span>catastrophic</span></div>
    <div class="lab">Likely right?</div>${scale5("confidence", a.id, a.confidence)}<div class="rate-l"><span>likely wrong</span><span>likely right</span></div>
    <div class="lab">Priority</div><div>${p ? `<b style="font-size:20px">${p}</b> <span class="small muted">impact × (6 − confidence)</span>` : `<span class="small muted">Pick numbers above or drag the point into the grid.</span>`}</div>
    <div class="lab">Kind of bet</div><select class="inline" data-act="aKind" data-id="${esc(a.id)}">${Object.entries(ASSUMPTION_KINDS).map(([k2, v]) => opt(k2, a.kind, v.label)).join("")}</select>
    ${a.kind === "problem" ? `<div class="lab">Linked problem</div><select class="inline" data-act="aLink" data-id="${esc(a.id)}" data-field="problemId" style="max-width:100%"><option value="">None</option>${S.problems.map(pr => opt(pr.id, a.problemId, pr.id + ": " + pr.text)).join("")}</select>` : ""}
    ${(a.kind === "early-adopters" || a.kind === "customers") ? `<div class="lab">Linked segment</div><select class="inline" data-act="aLink" data-id="${esc(a.id)}" data-field="customerId" style="max-width:100%"><option value="">None</option>${(S.compass.customers||[]).map(c => opt(c.id, a.customerId, c.text)).join("")}</select>` : ""}
    <div class="lab">Your note</div>${ed("aNote", `data-id="${esc(a.id)}"`, a.note, "Anything to remember about this one", "sans")}
    ${a.status === "Active" ? `<div style="margin-top:14px"><button class="btn sm" data-act="aStatus" data-id="${esc(a.id)}" data-val="Retired">Retire this point</button></div>` : ""}
  </div>`;
}
/* The AI's side of the page. Always says what the rating rests on. */
function aiPanel(a){
  const basis = aiBasis(a); const p = aiPriority(a); const dis = disagreement(a);
  if (basis.kind === "none") return `<div class="ov ov-r panel p-ai"><h4>Your AI</h4><p class="small muted" style="margin:0 0 8px">Hasn't rated this one. In your AI assistant, say:</p><pre class="code" style="margin:0 0 8px">Rank the riskiest assumptions</pre><button class="btn sm" data-act="copyText" data-text="Rank the riskiest assumptions">Copy</button><p class="hint" style="margin-top:12px">It rates every point for impact and confidence, lists the quotes it relied on, and is told to say so when it has none.</p></div>`;
  return `<div class="ov ov-r panel p-ai"><h4>Your AI</h4>
    <div style="margin-bottom:12px">${basis.kind === "evidence" ? `<span class="stamp ok">${esc(basis.label)}</span>` : `<span class="stamp">${esc(basis.label)}</span>`}</div>
    <div class="lab">Impact if wrong <span class="muted">${esc(a.aiImpact || "?")}</span></div>${bar5(a.aiImpact, "ai")}<div class="rate-l"><span>inconvenient</span><span>catastrophic</span></div>
    <div class="lab">Likely right? <span class="muted">${esc(a.aiConfidence || "?")}</span></div>${bar5(a.aiConfidence, "ai")}<div class="rate-l"><span>likely wrong</span><span>likely right</span></div>
    <div class="lab">Priority</div><div>${p ? `<b style="font-size:20px">${p}</b>` : `<span class="small muted">Incomplete rating</span>`}</div>
    <div class="lab">Why</div><p class="small" style="margin:0">${esc(a.aiReason || "No reason given.")}</p>
    ${basis.ids.length ? `<div class="lab">What it relied on</div>${basis.ids.map(id => { const e = byId(S.evidence, id); return e ? `<div class="q compact s-${esc(e.status)}" style="margin:0 0 6px;padding:8px 10px 6px 12px"><span class="words" style="font-size:13.5px">${esc(e.quote)}</span><div class="meta"><a href="#/interviews/${esc(e.interviewId)}">${esc(e.interviewId)}</a>${e.status !== "Confirmed" ? statusChip(e.status) : ""}</div></div>` : `<span class="chip bad">${esc(id)} not found</span>`; }).join("")}` : `<p class="hint" style="margin-top:10px">${basis.kind === "guess" ? "It had no confirmed quotes to go on. This is a reasoned guess, the same kind you're making. Interviews settle it." : ""}</p>`}
    ${dis ? `<div class="notice warn" style="margin-top:10px">You and your AI are 2 or more apart. Who's reading the evidence right?</div>` : ""}
  </div>`;
}

/* 05 Leads List */

  <table><tr><th style="width:30px"></th><th>Name<div class="hint" style="font-weight:400">Who could you talk to?</div></th><th>Organisation<div class="hint" style="font-weight:400">Work, club, community</div></th><th>Why?<div class="hint" style="font-weight:400">What do they know about the problem?</div></th><th>How?<div class="hint" style="font-weight:400">Intro, DM, email, event</div></th><th>Done</th></tr>
  ${Array.from({length: rows}, (_, i) => { const l = leads[i]; if (!l) return `<tr><td class="muted">${i+1}</td><td colspan="5"><button class="add" data-act="cAdd" data-kind="leads">+ Add a lead</button></td></tr>`;
    return `<tr><td class="muted">${i+1}</td>${["name","org","why","how"].map(f => `<td>${ed("cItem", `data-kind="leads" data-id="${esc(l.id)}" data-field="${f}"`, l[f], "", "sans")}</td>`).join("")}<td><div class="row" style="flex-wrap:nowrap"><input type="checkbox" data-act="leadDone" data-id="${esc(l.id)}" ${l.done ? "checked" : ""} title="Done">${l.interviewId ? `<a class="small" href="#/interviews/${esc(l.interviewId)}">${esc(l.interviewId)}</a>` : `<button class="btn sm" data-act="leadInterview" data-id="${esc(l.id)}">Log interview</button>`}<button class="btn icon no" title="Remove" data-act="cRemove" data-kind="leads" data-id="${esc(l.id)}">✕</button></div></td></tr>`; }).join("")}</table>
  ${sheetFoot("05")}</div>
  ${stepNav("compass/map", "Back", "interviews", "Next: interviews")}`;

/* ---------------- Insights: one page per focus area ---------------- */
function statusChipA(s){ return `<span class="chip ${s === "Holding up" ? "ok" : s === "Contradicted" ? "bad" : s === "Shaky" ? "warn" : "gray"}">${esc(s === "Untested" ? "No evidence yet" : s)}</span>`; }
const statusColor = s => s === "Holding up" ? "var(--teal)" : s === "Contradicted" ? "var(--coral)" : s === "Shaky" ? "var(--yellow)" : "var(--line-2)";
function pointTile(x){
  const a = x.a, s = x.s; const b = aiBasis(a); const k = ASSUMPTION_KINDS[a.kind] || {label:a.kind};
  return `<div class="tile click" data-act="openPoint" data-id="${esc(a.id)}" style="border-left:4px solid ${statusColor(s.status)}">
    <div class="belief" style="font-size:14.5px">${esc(a.text || "untitled point")}</div>
    <div class="row small" style="margin-top:8px;gap:6px"><span class="chip gray">${esc(k.label)}</span>${statusChipA(s.status)}${x.p ? `<span class="chip blue">Priority ${x.p}</span>` : `<span class="chip warn">Not rated</span>`}${b.kind === "guess" ? `<span class="chip bad">AI guessed</span>` : b.kind === "evidence" ? `<span class="chip ok">AI: ${esc(b.label.toLowerCase())}</span>` : ""}</div>
    <div class="h" style="margin-top:6px">${esc(s.why)}.</div></div>`;
}
function statusTiles(counts){
  return `<div class="tiles">${[["Holding up","good"],["Shaky","warn"],["Untested",""],["Contradicted","bad"]].map(([k, cls]) => `<div class="tile ${counts[k] ? cls : ""}"><div class="n">${counts[k]}</div><div class="l">${k === "Untested" ? "No evidence yet" : k}</div></div>`).join("")}</div>`;
}
function beliefBox(area){
  const C = S.compass; const probs = sortById([...S.problems]);
  let inner = "";
  if (area === "problem") inner = `<div class="belief">${esc(problemStatementText())}</div>${probs.map(p => `<div class="belief" style="margin-top:8px"><a href="#/problems/${esc(p.id)}" style="color:inherit;text-decoration:none"><span class="mono muted" style="font-size:12px">${esc(p.id)}</span> ${esc(p.text)}</a> <span class="small muted">${esc(p.who || "")}</span></div>`).join("")}`;
  else if (area === "customers") inner = `${(C.customers||[]).map(cu => `<div class="belief">${cu.ideal ? `<span class="chip blue" style="vertical-align:2px">1 · ideal</span> ` : ""}${esc(cu.text)}</div>`).join("") || `<div class="belief muted">No customers on the canvas yet.</div>`}<div class="belief" style="margin-top:8px"><span class="small muted">Leads list:</span> ${(C.leads||[]).length} name${(C.leads||[]).length === 1 ? "" : "s"}, ${(C.leads||[]).filter(l => l.done).length} talked to. <a href="#/compass/leads">Open it.</a></div>`;
  else if (area === "solution") inner = `${probs.map(p => `<div class="belief"><span class="mono muted" style="font-size:12px">${esc(p.id)}</span> ${esc((C.solutions||{})[p.id] || "No solution written yet")}</div>`).join("") || `<div class="belief muted">No problems on the canvas yet.</div>`}<div class="belief" style="margin-top:8px">${esc(valuePropText())}</div>`;
  else inner = `${(C.alternatives||[]).map(a => `<div class="belief"><b>${esc(a.name)}</b>${a.gap ? ` <span class="muted">leaves this gap:</span> ${esc(a.gap)}` : ""}</div>`).join("") || `<div class="belief muted">No alternatives on the canvas yet.</div>`}<div class="belief" style="margin-top:8px">They will choose it over ${esc(C.valueProp.over || "[competitors]")} because our solution is ${esc(C.valueProp.why || "[differentiation]")}.</div>`;
  return `<div class="box soft"><h3>What you believe</h3><p class="ins">From your Compass. <a href="#/compass/${area === "problem" ? "problem" : area === "solution" ? "value" : "canvas"}">Edit it there.</a></p>${inner}</div>`;
}
function insightsView(area){
  area = AREAS[area] ? area : "problem";
  const A = AREAS[area]; const r = areaReadout(area);
  const tabs = `<div class="tabs" style="margin-top:0">${Object.entries(AREAS).map(([k, v]) => `<button class="${area === k ? "on" : ""}" data-act="go" data-href="insights/${k}">${v.title}</button>`).join("")}</div>`;
  let evidence = "";
  if (area === "problem") evidence = `<h2>Pain per problem</h2>${problemsTiles()}`;
  else if (area === "customers") evidence = `<h2>Who feels it most</h2>${segmentTable()}<h2>Where your interviews came from</h2>${sourceTiles()}<h2>Where to look next</h2>${placesList()}<h2>Customer persona</h2>${personaSummary()}`;
  else if (area === "solution") evidence = `<h2>What they do today</h2><p class="lede">Solution bets are tested by tagging confirmed quotes for or against them. Workarounds and past behavior are the best place to look.</p>${quoteList(S.evidence.filter(e => e.status === "Confirmed" && ["Current workaround","Past behavior, irreversible","Past behavior, reversible"].includes(e.type)))}
    <details class="fold"><summary>Later: jobs to be done and MVP scope</summary><p class="small">Kept for when the problem holds up. A job is the progress a customer is trying to make at a specific moment. <a href="#/jobs">Jobs</a> · <a href="#/mvp">MVP scope</a></p></details>`;
  else evidence = `<h2>Alternatives, one by one</h2>${alternativesTable()}`;
  return tabs + `<div class="sheet">${docHead("Insights", esc(A.title), esc(A.lede))}
  ${statusTiles(r.counts)}
  <div class="boxes g2">${beliefBox(area)}<div class="box soft"><h3>How this gets tested</h3><p class="ins">Status is read from your confirmed evidence, never typed in.</p>
    <p class="small" style="margin:0">${area === "problem" ? "Each problem bet holds up when enough confirmed interviews score it Hair on Fire or Incremental Improvement." : area === "customers" ? "The early-adopter bet holds up when your ideal segment shows more real pain than the other segments; set the segment on each interview so it counts. Your AI reads every transcript for where these people gather and suggests places to look; a place with no quote behind it is a guess until you've been there." : area === "solution" ? "Tag confirmed quotes for or against each solution bet from its point on the map. Behavior counts; “I would use it” doesn't." : "Tag confirmed quotes for or against each alternative or competition bet. A workaround they keep using is a quote about an alternative."}</p></div></div>
  <h2>Your bets in this area</h2>
  ${r.list.length ? `<div class="boxes g2" style="margin-bottom:6px">${r.list.map(pointTile).join("")}</div>` : `<div class="empty">No ${esc(A.title.toLowerCase())} points yet. <a href="#/compass/map">Add them on the map.</a></div>`}
  ${evidence}
  ${sheetFoot("")}</div>`;
}
function problemsTiles(){
  const minN = Number(S.config.minInterviews ?? 5);
  if (!S.problems.length) return `<div class="empty">No problems yet. <a href="#/compass/canvas">Add them on the Leaner Canvas.</a></div>`;
  return `<div class="boxes g2">${sortById([...S.problems]).map(p => { const s = problemStats(p); const pct = Math.min(100, s.n / minN * 100);
    return `<div class="tile click" data-href="problems/${esc(p.id)}"><div class="spread"><div class="belief" style="font-size:14.5px"><span class="mono muted" style="font-size:12px">${esc(p.id)}</span> ${esc(p.text)}</div>${signalChip(s.signal)}</div>
      <div class="bar" style="margin:10px 0 6px"><div style="width:${pct}%;background:${s.signal === "Strong signal" ? "var(--teal)" : "var(--sky)"}"></div></div>
      <div class="row small" style="gap:6px"><span>${s.n} of ${minN} confirmed interviews</span>${TIERS.filter(t => s.counts[t]).map(t => `<span class="chip tier ${TIER_CLASS[t]}">${esc(t)}: ${s.counts[t]}</span>`).join("")}<span class="muted">${s.quotes} confirmed quote${s.quotes === 1 ? "" : "s"}</span></div></div>`; }).join("")}</div>
  <p class="hint">Strong signal: at least ${esc(minN)} confirmed interviews score it and ${Math.round((S.config.strongShare ?? .5)*100)}% or more land in Hair on Fire or Incremental Improvement. Change this in Settings.</p>`;
}
function personaSummary(){
  const P = S.persona; const filled = PERSONA_FIELDS.filter(([k]) => P.fields[k] && P.fields[k].text);
  const backed = filled.filter(([k]) => (P.fields[k].evidence||[]).some(id => { const e = byId(S.evidence, id); return e && e.status === "Confirmed"; }));
  return `<div class="tiles" style="grid-template-columns:repeat(3,minmax(0,1fr))"><div class="tile ${filled.length ? "" : ""}"><div class="n">${filled.length}<span class="muted" style="font-size:14px;font-weight:500"> of ${PERSONA_FIELDS.length}</span></div><div class="l">lines written</div></div><div class="tile ${filled.length && backed.length === filled.length ? "good" : filled.length ? "bad" : ""}"><div class="n">${backed.length}</div><div class="l">backed by a confirmed quote</div><div class="h">A line with no quote is a guess.</div></div><div class="tile click" data-href="persona"><div class="n">→</div><div class="l">Open the persona</div></div></div>`;
}
function sourceTiles(){
  const n = S.interviews.length; if (!n) return `<div class="empty">No interviews yet.</div>`;
  const counts = SOURCES.map(s => [s, S.interviews.filter(i => i.source === s).length]).filter(([, k]) => k);
  const unknown = S.interviews.filter(i => !i.source).length;
  return `<div class="tiles" style="grid-template-columns:repeat(${Math.min(4, counts.length + (unknown ? 1 : 0)) || 1},minmax(0,1fr))">${counts.map(([s, k]) => `<div class="tile ${s === "Friend or family" && k / n > 0.3 ? "warn" : s.startsWith("Stranger") ? "good" : ""}"><div class="n">${k}</div><div class="l">${esc(s)}</div>${s === "Friend or family" ? `<div class="h">Friends are polite. Aim for strangers.</div>` : ""}</div>`).join("")}${unknown ? `<div class="tile warn"><div class="n">${unknown}</div><div class="l">source not set</div></div>` : ""}</div>`;
}
/* Places to find people, suggested by the AI from the transcripts and a directed search. A place with no quote behind it is a guess. */
function placeBasis(pl){
  const ids = (pl.evidenceIds || []).filter(Boolean); const found = ids.map(id => byId(S.evidence, id)).filter(Boolean); const conf = found.filter(e => e.status === "Confirmed");
  if (conf.length) return {kind:"evidence", label:`From ${conf.length} confirmed quote${conf.length > 1 ? "s" : ""}`, ids};
  if (found.length) return {kind:"unconfirmed", label:`From ${found.length} unconfirmed quote${found.length > 1 ? "s" : ""}`, ids};
  if (ids.length) return {kind:"missing", label:"Cites quotes that don't exist", ids};
  return {kind:"guess", label:"No quote behind it: a guess", ids};
}
function placeCard(pl){
  const b = placeBasis(pl); const seg = byId(S.compass.customers || [], pl.customerId);
  return `<div class="tile" style="border-left:4px solid ${pl.status === "Confirmed" ? "var(--teal)" : pl.status === "Rejected" ? "var(--line)" : "var(--yellow)"};${pl.status === "Rejected" ? "opacity:.6" : ""}">
    <div class="spread"><div><b style="font-size:15px">${pl.url ? `<a href="${esc(pl.url)}" target="_blank" rel="noopener" style="color:inherit">${esc(pl.name)}</a>` : esc(pl.name)}</b><div class="h">${esc(pl.kind || "")}${seg ? " · " + esc(seg.text) : pl.who ? " · " + esc(pl.who) : ""}</div></div>
      <div class="acts">${pl.status !== "Rejected" ? `<button class="btn icon no" title="Reject" data-act="setStatus" data-kind="places" data-id="${esc(pl.id)}" data-val="Rejected">✕</button>` : ""}${pl.status !== "Confirmed" ? `<button class="btn icon yes" title="Confirm: worth trying" data-act="setStatus" data-kind="places" data-id="${esc(pl.id)}" data-val="Confirmed">✓</button>` : ""}</div></div>
    ${pl.how ? `<p class="small" style="margin:8px 0 0">${esc(pl.how)}</p>` : ""}
    <div class="row small" style="margin-top:8px;gap:6px">${statusChip(pl.status)}${pl.status === "Candidate" ? sourceChip(pl.foundBy) : ""}${b.kind === "evidence" ? `<span class="chip ok">${esc(b.label)}</span>` : b.kind === "guess" ? `<span class="stamp" style="transform:none;font-size:10.5px">${esc(b.label)}</span>` : `<span class="chip ${b.kind === "missing" ? "bad" : "warn"}">${esc(b.label)}</span>`}${pl.verified ? `<span class="chip blue" title="${esc(pl.verified)}">Checked by AI</span>` : `<span class="chip gray">Not checked</span>`}</div>
    ${pl.why ? `<div class="h" style="margin-top:6px">${esc(pl.why)}${b.ids.length ? " " + b.ids.map(id => { const e = byId(S.evidence, id); return e ? `<a href="#/interviews/${esc(e.interviewId)}" class="mono" style="font-size:11px">${esc(id)}</a>` : `<span class="chip bad">${esc(id)}</span>`; }).join(" ") : ""}</div>` : ""}
    ${pl.verified ? `<div class="h" style="margin-top:4px"><span class="muted">What the AI saw:</span> ${esc(pl.verified)}</div>` : ""}
    ${pl.status === "Confirmed" ? `<div style="margin-top:8px"><button class="btn sm" data-act="placeLead" data-id="${esc(pl.id)}">Add a lead from here</button></div>` : ""}
  </div>`;
}
function placesList(){
  const list = [...S.places].sort((a, b) => ({Confirmed:0, Candidate:1, Rejected:2}[a.status] ?? 1) - ({Confirmed:0, Candidate:1, Rejected:2}[b.status] ?? 1) || a.id.localeCompare(b.id, undefined, {numeric:true}));
  const ask = `<div class="box soft"><h3>Ask your AI</h3><p class="ins">Say <span class="kbd">Find where to interview next</span>. It reads every transcript for where these people gather, searches for communities, groups and job titles, and writes each place here with the quote it rests on. Places it couldn't check are marked.</p><button class="btn sm" data-act="copyText" data-text="Find where to interview next">Copy</button></div>`;
  if (!list.length) return `<div class="empty" style="padding-bottom:8px">No places suggested yet.</div>${ask}`;
  return `<div class="boxes g2" style="margin-bottom:14px">${list.map(placeCard).join("")}</div>${ask}`;
}
function quoteList(list){ return list.length ? list.map(e => quoteCard(e, S.transcripts[e.interviewId] ?? null, {showInterview:true})).join("") : `<div class="empty">No confirmed workaround or past-behavior quotes yet.</div>`; }
function segmentTable(){
  const segs = S.compass.customers || []; const confirmed = confirmedPains();
  if (!segs.length) return `<div class="empty">No customer segments on the canvas yet.</div>`;
  const rows = segs.map(c => { const ivs = S.interviews.filter(i => i.customerId === c.id); const ps = confirmed.filter(p => ivs.some(i => i.id === p.interviewId)); return {c, ivs:ivs.length, n:ps.length, share:segShare(ps), hof:ps.filter(p => p.tier === "Hair on Fire").length}; });
  const untagged = S.interviews.filter(i => !i.customerId).length;
  return `<div class="box flat soft"><table><tr><th>Segment</th><th class="right">Interviews</th><th class="right">Confirmed scores</th><th class="right">Hair on Fire</th><th class="right">Real pain</th></tr>
  ${rows.map(r => `<tr><td>${r.c.ideal ? "<b>1. " : ""}${esc(r.c.text)}${r.c.ideal ? "</b> <span class='chip blue'>ideal</span>" : ""}</td><td class="right">${r.ivs}</td><td class="right">${r.n}</td><td class="right">${r.hof}</td><td class="right">${r.n ? Math.round(r.share*100) + "%" : "–"}</td></tr>`).join("")}
  ${untagged ? `<tr><td class="muted">No segment set</td><td class="right">${untagged}</td><td colspan="3"><span class="chip warn">Set the segment on each interview</span></td></tr>` : ""}</table></div>
  <p class="hint">Real pain = share of confirmed scores in the top two tiers. The early-adopter bet holds up when the ideal segment beats the others by a clear margin; three confirmed scores per segment is the minimum before it reads anything.</p>`;
}
function alternativesTable(){
  const alts = S.compass.alternatives || [];
  return `<div class="box flat soft">${alts.length ? `<table><tr><th>Alternative</th><th>Gap you believe it leaves</th><th>What the evidence says</th></tr>${alts.map(al => { const a = S.assumptions.find(x => x.alternativeId === al.id && x.status !== "Retired"); const s = a ? assumptionStatus(a) : null; return `<tr class="${a ? "click" : ""}" ${a ? `data-act="openPoint" data-id="${esc(a.id)}"` : ""}><td><b>${esc(al.name)}</b></td><td>${esc(al.gap||"")}</td><td>${s ? `${statusChipA(s.status)} <span class="small muted">${esc(s.why)}</span>` : `<span class="hint">No point on the map yet</span>`}</td></tr>`; }).join("")}</table>` : `<p class="empty">No alternatives listed. <a href="#/compass/canvas">Add them on the Leaner Canvas.</a></p>`}</div>`;
}

/* Ledger check page */
function ledgerView(){
  const issues = ledgerChecks(); const bad = issues.filter(i => i.sev === "bad").length, warn = issues.filter(i => i.sev === "warn").length;
  return `<div class="sheet">${docHead("Help", "Ledger check", `The same checks your AI is told to run after every task (<span class="mono">node tools/check.js</span>). Quotes must be word for word, pain tiers must be justified by the quotes they cite, and an AI rating must say what it's based on.`)}
  <div class="tiles" style="grid-template-columns:repeat(3,minmax(0,1fr))"><div class="tile ${bad ? "bad" : "good"}"><div class="n">${bad}</div><div class="l">problem${bad === 1 ? "" : "s"}</div></div><div class="tile ${warn ? "warn" : ""}"><div class="n">${warn}</div><div class="l">warning${warn === 1 ? "" : "s"}</div></div><div class="tile"><div class="n">${issues.length - bad - warn}</div><div class="l">notes</div></div></div>
  <div class="box soft"><h3>Findings</h3>${issues.length ? issues.sort((x, y) => ({bad:0, warn:1, info:2}[x.sev] - {bad:0, warn:1, info:2}[y.sev])).map(i => `<div class="issue"><span class="chip ${i.sev === "bad" ? "bad" : i.sev === "warn" ? "warn" : "gray"}">${i.sev === "bad" ? "Problem" : i.sev === "warn" ? "Warning" : "Note"}</span><div><a href="#/${esc(i.href)}" class="mono">${esc(i.where)}</a> ${esc(i.msg)}</div></div>`).join("") : `<p class="empty"><b>Clean.</b> Every quote is verbatim, every tier is justified, and every AI rating says what it rests on.</p>`}</div>

      ${e.where ? `${sep}<span>at ${esc(e.where)}</span>` : ""}
      ${transcript ? `${sep}${opts.inInterview ? `<button class="btn link small" data-act="jump" data-id="${esc(e.id)}">Find in transcript</button>` : `<button class="btn link small" data-act="openDrawer" data-id="${esc(e.id)}">Read in transcript</button>`}` : ""}

      <select class="inline" data-act="evField" data-id="${esc(e.id)}" data-field="problemId"><option value="">No problem</option>${S.problems.map(p => opt(p.id, e.problemId, p.id + ": " + p.text.slice(0, 40))).join("")}</select>
      ${S.jobs.length ? `<select class="inline" data-act="evField" data-id="${esc(e.id)}" data-field="jobId"><option value="">No job</option>${S.jobs.map(j => opt(j.id, e.jobId, j.id)).join("")}</select>` : ""}
      ${e.status === "Rejected" ? `<button class="btn link small" data-act="setStatus" data-kind="evidence" data-id="${esc(e.id)}" data-val="Candidate">Back to suggested</button>` : ""}</div>` : ""}
