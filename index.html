<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Discovery Records Manager</title>
<meta name="theme-color" content="#eeeeea">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100,200;100,300;100,800&family=Fraunces:ital,opsz,wght@0,9..144,300;1,9..144,300&display=swap" rel="stylesheet">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<style>
:root{
  /* DESIGN.md: stone, ink, one blue accent (links, primary action, focus, selection only). Status is shape, never colour. */
  --stone:#eeeeea; --stone-top:#f3f3ef; --inset:#f6f6f3; --paper:#ffffff;
  --ink:#111111; --grey:#8c8c88; --hair:#c9c9c4;
  --acc:#1438d8;
  --hatch:repeating-linear-gradient(45deg,var(--ink) 0 1px,transparent 1px 3.5px);
  --hatch-grey:repeating-linear-gradient(45deg,var(--grey) 0 1px,transparent 1px 3.5px);
  --sans:"Archivo","Helvetica Neue",Arial,sans-serif;
  --serif:"Fraunces",Georgia,"Iowan Old Style",serif;
  --mono:ui-monospace,Menlo,Consolas,monospace;
  --w:300; --wb:800; --wl:200;
  --t:.15s ease-out;
  /* names the old code still uses for inline colours; mapped onto the neutral ramp */
  --navy:var(--ink); --teal:var(--ink); --coral:var(--ink); --red:var(--ink); --sky:var(--grey); --yellow:var(--grey); --pale:var(--inset);
  --line:var(--hair); --line-2:var(--grey); --ink-2:var(--ink); --ink-3:var(--grey); --paper-2:var(--inset); --nap:var(--inset);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--sans);font-weight:var(--w);font-variation-settings:"wdth" 100;color:var(--ink);background:linear-gradient(180deg,var(--stone-top) 0,var(--stone) 480px) fixed;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit;font-weight:inherit}
a{color:var(--acc);text-decoration:none;border-bottom:1px solid currentColor}
a:hover{border-bottom-width:2px}
a:active{opacity:.7}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
b,strong{font-weight:var(--wb)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important}.pt:hover .dotp,.pt.dragging .dotp,.btn:active,.tile.click:hover{transform:none!important}}

/* ===== frame: the sidebar is the first column of the grid, not a panel ===== */
.app{display:grid;grid-template-columns:236px 1fr;height:100vh}
.side{border-right:2px solid var(--ink);display:flex;flex-direction:column;min-height:0}
.brand{padding:22px 20px 14px;border-bottom:1px solid var(--ink)}
.brand b{display:block;font-size:12px;font-weight:var(--wb);letter-spacing:.02em;text-transform:uppercase;line-height:1.3}
.brand span{display:block;font-size:12px;color:var(--grey);margin-top:4px}
.nav{padding:8px 0 12px;overflow:auto;flex:1}
.nav a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 20px 5px 20px;border:none;color:var(--ink);font-size:14px;line-height:1.3;border-left:3px solid transparent}
.nav a:hover{border-left-color:var(--grey)}
.nav a:active{opacity:.7}
.nav a.on{font-weight:var(--wb);border-left-color:var(--ink)}
/* a group heading: the title links to the section's page; the chevron beside it collapses the group */
.nav .grp{display:flex;align-items:center;gap:6px;width:100%;font-size:11px;font-weight:var(--wb);letter-spacing:.02em;text-transform:uppercase;white-space:nowrap;color:var(--grey);padding:18px 20px 5px 17px;text-align:left}
.nav .grp .chev{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;padding:0;margin:0;border:none;background:none;cursor:pointer;color:inherit;font:inherit;transition:transform var(--t)}
.nav .grp .chev:hover{color:var(--ink)}
.nav .grp .chev:active{opacity:.7}
.nav .grp.closed .chev{transform:rotate(-90deg)}
.nav .grp a.gt{display:inline;padding:0;border:none;border-bottom:1px solid transparent;color:inherit;font:inherit;line-height:inherit}
.nav .grp a.gt:hover{color:var(--ink);border-bottom-color:var(--ink)}
.nav .grp a.gt.on{color:var(--ink);border-bottom-color:var(--ink)}
.nav .grp.has-active{color:var(--ink)}
.nav .grp .pill{margin-left:auto}
.nav .num{font-family:var(--mono);font-size:11px;color:var(--grey);margin-right:6px}
.count{color:var(--grey);font-size:12px;font-family:var(--mono)}
.pill{background:var(--ink);color:var(--stone);font-size:11px;font-weight:var(--wb);padding:1px 6px;font-family:var(--mono)}
.sidefoot{border-top:1px solid var(--ink);padding:12px 20px;font-size:12px;color:var(--grey);line-height:1.5}
.sidefoot b{color:var(--ink)}
.sidefoot .err{color:var(--ink);background:var(--hatch-grey);padding:0 2px}
.main{overflow:auto;min-width:0}
.main.bare{overflow:hidden;display:flex;flex-direction:column}
.app.nosb{grid-template-columns:1fr} .app.nosb .side{display:none}
.page{padding:36px 48px 96px}
.crumbs{font-size:12px;color:var(--grey);margin-bottom:8px}
.crumbs a{color:var(--grey)}
h2{font-size:12px;font-weight:var(--wb);text-transform:uppercase;letter-spacing:.02em;margin:40px 0 12px;padding-top:12px;border-top:2px solid var(--ink)}
h2:first-child{margin-top:0}
h3{font-size:12px;font-weight:var(--wb);text-transform:uppercase;letter-spacing:.02em;margin:0 0 8px}
.lede{color:var(--ink);margin:0 0 18px;max-width:62ch}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.muted{color:var(--grey)}
.small{font-size:12px}
.right{text-align:right}
.mono{font-family:var(--mono);font-size:12px}
@media (max-width:900px){.app{grid-template-columns:1fr}.side{display:none}.page{padding:20px 16px 80px}}

/* ===== sheets: every page is one typographic document; no container ===== */
.sheet{background:none;border:none;box-shadow:none;padding:0;margin:0 0 32px;position:relative}
.sheet .tool{font-size:12px;font-weight:var(--wb);letter-spacing:.02em;text-transform:uppercase}
.sheet h1{font-size:48px;font-weight:var(--wb);letter-spacing:-.03em;line-height:1;margin:6px 0 0}
.sheet h1 .muted.mono{font-size:12px;font-weight:var(--wb);letter-spacing:0;vertical-align:middle}
.sheet .wordmark{text-align:right;line-height:1.2}
.sheet .wordmark b{display:block;font-size:12px;font-weight:var(--wb);letter-spacing:.02em;text-transform:uppercase}
.sheet .wordmark span{font-size:12px;color:var(--grey)}
.sheet .rule{border-top:2px solid var(--ink);margin:16px 0 14px}
.sheet .nameline{display:flex;gap:32px;flex-wrap:wrap;font-size:12px;margin-bottom:22px}
.sheet .nameline b{font-weight:var(--wb);text-transform:uppercase;letter-spacing:.02em}
.sheet .nameline [contenteditable]{display:inline-block;min-width:80px}
.sheet .intro{margin:0 0 20px;max-width:66ch}
.sheet .foot{display:flex;justify-content:space-between;gap:12px;font-size:12px;color:var(--grey);margin-top:40px;padding-top:10px;border-top:1px solid var(--ink)}
.sheet .actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:-2px 0 14px}

/* boxes become ruled rows: a 2px rule, an uppercase label, the content */
.box{border:none;border-top:2px solid var(--ink);padding:12px 0 8px;position:relative;background:none;margin-bottom:24px}
.box h3{font-size:12px;font-weight:var(--wb);letter-spacing:.02em;text-transform:uppercase;margin:0 0 4px}
.box .ins{font-size:12px;color:var(--grey);margin:0 0 12px;max-width:66ch}
.box.soft{border-top-width:1px}
.box.flat{padding:12px 0 0}
.boxes{display:grid;gap:0 24px}
.boxes.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.boxes.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
/* .fit: as many columns as the width holds (each at least --col), so wide windows get more columns, not wider ones */
.boxes.fit{grid-template-columns:repeat(auto-fill,minmax(var(--col,340px),1fr))}
@media (max-width:900px){.boxes.g2,.boxes.g3,.boxes.fit{grid-template-columns:1fr}}
/* counts: label / big thin numeral / caption, on a hairline */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0 24px;margin-bottom:24px}
.tiles.five{grid-template-columns:repeat(5,minmax(0,1fr))}
@media (max-width:1000px){.tiles,.tiles.five{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{border:none;border-top:1px solid var(--ink);padding:10px 0 12px;background:none}
.tile .n{font-size:48px;font-weight:var(--wl);letter-spacing:-.02em;line-height:1;margin:2px 0 4px}
.tile .n .muted{font-size:15px;font-weight:var(--w)}
.tile .l{font-size:12px;font-weight:var(--wb);text-transform:uppercase;letter-spacing:.02em}
.tile .h{font-size:12px;color:var(--grey);margin-top:4px}
.tile .belief{font-size:15px}
.tile.warn .n,.tile.good .n,.tile.bad .n{color:var(--ink)}
.tile.bad .l:after{content:"";display:inline-block;width:9px;height:9px;border:1px solid var(--ink);background:var(--hatch);margin-left:8px;vertical-align:0}
.tile.good .l:after{content:"";display:inline-block;width:9px;height:9px;border:1px solid var(--ink);background:var(--ink);margin-left:8px;vertical-align:0}
.tile.warn .l:after{content:"";display:inline-block;width:9px;height:9px;border:1px solid var(--ink);margin-left:8px;vertical-align:0}
.tile.click{cursor:pointer;transition:transform var(--t)} .tile.click:hover{transform:translateX(4px)} .tile.click:active{opacity:.7}
/* a row of the page: label column, then content (the 12-column grid: 2 + 10) */
.g12{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:24px}
.lrow{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,10fr);column-gap:24px;border-top:2px solid var(--ink);padding:14px 0 20px;align-items:start}
.lrow.hair{border-top-width:1px}
.lrow>.lbl{font-size:12px;font-weight:var(--wb);text-transform:uppercase;letter-spacing:.02em;line-height:1.4;padding-top:2px}
.lrow>.lbl .sub{display:block;font-weight:var(--w);text-transform:none;letter-spacing:0;color:var(--grey);margin-top:4px}
@media (max-width:1100px){.lrow{grid-template-columns:minmax(0,1fr);row-gap:8px}}
/* the verdict: first and largest on the home page and the map */
h1.verdict{font-size:64px;font-weight:var(--wb);line-height:.98;letter-spacing:-.03em;margin:0;max-width:26ch}
h1.verdict.sm{font-size:24px;line-height:1.15;letter-spacing:-.02em;max-width:none}
@media (max-width:1100px){h1.verdict{font-size:clamp(34px,6vw,56px)}}
@media (max-width:600px){h1.verdict{font-size:34px;letter-spacing:-.02em}h1.verdict.sm{font-size:20px}}
.vrow{display:grid;grid-template-columns:minmax(0,9fr) minmax(220px,3fr);column-gap:24px;padding:28px 0 32px;align-items:start}
@media (max-width:1100px){.vrow{grid-template-columns:1fr;row-gap:20px}}
.facts{display:grid;grid-template-columns:1fr 1fr;column-gap:24px;row-gap:16px;border-top:1px solid var(--ink);padding-top:12px}
.facts>div{min-width:0}
.facts .lbl{font-size:12px;font-weight:var(--wb);text-transform:uppercase;letter-spacing:.02em;line-height:1.2;min-height:29px;display:flex;align-items:flex-end}
.facts .n{font-size:48px;font-weight:var(--wl);line-height:1;letter-spacing:-.02em;margin:4px 0 2px}
.facts .s{font-size:12px;color:var(--grey);line-height:1.3}
.facts a{color:inherit;border:none;display:block} .facts a:hover .n{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:6px}
.nextline{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,7fr) minmax(0,3fr);column-gap:24px;align-items:center;border-top:2px solid var(--ink);padding:14px 0 16px}
.nextline .lbl{font-size:12px;font-weight:var(--wb);text-transform:uppercase;letter-spacing:.02em}
.nextline .a{text-align:right}
@media (max-width:1100px){.nextline{grid-template-columns:1fr;row-gap:10px}.nextline .a{text-align:left}}
/* the posture gauge (map: large; home: under the verdict) */
.gauge{position:relative;padding-top:14px}
.gauge .scale{position:relative;height:28px;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink)}
.gauge .tick{position:absolute;top:0;bottom:0;width:1px;background:var(--hair)}
.gauge .tick.c{background:var(--ink)}
.gauge .needle{position:absolute;left:0;top:-10px;width:100%;height:48px;background:none;margin:0;pointer-events:none;transform:translateX(calc(var(--p,0) * 40%));animation:needle .24s ease-out both}
/* the slide happens once per page load; after that every re-render draws the needle in place (same transform, no animation) */
.settled .gauge .needle{animation:none}
.gauge .needle:before{content:"";position:absolute;left:50%;top:0;width:2px;height:100%;margin-left:-1px;background:var(--ink)}
.gauge .needle:after{content:"";position:absolute;left:50%;top:-6px;border:6px solid transparent;border-top-color:var(--ink);transform:translateX(-50%)}
@keyframes needle{from{transform:translateX(0)}to{transform:translateX(calc(var(--p,0) * 40%))}}
@media (prefers-reduced-motion:reduce){@keyframes needle{from{opacity:0}to{opacity:1}}}
.chip.st:before{display:none}
.q .meta .etype{font-weight:var(--wb);text-transform:uppercase;letter-spacing:.02em;color:var(--ink);font-size:11px}
.btn.on{background:var(--ink);color:var(--stone)}
/* five readings, five bands: each label sits under its band, the needle lands on a band's centre */
.gauge .gl{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));margin-top:6px;font-size:11px;font-weight:var(--wb);letter-spacing:.02em;text-transform:uppercase;text-align:center;line-height:1.2}
.gauge .gl span:first-child{text-align:left} .gauge .gl span:last-child{text-align:right}
.gauge .read{display:block;margin-top:8px;font-size:12px;color:var(--grey)}
.gauge.sm .scale{height:18px} .gauge.sm .needle{height:36px;top:-8px}
/* the share bar per problem: one slot per interview needed */
.share{display:grid;column-gap:4px;height:56px;margin:14px 0 0}
.share i{display:block;border:2px solid var(--ink)}
.share i.hof{background:var(--ink)}
.share i.inc{background:var(--hatch)}
.share i.nth{background:var(--grey)}
.share i.lat{background:var(--hatch-grey)}
.share i.nap{border-color:var(--grey)}
.share i.empty{border:1px dashed var(--grey)}
.share-n{display:grid;column-gap:4px;margin-top:10px}
.share-n>div{font-size:12px;font-weight:var(--wb);text-transform:uppercase;letter-spacing:.02em;padding-top:8px;border-top:1px solid var(--ink);min-width:0}
.share-n .n{display:block;font-weight:var(--wl);font-size:96px;line-height:.9;letter-spacing:-.03em;margin:4px 0 6px}
.share-n .g{color:var(--grey)}
@media (max-width:900px){.share{height:40px}.share-n .n{font-size:48px}}
/* status glyph and word: shape, never colour. Hollow = untested, half = shaky, ringed = weak signal, filled = strong signal, hatched = contradicted. */
.gy{display:inline-block;width:10px;height:10px;border:1px solid var(--ink);vertical-align:0;margin-right:6px;flex-shrink:0;background:transparent}
.gy.shaky{background:linear-gradient(90deg,var(--ink) 50%,transparent 50%)}
.gy.weak{box-shadow:inset 0 0 0 2px var(--ink)}
.gy.strong{background:var(--ink)}
.gy.contradicted{background:var(--hatch)}
.gy.ai{border-style:dashed;border-color:var(--grey)}
.stw{font-size:12px;font-weight:var(--wb);text-transform:uppercase;letter-spacing:.02em;white-space:nowrap}
.why{font-size:12px;color:var(--grey);display:block;margin-top:2px;font-weight:var(--w);text-transform:none;letter-spacing:0;white-space:normal}
/* the riskiest-assumptions table */
table.bets{width:100%}
table.bets th{padding:8px 16px 8px 0}
table.bets td{padding:14px 16px 16px 0;vertical-align:top}
table.bets td.p{font-size:48px;font-weight:var(--wl);line-height:.9;letter-spacing:-.02em;width:72px;padding-top:12px}
table.bets td.id{font-family:var(--mono);font-size:12px;font-weight:var(--wb);width:64px;padding-top:18px}
table.bets td.t{width:26%}
table.bets td.obj{width:26%}
table.bets .rat{font-weight:var(--wb);font-size:12px;white-space:nowrap}
table.bets .rat span{font-weight:var(--w);color:var(--grey)}
table.bets tr.click td{cursor:pointer} table.bets tr.click:hover td{background:none;text-decoration:none} table.bets tr.click:hover td.t{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
.tscroll{overflow-x:auto}

/* ===== canvas sheet ===== */
.canvas{display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:auto auto;gap:0 24px;grid-template-areas:"problem solution customer" "problem solution alts"}
.canvas .b-problem{grid-area:problem} .canvas .b-solution{grid-area:solution} .canvas .b-customer{grid-area:customer} .canvas .b-alts{grid-area:alts}
.canvas .box{margin:0 0 24px}
@media (min-width:1500px){.canvas{grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:auto;grid-template-areas:"problem solution customer alts"}}
@media (max-width:900px){.canvas{grid-template-columns:1fr;grid-template-areas:"problem" "solution" "customer" "alts"}}
.lines{display:flex;flex-direction:column;gap:0}
.ln{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--hair)}
.ln .n{font-family:var(--mono);font-size:12px;color:var(--grey);width:18px;flex-shrink:0;padding-top:5px}
.ln .x{opacity:0;transition:opacity var(--t)}
.ln:hover .x,.ln:focus-within .x{opacity:1}
.ln .sub{font-size:12px;color:var(--grey)}
.ln.ideal{border-left:3px solid var(--ink);padding-left:8px;margin-left:-11px}
.ln .star{border:1px solid var(--ink);background:none;font-size:11px;font-weight:var(--wb);text-transform:uppercase;letter-spacing:.02em;padding:2px 8px;cursor:pointer;white-space:nowrap}
.ln .star:hover{background:var(--ink);color:var(--stone)} .ln .star:active{opacity:.7}
.ln .star.on{background:var(--ink);color:var(--stone)}
[contenteditable]{outline:none;min-height:1.4em;padding:2px 3px;margin:-2px -3px;cursor:text}
[contenteditable]:focus{background:var(--inset);box-shadow:0 0 0 2px var(--acc)}
[contenteditable][data-ph]:empty:before{content:attr(data-ph);color:var(--grey);font-style:italic;pointer-events:none}
.ed{font-family:var(--serif);font-weight:300;font-size:17px;line-height:1.4;font-variation-settings:"opsz" 24}
.ed.sans{font-family:var(--sans);font-weight:var(--w);font-size:14px;font-variation-settings:"wdth" 100}
.add{font-size:12px;font-weight:var(--wb);text-transform:uppercase;letter-spacing:.02em;color:var(--grey);background:none;border:none;cursor:pointer;padding:8px 0;text-align:left}
.add:hover{color:var(--ink)} .add:active{opacity:.7}
.stmt{display:grid;grid-template-columns:minmax(0,7fr) minmax(280px,5fr);gap:0 48px}
@media (max-width:900px){.stmt{grid-template-columns:1fr}}
.stmt .aside p,.stmt .aside .use{max-width:60ch}
.blank .ed{max-width:52ch}
.blank{border-bottom:2px solid var(--ink);padding:0 0 10px;margin-bottom:22px}
.blank .lead{display:inline-block;font-weight:var(--wb);font-size:12px;text-transform:uppercase;letter-spacing:.02em;padding:4px 0}
.blank .ed{display:block;margin-top:6px;min-height:1.6em;font-size:24px;font-variation-settings:"opsz" 48}
.aside{border-top:1px solid var(--ink);padding:12px 0 0;font-size:14px}
.aside h4{font-size:12px;font-weight:var(--wb);letter-spacing:.02em;text-transform:uppercase;margin:0 0 6px}
.aside p{margin:0 0 14px;line-height:1.5}
.aside .ex{font-family:var(--serif);font-weight:300;font-style:italic;font-size:17px}
.aside .use{border-top:1px solid var(--hair);padding:8px 0;margin:0;display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:14px}
.readback{font-family:var(--serif);font-weight:300;font-size:28px;line-height:1.25;margin:6px 0 22px;max-width:30ch;font-variation-settings:"opsz" 72}

/* ===== controls: square, 800 uppercase, invert on hover ===== */
.btn{text-decoration:none;display:inline-block;border:2px solid var(--ink);background:none;padding:8px 14px;cursor:pointer;white-space:nowrap;font-weight:var(--wb);font-size:12px;text-transform:uppercase;letter-spacing:.02em;color:var(--ink);line-height:1.2;transition:opacity var(--t)}
.btn:hover{background:var(--ink);color:var(--stone)}
.btn:active{opacity:.7}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--stone)}
.btn.pri:hover{background:var(--stone);color:var(--acc)}
.btn.sm{padding:5px 10px;font-size:11px;border-width:1px}
.btn.icon{width:30px;height:30px;padding:0;display:inline-flex;align-items:center;justify-content:center;font-size:13px;border-width:1px}
.btn.icon.yes:hover{background:var(--ink);color:var(--stone)}
.btn.icon.no{border-style:dashed} .btn.icon.no:hover{background:var(--hatch);color:var(--ink)}
.btn.link{border:none;background:none;color:var(--acc);padding:0;text-decoration:none;border-bottom:1px solid currentColor;font-weight:var(--w);text-transform:none;letter-spacing:0;font-size:inherit}
.btn.link:hover{background:none;color:var(--acc);border-bottom-width:2px}
.btn:disabled,.btn[disabled]{opacity:.4;cursor:not-allowed;pointer-events:none}
label.f{display:block;font-size:12px;font-weight:var(--wb);text-transform:uppercase;letter-spacing:.02em;margin-bottom:14px}
label.f > input,label.f > select,label.f > textarea{display:block;width:100%;margin-top:5px}
label.f .hint{display:block;font-weight:var(--w);text-transform:none;letter-spacing:0;margin-top:4px}
input[type=text],input[type=number],input[type=date],select,textarea{border:1px solid var(--ink);padding:8px 10px;background:var(--inset);color:var(--ink);font-weight:var(--w);text-transform:none;letter-spacing:0;font-size:15px}
input[type=checkbox]{accent-color:var(--ink);width:16px;height:16px}
textarea{resize:vertical;min-height:72px;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:0;border-color:var(--ink)}
input:disabled,select:disabled,textarea:disabled{opacity:.4;cursor:not-allowed}
select.inline{padding:3px 6px;font-size:12px}
.seg{display:inline-flex;border:1px solid var(--ink)}
.seg button{border:none;background:none;padding:4px 10px;cursor:pointer;border-right:1px solid var(--ink);font-size:12px;font-weight:var(--wb)}
.seg button:last-child{border-right:none}
.seg button:hover{background:var(--inset)} .seg button:active{opacity:.7}
.seg button.on{background:var(--ink);color:var(--stone)}
.seg button:disabled{opacity:.4;cursor:not-allowed}
.tabs{display:flex;gap:18px;border-bottom:2px solid var(--ink);margin:0 0 20px;overflow-x:auto}
.tabs button{border:none;background:none;padding:10px 0;cursor:pointer;color:var(--grey);border-bottom:2px solid transparent;margin-bottom:-2px;font-size:12px;font-weight:var(--wb);text-transform:uppercase;letter-spacing:.02em;white-space:nowrap}
.tabs button:hover{color:var(--ink);border-color:var(--grey)}
.tabs button:active{opacity:.7}
.tabs button.on{color:var(--ink);border-color:var(--ink)}
.tabs button:disabled{opacity:.4;cursor:not-allowed}
.tabs.filters{border:none;margin:0 0 10px;gap:6px}
.tabs.filters button{border:1px solid var(--ink);padding:3px 10px;margin:0;color:var(--ink)}
.tabs.filters button:hover{background:var(--inset)}
.tabs.filters button.on{background:var(--ink);color:var(--stone)}
details.fold{border-top:1px solid var(--hair);padding:10px 0;margin-top:16px}
details.fold summary{cursor:pointer;font-weight:var(--wb);font-size:12px;text-transform:uppercase;letter-spacing:.02em}
details.fold summary:hover{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}

/* ===== tables: hairlines, uppercase heads, no zebra ===== */
table{width:100%;border-collapse:collapse}
th{font-size:12px;font-weight:var(--wb);text-transform:uppercase;letter-spacing:.02em;text-align:left;padding:10px 12px 8px 0;border-bottom:1px solid var(--ink);white-space:nowrap;vertical-align:bottom}
td{padding:11px 12px 11px 0;border-bottom:1px solid var(--hair);vertical-align:top}
tr:last-child td{border-bottom:none}
tr.click{cursor:pointer} tr.click:hover td{background:var(--inset)} tr.click:active td{opacity:.7}

/* ===== chips: an uppercase word with a glyph, no colour; notices: a ruled line ===== */
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ink);padding:1px 7px;font-size:11px;font-weight:var(--wb);text-transform:uppercase;letter-spacing:.02em;white-space:nowrap;line-height:1.5}
.chip:before{content:"";width:8px;height:8px;border:1px solid var(--ink);flex-shrink:0}
.chip.gray{border-color:var(--grey);color:var(--grey)} .chip.gray:before{display:none}
.chip.blue{border-color:var(--ink)} .chip.blue:before{display:none}
.chip.ok:before{background:var(--ink)}
.chip.warn:before{background:transparent}
.chip.bad:before{background:var(--hatch)}
.chip.tier:before{display:none}
.tier-hof{background:var(--ink);color:var(--stone)} .tier-inc{background:var(--hatch-grey)} .tier-nth{border-color:var(--ink)} .tier-lat{border-color:var(--grey);color:var(--grey)} .tier-nap{border-style:dashed;border-color:var(--grey);color:var(--grey)}
.notice{padding:6px 0 6px 14px;font-size:14px;border-left:3px solid var(--ink)}
.notice.bad{border-left:8px solid transparent;border-image:var(--hatch) 8}
.notice.warn{border-left-color:var(--grey)}
.notice.ok{border-left-color:var(--ink)}
.notice.plain{border-left:1px solid var(--grey);color:var(--grey)}
.ai{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:var(--wb);text-transform:uppercase;letter-spacing:.02em;border:1px dashed var(--grey);padding:1px 7px}
.kbd{font-family:var(--mono);font-size:12px;border:1px solid var(--ink);padding:1px 6px;font-weight:var(--w)}
.stamp{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ink);padding:2px 8px;font-size:11px;font-weight:var(--wb);letter-spacing:.02em;text-transform:uppercase;transform:none;background:var(--hatch-grey)}
.stamp.ok{background:var(--ink);color:var(--stone)}
.bar{display:flex;height:8px;overflow:hidden;border:1px solid var(--ink)}
.bar div{height:100%;background:var(--ink)}
.bar.tiers{height:24px}
.bar.tiers div{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:var(--wb);border-right:1px solid var(--stone)}
.bar.tiers .tier-hof{background:var(--ink);color:var(--stone)} .bar.tiers .tier-inc{background:var(--hatch)} .bar.tiers .tier-nth{background:var(--grey);color:var(--stone)} .bar.tiers .tier-lat{background:var(--hatch-grey)} .bar.tiers .tier-nap{background:var(--inset)}

/* ===== the customer's words: a pull quote with a margin note ===== */
.q{background:none;border:none;border-top:1px solid var(--hair);padding:14px 0 12px;margin:0}
.q:first-of-type,.q.compact{border-top:none}
.q.s-Rejected{opacity:.5}
.q .words{font-family:var(--serif);font-weight:300;font-size:24px;line-height:1.25;letter-spacing:-.005em;text-indent:-.45em;font-variation-settings:"opsz" 72;display:block}
.q .words:before{content:"\201C"} .q .words:after{content:"\201D"}
.q.s-Candidate .words{color:var(--ink)}
.q.compact{padding:8px 0 6px}
.q.compact .words{font-size:17px;font-variation-settings:"opsz" 24;text-indent:-.4em}
.q .meta{display:flex;gap:4px 10px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--grey);margin-top:8px;padding-left:1px}
.q .meta a{color:var(--ink);border-bottom-color:transparent} .q .meta a:hover{border-bottom-color:var(--ink)}
.q .meta a b{font-family:var(--mono);font-size:12px}
.q .meta .sep{color:var(--hair)}
.q .acts{display:flex;gap:6px;flex-shrink:0;margin-left:12px}
.q.focus{box-shadow:-6px 0 0 var(--acc)}
.q.open{cursor:pointer}
.q.spread{display:flex}

/* transcript */
.transcript{white-space:pre-wrap;font-family:var(--serif);font-weight:300;font-size:16px;line-height:1.7;max-height:70vh;overflow:auto;padding-right:8px;font-variation-settings:"opsz" 18}
mark{background:none;padding:0 1px;cursor:pointer;color:inherit}
mark.s-Confirmed{box-shadow:inset 0 -2px 0 var(--ink)}
mark.s-Candidate{box-shadow:inset 0 -1px 0 var(--grey);background:var(--inset)}
mark.s-Rejected{text-decoration:line-through;color:var(--grey)}
mark.focus-mark,mark.focus{outline:2px solid var(--acc);outline-offset:1px}
.near{outline:1px dashed var(--grey);outline-offset:1px}
.legend{font-size:12px;color:var(--grey);margin-top:10px}

/* drawers */
.scrim{position:fixed;inset:0;background:rgba(17,17,17,.3);z-index:39}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,96vw);background:var(--stone);border-left:2px solid var(--ink);display:flex;flex-direction:column;z-index:40}
.drawer .dh{padding:16px 24px;border-bottom:1px solid var(--ink)}
.drawer .db{overflow:auto;padding:18px 24px;flex:1}
.drawer .transcript{max-height:none}

/* ===== assumptions map: a whiteboard. The board fills the stage under the tab strip and the posture band; the grid is a
   white square on the stone with 2px ink axes, the shelf a dashed strip below it. Points are glyphs, no labels. ===== */
.mapfull{position:relative;flex:1;display:flex;flex-direction:column;min-height:0}
.tabstrip{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:0 16px 0 24px;border-bottom:2px solid var(--ink);flex-shrink:0}
.tabstrip .tabs{border:none;margin:0;gap:18px;min-width:0}
.tabstrip>.row{flex-wrap:nowrap;flex-shrink:0}
.tabstrip .seg button{padding:5px 10px;font-size:11px;text-transform:uppercase;letter-spacing:.02em;line-height:1.2}
@media (max-width:1500px){.tabstrip{padding-left:16px;padding-right:12px}.tabstrip .tabs{gap:8px}.tabstrip .tabs button{font-size:11px}.tabstrip>.row{gap:3px!important}.tabstrip .counts{gap:4px;margin-right:2px}.tabstrip .counts .dotp{margin-right:3px}.tabstrip .seg button{padding:5px 6px}.tabstrip .btn.sm{padding:5px 7px}}
.tabstrip .tabs button{padding:12px 0}
.mapband{display:grid;grid-template-columns:minmax(0,7fr) minmax(280px,5fr);column-gap:48px;align-items:end;padding:12px 24px 12px;border-bottom:1px solid var(--ink);flex-shrink:0}
.mapband .lab{font-size:12px;font-weight:var(--wb);text-transform:uppercase;letter-spacing:.02em}
@media (max-width:1100px){.mapband{grid-template-columns:1fr;row-gap:12px}}
@media (max-width:1500px){.mapband .gauge .gl{font-size:10px}}
@media (max-width:900px){.mapband .gauge .scale{height:20px}.mapband .gauge .needle{height:38px;top:-8px}}
@media (max-width:1300px){.tabstrip{flex-wrap:wrap;padding:0 16px}.tabstrip .tabs{width:100%;order:2;gap:14px;flex-wrap:wrap;overflow:visible}.tabstrip .tabs button{padding:8px 0}.tabstrip>.row{width:100%;padding:8px 0 4px;justify-content:flex-start;flex-wrap:wrap}}
@media (max-width:900px){.mapband{padding:10px 16px}}
.counts{display:inline-flex;gap:10px;align-items:center;font-size:12px;margin-right:6px}
.counts .cnt{display:inline-flex;align-items:center;gap:0;font-weight:var(--wb)}
.counts .dotp{display:inline-block;width:10px;height:10px;border:1px solid var(--ink);background:transparent;margin-right:5px}
.counts .dotp.s-ok{background:var(--ink)} .counts .dotp.s-weak{box-shadow:inset 0 0 0 2px var(--ink)} .counts .dotp.s-warn{background:linear-gradient(90deg,var(--ink) 50%,transparent 50%)} .counts .dotp.s-bad{background:var(--hatch)}
/* The stage: the board, and on double-click one column on the right for the point's details. Columns, not overlays. */
.mapstage{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
.mapstage.sel{grid-template-columns:minmax(0,1fr) 360px}
.mappanel{min-height:0;overflow:auto;border-left:2px solid var(--ink);padding:16px 20px 24px;background:var(--stone)}
.mappanel h4{font-size:12px;font-weight:var(--wb);letter-spacing:.02em;text-transform:uppercase;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.mappanel .sec{margin-top:20px;padding-top:14px;border-top:2px solid var(--ink)}
.mappanel .sec.aisec{border-top-style:dashed;border-top-color:var(--grey)}
.mappanel .lab{font-size:12px;font-weight:var(--wb);text-transform:uppercase;letter-spacing:.02em;margin:14px 0 4px}
.mappanel .lab .muted{font-weight:var(--w);text-transform:none;letter-spacing:0}
.mappanel .lab:first-of-type{margin-top:0}
.mappanel .ed[data-act="aText"]{font-size:18px;margin:0 0 4px}
.mappanel .seg{display:inline-flex}
.ov{position:absolute;z-index:5;background:rgba(238,238,234,.97);border:2px solid var(--ink);padding:14px 16px;cursor:default}
.ov.shelfpanel{right:14px;top:14px;bottom:52px;width:330px;overflow:auto}
.ov h4{font-size:12px;font-weight:var(--wb);letter-spacing:.02em;text-transform:uppercase}
@media (max-width:1200px){
  /* Under 1200px the board would be too narrow beside the panel, so the page scrolls as a document: band, the board at a fixed height, then the panel below it. */
  .mapfull:has(.mapstage.sel){overflow:auto}
  .mapstage.sel{flex:none;grid-template-columns:1fr;grid-template-rows:min(440px,55vh) auto}
  .mapstage.sel>.vp{flex:none}
  .mappanel{border-left:none;border-top:2px solid var(--ink);padding:12px 16px 16px}
  .ov.shelfpanel{width:calc(100% - 28px)}
}
/* The board itself. Everything in the world scales with the view; words and points undo the scale with --ik so they keep their screen size. */
.vp{position:relative;flex:1;min-height:0;overflow:hidden;background:linear-gradient(180deg,var(--stone-top) 0,var(--stone) 480px);cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none}
.vp.panning{cursor:grabbing}
.world{position:absolute;left:0;top:0;width:0;height:0;transform-origin:0 0;--ik:1}
.world svg.geo{position:absolute;left:0;top:0;overflow:visible;width:1px;height:1px;pointer-events:none}
.world svg.geo *{vector-effect:non-scaling-stroke}
.world .wl{position:absolute;width:0;height:0;transform:scale(var(--ik));transform-origin:0 0;pointer-events:none}
.world .wl span{position:absolute;white-space:nowrap;font-size:11px;font-weight:var(--wb);letter-spacing:.02em;text-transform:uppercase;color:var(--ink);line-height:1}
.world .wl.conf span{transform:translate(-50%,0);margin-top:14px} .world .wl.conf.odd span{margin-top:28px} .world .wl.conf.first span{transform:translate(-100%,0);margin-left:-6px} .world .wl.conf.last span{transform:translate(0,0);margin-left:6px}
.world .wl.imp span{transform:translate(-100%,-50%);margin-left:-16px}
.world .wl.axname span{color:var(--grey);font-weight:var(--w);text-transform:none;letter-spacing:0;font-size:12px}
.world .wl.axname.h span{margin:28px 0 0 6px}
.world .wl.axname.v span{writing-mode:vertical-rl;transform:rotate(180deg);margin:16px 0 0 -162px;line-height:12px}
.world .wl.note span{color:var(--grey);font-weight:var(--w);text-transform:none;letter-spacing:0;font-size:12px;line-height:1.25;margin:10px 0 0 12px}
.vp.tiny .wl.conf.odd,.vp.tiny .wl.axname{display:none}
.world .wl.note small{display:block;font-size:12px}
/* Points: a shape and a word (in the title), nothing else. */
.pt{position:absolute;width:0;height:0;transform:scale(var(--ik));transform-origin:0 0;cursor:grab}
.pt:before{content:"";position:absolute;left:-14px;top:-14px;width:28px;height:28px}
.pt .dotp{position:absolute;left:-7px;top:-7px;width:14px;height:14px;border:2px solid var(--ink);background:var(--paper);transition:transform var(--t)}
.pt:hover .dotp{transform:scale(1.25)}
.pt .dotp.s-ok{background:var(--ink)} .pt .dotp.s-weak{background:linear-gradient(var(--paper),var(--paper)) center/4px 4px no-repeat,var(--ink)} .pt .dotp.s-warn{background:linear-gradient(90deg,var(--ink) 50%,var(--paper) 50%)} .pt .dotp.s-bad{background:var(--hatch),var(--paper)} .pt .dotp.s-none{background:var(--paper)}
.pt.cand .dotp{border-style:dashed}
.pt.sel .dotp{outline:2px solid var(--acc);outline-offset:3px}
.pt.piv .dotp{box-shadow:0 0 0 3px var(--paper),0 0 0 4px var(--grey)}
.pt.dragging{z-index:9;cursor:grabbing} .pt.dragging .dotp{transform:scale(1.25)}
.pt.ai{cursor:pointer}
.pt.ai .dotp{left:-6px;top:-6px;width:12px;height:12px;border:1px dashed var(--grey);background:transparent}
.pt.ai.sel .dotp{outline:2px solid var(--acc);outline-offset:3px}
.vp.f-mine .pt.ai,.vp.f-mine .tie,.vp.f-ai .pt.me,.vp.f-ai .tie{display:none}
/* The card on click: next to the point, in screen space; it fades, nothing else moves. */
.ptcard{position:absolute;z-index:5;width:272px;background:rgba(238,238,234,.97);border:2px solid var(--ink);padding:10px 12px 12px;cursor:default;opacity:0;transition:opacity var(--t);pointer-events:none}
.ptcard.in{opacity:1;pointer-events:auto}
.ptcard .head{display:flex;justify-content:space-between;gap:8px;margin-bottom:6px;align-items:baseline}
.ptcard .head .lab{font-size:11px;font-weight:var(--wb);text-transform:uppercase;letter-spacing:.02em}
.ptcard .head .st{display:inline-flex;align-items:center;white-space:nowrap}
.ptcard .txt{font-size:15px;line-height:1.35} .ptcard .txt.empty{color:var(--grey);font-style:italic}
.ptcard .ev{margin-top:6px;font-size:12px;color:var(--grey);line-height:1.35}
.ptcard .ag{margin-top:8px;padding-top:6px;border-top:1px dashed var(--grey);font-size:12px;color:var(--grey);line-height:1.35}
.ptcard .ag b{color:var(--ink);text-transform:uppercase;letter-spacing:.02em;font-size:11px;margin-right:4px}
.ptcard .acts{margin-top:10px;display:flex;gap:6px}
.ptcard .more{margin-top:8px;font-size:12px;color:var(--grey)}
.vp .hud{position:absolute;right:14px;bottom:10px;display:flex;gap:4px;z-index:3}
.vp .hud .btn{padding:3px 9px;font-size:12px;background:var(--stone)}
.vp .hud .btn:hover{background:var(--ink)}
.vp .legend{position:absolute;left:14px;bottom:10px;right:150px;margin:0;display:flex;gap:12px;flex-wrap:wrap;width:max-content;max-width:calc(100% - 164px);background:rgba(238,238,234,.92);padding:4px 8px;font-size:11px;font-weight:var(--wb);text-transform:uppercase;letter-spacing:.02em;color:var(--ink)}
.vp .legend i{display:inline-block;width:10px;height:10px;border:1px solid var(--ink);vertical-align:-1px;margin-right:5px;background:transparent}
.vp .hint2{position:absolute;left:50%;transform:translateX(-50%);top:12px;font-size:12px;color:var(--grey);background:rgba(238,238,234,.92);padding:3px 10px;white-space:nowrap;z-index:3}
.vp:has(.ov) .hint2,.mapstage.sel .hint2{display:none}
@media (max-width:1250px){.vp .hint2{display:none}}
.rate{display:flex;gap:4px}
.rate i{flex:1;height:12px;border:1px solid var(--ink);display:block;background:transparent}
.rate i.you{background:var(--ink)} .rate i.ai{background:var(--hatch)}
.rate-l{display:flex;justify-content:space-between;font-size:11px;color:var(--grey);margin-top:3px}
.sidebox{border-top:1px solid var(--ink);padding:12px 0 4px;margin-bottom:8px}
.sidebox h4{font-size:12px;font-weight:var(--wb);letter-spacing:.02em;text-transform:uppercase;margin:0 0 6px}

/* ===== misc ===== */
.check{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--hair)}
.check:last-child{border-bottom:none}
.check .dot{width:14px;height:14px;border:1px solid var(--ink);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:0;margin-top:4px}
.check.done .dot{background:var(--ink)}
.check.done .t{color:var(--grey);text-decoration:line-through}
.check .t{font-weight:var(--wb);color:var(--ink);border:none}
.check .t:hover{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
.check .d{font-size:12px;color:var(--grey)}
.empty{color:var(--grey);text-align:left;padding:18px 0;border-top:1px solid var(--hair)}
.empty b{color:var(--ink)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--stone);padding:10px 14px;display:flex;gap:14px;align-items:center;z-index:60;font-size:14px}
.toast button{background:none;border:1px solid var(--stone);color:var(--stone);padding:3px 9px;cursor:pointer;font-size:11px;font-weight:var(--wb);text-transform:uppercase;letter-spacing:.02em}
.toast button:hover{background:var(--stone);color:var(--ink)} .toast button:active{opacity:.7}
.banner{border-bottom:2px solid var(--ink);padding:9px 24px;font-size:13px}
.welcome{max-width:760px;margin:0;padding:64px 48px 96px}
.welcome h1{font-size:64px;font-weight:var(--wb);letter-spacing:-.03em;line-height:.98;margin:0;max-width:12ch}
.welcome .sub{font-family:var(--serif);font-weight:300;font-size:28px;line-height:1.25;margin:20px 0 36px;max-width:30ch;font-variation-settings:"opsz" 72}
.welcome h1 .mono,.welcome .sub .mono{font-size:.8em;font-weight:400}

.welcome .card hr{border:none;border-top:1px solid var(--hair);margin:18px 0}

@media (max-width:900px){.welcome{padding:32px 16px 64px}.welcome h1{font-size:40px}.welcome .sub{font-size:22px}}
.hint{font-size:12px;color:var(--grey)}
pre.code{white-space:pre-wrap;font-family:var(--mono);font-size:13px;background:var(--inset);border:1px solid var(--ink);padding:10px 12px;margin:6px 0}
pre.prompt{white-space:pre-wrap;background:var(--inset);border:1px solid var(--ink);padding:12px;max-height:320px;overflow:auto;font-size:12px;font-family:var(--mono)}
.md h1{font-size:24px;font-weight:var(--wb);letter-spacing:-.02em}.md h2{font-size:12px;margin-top:24px;border-top:1px solid var(--ink)}.md h3{font-size:12px;margin-top:16px}.md table{margin:8px 0 14px}.md td,.md th{border:1px solid var(--hair);padding:6px 8px}

<body>
<div id="root"></div>
<script>
"use strict";
/* ============================================================
   Discovery Records Manager (DRM)
   Compass (what you believe) -> Evidence (what customers said)
   -> Validate (which beliefs hold up), by focus area.
   Data lives as plain files in the founder's own repo folder.
   The founder's AI assistant reads and writes the same folder
   (see CLAUDE.md); this app is for entering and judging evidence.
   ============================================================ */

const TEMPLATE_URL = "https://github.com/Magiomakes/discovery-records-manager";
const SETUP_URL = TEMPLATE_URL + "/blob/main/SETUP.md";

/* Signal thresholds. Fixed in the app and in CLAUDE.md, not a setting: a problem is tested once this many confirmed
   interviews score it, and the signal is strong when at least this share land in Hair on Fire or Incremental Improvement. */
const MIN_INTERVIEWS = 5, STRONG_SHARE = 0.5;
/* Two more fixed thresholds: a problem reads nothing under 2 confirmed scores (one story is not a pattern); a segment reads nothing under 3. Contradicted needs MIN_INTERVIEWS scores with 20% or fewer in the top two tiers. */
const MIN_SCORED = 2, MIN_SEGMENT = 3, CONTRADICTED_SHARE = 0.2;
/* The five readings, left to right on the gauge and everywhere else. */
const STATUSES = ["Contradicted","Shaky","Untested","Weak signal","Strong signal"];
const TIERS = ["Hair on Fire","Incremental Improvement","Nice to Have","Latent","Not a Problem"];
const TIER_CLASS = {"Hair on Fire":"tier-hof","Incremental Improvement":"tier-inc","Nice to Have":"tier-nth","Latent":"tier-lat","Not a Problem":"tier-nap"};
const TIER_DEF = {
  "Hair on Fire":"Already invested money or recurring time they can't get back, and the problem is still not solved.",
  "Incremental Improvement":"Actively trying to fix it, but the effort is reversible (tried a tool and dropped it, stopped when a free trial ended).",
  "Nice to Have":"Describes the problem clearly but has done nothing about it.",
  "Latent":"Has the problem but doesn't see it as a problem. A flag to notice, not a buying signal.",
  "Not a Problem":"No sign they have it."
};
const EVIDENCE_TYPES = ["Past behavior, irreversible","Past behavior, reversible","Current workaround","Frequency","Cost (time or money)","Strong language","Opinion or future intent"];
/* A quote is for the problem (shows it, or what they do about it) or against it (shows it's mild, rare, solved or not theirs). Older files have no stance: for. */
const STANCES = ["for","against"];
const stanceOf = e => e && e.stance === "against" ? "against" : "for";
const EVIDENCE_DEF = {
  "Past behavior, irreversible":"Money spent, recurring time, or a workaround they built and keep using.",
  "Past behavior, reversible":"Tried something and dropped it, abandoned free trials.",
  "Current workaround":"What they use today instead of a real solution.",
  "Frequency":"How often it happens, in their words.",
  "Cost (time or money)":"Hours, dollars or grades lost.",
  "Strong language":"How they talk about it. Supports a score, never decides it.",
  "Opinion or future intent":"\"I would\", \"I'd probably\", \"sounds useful\". Weak evidence."
};
const SOURCES = ["Stranger (cold outreach)","Online community or follower","Referral from an interviewee","Classmate or acquaintance","Friend or family"];
const FREQ = [["Daily",5],["Weekly",4],["Monthly",3],["A few times a year",2],["Rarely",1]];
const CONSEQ = [[5,"Serious loss (money, grades, job, reputation)"],[4,"Real cost (hours or money lost, someone upset)"],[3,"Noticeable hassle that slows them down"],[2,"Minor annoyance"],[1,"Barely matters"]];
const JOB_TYPES = ["Functional","Emotional","Social"];
const DECISIONS = ["Undecided","Wedge","Later","Say no"];
const PERSONA_FIELDS = [
  ["who","Who they are (role and situation)"],
  ["moment","When the problem hits (the specific moment)"],
  ["workaround","What they do about it today"],
  ["cost","What it costs them (time, money, stress)"],
  ["words","How they describe it, in their own words"],
  ["buyer","Who decides or pays to fix it"],
  ["reach","Where we found them (how to reach more)"]
];
/* ---------------- helpers ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const opt = (v, cur, label) => `<option value="${esc(v)}"${String(v)===String(cur??"")?" selected":""}>${esc(label??v)}</option>`;
const today = () => new Date().toISOString().slice(0,10);
const pad = (n, w) => String(n).padStart(w, "0");
function nextId(prefix, list, width){
  let max = 0;
  for (const r of list){ const m = String(r.id).match(new RegExp("^" + prefix + "(\\d+)$")); if (m) max = Math.max(max, +m[1]); }
  return prefix + pad(max + 1, width);
}
function ago(ms){
  const s = (Date.now() - ms) / 1000;
  if (s < 90) return "just now";
  if (s < 3600) return Math.round(s/60) + " min ago";
  if (s < 86400) return Math.round(s/3600) + " h ago";
  return Math.round(s/86400) + " days ago";
}
function tierChip(t){ return t ? `<span class="chip tier ${TIER_CLASS[t]||""}">${esc(t)}</span>` : `<span class="chip gray">Not scored</span>`; }
function statusChip(s){ return `<span class="chip ${s==="Confirmed"?"ok":s==="Rejected"?"gray":"warn"}">${esc(s)}</span>`; }

/* Verbatim matching: is the quote really in the transcript, word for word? */
function quoteRegex(q){
  const t = String(q||"").trim().replace(/^["“”']+|["“”']+$/g,"").trim();
  if (t.length < 4) return null;
  const body = t.split(/\s+/).map(w => w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&").replace(/['’‘]/g,"['’‘]").replace(/["“”]/g,'["“”]')).join("\\s+");
  try { return new RegExp(body, "i"); } catch(e){ return null; }
}
function findInTranscript(quote, text){
  const re = quoteRegex(quote); if (!re || !text) return null;
  const m = re.exec(text); return m ? {start:m.index, end:m.index + m[0].length} : null;
}

/* ---------------- storage ---------------- */
const idb = {
  open(){ return new Promise((res, rej) => { const r = indexedDB.open("drm", 1); r.onupgradeneeded = () => r.result.createObjectStore("kv"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  async get(k){ const db = await this.open(); return new Promise(res => { const t = db.transaction("kv").objectStore("kv").get(k); t.onsuccess = () => res(t.result); t.onerror = () => res(undefined); }); },
  async set(k, v){ const db = await this.open(); return new Promise(res => { const t = db.transaction("kv","readwrite").objectStore("kv").put(v, k); t.onsuccess = () => res(); t.onerror = () => res(); }); }
};

const DIRS = {interviews:"interviews", evidence:"evidence", pains:"pain-scores", problems:"problems", jobs:"jobs", assumptions:"assumptions", places:"places", leads:"leads", pivots:"pivots", competitors:"competitors"};

class FolderStore {
  constructor(root){ this.root = root; this.kind = "folder"; this.name = root.name; this.stamps = null; }
  async dir(path, create=true){ let d = this.root; for (const p of path.split("/").filter(Boolean)) d = await d.getDirectoryHandle(p, {create}); return d; }
  async write(path, text){
    const parts = path.split("/"); const file = parts.pop();
    const d = await this.dir(parts.join("/"));
    const fh = await d.getFileHandle(file, {create:true});
    const w = await fh.createWritable(); await w.write(text); await w.close();
    if (this.stamps) this.stamps[path] = (await (await fh.getFile()).lastModified);
  }
  async read(path){
    try { const parts = path.split("/"); const file = parts.pop(); const d = await this.dir(parts.join("/"), false); const f = await (await d.getFileHandle(file)).getFile(); return await f.text(); }
    catch(e){ return null; }
  }
  async remove(path){ try { const parts = path.split("/"); const file = parts.pop(); const d = await this.dir(parts.join("/"), false); await d.removeEntry(file); delete (this.stamps||{})[path]; } catch(e){} }
  async isInitialized(){ return (await this.read("drm/config.json")) !== null; }
  async hasGit(){ try { await this.root.getDirectoryHandle(".git"); return true; } catch(e){ return false; } }
  async hasAiInstructions(){ return (await this.read("CLAUDE.md")) !== null; }
  /* The commonest setup mistake: picking the drm/ data folder inside the repository instead of the
     repository itself. The app can't look at the parent, so it goes by what's inside: a ledger's own
     files at the top (config.json), or a folder called drm with none of the repository's files. */
  async looksLikeDataFolder(){
    if ((await this.read("config.json")) !== null && (await this.read("index.html")) === null) return "data";
    if (/^drm$/i.test(this.name) && (await this.read("index.html")) === null && (await this.read("CLAUDE.md")) === null && !(await this.hasGit())) return "named";
    return "";
  }
  async lastPush(){
    try {
      const g = await this.root.getDirectoryHandle(".git");
      const r = await (await (await g.getDirectoryHandle("refs")).getDirectoryHandle("remotes")).getDirectoryHandle("origin");
      for (const b of ["main","master"]) { try { const f = await (await r.getFileHandle(b)).getFile(); return f.lastModified; } catch(e){} }
    } catch(e){}
    return null;
  }
  /* Snapshot of every data file's modified time, so the app can notice when an AI assistant writes into the folder. */
  async scan(){
    const out = {};
    let drm; try { drm = await this.root.getDirectoryHandle("drm"); } catch(e){ return out; }
    for await (const [name, h] of drm.entries()){
      if (h.kind === "file"){ out["drm/" + name] = (await h.getFile()).lastModified; continue; }
      for await (const [n2, h2] of h.entries()) if (h2.kind === "file") out[`drm/${name}/${n2}`] = (await h2.getFile()).lastModified;
    }
    return out;
  }
  async loadAll(){
    const S = emptyState();
    S.config = JSON.parse(await this.read("drm/config.json") || "{}");
    S.persona = JSON.parse(await this.read("drm/persona.json") || "null") || S.persona;
    S.compass = {...emptyCompass(), ...(JSON.parse(await this.read("drm/compass.json") || "null") || {})};
    for (const [key, dir] of Object.entries(DIRS)){
      let d; try { d = await this.dir("drm/" + dir, false); } catch(e){ continue; }
      for await (const [name, h] of d.entries()){
        if (h.kind !== "file" || !name.endsWith(".json")) continue;
        try { const rec = JSON.parse(await (await h.getFile()).text()); if (rec && rec.id) S[key].push(rec); else S.unreadable.push(`drm/${dir}/${name}`); }
        catch(e){ S.unreadable.push(`drm/${dir}/${name}`); }
      }
    }
    try {
      const d = await this.dir("drm/transcripts", false);
      for await (const [name, h] of d.entries()) if (h.kind === "file" && name.endsWith(".md")) S.transcripts[name.slice(0,-3)] = await (await h.getFile()).text();
    } catch(e){}
    try {
      const d = await this.dir("drm/notes", false);
      for await (const [name, h] of d.entries()) if (h.kind === "file" && name.endsWith(".md")){ const f = await h.getFile(); S.notes.push({name, text: await f.text(), modified: f.lastModified}); }
    } catch(e){}
    S.notes.sort((a, b) => b.modified - a.modified);
    this.stamps = await this.scan();
    migrate(S);
    return S;
  }
}

class MemoryStore {
  constructor(){ this.kind = "demo"; this.name = "Demo"; this.files = {}; }
  async write(p, t){ this.files[p] = t; } async read(p){ return this.files[p] ?? null; } async remove(p){ delete this.files[p]; }
  async hasGit(){ return true; } async lastPush(){ return null; } async hasAiInstructions(){ return true; } async scan(){ return {}; }
}

function emptyState(){
  return {config:{}, interviews:[], evidence:[], pains:[], problems:[], jobs:[], assumptions:[], places:[], leads:[], pivots:[], competitors:[], compass:emptyCompass(), transcripts:{}, notes:[], unreadable:[],
          persona:{problemId:"", fields:Object.fromEntries(PERSONA_FIELDS.map(([k]) => [k, {text:"", evidence:[]}]))}};
}

/* ---------------- app state ---------------- */
let store = null, S = emptyState(), lastPush = null, saveErr = null, savedAt = null, aiReady = null;
function loadCollapsed(){ try { return JSON.parse(localStorage.getItem("drm-collapsed") || "{}"); } catch(e){ return {}; } }
let ui = {collapsed:loadCollapsed(), drafts:{transcript:{}, rubric:{}}, toast:null, importPreview:null, tab:{}, filters:{problem:"All", type:"All"}, reviewIdx:0, drawer:null, hideChecklist: localStorage.getItem("drm-hide-checklist") === "1"};

const sortById = a => a.sort((x, y) => String(x.id).localeCompare(String(y.id), undefined, {numeric:true}));
function byId(list, id){ return list.find(r => r.id === id); }

async function persist(type, rec){
  try {
    if (type === "config") await store.write("drm/config.json", JSON.stringify(S.config, null, 2));
    else if (type === "persona") await store.write("drm/persona.json", JSON.stringify(S.persona, null, 2));
    else if (type === "compass") await store.write("drm/compass.json", JSON.stringify(S.compass, null, 2));
    else if (type === "transcript") await store.write(`drm/transcripts/${rec.id}.md`, rec.text);
    else await store.write(`drm/${DIRS[type]}/${rec.id}.json`, JSON.stringify(rec, null, 2));
    saveErr = null; savedAt = Date.now();
  } catch(e){ saveErr = e.message || String(e); console.error(e); }
}
async function unpersist(type, id){ await store.remove(`drm/${DIRS[type]}/${id}.json`); }

function upsert(type, rec){
  const list = S[type]; const i = list.findIndex(r => r.id === rec.id);
  rec.updatedAt = new Date().toISOString();
  if (i >= 0) list[i] = rec; else list.push(rec);
  persist(type, rec);
}
function removeRec(type, id){ S[type] = S[type].filter(r => r.id !== id); unpersist(type, id); }

/* ---------------- calculations ---------------- */
function confirmedPains(){ return S.pains.filter(p => p.status === "Confirmed"); }
function hygieneIssues(iv){ return (Number(iv.leading) > 0 ? 1 : 0) + (iv.pitched === "Yes" ? 1 : 0) + (iv.demoed === "Yes" ? 1 : 0); }
/* An interview that can't carry an assumption on its own: a friend or family member, leading questions, a pitch or demo, or no recent instance. It still counts; it just can't be what holds the assumption up. */
function weakInterview(iv){ return !iv || hygieneIssues(iv) > 0 || iv.source === "Friend or family" || iv.recentInstance === "No"; }
function painShare(ps){
  const isWeak = p => weakInterview(byId(S.interviews, p.interviewId));
  const top2 = ps.filter(p => ["Hair on Fire","Incremental Improvement"].includes(p.tier));
  const weak = top2.filter(isWeak).length;
  const n = ps.length;
  const cleanN = ps.filter(p => !isWeak(p)).length;
  const cleanHof = ps.filter(p => p.tier === "Hair on Fire" && !isWeak(p)).length;
  return {n, top2:top2.length, weak, cleanN, cleanHof, share:n ? top2.length / n : 0, cleanShare:n ? (top2.length - weak) / n : 0};
}
/* The reading on one problem, from its confirmed scores. Five statuses, fixed thresholds:
   Untested: under MIN_SCORED scores. Contradicted: MIN_INTERVIEWS or more and 20% or fewer in the top two tiers.
   Shaky: the top-two share is under the bar, or reaches it only when weak interviews count.
   Weak signal: clean interviews alone clear the bar, but under MIN_INTERVIEWS scores (or no clean Hair on Fire among them).
   Strong signal: MIN_INTERVIEWS or more, clean interviews alone clear the bar, and at least one clean Hair on Fire. */
function problemSignal(ps, extra){
  const minN = MIN_INTERVIEWS, strong = STRONG_SHARE;
  const {n, top2, weak, cleanHof, share, cleanShare} = painShare(ps);
  const q = extra || "";
  const w = weak ? `; ${weak} of those ${weak === 1 ? "is" : "are"} from a friend, a leading interview, a pitch or no recent instance` : "";
  const pct = Math.round(share * 100);

  if (n < minN) return {status:"Weak signal", why:`${top2} of ${n} interviews are Hair on Fire or Incremental (${pct}%)${w}, but ${n} of ${minN} is too few to lean on${q}`, n, share};

/* Pain yield per place: of the interviews that came from a place, how many scored (confirmed) Hair on Fire or Incremental. Only confirmed scores count; a strong score from a weak interview is flagged. */
function placeYield(pl){

function problemStats(pr){

/* Deterministic rubric check: does the cited evidence justify the tier? Same rule the AI is told to follow. */
function painCheck(p){
  const ev = (p.evidenceIds || []).map(id => byId(S.evidence, id)).filter(Boolean);
  const types = new Set(ev.map(e => e.type));
  const iv = byId(S.interviews, p.interviewId);
  const issues = [];
  if (!ev.length && p.tier && p.tier !== "Not a Problem") issues.push("No quotes cited. A tier needs evidence behind it.");
  const strongTiers = ["Hair on Fire","Incremental Improvement"];
  if (strongTiers.includes(p.tier) && iv && iv.recentInstance === "No") issues.push("They couldn't describe a specific, recent instance, so the ceiling is Nice to Have.");
  if (p.tier === "Hair on Fire" && !types.has("Past behavior, irreversible")) issues.push("Hair on Fire needs a quote showing irreversible investment (money spent, recurring time, a workaround they built and keep using).");
  if (p.tier === "Incremental Improvement" && !types.has("Past behavior, reversible") && !types.has("Current workaround") && !types.has("Past behavior, irreversible")) issues.push("Incremental Improvement needs a quote showing they tried something (reversible effort or a current workaround).");
  const onlyWeak = ev.length && [...types].every(t => ["Opinion or future intent","Strong language"].includes(t));
  if (onlyWeak && strongTiers.includes(p.tier)) issues.push("Every cited quote is opinion or language. Those support a score; they can't decide one.");
  const against = ev.filter(e => stanceOf(e) === "against").length;
  if (against && strongTiers.includes(p.tier)) issues.push(`${against} cited quote${against > 1 ? "s say" : " says"} the problem is mild, rare or solved. That lowers a tier; it can't justify a strong one.`);
  const unconfirmed = ev.filter(e => e.status !== "Confirmed").length;
  if (unconfirmed) issues.push(`${unconfirmed} cited quote${unconfirmed > 1 ? "s aren't" : " isn't"} confirmed yet.`);

  if (missing.length) issues.push(`Cites quotes that don't exist: ${missing.join(", ")}.`);

function freqScore(f){ const x = FREQ.find(([k]) => k === f); return x ? x[1] : null; }

/* ---------------- rubric prompt + parser ---------------- */
function rubricPrompt(iv){
  const probs = S.problems.length ? S.problems.map(p => `${p.id}: ${p.text}`).join("\n") : "none yet (mark every problem as NEW)";
  const jobs = S.jobs.length ? S.jobs.map(j => `${j.id}: ${j.statement}`).join("\n") : "none";
  const transcript = iv ? (S.transcripts[iv.id] || "[paste the full transcript]") : "[paste the full transcript]";
  return `You are reviewing one customer discovery interview for a startup founder. You suggest, the founder decides. Follow these rules exactly.

RULES
1. Quotes, not summaries. Every piece of evidence must be copied word for word from the transcript. Do not paraphrase, shorten, combine or fix grammar. If you can't find the exact words, leave it out.
2. Behavior, not interpretation. What the person has already done counts more than what they feel or say they would do.
3. Argue against it. Look as hard for words that show the problem is mild, rare, already solved or not this person's as for words that show it. When two readings are possible, take the weaker one; the founder can push back.

5. Use only the exact labels listed below for types, tiers, stances and Yes/No fields.

- Demoed a product: Yes if they showed a prototype, mockup or product.

Output one line in a code block, separated by | :
Specific recent instance|Leading questions (number)|Pitched or sold|Demoed|Closing question asked
Then list the leading questions you counted, quoted.

PART 2: EVIDENCE
Pull out every quote that shows the problem, what they do about it, how often, what it costs, or how strongly they feel. Also pull out every quote that shows the problem is mild, rare, already solved, or not this person's. One quote per row.
Output in a code block, one row per quote, separated by | , with no header row:
Evidence ID|Interview ID|Problem ID|Job ID|Verbatim quote|Where in transcript|Evidence type|Stance|Found by|Status
- Evidence ID: the Interview ID plus -Q01, -Q02 and so on (example: ${iv ? iv.id : "INT-003"}-Q01).
- Problem ID: the matching ID from the problem list. If the quote shows a problem not on the list, write NEW: and a five-word description.

${TIERS.map(t => `- ${t}: ${TIER_DEF[t]}`).join("\n")}
Scoring rules: classify by what they did, not by how they talk. Strong language supports a score but is never enough on its own. If you are unsure between two tiers, choose the lower one. If they could not describe a specific, recent time it happened, score no higher than Nice to Have.
Output in a code block, one row per problem, separated by | , with no header row:

function matchLabel(v, list){
  const t = String(v||"").trim().toLowerCase();
  return list.find(x => x.toLowerCase() === t) || list.find(x => t && (x.toLowerCase().startsWith(t) || t.startsWith(x.toLowerCase()))) || null;
}
const YN = v => { const t = String(v||"").trim().toLowerCase(); return t.startsWith("y") ? "Yes" : t.startsWith("n") ? "No" : ""; };

function parseRubric(text){
  const out = {hygiene:null, evidence:[], pains:[], skipped:[]};
  for (let raw of String(text||"").split(/\r?\n/)){
    let line = raw.trim();
    if (!line.includes("|") || line.startsWith("```")) continue;
    if (/^\|?[\s:\-|]+\|?$/.test(line)) continue;            // markdown table separator
    if (line.startsWith("|")) line = line.slice(1);
    if (line.endsWith("|")) line = line.slice(0, -1);
    let parts = line.split("|").map(s => s.trim());
    const head = parts[0].toLowerCase();
    if (/^(evidence id|interview id|specific recent)/.test(head)) continue;   // header rows
    if (/^-\s*evidence type/i.test(line) || line.startsWith("- ")) continue;   // stray instruction lines
    if (parts.length === 5 && YN(parts[0]) && !isNaN(parseInt(parts[1]))){
      out.hygiene = {recentInstance:YN(parts[0]), leading:parseInt(parts[1]), pitched:YN(parts[2]), demoed:YN(parts[3]), closing:YN(parts[4])};
    } else if (parts.length === 6 && matchLabel(parts[2], TIERS)){
      out.pains.push({aiInterview:parts[0], problemRef:parts[1], tier:matchLabel(parts[2], TIERS), evidenceIds:parts[3].split(/[,;\s]+/).filter(Boolean)});
    } else if (parts.length >= 9){
      const hasStance = parts.length >= 10 && STANCES.includes(String(parts[parts.length - 3]).trim().toLowerCase());   // replies to the older prompt have no stance column
      const tail = parts.slice(hasStance ? -5 : -4); const quote = parts.slice(4, parts.length - tail.length).join("/");
      out.evidence.push({aiId:parts[0], problemRef:parts[2], jobRef:parts[3], quote:quote.replace(/^["“]|["”]$/g,"").trim(), where:tail[0], typeRaw:tail[1], type:matchLabel(tail[1], EVIDENCE_TYPES), stance:hasStance ? tail[2].trim().toLowerCase() : "for"});
    } else out.skipped.push(raw);
  }
  return out;
}

function planImport(iv, parsed){
  // Work out IDs, new problems and verbatim checks before anything is saved.
  const transcript = S.transcripts[iv.id] || "";
  const newProblems = []; const problemMap = {};
  let prList = [...S.problems];
  function resolveProblem(ref){
    const r = String(ref||"").trim(); if (!r) return "";
    if (problemMap[r] !== undefined) return problemMap[r];
    if (byId(S.problems, r)) return problemMap[r] = r;
    const m = r.match(/^NEW\s*:?\s*(.+)$/i);
    const text = m ? m[1].trim() : r;
    const same = prList.find(p => p.text.toLowerCase() === text.toLowerCase());
    if (same) return problemMap[r] = same.id;
    const id = nextId("PR-", prList, 2); const p = {id, text, who:""}; prList.push(p); newProblems.push(p);
    return problemMap[r] = id;
  }
  const idMap = {}; let evList = [...S.evidence];
  const evidence = parsed.evidence.map(e => {
    let id = e.aiId && /^[A-Za-z0-9_-]+$/.test(e.aiId) && e.aiId.startsWith(iv.id) && !byId(evList, e.aiId) ? e.aiId : null;
    if (!id) id = nextId(iv.id + "-Q", evList.filter(x => x.id.startsWith(iv.id + "-Q")), 2);
    idMap[e.aiId] = id;
    const rec = {id, interviewId:iv.id, problemId:resolveProblem(e.problemRef), jobId:byId(S.jobs, e.jobRef) ? e.jobRef : "", quote:e.quote, where:e.where, type:e.type || "", stance:e.stance || "for", foundBy:"Claude Code", status:"Candidate", note: e.type ? "" : `AI type: ${e.typeRaw}`};
    evList.push(rec);
    rec._verbatim = !!findInTranscript(rec.quote, transcript);
    return rec;
  });
  const pains = parsed.pains.map(p => {
    const problemId = resolveProblem(p.problemRef);
    const id = `${iv.id}__${problemId}`;
    const existing = byId(S.pains, id);
    return {id, interviewId:iv.id, problemId, tier:p.tier, evidenceIds:p.evidenceIds.map(x => idMap[x] || x), scoredBy:"Claude Code", status:"Candidate", disagree:"", _skip: existing && existing.status === "Confirmed"};
  });
  return {hygiene:parsed.hygiene, evidence, pains, newProblems, skipped:parsed.skipped};
}

function applyImport(iv, plan, raw){
  for (const p of plan.newProblems) upsert("problems", {...p});
  for (const e of plan.evidence){ const r = {...e}; delete r._verbatim; upsert("evidence", r); }
  for (const p of plan.pains){ if (p._skip) continue; const r = {...p}; delete r._skip; upsert("pains", r); }
  const updated = {...iv, rubricRun:true, rubricRaw:raw};
  if (plan.hygiene) Object.assign(updated, plan.hygiene);
  upsert("interviews", updated);
}

/* Minimal markdown rendering for AI notes */
function renderMd(md){
  const lines = md.split("\n"); let html = "", inTable = false, inList = false;
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/_(.+?)_/g,"<i>$1</i>").replace(/\[(.+?)\]\((.+?)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  for (const l of lines){
    if (l.startsWith("|")){
      if (/^\|[-| ]+\|$/.test(l)) continue;
      const cells = l.slice(1, -1).split("|").map(c => c.trim());
      if (!inTable){ html += "<table><tr>" + cells.map(c => `<th>${inline(c)}</th>`).join("") + "</tr>"; inTable = true; }
      else html += "<tr>" + cells.map(c => `<td>${inline(c)}</td>`).join("") + "</tr>";
      continue;
    } else if (inTable){ html += "</table>"; inTable = false; }
    if (l.startsWith("- ")){ if (!inList){ html += "<ul>"; inList = true; } html += `<li>${inline(l.slice(2))}</li>`; continue; }
    else if (inList){ html += "</ul>"; inList = false; }
    if (l.startsWith("### ")) html += `<h3>${inline(l.slice(4))}</h3>`;
    else if (l.startsWith("## ")) html += `<h2>${inline(l.slice(3))}</h2>`;
    else if (l.startsWith("# ")) html += `<h1>${inline(l.slice(2))}</h1>`;
    else if (l.startsWith("> ")) html += `<blockquote>${inline(l.slice(2))}</blockquote>`;
    else if (l === "---") html += "<hr>";
    else if (l.trim()) html += `<p>${inline(l)}</p>`;
  }
  if (inTable) html += "</table>"; if (inList) html += "</ul>";
  return html;
}
/* Notes the AI wrote into drm/notes/, routed by filename to the page they are about. Anything that matches nothing lands on the home page, so no note is unreachable. */

/* One compact ruled block per note: date, what kind of note, its title; the text behind a toggle. With `lead`, the first section is open and the rest sits behind "Read the full note". */
function noteBlock(n, opts = {}){
  const k = noteKind(n); const body = noteBody(n);

  }

function noteBlocks(list, opts){ return list.length ? `<div class="notes">${list.map(n => noteBlock(n, opts)).join("")}</div>` : ""; }
